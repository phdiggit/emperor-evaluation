schema_version: i5b-factor-test-set-v1
status: frozen_test_input
task_code: V4-I5B-TOLERATE_TALENT-SEALED_HOLDOUT
rule_code: tolerate_talent
dataset_role: sealed_holdout
factor_policy_version: tolerate-talent-factor-agent-v1
expected_unit_count: 8
applicability_options:
- applicable
- not_applicable
- insufficient_evidence
factor_option_catalog:
  feedback_reception:
    actively_solicited: 主动求言并形成反馈入口
    accepted_after_conflict: 冲突后仍采纳或承认专业意见
    tolerated_not_adopted: 允许表达但未采纳
    suppressed_or_punished: 因表达遭压制或处分
    no_feedback_event: 没有可定位的反馈事件
    not_applicable: 不属于容才事件
    insufficient_evidence: 反馈反应证据不足
  talent_safety:
    actively_protected: 统治者主动保护表达者或能臣安全
    safe_without_retaliation: 表达后未受报复且安全边界清楚
    localized_penalty: 受到局部处分但未形成严重伤害
    career_exclusion: 因表达遭职业排除
    personal_or_associative_harm: 造成生命、人身或连带伤害
    mixed_responsibility: 伤害成立但多人责任需拆分
    not_applicable: 不属于人才安全事件
    insufficient_evidence: 安全影响证据不足
  professional_autonomy:
    professional_judgment_respected: 专业判断获得尊重或授权
    reasoned_override: 经审议后合理覆盖专业意见
    political_override: 以政治偏好压过专业判断
    sustained_blockage: 专业反馈渠道持续堵塞
    no_autonomy_issue: 事件没有专业自治议题
    not_applicable: 不属于容才事件
    insufficient_evidence: 专业自治证据不足
  conflict_repair_continuity:
    stable_without_conflict: 多次独立事实证明稳定容纳
    timely_repair: 冲突后及时修复表达或授权信用
    delayed_partial_repair: 延迟或部分修复
    formal_reversal_without_trust_repair: 形式反转但未恢复信用
    persistent_unrepaired: 压制持续且未修复
    single_event_only: 只有单次事件，不能外推长期稳定
    not_applicable: 不属于容才事件
    insufficient_evidence: 连续性或修复证据不足
rule_boundary:
  coverage_and_scoring_unit: 须证明反馈触发到实际伤害或保护的皇帝责任链
  rule_specific_gates:
  - 适用必须有可定位的专业反馈冲突，或能臣安全事件与皇帝反应；纯发现、任用和普通升迁不适用
  - 谋反、重大过错、军纪或一般刑罚不得仅凭人才结局判负；必须证明伤害因表达或专业独立而发生
  - 持续获准表达或继续信任可证明安全；仅未记载报复不能推断安全
  - 单次容忍或压制不能外推长期稳定或系统性持续；修复须有独立后续事实
  - 证据只证明求言或采纳时，不得据此推断人才安全或专业自治；没有相关事件使用 no_*，缺少结果证据使用 insufficient_evidence
  - 材料若明确属于谗构、一般权斗或臣下自我噤声而未连接皇帝对专业表达的反应，则 not_applicable，不以缺材料替代边界判断
  cross_rule_double_counting_forbidden: true
  v3_assets_are_readonly_regression_candidates: true
evidence_coverage:
  schema_version: rule-factor-evidence-coverage-v1
  coverage_status: reviewed_test_fixture
  absence_inference_allowed: false
  formal_v4_fact: false
runtime_policy:
  mode: offline_report_only_shadow
  database_writes_allowed: false
  formal_scoring_allowed: false
