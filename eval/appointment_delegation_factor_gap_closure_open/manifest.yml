schema_version: i5b-factor-test-set-v1
status: frozen_test_input
task_code: V4-I5B-APPOINTMENT_DELEGATION-OPEN_DEVELOPMENT
rule_code: appointment_delegation
dataset_role: open_development
factor_policy_version: appointment-delegation-factor-observation-agent-v4
expected_unit_count: 4
applicability_options:
- applicable
- not_applicable
- insufficient_evidence
factor_option_catalog:
  appointment_importance:
    nominal_or_light: 名义或轻量职责
    real_bounded: 真实但有限职责
    major_affairs: 重要军政事务
    critical_national_or_long_term: 国家全局或长期结构性授权
    not_applicable: 不属于任用授权
    insufficient_evidence: 责任域证据不足
  appointment_effect:
    major_success: 用人链直接证明异常显著成功
    normal_success: 适配与履职反馈明确
    weak_feedback: 正向反馈较弱或不完整
    poor_result: 授权控制或履职结果较差
    major_direct_damage: 授权直接造成重大损害
    structural_continuing_damage: 授权造成跨期结构损害
    not_applicable: 不属于任用授权
    insufficient_evidence: 效果证据不足
  continuity_factor:
    short_or_one_off: 一次授权或短期任务
    stable: 同一授权下至少两个持续反馈事实
    long_term_multi_stage: 至少两次可区分授权或复用
    not_applicable: 不属于任用授权
    insufficient_evidence: 覆盖不足，不能用缺失推断短期
  attribution_factor:
    indirect: 皇帝责任受复杂链条影响
    direct: 任用或反馈可直接归责
    direct_under_pressure: 在明确压力下作出取舍
    not_applicable: 不属于任用授权
    insufficient_evidence: 归责证据不足
  source_factor:
    weak_or_compressed: 关键环节压缩或间接
    standard: 足以支持主要判断
    complete_direct_chain: 直接覆盖任用职责反馈链
    not_applicable: 不属于任用授权
    insufficient_evidence: 史源链不足
  context_factor:
    weak_but_applicable: 相关但边界有缺口
    clear: 上下文和结算边界清楚
    core_mechanism_direct: 直接展示任用授权反馈机制
    not_applicable: 不属于任用授权
    insufficient_evidence: 上下文不足
rule_boundary:
  coverage_and_scoring_unit: 新增开放材料只补四个代表性缺口，不修改或重跑既有 sealed
  rule_specific_gates:
  - 缺失敏感连续性在开放覆盖下不得从未发现后续推断 short_or_one_off
  - 同一任务的推进、结果、纠正和善后不构成第二次授权
  - 多源不同阶段只在 RuleEvidenceUnit 层 join，不拼成单一 Episode
  - 方向反转可证明结果转坏与受压撤权，但不得由任命和罢免两点推断稳定连续；连续性仍须独立跨阶段证据
  cross_rule_double_counting_forbidden: true
  v3_assets_are_readonly_regression_candidates: true
evidence_coverage:
  schema_version: rule-factor-evidence-coverage-v1
  coverage_status: reviewed_test_fixture
  absence_inference_allowed: false
  formal_v4_fact: false
runtime_policy:
  mode: offline_report_only_shadow
  database_writes_allowed: false
  formal_scoring_allowed: false
units:
- unit_ref: AD-G01
  ruler: 武曌
  subject: 李昭德
  context_kind: rule_evidence_unit
  context_summary: appointment_delegation 代表性缺口增补
  evidence:
  - assertion_ref: EVD-I5B-WUZETIAN-POS-LIZHAODE-001@A1
    summary: 武则天对李昭德的明确信任显示其有任用能臣分担政务的正向能力，可作强正候选。
    quote: 吾任昭德，始得安眠，此代吾劳，汝勿言也。
    source:
      source_ref: SRC-ZZTJ-J205-LIZHAODE-WUZETIAN-001
      source_title: 资治通鉴
      locator: 唐纪二十一，武则天任李昭德分劳并回应谏言段
