assertions:
- assertion_ref: V4PROD32-JIN-SMY-YH-001
  source_passage_ref: PAS-CD69219221A0
  summary: 司马炎因有灭吴之志，任羊祜为都督荆州诸军事并假节，令其出镇南方。
  confidence: 0.95
- assertion_ref: V4PROD32-JIN-SMY-YH-002
  source_passage_ref: PAS-CD69219221A0
  summary: 羊祜任内使吴罢石城之守，减少戍逻、开垦八百余顷，并使军粮由不足百日增至十年之积。
  confidence: 0.95
- assertion_ref: V4PROD32-JIN-SMY-YH-003
  source_passage_ref: PAS-CD69219221A0
  summary: 朝廷撤销江北都督后，将汉东、江夏诸军增隶羊祜。
  confidence: 0.95
- assertion_ref: V4PROD32-JIN-SMY-YH-004
  source_passage_ref: PAS-E53F6E378250
  summary: 司马炎诏令羊祜迎接步阐，羊祜遣杨肇进攻陆抗而失败，步阐被擒。
  confidence: 0.95
- assertion_ref: V4PROD32-JIN-SMY-YH-005
  source_passage_ref: PAS-E53F6E378250
  summary: 有司指控羊祜处置失当、违背诏命，朝廷最终将羊祜贬为平南将军并免杨肇为庶人。
  confidence: 0.95
- assertion_ref: V4PROD32-QIN-FJ-WM-001
  source_passage_ref: PAS-BFA25E0F6AC4
  summary: 苻坚先任王猛为中书侍郎，后转任始平令，职责指向治理豪强横行、盗贼充斥的剧邑。
  confidence: 0.95
- assertion_ref: V4PROD32-QIN-FJ-WM-002
  source_passage_ref: PAS-BFA25E0F6AC4
  summary: 王猛因严刑处置被奏劾下狱后，苻坚亲自问责并最终赦免，公开认可其治理能力。
  confidence: 0.95
- assertion_ref: V4PROD32-QIN-FJ-WM-003
  source_passage_ref: PAS-403F0B8B0DF5
  summary: 宗戚旧臣多次谮毁王猛时，苻坚黜退谮毁者，继续将王猛擢至尚书令、太子太傅等职。
  confidence: 0.95
- assertion_ref: V4PROD32-QIN-FJ-WM-004
  source_passage_ref: PAS-444B76D3FDF6
  summary: 苻坚留王猛镇冀州，授权其在六州便宜从事并选任关东守宰；王猛请求停止后，苻坚不许并令其继续视事。
  confidence: 0.95
- assertion_ref: V4PROD32-QIN-FJ-WM-005
  source_passage_ref: PAS-444B76D3FDF6
  summary: 苻坚随后任王猛为丞相等职并逐步加都督中外诸军事，将军国内外事务交由其处理。
  confidence: 0.95
- assertion_ref: V4PROD32-QIN-FJ-WM-006
  source_passage_ref: PAS-444B76D3FDF6
  summary: 原文将兵强国富、庶绩咸熙和百揆时叙直接归于王猛施政。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZJ-CJ-001
  source_passage_ref: PAS-94701710BDE4
  summary: 赵佶为继承熙丰政事而决意起用蔡京，先拜尚书左丞、右仆射，后进左仆射，并当面要求其提出施政方案。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZJ-CJ-002
  source_passage_ref: PAS-11853DF1463D
  summary: 蔡京掌权后设置讲议司并自任提举，使重大政事由该机构及其党羽办理。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZJ-CJ-003
  source_passage_ref: PAS-11853DF1463D
  summary: 蔡京更改盐钞法、废弃旧钞，原文直接记载部分富商由此沦为流丐乃至自杀；章縡奏称改法误民后反被蔡京夺官。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZJ-CJ-004
  source_passage_ref: PAS-4F41EBB1511E
  summary: 赵佶在蔡京已经三度任政后仍于宣和六年再起其领三省，使其达到四度当国。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZJ-CJ-005
  source_passage_ref: PAS-4F41EBB1511E
  summary: 蔡京目昏不能处理政务后，事务由其子蔡絛决定并代为入奏，继而发生弄权、任亲和拘括财物。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZJ-CJ-006
  source_passage_ref: PAS-4F41EBB1511E
  summary: 相关问题被揭发后，赵佶先处分蔡絛及韩梠，后令蔡京上章谢事并批准其去职。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZZ-FZY-001
  source_passage_ref: PAS-B38B9751D0BA
  summary: 江淮等地发生蝗旱后，赵禎因范仲淹进言而命其安抚江淮，职责包括开仓赈济及提出救弊措施。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZZ-FZY-002
  source_passage_ref: PAS-796B6C9284F3
  summary: 元昊请和后，赵禎召范仲淹任枢密副使；经谏官推荐又改任参知政事，范辞任后仍先获陕西宣抚使之命、继而再任参知政事。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZZ-FZY-003
  source_passage_ref: PAS-796B6C9284F3
  summary: 范仲淹反对专责失守州县官，赵禎采纳后使相关守令免于诛处。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZZ-FZY-004
  source_passage_ref: PAS-054C8356EDCA
  summary: 赵禎多次询问政事、赐手诏并召二府条对，范仲淹提出十项改革；皇帝采纳多数并以诏书颁行，府兵法因众议反对而停止。
  confidence: 0.95
