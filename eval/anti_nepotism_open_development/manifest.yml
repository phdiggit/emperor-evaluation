schema_version: i5b-factor-test-set-v1
status: frozen_test_input
task_code: V4-I5B-ANTI_NEPOTISM-OPEN_DEVELOPMENT
rule_code: anti_nepotism
dataset_role: open_development
factor_policy_version: anti-nepotism-factor-agent-v1
expected_unit_count: 12
applicability_options:
- applicable
- not_applicable
- insufficient_evidence
factor_option_catalog:
  capability_basis:
    verified_merit: 能力与履职依据已验证
    mixed_merit_private: 能力与私人关系共同影响
    private_substitutes_merit: 私人关系取代能力依据
    capability_disproved: 已有明确不适任反馈
    not_applicable: 不属于私人任用污染
    insufficient_evidence: 能力依据不足
  process_integrity:
    open_or_formal: 公开或正式程序成立
    bounded_exception_reviewable: 例外有限且可复核
    bypass_but_correctable: 绕过程序但仍可纠正
    private_interference: 私人关系干预任免
    channel_captured: 任免渠道被私人网络控制
    not_applicable: 不属于私人任用污染
    insufficient_evidence: 程序证据不足
  office_exposure:
    nominal_or_nonpublic: 名义或非公共岗位
    bounded_operational: 有限业务职责
    major_affairs: 重要军政事务
    key_appointment_or_succession: 关键任免或继承权责
    appointment_channel_control: 直接控制任免渠道
    not_applicable: 不属于私人任用污染
    insufficient_evidence: 岗位风险证据不足
  network_effect:
    isolated_no_network: 孤立个案且无网络扩张
    repeated_bounded: 重复但影响仍有限
    cross_person_single_channel: 跨人物但限于单一渠道
    cross_channel_capture: 跨人物和多渠道控制
    durable_capture: 形成持续私人网络控制
    dismantled_by_ruler: 统治者已主动拆除网络
    not_applicable: 不属于私人任用污染
    insufficient_evidence: 网络影响证据不足
rule_boundary:
  coverage_and_scoring_unit: 单一亲属或近幸不自动负向；episode 与 aggregate 分维度去重
  rule_specific_gates:
  - 必须有亲属、近幸、私人门庭或任免网络对公共岗位的可定位影响；坏任用、酷吏、党案和一般权臣问题不自动适用
  - 单一亲属或近幸任职不自动负向；能力、程序、岗位和网络必须分层
  - episode 只拥有能力、程序和岗位风险；aggregate 只拥有网络广度、持续性与渠道控制，禁止重复结算
  - 教育、内廷接触或身份本身若未证明影响公共任免，只能证据不足或不适用
  - 材料没有呈现亲属、近幸、私人门庭或任免网络时直接 not_applicable；只有已经定位相关私人关系但影响强度缺证时才 insufficient_evidence
  - 权臣门庭聚集可证明跨人单一渠道，但没有皇帝放任或公共任免被控制的证据时不得上推 channel_captured 或 durable_capture
  cross_rule_double_counting_forbidden: true
  v3_assets_are_readonly_regression_candidates: true
evidence_coverage:
  schema_version: rule-factor-evidence-coverage-v1
  coverage_status: reviewed_test_fixture
  absence_inference_allowed: false
  formal_v4_fact: false
runtime_policy:
  mode: offline_report_only_shadow
  database_writes_allowed: false
  formal_scoring_allowed: false
