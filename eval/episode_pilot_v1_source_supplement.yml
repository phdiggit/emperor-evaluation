output_requirements:
  - immutable_source_document
  - locatable_source_passage
  - document_and_passage_content_hash
  - retrieval_provenance
  - context_preserving_segmentation
  - no_rule_judgment_or_score

acceptance_gate:
  - 11 个文献请求均有明确 source identity 和 retrieval provenance
  - 15 个 required locator 与 1 个 related window 均返回 passage 或结构化错误
  - 任命、职责和结果相隔较远时保留可审计的 related window
  - 同内容 ensure/supplement 重跑零重复网络抓取
  - 输出只进入 V4 fixture，不写入 V3 正式业务数据
