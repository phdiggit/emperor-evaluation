- person: 于谦
  current_grade: top
  primary_lanes:
  - military
  - governance
  achievement_summary: 直接主持北京保卫战并稳定危局，另有长期巡抚、边政和地方治理成果。
  consistency_summary: 国家存亡级核心成果兑现极强，地方治理也长期稳定；但最高强度成果主要集中于一次危局，缺少同级重复兑现。
  legacy_summary: 形成保卫京师与危机军政组织范例，未见由其创制并长期运行的基础军事或治理制度体系。
  calibrated_grade: top
  failure_codes:
  - historic_repeated_era_shaping_realization_insufficient
  - historic_foundational_legacy_missing
  review_basis: 北京保卫战是个人高归属的国家存亡级成果，长期巡抚、边政与危机组织又提供独立稳定兑现，明显超过important。最高高度主要集中于一次救亡，且无基础制度或思想遗产，维持top。
