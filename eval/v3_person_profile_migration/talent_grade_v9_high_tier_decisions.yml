  achievement_summary: 独立平蜀、统军征云南，并持续承担西南平叛和边疆军政经营。
  consistency_summary: 平蜀与征云南连续兑现，胜绩稳定；早期开国战事多属共同体系，后续稳定化含金量低于独立征服。
  legacy_summary: 留下西南远征和占领经营经验，但未形成可与其战功分离的长期军事思想或组织制度遗产。
  calibrated_grade: top
  failure_codes:
  - historic_third_era_shaping_result_missing
  - historic_foundational_legacy_missing
  review_basis: 平蜀、征云南是两个独立重大远征，主帅归属与结果清楚，足过top；早期开国共同战事和后续屯防不能重复抬高，但也没有理由降important。
