schema_version: supplemental-team-profile-evaluation-v1
status: human_authorized_gatekeeper_evaluation
authorization_ref: user-authority:2026-07-15:v3-profile-axes-and-gatekeeper-supplement
research_agent_run_count: 3
policy:
  grade_rubric: talent-grade-v5-gatekeeper-supplement-v1
  negative_rubric: negative-talent-v1-gatekeeper-supplement-v1
  talent_and_negative_axes_are_orthogonal: true
  office_or_fame_alone_cannot_raise_grade: true
  political_outcome_alone_cannot_create_negative_class: true
evaluations:
  - person: 冯胜
    identity_scope: 明初开国将领冯胜
    capability_domains: [military]
    source_refs:
      - https://zh.wikisource.org/zh-hans/明史_(四库全书本)/卷129
    talent:
      grade: top
      confidence: 0.96
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: comprehensive
      basis: 跨鄱阳、淮东、山东、陕甘等战区持续任主副帅，甘肃一路全师而还，征纳哈出促成二十余万部众降附，属于同时代第一梯队统帅；多次处于徐达体系且受降执行有瑕疵，未达到历史级守门员。
    negative:
      class: mixed_or_disputed
      severity: material
      confidence: 0.76
      authority_consensus: disputed
      fact_support: moderate
      evidence_coverage: partial
      basis: 私匿驼马、索珠宝、强娶降将之女等控告涉及滥权和破坏降附，但本传多以会有言、他人攻讦呈现，保留争议，不上推为重大滥权。
  - person: 詹徽
    identity_scope: 洪武朝吏部尚书詹徽
    capability_domains: [administration]
    source_refs:
      - https://zh.wikisource.org/wiki/明史/卷136
    talent:
      grade: usable
      confidence: 0.86
      authority_consensus: moderate
      performance_support: moderate
      evidence_coverage: partial
      basis: 正史明确称有才智、刚决、勤于治事并受皇帝奖任，证明稳定行政执行能力；但没有两个结果明确的独立制度或治理成果簇，守门员只到可用级。
    negative:
      class: power_abuser
      severity: material
      confidence: 0.78
      authority_consensus: moderate
      fact_support: moderate
      evidence_coverage: partial
      basis: 正史称其性险刻，并明确记李善长之死徽有力焉，足以建立利用权位推动政治迫害的实质风险；材料较短，不上推为重大或历史级。
  - person: 秦桧
    identity_scope: 南宋宰相秦桧
    capability_domains: [administration, decision]
    source_refs:
      - https://zh.wikisource.org/zh-hans/宋史/卷473
    talent:
      grade: important
      confidence: 0.90
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: comprehensive
      basis: 靖康时提出兵机方案、反对另立张邦昌，后长期控制中枢并两据相位十九年，证明很强的政治判断、组织控制与外交执行能力；但缺少可归责的持续正向国家级成果，守门员不升顶级。
    negative:
      class: power_abuser
      severity: historic
      confidence: 0.98
      authority_consensus: strong
      fact_support: strong
      evidence_coverage: comprehensive
      basis: 正史完整记载诛锄异议与良将、岳飞冤狱、屏塞人言、罗织大狱、操纵台谏任免和长期垄断中枢，属于跨时代典型的权力滥用和政治迫害。
  - person: 万俟卨
    identity_scope: 南宋万俟卨
    capability_domains: [administration]
    source_refs:
      - https://zh.wikisource.org/zh-hant/宋史/卷474
    talent:
      grade: important
      confidence: 0.89
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: comprehensive
      basis: 沅州守城迫退曹成、提出和后财政储备方案，并编成贡举敕令格式和看详法意等制度成果，具备两个以上明确能力簇；未达到同时代第一梯队，定重要级。
    negative:
      class: framer
      severity: historic
      confidence: 0.98
      authority_consensus: strong
      fact_support: strong
      evidence_coverage: comprehensive
      basis: 何铸查明岳飞无辜后，万俟卨接手案件并连续构造罪名，导致岳飞父子、张宪被杀，又打击申冤者，构成历史影响极大的司法构陷。
  - person: 汤思退
    identity_scope: 南宋宰相汤思退
    capability_domains: [administration]
    source_refs:
      - https://zh.wikisource.org/zh-hans/宋史/卷371
    talent:
      grade: important
      confidence: 0.70
      authority_consensus: moderate
      performance_support: moderate
      evidence_coverage: substantial
      basis: 博学宏词入仕，历郎曹、中秘、史职并进入枢密和宰辅层，证明文书、中枢运作和政治操作能力达到重要级；正面施政绩效不足，不能升顶级。
    negative:
      class: incompetent_harmful
      severity: major
      confidence: 0.95
      authority_consensus: strong
      fact_support: strong
      evidence_coverage: comprehensive
      basis: 对金交涉中擅推割地、排斥张浚、密令以重兵胁和，随后辞督江淮，正史明确归责急和撤备之罪；足证重大有害决策，但不足认定主观叛国。
  - person: 李东阳
    identity_scope: 弘治正德朝阁臣李东阳
    capability_domains: [decision]
    source_refs:
      - https://zh.wikisource.org/zh-hans/明史/卷181
    talent:
      grade: top
      confidence: 0.94
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: comprehensive
      basis: 长期任阁臣，弘治时竭心献纳，正德刘瑾乱政时救免大批官员，且在文学、制诰和人才培养方面形成领袖地位，达到同时代第一梯队；政治作为受因循隐忍限制，不升历史级。
    negative:
      class: mixed_or_disputed
      severity: material
      confidence: 0.82
      authority_consensus: disputed
      fact_support: moderate
      evidence_coverage: comprehensive
      basis: 刘健、谢迁去位时独留，对刘瑾委蛇避祸并自认因循隐忍、所损亦多；同传又确认其弥缝乱政、保全善类，故保留争议，不定谄媚或滥权。
  - person: 马文升
    identity_scope: 弘治朝兵部吏部尚书马文升
    capability_domains: [military, administration]
    source_refs:
      - https://zh.wikisource.org/zh-hans/明史/卷182
    talent:
      grade: top
      confidence: 0.97
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: comprehensive
      basis: 平乱、边防、马政、赈灾、漕运以及兵部、吏部均有可核绩效，兵部十三年且边务判断多次应验，正史称有文武才、长于应变，达到跨域顶级；尚未达到时代唯一的制度奠基档。
    negative:
      class: null
      severity: null
      confidence: 0.94
      authority_consensus: strong
      fact_support: none
      evidence_coverage: comprehensive
      basis: 一次报功勘验不实不足形成稳定负面类型；全传和史赞主要强调正直、廉隅与气节，判定为已审查但无确立负类。
  - person: 张苍
    identity_scope: 西汉丞相张苍
    capability_domains: [administration]
    source_refs:
      - https://zh.wikisource.org/zh-hans/汉书/卷042
    talent:
      grade: historic
      confidence: 0.98
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: comprehensive
      basis: 主持郡国上计，精通图书计籍、算术律历，完成汉初律历、度量和制度整饬，正史称汉家言律历者本张苍，属于基础制度奠基型历史级人才。
    negative:
      class: null
      severity: null
      confidence: 0.90
      authority_consensus: moderate
      fact_support: none
      evidence_coverage: substantial
      basis: 早年有罪亡归但罪状不明，历法主张后自黜属于政策纠错，均不足建立稳定负面类型。
  - person: 张释之
    identity_scope: 汉文帝朝廷尉张释之
    capability_domains: [correction]
    source_refs:
      - https://zh.wikisource.org/wiki/史記/卷102
      - https://zh.wikisource.org/zh-hant/漢書/卷050
    talent:
      grade: top
      confidence: 0.97
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: comprehensive
      basis: 阻止因口辩越级任官，依法劾太子梁王，并在惊乘舆和盗宗庙器案两次抗帝意维持法定刑，获文帝采纳且天下称之，达到司法守门员顶级；未形成跨时代完整法典或多项制度工程，不升历史级。
    negative:
      class: null
      severity: null
      confidence: 0.95
      authority_consensus: strong
      fact_support: none
      evidence_coverage: comprehensive
      basis: 本传与史赞均强调守法不阿意、公直谦抑，无稳定负面政治风险事实。
  - person: 李处耘
    identity_scope: 北宋将领李处耘
    capability_domains: [administration]
    source_refs:
      - https://zh.wikisource.org/zh-hans/宋史/卷257
      - https://zh.wikisource.org/zh/續資治通鑑長編/卷004
    talent:
      grade: important
      confidence: 0.93
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: substantial
      basis: 陈桥临机决策、平李重进后抚扬州减屋税、荆南奇袭及朗州湖南战役证明显著军政执行力，正史称临机决事、谋无不中；共同统军且与主帅失和限制个人归属，不升顶级。
    negative:
      class: cruel_official
      severity: major
      confidence: 0.96
      authority_consensus: strong
      fact_support: strong
      evidence_coverage: substantial
      basis: 正史直接记因饼价斩人、分食肥俘、黥俘制造大军食人恐怖并导致朗州焚城溃散，构成严重且可归责的战争酷虐。
  - person: 窦仪
    identity_scope: 后周北宋法制官员窦仪
    capability_domains: [correction]
    source_refs:
      - https://zh.wikisource.org/zh-hans/宋史/卷263
    talent:
      grade: top
      confidence: 0.96
      authority_consensus: strong
      performance_support: strong
      evidence_coverage: comprehensive
      basis: 预判契丹渡河并促成防守，主持贡举改革，奉诏重定刑统三十卷，并在中枢典章争议中援典定议，形成法律、考试和朝仪多个独立制度簇，达到制度型顶级；未长期主导治世，不升历史级。
    negative:
      class: null
      severity: null
      confidence: 0.96
      authority_consensus: strong
      fact_support: none
      evidence_coverage: comprehensive
      basis: 正史反复记其清介重厚、刚直有执守，并有保全胁从和守公帑的直接事实，无稳定负面类型。
