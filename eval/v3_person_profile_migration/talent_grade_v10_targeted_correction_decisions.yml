decisions:
  - person: 陈群
    current_grade: historic
    calibrated_grade: top
    primary_lanes: [institution, governance, talent_selection]
    correction_codes:
      - institution_longevity_was_mistaken_for_net_success
      - single_mixed_effect_institution_does_not_pass_historic_gate
    achievement_summary: 九品官人法由陈群核心建立并正式实施，另有长期选举、辅政和中枢判断成果，足以稳定通过制度领域top门槛。
    consistency_summary: 九品官人法解决了曹魏初期选官秩序问题，但后续门阀化和制度净效果争议显著；其他政绩不足以构成第二项同量级治世或制度重构。
    legacy_summary: 制度延续数百年证明影响深远，不等于持续产生正向治理效果，不能仅按寿命认定为historic基础遗产。
    review_basis: 陈群对九品官人法的个人归属很强，但成果集中于一项长期效果混合的选官制度；其余辅政、选举和节制营建表现足以稳居top，却未达到商鞅式多模块国家能力重构或李斯式帝国结构与标准化建设。制度寿命不能替代净效果，故从historic纠正为top。
    source_refs:
      - 三国志/卷22/陈群传
      - 晋书/卷45/刘毅传
  - person: 苏定方
    current_grade: top
    calibrated_grade: historic
    primary_lanes: [military]
    correction_codes:
      - v8_third_result_gate_was_incorrectly_reused
      - pyongyang_objective_unmet_was_overstated_as_defeat
    achievement_summary: 主帅击灭西突厥并生擒阿史那贺鲁，跨海灭百济并俘其王，又平都曼；战胜、决定性重创和完成战略征服分别记录。
    consistency_summary: 西突厥与百济是两个跨战区、高个人归属的时代级或国家级完整兑现；征高句丽先破敌并围平壤，最终未克撤军，属于战略目标未完成而非战场败仗。
    legacy_summary: 西突厥覆灭重塑唐朝西域格局，百济征服改变东北亚力量结构；即使不要求独立军事思想遗产，也已满足时代塑造加重复高风险兑现。
    review_basis: V9冻结合同不要求第三项同高度战果或军事遗产同时成立。苏定方灭西突厥、灭百济两次跨战区完整兑现，已经满足时代塑造高度与重复高风险兑现；都曼战果提供补强。高句丽方向先破敌、夺营并围平壤，未克只降低任务完成率，不能记作败仗。原top结论错误沿用了V8门槛，故纠正为historic。
    source_refs:
      - 新唐书/卷111/苏烈传
      - 旧唐书/卷4/高宗纪
