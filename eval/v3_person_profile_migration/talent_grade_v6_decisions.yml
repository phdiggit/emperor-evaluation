  downgrade_important:
    - person: 刘文静
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 晋阳起兵、联突厥和入关筹划合并为同一唐创业职责链，缺少链外第二个重大结果。
    - person: 叔孙通
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 朝仪、宗庙仪法和继承秩序属于同一汉初礼制工程，只有一个基础制度簇。
    - person: 周亚夫
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 七国之乱是国家级成果，细柳只证明军纪与备战，不能算第二个重大结果簇。
    - person: 夏原吉
      calibrated_grade: important
      failure_codes: [national_scale_result_missing, second_independent_major_cluster_missing]
      review_basis: 浙西治水成立，但长期户部履职与谏止北征缺少第二个可结算的国家级独立结果。
    - person: 姚广孝
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 靖难密策及相关守城转向均属同一战争链，集体编纂工程不能补足第二簇。
    - person: 孙传庭
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing, clear_result_instability]
      review_basis: 关中剿乱和陕西防务属于同一战区链，后期失利且无第二个独立完成结果。
    - person: 孙承宗
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 关宁防线、整军、用将与屯田均服务同一辽东经略链，再度出镇仍是同职责复建。
    - person: 安禄山
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing, clear_result_instability]
      review_basis: 河北控制、蓄兵动员与攻陷两京属于同一叛乱链，后续统治失败且无独立第二成果。
    - person: 张廷玉
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 军机规制是国家级制度主簇，集体奉敕编纂和同链机务不能另算第二重大成果。
    - person: 张辅
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing, high_personal_attribution_missing]
      review_basis: 安南征服、交阯平乱和制度整合高度集中于同一战区链，其他共同战事个人归属不足。
    - person: 彭越
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 梁地游击、断粮、夺城与垓下会师均属于同一楚汉战争职责链。
    - person: 施琅
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 沿海作战与澎湖台湾统一是同一海峡战争目标的连续阶段，缺少第二独立战区成果。
    - person: 曹彬
      calibrated_grade: important
      failure_codes: [first_tier_comparison_failed]
      review_basis: 灭蜀、灭南唐战果成立，但现有个人归属与持续独立统帅证据不足以稳过班超马援守门线。
    - person: 曹文诏
      calibrated_grade: important
      failure_codes: [national_scale_result_missing]
      review_basis: 陕甘山西平乱体现一线统帅能力，但主要是内乱清剿，缺少国家统一或决定性大战区级结果。
    - person: 李沆
      calibrated_grade: important
      failure_codes: [implemented_result_missing, second_independent_major_cluster_missing]
      review_basis: 中枢守成和边患预见主要是纠偏与判断，独立实施并可结算的国家级结果不足两簇。
    - person: 桑弘羊
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing, first_tier_comparison_failed]
      review_basis: 盐铁、均输和平准属于同一财政政策组合，不能按三个名称拆成独立国家级成果簇。
    - person: 狄仁杰
      calibrated_grade: important
      failure_codes: [national_scale_result_missing, first_tier_comparison_failed]
      review_basis: 司法纠偏、地方治理与中枢辅政能力明确，但全国性制度或治世结果不足以稳过姚崇宋璟守门线。
    - person: 英布
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing, high_personal_attribution_missing]
      review_basis: 现有材料主要覆盖反秦楚汉同一战争链，后续关键战役个人归属和第二独立成果不足。
    - person: 董仲舒
      calibrated_grade: important
      failure_codes: [implemented_result_missing]
      review_basis: 天人政治与公羊学思想影响重大，但现有证据不足以证明两个正式实施且结果明确的国家制度簇。
    - person: 虞世南
      calibrated_grade: important
      failure_codes: [national_scale_result_missing, second_independent_major_cluster_missing]
      review_basis: 书法、类书、文翰与规谏多属文化顾问同一职业链，缺少国家级独立实施成果。
    - person: 袁崇焕
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing, high_personal_attribution_missing]
      review_basis: 宁远宁锦及关外经营属于同一辽东防御链，且成果与孙承宗等共享。
    - person: 贺若弼
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing]
      review_basis: 平陈十策、欺敌准备与白土冈战果均集中于同一灭陈战略方向。
    - person: 贾谊
      calibrated_grade: important
      failure_codes: [implemented_result_missing]
      review_basis: 政论设计与文学成就突出，但国家治理主张缺少正式施行和持续结果。
    - person: 赵广汉
      calibrated_grade: important
      failure_codes: [national_scale_result_missing]
      review_basis: 颍川与京兆治理是优秀地方行政成果，尚未达到全国治世或基础制度级门槛。
    - person: 赵鼎
      calibrated_grade: important
      failure_codes: [first_tier_comparison_failed, implemented_result_missing]
      review_basis: 南宋危机辅政与军政统筹重要，但独立完成结果和长期治世成效不足以稳过姚崇宋璟。
    - person: 邓禹
      calibrated_grade: important
      failure_codes: [clear_result_instability, first_tier_comparison_failed]
      review_basis: 开国战略与组织贡献成立，但西征重大失利削弱第二簇的完成结果和第一梯队稳定性。
    - person: 韩琦
      calibrated_grade: important
      failure_codes: [implemented_result_missing, first_tier_comparison_failed]
      review_basis: 台谏、边防、新政与宰辅履历广，但改革和边防的持续可归责结果不足以稳过治国top守门线。
    - person: 额尔德尼
      calibrated_grade: important
      failure_codes: [second_independent_major_cluster_missing, high_personal_attribution_missing]
      review_basis: 满文创制、改进和行政应用属于同一共同文字工程，缺少第二独立重大簇。
    - person: 黄霸
      calibrated_grade: important
      failure_codes: [national_scale_result_missing, second_independent_major_cluster_missing]
      review_basis: 地方循吏治绩突出，但兴利安民与吏治执行属于同一地方治理链，缺少全国性第二成果。
