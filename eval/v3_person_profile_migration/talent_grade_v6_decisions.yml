      review_basis: 多个著名案件属于同一司法职责链，没有法典或全国性司法制度工程，降为important。
    - person: 李处耘
      calibrated_grade: important
      failure_codes: []
      review_basis: 军政贡献达到important，但联合统军且只有一个主要战役簇，不升top。
    - person: 窦仪
      calibrated_grade: top
      failure_codes: []
