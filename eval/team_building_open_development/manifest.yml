schema_version: i5b-factor-test-set-v1
status: frozen_test_input
task_code: V4-I5B-TEAM_BUILDING-OPEN_DEVELOPMENT
rule_code: team_building
dataset_role: open_development
factor_policy_version: team-building-factor-agent-v1
expected_unit_count: 8
applicability_options:
- applicable
- not_applicable
- insufficient_evidence
factor_option_catalog:
  talent_depth:
    multi_historic: 多名历史级人才形成深度
    multi_top: 多名顶级人才
    adequate_mixed: 层级混合但基本够用
    thin: 人才深度薄弱
    capability_risk_dominated: 能力风险主导团队
    not_applicable: 不属于团队时间窗
    insufficient_evidence: 画像覆盖不足
  core_role_coverage:
    four_core: 决策、行政、军事、纠错四面覆盖
    three_core: 覆盖三类核心功能
    two_core: 仅覆盖两类核心功能
    one_or_none: 至多覆盖一类核心功能
    critical_long_vacancy: 关键功能长期空缺
    not_applicable: 不属于团队时间窗
    insufficient_evidence: 岗位覆盖证据不足
  functional_complementarity:
    balanced_four: 四类功能均衡互补
    strong_three: 三类功能强互补
    ordinary_two: 两类普通互补
    homogeneous: 成员功能同质化
    qualified_roles_crowded_out: 合格功能成员被排挤
    not_applicable: 不属于团队时间窗
    insufficient_evidence: 互补结构证据不足
  continuity_structure:
    durable_multi_stage: 跨多个阶段保持团队能力
    stable_window: 窗口内稳定
    managed_turnover: 有序更替且功能不断裂
    stable_but_narrow: 稳定但结构狭窄
    fragmented: 团队结构碎片化
    purge_or_capture_collapse: 清洗或网络控制造成坍塌
    not_applicable: 不属于团队时间窗
    insufficient_evidence: 连续性证据不足
  confidant_dependency:
    distributed: 权责分布且无单点依赖
    bounded_anchor: 有核心锚点但依赖可控
    elevated_single_person: 单人依赖偏高
    single_point: 形成单点故障
    personal_network_capture: 私人网络控制团队
    centralized_ruler_bottleneck_without_confidant: 皇帝亲断形成瓶颈而非亲信依赖
    not_applicable: 不属于团队时间窗
    insufficient_evidence: 依赖结构证据不足
  key_role_integrity:
    no_material_vacancy: 关键岗位无实质空缺
    short_transition: 只有短期过渡空缺
    persistent_vacancy: 关键岗位持续空缺
    qualified_person_crowded_out: 合格成员被排挤
    systemic_hollowing: 关键功能系统性空心化
    not_applicable: 不属于团队时间窗
    insufficient_evidence: 关键岗位证据不足
rule_boundary:
  coverage_and_scoring_unit: 冻结皇帝时间窗、canonical人物集合和版本化画像；窗口内同人一次
  rule_specific_gates:
  - 人物质量只能读取 profile_snapshots；岗位、连续性、依赖和空缺只能读取 member_set 与 structural_observations
  - 同一窗口同一人物只计一次；跨年代不重叠人物不得拼接为团队
  - 亲信依赖只评价结构集中与脆弱性，不重复结算反任人唯亲
  cross_rule_double_counting_forbidden: true
  v3_assets_are_readonly_regression_candidates: true
evidence_coverage:
  schema_version: rule-factor-evidence-coverage-v1
  coverage_status: reviewed_test_fixture
  absence_inference_allowed: false
  formal_v4_fact: false
runtime_policy:
  mode: offline_report_only_shadow
  database_writes_allowed: false
  formal_scoring_allowed: false
