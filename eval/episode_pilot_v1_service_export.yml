schema_version: 1
export_code: episode_pilot_v1_service_fixture_export
status: frozen_existing_v3_outputs
mode: read_only_snapshot
gold_manifest: eval/episode_pilot_v1.yml
gold_review: eval/episode_pilot_v1_review.yml
episode_selection: frozen_episode_codes

required_outputs:
  source_cache:
    legacy_contract: retrieval-v3-object-source-claim-plan
    adapter_target_contract: source-cache-contract-v1
    path: tests/fixtures/episode_pilot_v1/source-cache-response.json
    encoding: utf-8
    format: json
    content_sha256_required: true
    required_top_level_fields:
      - fixture_schema_version
      - legacy_contract
      - captured_from_release
      - captured_at
      - capture_mode
      - environment_redactions
      - people
    required_legacy_payload_fields:
      - task_identity
      - source_documents
      - candidate_slices
      - coverage
      - stats

  claim_extractor:
    legacy_contract: retrieval-v3-claim-judge-final
    adapter_target_contract: assertion-extraction-contract-v1
    path: tests/fixtures/episode_pilot_v1/claim-extractor-response.json
    encoding: utf-8
    format: json
    content_sha256_required: true
    required_top_level_fields:
      - fixture_schema_version
      - legacy_contract
      - captured_from_release
      - captured_at
      - capture_mode
      - environment_redactions
      - people
    required_legacy_payload_fields:
      - status
      - documents
      - passages
      - claims
      - coverage

  metadata:
    path: tests/fixtures/episode_pilot_v1/export-metadata.yml
    encoding: utf-8
    format: yaml
    required_fields:
      - exported_at
      - source_cache_service_version
      - claim_extractor_service_version
      - source_cache_response_sha256
      - claim_extractor_response_sha256
      - gold_manifest_sha256
      - source_policy_version
      - extraction_profile
      - extraction_schema_version
      - model_policy_version

selection_requirements:
  source_cache:
    - 覆盖 frozen episode 所列全部 required_source_passages
    - 保留未命中、访问失败和 source identity 不确定记录
    - passage 必须包含 locator、原文、前后文和内容 hash
    - 不因同一 URL 或同一人物把跨时期 passage 合并
  claim_extractor:
    - 只处理本次 source cache response 中的 passage refs
    - 每条 assertion 必须回指一个实际 passage_cache_id
    - 保留疑、传闻、史家评论和责任主体不确定性
    - 外部 claim 输出进入 V4 后只具有 AssertionDraft 身份

prohibited_content:
  - credentials
  - dsn
  - private_network_address
  - production_write_token
  - rule_score
  - talent_grade
  - formal_judgment
  - formal_ranking
  - v3_database_primary_key_as_v4_identity

freeze_acceptance:
  - 两份响应均来自当前服务的真实只读执行，不是手工合成
  - 两份响应均通过对应 accepted contract
  - metadata 中的 SHA-256 与文件实际内容一致
  - claim extractor 的所有 passage ref 均存在于 source cache response
  - 同一输入重复导出不得再次调用模型或重复网络抓取
  - fixture 提交前删除凭据、私有地址和运行环境噪声

freeze_result:
  captured_from_release: 7e7db79f651d732adb59c62f0790756f8e2733ce
  captured_without_service_execution: true
  source_document_count: 11
  source_candidate_slice_count: 28
  claim_passage_count: 16
  claim_count: 43
  environment_paths_redacted: true
  semantic_payload_preserved: true

next_action: 实现两个薄 adapter，把 legacy fixture 转为 accepted V4 contract；不得修改 fixture 原始语义内容
