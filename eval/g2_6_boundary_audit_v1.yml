next_gate:
  code: g2_6_contract_and_reviewer_v2
  requirements:
    - HistoricalEpisode 保持原子边界
    - EpisodeRelation 表达纵向、撤任和因果联系
    - RuleEvidenceUnitDraft 只在规则层聚合且不得直接计分
    - ReviewUnit 局部缓存，无变化 unit 零模型调用
    - Episode 与 Relation 分开评分
    - 完成后才允许建立全新双层 Gold holdout
