decisions:
  - gold_episode_code: G25-GE-001
    subject: 噶礼
    decision: separate_episodes_with_relation
    atomic_boundaries:
      - 康熙三十五年督运及随后升迁
      - 康熙三十八年授山西巡抚
    relation_types: [promotion_after]
    rule_evidence_unit: 同一仕进弧线可由 appointment_delegation 聚合消费
    rationale: 不同年份的独立任用决策不得合成一个 HistoricalEpisode。

  - gold_episode_code: G25-GE-004
    subject: 施琅
    decision: adjudication_required
    alternatives:
      - single_episode_with_mandate_phases
      - separate_episodes_with_same_mandate_phase
    relation_types: [same_mandate_phase]
    rule_evidence_unit: 两种裁定均可投影为同一授权任务链
    rationale: 康熙元年授水师提督与二年后攻台受阻是否共享同一责任链仍需人工裁定。

  - gold_episode_code: G25-GE-006
    subject: 张英
    decision: separate_episodes_with_relations
    atomic_boundaries:
      - 入直南书房
      - 擢工部尚书
      - 罢尚书
    relation_types: [promotion_after, revokes]
    rule_evidence_unit: 三个事件组成长期任用与反馈弧线
    rationale: 十二年以上的升任与后续罢免是三个独立皇帝决策。

  - gold_episode_code: G25-GE-007
    subject: 明珠
    decision: separate_episodes_with_relation
    atomic_boundaries:
      - 授大学士
      - 被劾罢职
    relation_types: [revokes]
    rule_evidence_unit: 任用与撤任共同构成规则反馈单元
    rationale: 任命和十一年后的撤任不共享单一 action，但存在明确撤权关系。

  - gold_episode_code: G25-GE-009
    subject: 高力士
    decision: separate_episodes_with_relations
    atomic_boundaries:
      - 早期奉事
      - 先天奖授
      - 开元升任
    relation_types: [continues, promotion_after]
    rule_evidence_unit: 连续信任弧线由规则层聚合
    rationale: 三个迁授节点各自保留时间与决策身份。

  - gold_episode_code: G25-GE-012
    subject: 安禄山
    decision: separate_episodes_with_relation
    atomic_boundaries:
      - 玄宗授予安禄山兵柄
      - 安禄山自主聚兵准备叛乱
    relation_types: [causal_followup]
    rule_evidence_unit: 授权责任与后续反馈可共同进入用人规则证据单元
    rationale: 必须隔离皇帝授权责任与对象自主谋逆责任。

