schema_version: 1
review_code: episode_pilot_v1_source_and_boundary_review
reviewed_on: 2026-07-12
review_method:
  - 从 v3-freeze-20260712 只读提取候选 source ref
  - 独立打开史源承载页核对原书身份、卷次与短语锚点
  - 重新判断 episode 边界和 merge/split 关系
