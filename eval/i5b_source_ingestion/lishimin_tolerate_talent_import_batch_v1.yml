source_cache_import_gate:
  required:
    - 每个SourceDocument具有稳定source identity、edition、canonical URL或馆藏定位。
    - 保存不可变完整原文，不接受quote_preview、slice_text_preview、摘要或投影依据替代。
    - content_sha256基于规范化后的完整原文计算，并声明normalization profile。
    - 每个SourcePassage具有document revision lineage、稳定locator、原文和passage hash。
    - V3 document_code、source_slice_ref、claim_ref只作lineage，不直接成为V4事实。
    - 同一输入重跑必须命中幂等键且零重复业务写入。
  reject_when:
    - 页面抓取失败、只取得搜索摘要或转录被截断。
    - 书名、卷次、版本或URL与V3文档代码无法可靠重绑。
    - 原文哈希缺失，或哈希基于预览文本计算。
    - passage跨越多个独立事件且无法保留精确定位。

assertion_acceptance_gate:
  prerequisite: Source Cache导入通过后方可生成AssertionDraft；本批次不直接生成正式Assertion。
  required:
    - 皇帝归责、行为主体、行为方向、结果与时间上下文均由原文直接支持。
    - 制度级单元只结算正式反馈通道的建立与持续运行。
    - 个人级单元只结算个人反馈、留任、表达安全或信用修复，不重复结算制度收益。
    - 魏徵谏诤次数只增强高密度与跨领域判断，不按次数线性累分。
    - TT-O05身后信用撤销与复碑修复按时间分别记录，不能用生前安全材料抵销。
    - 每个AssertionDraft必须关联至少一个已入库SourcePassage和输入版本。
  manual_review_required:
    - TT-LSM-INSTITUTIONAL-REM-01与个人材料的重叠只可作为通道运行证明，不重复计分。
    - TT-LSM-CSL-01三个事件是否足以闭合跨阶段档位。
    - TT-LSM-DZ-01律令修定事件中戴胄作用与李世民归责。
    - TT-O01联合因子是否由最小充分证据闭合，避免二百余事展开成重复材料。

