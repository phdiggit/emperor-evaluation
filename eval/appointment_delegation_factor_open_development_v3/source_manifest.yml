  confidence: 0.95
- assertion_ref: V4PROD32-SUI-YG-YSJ-003
  source_passage_ref: PAS-B9EEC3DC47FE
  summary: 天下大乱后，虞世基压低败报而不据实上闻。
  confidence: 0.95
- assertion_ref: V4PROD32-SUI-YG-YSJ-004
  source_passage_ref: PAS-B9EEC3DC47FE
  summary: 压低败报后，皇帝不能得知外间变化。
  confidence: 0.95
- assertion_ref: V4PROD32-SUI-YJ-HRB-001
  source_passage_ref: PAS-17B7D786916E
  summary: 楊堅采纳高熲推荐，任賀若弼为吴州总管并委以平陈之事。
  confidence: 0.95
- assertion_ref: V4PROD32-SUI-YJ-HRB-002
  source_passage_ref: PAS-6E836AF5FE9F
  summary: 正式大举伐陈时，楊堅再任賀若弼为行军总管。
  confidence: 0.95
- assertion_ref: V4PROD32-SUI-YJ-HRB-003
  source_passage_ref: PAS-6E836AF5FE9F
  summary: 賀若弼率军隐蔽渡江，攻拔南徐州并在白土冈大破陈军。
  confidence: 0.95
- assertion_ref: V4PROD32-SUI-YJ-HRB-004
  source_passage_ref: PAS-4C0300379876
  summary: 虽然存在与韩擒虎争功及先期决战争议，楊堅仍明确称克定三吴为賀若弼之功并予重赏。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZG-QH-001
  source_passage_ref: PAS-C21DB305B6FB
  summary: 秦檜请求将和议排除群臣参与而专由自己与皇帝商议，趙構明确答复独自委任秦檜。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZG-QH-002
  source_passage_ref: PAS-C21DB305B6FB
  summary: 趙構和议意向坚定，秦檜确认其意不移后提交文字请求决定和议并禁止群臣参与。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZG-QH-003
  source_passage_ref: PAS-7ED5C597222C
  summary: 秦檜独专国政并推进和议时，中朝官员持续提出反对，反对者相继离去或被排斥。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZG-QH-004
  source_passage_ref: PAS-4A805FD06282
  summary: 金人后来败盟、四道入侵，河南诸郡相继陷没。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZG-QH-005
  source_passage_ref: PAS-4A805FD06282
  summary: 败盟后秦檜仍安于相位，并长期据位。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZX-WAS-001
  source_passage_ref: PAS-D05354BA5CE0
  summary: 趙頊任王安石为参知政事，并认可其变风俗、立法度的施政优先次序。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZX-WAS-002
  source_passage_ref: PAS-D05354BA5CE0
  summary: 朝廷设制置三司条例司并相继推行多项新法，王安石安排吕惠卿参与其事。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZX-WAS-003
  source_passage_ref: PAS-10C49941D523
  summary: 多项新法实施后，原文记载赋敛愈重、天下骚然。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZX-WAS-004
  source_passage_ref: PAS-6032C9C1CB68
  summary: 趙頊后来再拜王安石为同中书门下平章事，面对保甲和助役钱反馈仍继续由其处理新政。
  confidence: 0.95
- assertion_ref: V4PROD32-SONG-ZX-WAS-005
  source_passage_ref: PAS-6032C9C1CB68
  summary: 王韶开熙河奏功，趙頊认定王安石主议并赐予所服玉带。
  confidence: 0.95
- assertion_ref: V4PROD32-YUAN-HBL-BY-001
  source_passage_ref: PAS-A342A08D9D40
  summary: 忽必烈在史天泽因病请专任后，命伯顏领河南等路行中书省，所属均听其节制。
  confidence: 0.95
- assertion_ref: V4PROD32-YUAN-HBL-BY-002
  source_passage_ref: PAS-A342A08D9D40
  summary: 忽必烈要求伯顏体察其意，以不嗜杀的方式平定江南。
  confidence: 0.95
- assertion_ref: V4PROD32-YUAN-HBL-BY-003
  source_passage_ref: PAS-4DD7DD737183
  summary: 伯顏所统军队突破阳罗堡并渡江，随后鄂州、汉阳军、德安府及程鹏飞所部归降。
  confidence: 0.95
- assertion_ref: V4PROD32-YUAN-HBL-BY-004
  source_passage_ref: PAS-FCD34DCA9F89
  summary: 宋平后，忽必烈慰劳伯顏并再次授职、赐予赏赉。
  confidence: 0.95
- assertion_ref: V4PROD32-YUAN-HBL-AHM-001
  source_passage_ref: PAS-D8616F77AD87
  summary: 忽必烈因阿合馬表现出的功利成效和辩论能力而授其政柄，并一度言无不从。
  confidence: 0.95
- assertion_ref: V4PROD32-YUAN-HBL-AHM-002
  source_passage_ref: PAS-D8616F77AD87
  summary: 安童指出尚书省越过既定议奏程序，忽必烈承认其意见有理。
  confidence: 0.95
- assertion_ref: V4PROD32-YUAN-HBL-AHM-003
  source_passage_ref: PAS-63799CB9BFBC
  summary: 在阿合馬主张大小事务皆受委任、用人应自择后，忽必烈同意除重刑和迁上路总管外其余事务均付阿合馬。
  confidence: 0.95
- assertion_ref: V4PROD32-YUAN-HBL-AHM-004
  source_passage_ref: PAS-C9C947E91397
  summary: 阿合馬久居其位后援引党羽、蒙蔽政务、加重课赋，导致民众流移，并迫害揭发者秦长卿致死。
  confidence: 0.95
- assertion_ref: V4PROD32-QING-YZ-NGY-001
  source_passage_ref: PAS-CB32C52393B1
  summary: 青海叛乱后，胤禛命年羹堯进讨，并要求相关将领及川、陕、滇督抚提镇的军事事务均告年羹堯。
