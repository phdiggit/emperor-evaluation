  confidence: 0.95
- assertion_ref: V4PROD32-QING-YZ-NGY-005
  source_passage_ref: PAS-31D90E638A64
  summary: 在多名官员奏报罪状后，胤禛命分案议罪，最终罢年羹堯将军并尽削其职。
  confidence: 0.95
- assertion_ref: V4PROD32-QING-XY-SL-001
  source_passage_ref: PAS-2089D306EABD
