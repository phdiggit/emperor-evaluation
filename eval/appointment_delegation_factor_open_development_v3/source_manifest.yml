- assertion_ref: V4PROD32-QING-XY-SL-005
  source_passage_ref: PAS-3D3709738C9A
  summary: 玄烨又批准施琅关于安置郑氏人员、申严海禁及稽核商船的后续请求。
  confidence: 0.95
- assertion_ref: V4PROD32-HAN-LC-JC-001
  source_passage_ref: PAS-0C4C9C5160CD
  summary: 江充奏称武帝疾病由巫蛊所致，武帝任命江充为使者治理巫蛊。
