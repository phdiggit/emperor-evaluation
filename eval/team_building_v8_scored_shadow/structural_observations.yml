  observation_basis: 1368至1380的冻结窗口中，刘基、李善长、徐达、宋濂、常遇春五人的 promoted member_set 均覆盖完整区间；决策、行政、军事、纠错由不同人物承担，至少三类功能可独立匹配，也不存在一人独占两类核心功能。材料仅支持窗口内角色结构未见实质断裂，未提供符合合同的前任、后任及交接时点，因此不能仅凭人物退出常识升级为
    managed_turnover；开放集人工 Gold 与资格报告均支持 stable_window/distributed。
