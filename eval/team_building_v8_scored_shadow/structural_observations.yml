- unit_ref: TB-O07
  frozen_workset_member_set_complete: true
  continuity_structure: stable_but_narrow
  confidant_dependency: single_point
  observation_basis: 绍兴和议后的1142—1155冻结窗口内，秦桧、万俟卨、汤思退的成员关系被记录为持续覆盖，但三人功能几乎全部集中于行政，只有秦桧同时承担decision与administration，军事和纠错没有独立入口；这不是成员频繁断裂，而是长期稳定却结构狭窄。现有人工冻结结构审计明确把多项核心功能及替代入口不足归于秦桧，故沿用single_point；其余两名行政成员不能形成对决策入口的替代。
  source_refs:
  - eval/v3_person_profile_migration/team_window_promotion.json#TB-O07
  - eval/team_building_open_development/worklist.json#TB-O07
  - eval/team_building_open_development/factor_gold.yml#TB-O07
  - eval/team_building_open_development/qualification_report_v3.json
- unit_ref: TB-O08
  frozen_workset_member_set_complete: true
  continuity_structure: stable_window
  confidant_dependency: distributed
  observation_basis: 弘治1488—1505冻结班底中，刘健、谢迁、李东阳、马文升、刘大夏均被记录为覆盖完整窗口，输入未提供实质更替、交接或核心功能断裂节点，因此按现有结构合同判为stable_window。决策由刘健、李东阳分担，行政由刘健、马文升分担，军事由马文升、刘大夏分担，纠错由谢迁独立承担；没有一人独占两类核心功能，四类功能可由不同成员完成独立匹配，故为distributed而非单点依赖。
  source_refs:
  - eval/v3_person_profile_migration/team_window_promotion.json#TB-O08
  - eval/team_building_open_development/worklist.json#TB-O08
  - eval/team_building_open_development/factor_gold.yml#TB-O08
  - eval/team_building_open_development/qualification_report_v3.json
- unit_ref: TB-S01
  frozen_workset_member_set_complete: true
  continuity_structure: durable_multi_stage
  confidant_dependency: distributed
  observation_basis: 已开封 sealed 的冻结结构审查明确识别出至少两个阶段及成员交接，交接前后决策、行政、军事三类核心功能持续存在，因此保留 durable_multi_stage；邓禹虽兼任决策与军事，但军事另有吴汉、冯异、耿弇，行政另有冯异、寇恂，可由不同人物形成三类独立锚点，不构成单一亲信入口。迁移后的全窗
    active_from/active_to 只是归一化成员覆盖，不能反向抹除冻结阶段判断。
  source_refs:
  - eval/v3_person_profile_migration/team_window_promotion.json#TB-S01
  - eval/team_building_sealed_holdout/worklist.json#TB-S01
  - eval/team_building_sealed_holdout/factor_gold.yml#TB-S01
- unit_ref: TB-S02
  frozen_workset_member_set_complete: true
  continuity_structure: managed_turnover
  confidant_dependency: distributed
  observation_basis: 已开封 sealed 的冻结结构审查记录窗口内存在有序成员更替且后继承接关键功能，未达到跨多阶段长期稳定所需的更强证据，故为 managed_turnover。周勃、陈平、张苍、张释之、贾谊分别提供军事、决策、行政、纠错的多人物锚点，陈平兼任决策与行政但两类均有独立替代锚点，不形成单人依赖。
  source_refs:
  - eval/v3_person_profile_migration/team_window_promotion.json#TB-S02
  - eval/team_building_sealed_holdout/worklist.json#TB-S02
  - eval/team_building_sealed_holdout/factor_gold.yml#TB-S02
- unit_ref: TB-S03
  frozen_workset_member_set_complete: true
  continuity_structure: managed_turnover
  confidant_dependency: bounded_anchor
  observation_basis: 既有已开封sealed结构审计记录了有界更替和短期过渡，核心功能在更替后仍可恢复，不按稳定不变窗口处理。
  source_refs:
  - eval/v3_person_profile_migration/team_window_promotion.json#TB-S03
  - eval/team_building_sealed_holdout/factor_gold.yml#TB-S03
- unit_ref: TB-S04
  frozen_workset_member_set_complete: true
  continuity_structure: stable_window
  confidant_dependency: bounded_anchor
  observation_basis: 五名成员的归一化活动区间覆盖960—976窗口，冻结结构审查未见实质更替或核心功能断裂，故为 stable_window。赵普是决策与行政的核心协调者，但行政另有李处耘、军事由曹彬和潘美、纠错由窦仪独立承担；依赖集中在有界协调锚点，未达到两类以上功能只能依赖一人的
    elevated 或 single-point 门槛。
  source_refs:
  - eval/v3_person_profile_migration/team_window_promotion.json#TB-S04
  - eval/team_building_sealed_holdout/worklist.json#TB-S04
  - eval/team_building_sealed_holdout/factor_gold.yml#TB-S04
