- unit_ref: TB-O04
  frozen_workset_member_set_complete: true
  continuity_structure: forced_turnover_collapse
  confidant_dependency: centralized_ruler_bottleneck_without_confidant
  observation_basis: 1381至1398的 promoted member_set 已完整收录蓝玉、傅友德、冯胜、詹徽，但功能仅集中于军事与行政；窗口审查明确记录清洗或私人控制使多个关键功能退出，多个核心功能长期弱化或空心化，故应按现行枚举记为
    forced_turnover_collapse，而不是稳定窗口或受控更替。关键中枢空缺后由皇帝亲断，材料未显示由某一亲信代行并控制入口，因此依赖类型是 centralized_ruler_bottleneck_without_confidant。开放集旧
    Gold 的 purge_or_capture_collapse 是同一语义的旧枚举，资格报告对连续性和依赖均与该 Gold 一致。
  source_refs:
  - eval/v3_person_profile_migration/team_window_promotion.json#TB-O04
  - eval/team_building_open_development/worklist.json#TB-O04
  - eval/team_building_open_development/factor_gold.yml#TB-O04
  - eval/team_building_open_development/qualification_report_v3.json
  - config/i5b-factor-semantics.yml#continuity_structure
- unit_ref: TB-O05
  frozen_workset_member_set_complete: true
  continuity_structure: stable_window
  confidant_dependency: distributed
  observation_basis: 当前冻结输入将姚崇、宋璟、张说、张九龄、萧嵩的活动区间统一覆盖713—736，且未提供可验证的stage snapshots、role transitions或核心功能断裂区间，因此按现有证据只能判为窗口内稳定，不能扩写为跨阶段耐久。决策由姚崇、张说分担，行政由姚崇、宋璟分担，纠错由宋璟、张九龄分担，军事另有萧嵩承担；至少三类功能存在独立锚点，未形成单人对两类以上核心入口的独占，故依赖为distributed。frozen_workset_member_set_complete仅表示冻结测试窗口成员集完整，不表示历史人物名录穷尽。
  source_refs:
  - eval/v3_person_profile_migration/team_window_promotion.json#TB-O05
  - eval/team_building_open_development/worklist.json#TB-O05
  - eval/team_building_open_development/factor_gold.yml#TB-O05
  - eval/team_building_open_development/qualification_report_v3.json
