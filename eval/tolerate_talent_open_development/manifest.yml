- unit_ref: TT-O06
  ruler: 刘邦
  subject: 萧何
  context_kind: episode
  context_summary: 表达、安全、专业自治或冲突修复事件
  evidence:
  - assertion_ref: EVD-I5B-LIUBANG-SUPP-XIAOHE-SAFETY-001@A1
    summary: 萧何并非异姓王，而是最高功臣和长期留守核心。史料显示刘邦晚年对其有疑心，萧何需自污以求上心安，后又因请苑事件被交廷尉。该材料说明功臣安全压力并不限于异姓王集团；但王卫尉进言后当日赦出，且刘邦随后以自责方式解释，故列中负而非强负。
    quote: 上所为数问君者，畏君倾动关中……乃下相国廷尉，械系之。数日，王卫尉侍，前问曰：相国何大罪？
    source:
      source_ref: SRC-SJ-J53-XIAOHE-SAFETY-LIUBANG-SUPP-001
      source_title: 史记
      locator: 萧相国世家第二十三，汉十一年至汉十二年萧何疑忌、自污、廷尉处置与赦出段
      url: https://zh.wikisource.org/wiki/%E5%8F%B2%E8%A8%98/%E5%8D%B7053
      lineage_kind: readonly_v3_regression_candidate
