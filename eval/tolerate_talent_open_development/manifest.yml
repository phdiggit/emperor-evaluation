- unit_ref: TT-O02
  ruler: 刘邦
  subject: 张良
  context_kind: episode
  context_summary: 表达、安全、专业自治或冲突修复事件
  evidence:
  - assertion_ref: EVD-I5B-LIUBANG-POS-ZHANGLIANG-RONGJIAN-001@A1
    summary: 张良早期多次以兵法进说，刘邦能“善之，常用其策”；入秦后又能在张良与樊哙劝谏下放弃留居秦宫、还军霸上。该证据直接命中第五项B的反馈入口、容纳谋臣意见和实际采纳建议。
    quote: 良數以太公兵法說沛公，沛公善之，常用其策……良曰：『忠言逆耳利於行……願沛公聽樊噲言。』沛公乃還軍霸上。
    source:
      source_ref: SRC-SJ-J55-ZHANGLIANG-LIUBANG-POS-001
      source_title: 史记
      locator: 留侯世家第二十五，张良归沛公及武关、霸上进谏段
