  context_kind: episode
  context_summary: 表达、安全、专业自治或冲突修复事件
  evidence:
  - assertion_ref: EVD-I5B-LIUBANG-NEG-HANXIN-001@A1
    summary: 韩信案兼具真实政权安全风险与功臣安全感损害：云梦被缚、降封及长乐钟室被诛均会削弱高功臣对授权秩序的预期。但《史记》同时记载陈豨案中韩信存在从中起事部署，不能把此案机械判为无端疑忌杀功臣。
