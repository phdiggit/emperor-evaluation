# 全项目人工运行入口配置。
# 只声明当前启用子项、默认时区、默认人物组、人物组、输出开关和本地工具开关；不承载候选池、展示细节、关键词或人工复核规则。
# 短名单可直接写 persons；长名单请用 persons_ref 指向 data/configs/lists/ 下的 YAML 清单。

version: 2
timezone: Asia/Shanghai

active_subitem: 第五项B
default_person_group: typical

person_groups:
  all:
    label: 所有君主
    persons_ref: data/configs/lists/所有君主.yml
  three_pilot:
    label: 三人试点
    persons:
    - 李世民
    - 刘秀
    - 刘庄
  typical:
    label: 代表性皇帝
    persons:
    - 李世民
    - 刘秀
    - 刘庄
    - 嬴政
    - 刘邦
    - 刘恒
    - 刘彻
    - 刘询
    - 刘启
    - 杨坚
    - 杨广
    - 李隆基
    - 武则天
    - 李治
    - 李渊
    - 李纯
    - 赵匡胤
    - 赵恒
    - 赵光义
    - 赵构
    - 赵祯
    - 朱元璋
    - 朱棣
    - 朱瞻基
    - 朱由检
    - 皇太极
    - 玄烨
    - 胤禛
    - 弘历

outputs:
  matrix: true
  review_entry: true
  subitem_details: true
  evidence_indexes: true

tooling:
  agent_runtime:
    defaults:
      model: gpt-5.6-luna
      reasoning_effort: medium
      max_workers: 4
      timeout_seconds: 1800
    stages:
      retrieval_taskgen:
        batch_size: 1
        max_workers: 4
        timeout_seconds: 1800
      retrieval_judge:
        shard_size: 8
        max_workers: 4
        timeout_seconds: 1800
      alias_refiner:
        batch_size: 8
        max_workers: 2
        timeout_seconds: 1200
      object_source_hint_review:
        batch_size: 8
        max_workers: 2
        timeout_seconds: 1200
      claim_extraction:
        shard_size: 1
        max_workers: 4
        timeout_seconds: 1800
      claim_passage_repair:
        batch_size: 5
        max_workers: 4
        timeout_seconds: 1800
      material_review:
        batch_size: 8
        max_workers: 4
        timeout_seconds: 1800
      identity_judgment:
        batch_size: 12
        max_workers: 4
        timeout_seconds: 1800
      factorization:
        batch_size: 8
        max_workers: 4
        timeout_seconds: 1800
      v3_candidate_review:
        batch_size: 8
        max_workers: 4
        timeout_seconds: 1800
      v3_context_review:
        batch_size: 6
        max_workers: 4
        timeout_seconds: 1800
      v3_unseeded_actor_review:
        batch_size: 8
        max_workers: 2
        timeout_seconds: 1200
      v3_negative_chain_review:
        batch_size: 4
        max_workers: 2
        timeout_seconds: 1200
      v3_expected_event_inventory:
        batch_size: 2
        max_workers: 2
        timeout_seconds: 1200
      v3_expected_event_reconciliation:
        batch_size: 1
        max_workers: 2
        timeout_seconds: 1200
  source_excerpt_pool:
    default_workflow_code: I5B
    paths:
      query_profile: data/query_profile_batches/i5b_layered_retrieval_profiles_20260630.jsonl
      query_profile_shared_copy:
        server: /data2/backups/code/emperor-evaluation/query-profiles/i5b_layered_retrieval_profiles_20260630.jsonl
        windows: Y:/code/emperor-evaluation/query-profiles/i5b_layered_retrieval_profiles_20260630.jsonl
      source_pack_root:
        server: /data2/backups/code/emperor-evaluation/source-packs
        windows: Y:/code/emperor-evaluation/source-packs
    workflows:
      I5B:
        adapter: i5b
        source_scope: I5B offline source pack
        paths:
          query_profile: data/query_profile_batches/i5b_layered_retrieval_profiles_20260630.jsonl
          query_profile_shared_copy:
            server: /data2/backups/code/emperor-evaluation/query-profiles/i5b_layered_retrieval_profiles_20260630.jsonl
            windows: Y:/code/emperor-evaluation/query-profiles/i5b_layered_retrieval_profiles_20260630.jsonl
          source_pack_root:
            server: /data2/backups/code/emperor-evaluation/source-packs
            windows: Y:/code/emperor-evaluation/source-packs
          jobs_dir:
            server: /data2/backups/code/emperor-evaluation/jobs
            windows: Y:/code/emperor-evaluation/jobs
          logs_dir:
            server: /data2/backups/code/emperor-evaluation/logs
            windows: Y:/code/emperor-evaluation/logs
          handoff_root:
            server: /data2/backups/code/emperor-evaluation/handoffs
            windows: Y:/code/emperor-evaluation/handoffs
    cache:
      enabled: true
      backend: postgres
      dsn_env: EMPEROR_EVAL_PG_DSN
      schema: tool_cache
