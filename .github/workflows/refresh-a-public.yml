name: Refresh A public projection

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - .github/workflows/refresh-a-public.yml

permissions:
  contents: write

jobs:
  refresh-a-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Refresh A formal public projection
        run: python -m emperor_v4.eval second-item-a-public --write
      - name: Verify A formal public projection
        run: python -m emperor_v4.eval second-item-a-verify
      - name: Commit deterministic A refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "docs/评分结算/净收益/第二项治国净收益/制度行政"
          if git diff --cached --quiet; then
            echo "A public projection is already current"
            exit 0
          fi
          git commit -m "同步A确定性公开投影"
          git push
