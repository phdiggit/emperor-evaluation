              [
                  {'receiver':'雍正帝胤禛','carrier':'《庭训格言》及雍正序言','actual_use':'长期把康熙训言作为自身治国与修身准则，并编定留给后嗣','source_basis':'PRIMARY_TEXT_DIGITAL_TRANSCRIPTION_READ'},
                  {'receiver':'乾隆帝弘历','carrier':'康熙军政训言及实录讨论','actual_use':'援引康熙武备/行围原则为现实军政训练辩护并自我约束','source_basis':'PRIMARY_TEXT_DIGITAL_TRANSCRIPTION_SCOPED_REVIEW'}
              ], [ting_idx,qian_idx],
              '虽具系统内容、专门载体与多代实际使用，但接收高度集中于同一清朝父子—祖孙继承环境；V1.4明确规定单一王朝连续继承不能单独达到S+，故守S。',
              '清代制度继续运行属于深度；这里只有后世皇帝把“圣祖训言/康熙治道”明确作为自身政治准则的部分计范式。',
              '范式S成立但本条内部S基础已由范围S、深度S-独立成立；个人因果S-维持，范式不再上调，公众S不变。'
          )

          r = rec('胤禛')
          yong_idx = add_source(r, {
              'kind':'HISTORICAL_WEB_SOURCE','title':'《世宗宪皇帝圣训》四库全书本',
              'url':'https://zh.wikisource.org/zh-hans/%E4%B8%96%E5%AE%97%E6%86%B2%E7%9A%87%E5%B8%9D%E8%81%96%E8%A8%93_%28%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC%29/%E5%85%A8%E8%A6%BD1',
              'evidence_note':'乾隆命编雍正圣训，广泛分类整理其治国言论，用于确认后继最高权力对雍正治道的系统承接与教育化。',
