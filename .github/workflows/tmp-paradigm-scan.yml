name: Temporary paradigm remediation

on:
  push:
    branches:
      - codex/single-ruler-session-control

permissions:
  contents: write
  pages: write

jobs:
  remediate:
    if: github.event.head_commit.message == '整改人物范式并系统补证'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/single-ruler-session-control
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e . -r reader/requirements.txt pytest

      - name: Apply paradigm remediation and Liu Che depth review
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          ROOT = Path('docs/评分结算/历史影响/01-历史影响正式结算')
          CONTRACT = Path('docs/项目总纲/历史影响评价总则.md')
          NOTE = '2026-09-15全池人物范式系统扩搜：按人物化接收新门槛反查帝王教育、治道选编与最高层实际援引；制度/法统模板沿用退回深度；S+按跨朝跨环境、多领域、反复实际使用硬门复核。'

          # 1) Contract: FORMAL-V1.4 and strict person/reign-centered paradigm boundary.
          text = CONTRACT.read_text(encoding='utf-8')
          if '`FORMAL-V1.3`' not in text:
              raise SystemExit('expected FORMAL-V1.3')
          text = text.replace('`FORMAL-V1.3`', '`FORMAL-V1.4`', 1)
          old_splus = '| S+ | 主体核心与多个主要外围政治空间共同发生极大规模重组，代表本评价对象中可由史实证明的最高覆盖量级 | 多域国家/文明底层结构跨多轮改朝换代持续锁定 | 删除本人，核心足迹大部消失或根本换轨，现实替代者难在相近窗口复制 | 系统政治模板跨朝、跨环境，被多代最高权力反复实际使用 |'
          new_splus = '| S+ | 主体核心与多个主要外围政治空间共同发生极大规模重组，代表本评价对象中可由史实证明的最高覆盖量级 | 多域国家/文明底层结构跨多轮改朝换代持续锁定 | 删除本人，核心足迹大部消失或根本换轨，现实替代者难在相近窗口复制 | 系统性人物/治道范型跨朝、跨环境、跨多类政治问题，被多代独立最高权力反复实际使用，并有稳定专门载体或同等强度传播结构 |'
          if old_splus not in text:
              raise SystemExit('S+ row not found')
          text = text.replace(old_splus, new_splus, 1)
          start = text.index('**范式**须闭合')
          end = text.index('## 4. 总档裁判与公众标签')
          paradigm_contract = '''**范式**须闭合“可识别的人物/治道内容→稳定载体→后世最高权力实际接收”。核心对象是**这个人或其统治实践本身被当成政治参照**，而不是其留下的制度、名号、礼仪或程序后来仍在运转。后世最高权力或决策中枢须能识别地把前代人物、其治世/失政或具体统治经验当作榜样、反例、标准、鉴戒或现实政治论据，并进入帝王教育、君臣论政或实际选择。

采用“**去名测试**”切分深度与范式：若删去前代人物姓名，后世行为仍可由既存制度、礼仪、法统、行政流程或政治结构完整解释，默认只计深度；若删去人物/治世指称后，后世的政治论证、教育内容或选择约束本身失去关键依据，才进入范式。皇帝名号、封禅、即位告天、郡县结构、官制、法律谱系、合法性程序等即使可追溯至某人，只凭后世沿用也不得转写为范式；高质量研究建立的制度谱系用于深度，不得替代行为者层面的“人物化接收”。

有效范式证据主要包括：①后世最高权力或其决策中枢明确点名人物/治世/事例，并据以论证、调整或约束现实选择；②具有明确最高权力受众、选编者或讲习场景的帝王教育与治道文本，其中人物案例实际进入教育/治道标准；③进入重大决策、经筵、实录或最高层君臣论政的反复正反面鉴戒，并能说明其现实用途。研究者事后类比、文学形象、一般名望、同名制度延续、仅称“祖宗之法”而无法分离到具体人物内容者均不足。

同一帝王教材、同一治道选编、同一最高权力窗口中的多个故事只算**一个接收窗口**，不得按篇数或引文数堆叠；同一接收者多次引用也不拆成多个独立接收者。祖宗之法只有在明确以具体先帝/治世作为选择约束时才计人物范式，普通制度承接仍归深度。同一史实不得因“后世继续使用”同时给深度和范式重复加码；只有另有独立的人物化接收证据时，二者才能分别入账。

A须有一个可信的最高权力实际使用或帝王教育窗口；A+须有一个高质量闭环并有重复使用、第二独立教育/治道窗口或同等辅助接收。S-以上须多次独立最高权力接收，且不能主要靠同一教材内部堆故事。S要求多个独立最高权力反复把人物/治世用于现实政治论证或行为，单纯跨朝收录教材不足以独撑。**S+使用硬门：**必须同时具备（1）系统性而非单一德目/单一警戒主题；（2）稳定专门载体、专门治道语汇或同等强度传播结构；（3）跨朝且跨政治环境的多代独立最高权力接收，同一王朝父子祖孙连续继承本身绝不够；（4）至少跨多个治理问题实际使用；（5）存在多次可定位的政治教育、论证或行为闭环，而非只靠后世评价或选本收录。未同时满足者不得以名望、材料数量或王朝寿命补到S+。

区分`LOCATED_RECEPTION`、`IMAGE_ONLY`与`NOT_LOCATED`。高档须列接收者、载体、实际用途及独立性边界；未定位不等于历史上不存在。正面示范与反面鉴戒同权，但都必须经过上述人物化接收门。范式是独立修正维度，不回填范围、深度或个人因果，也不得突破总档主维度和归责硬门。

'''
          text = text[:start] + paradigm_contract + text[end:]
          CONTRACT.write_text(text, encoding='utf-8')

          # 2) Load all shards and index records by name.
          files = {}
          by_name = {}
          for path in sorted(ROOT.glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              files[path] = data
              for rec in data.get('collections', {}).get('records', {}).get('records', []):
                  by_name.setdefault(rec.get('ruler_name'), []).append((path, rec))

          dirty = set()
          changed = {}

          def rec(name: str):
              xs = by_name.get(name, [])
              if len(xs) != 1:
                  raise KeyError(f'{name}: expected exactly one record, got {len(xs)}')
              path, r = xs[0]
              dirty.add(path)
              return r

          def add_source(r, source):
              refs = r.setdefault('source_refs', [])
              url = source.get('url')
              for i, s in enumerate(refs):
                  if url and s.get('url') == url:
                      return i
                  if not url and s.get('title') == source.get('title'):
                      return i
              refs.append(source)
              return len(refs) - 1

          def add_note(r, note=NOTE):
              notes = r.setdefault('historical_source_notes', [])
              if note not in notes:
                  notes.append(note)

          def set_foundation(r, grade, custom=None):
              f = r.setdefault('foundation', {})
              if custom is not None:
                  f['paradigm_adjustment'] = custom
                  return
              if grade == 'A':
                  f['paradigm_adjustment'] = '范式A已闭合一个可信的最高权力教育/治道接收窗口；按合同A不抬总档，仅修正范式维度。'
              elif grade == 'A+':
                  f['paradigm_adjustment'] = '范式A+由高质量接收并有重复/第二独立教育或治道窗口成立；A+不独立突破主维度或既有总档硬门。'
              elif grade == 'S-':
                  f['paradigm_adjustment'] = '范式S-由多次独立人物化接收成立；只按合同确认范式边界，不重复越过主维度、个人因果或既有总档上限。'
              elif grade == 'S':
                  f['paradigm_adjustment'] = '范式S由多个独立最高权力对人物/治道的反复实际接收成立；仍受主维度、个人因果和禁止双重抬档规则约束。'
              elif grade == 'S+':
                  f['paradigm_adjustment'] = '范式S+通过系统性、跨朝跨环境、多领域、反复实际使用硬门；仍不得替代范围、深度或个人因果。'
              else:
                  f['paradigm_adjustment'] = f'范式{grade}按人物化接收证据处理，不反写范围、深度或个人因果。'

          def set_paradigm(name, grade, analysis, receptions, indices, limitation, depth_sep, foundation=None):
              r = rec(name)
              old = r.get('dimensions', {}).get('paradigm', {}).get('grade')
              r.setdefault('dimensions', {}).setdefault('paradigm', {})['grade'] = grade
              r['paradigm_analysis'] = analysis
              r['paradigm_review'] = {
                  'evidence_status': 'LOCATED_RECEPTION',
                  'receptions': receptions,
                  'limitation': limitation,
                  'depth_separation': depth_sep,
                  'source_ref_indices': sorted(set(indices)),
              }
              set_foundation(r, grade, foundation)
              add_note(r)
              changed[name] = (old, grade)
              return r

          DIJI_INTRO = {
              'kind': 'HISTORICAL_WEB_SOURCE',
              'title': '故宫博物院：《帝鉴图说》的编纂与帝王教育',
              'url': 'https://www.dpm.org.cn/journal_detail/114972.html',
              'evidence_note': '用于确认张居正等为年少明神宗编纂《帝鉴图说》，以历代帝王善政与失政案例实施最高权力教育；同一书内多个故事只计一个万历接收窗口。',
              'verification_mode': 'IMPERIAL_EDUCATION_PROGRAM_SCOPED_REVIEW',
          }
          DIJI_TEXT = {
              'kind': 'HISTORICAL_WEB_SOURCE',
              'title': '《帝鉴图说》全文（中国哲学书电子化计划）',
              'url': 'https://ctext.org/wiki.pl?chapter=560960&if=gb&remap=gb',
              'evidence_note': '用于定向核对入选人物及其善政/鉴戒案例；与故宫对编纂目的的说明共同使用，不按篇数拆分接收窗口。',
              'verification_mode': 'PRIMARY_TEXT_DIGITAL_TRANSCRIPTION_SCOPED_REVIEW',
          }
          ZHIZHONG = {
              'kind': 'HISTORICAL_WEB_SOURCE',
              'title': '《钦定执中成宪》四库全书本',
              'url': 'https://zh.wikisource.org/zh-hans/%E6%AC%BD%E5%AE%9A%E5%9F%B7%E4%B8%AD%E6%88%90%E6%86%B2_%28%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC%29/%E5%85%A8%E8%A6%BD',
              'evidence_note': '乾隆序追述雍正命采历代帝王嘉言善政并“亲为删定”，作为启迪后人、昭垂标准的治道选编；同一选编内多条材料只计一个雍正最高权力接收窗口。',
              'verification_mode': 'PRIMARY_TEXT_DIGITAL_TRANSCRIPTION_SCOPED_REVIEW',
          }

          diji_cases = {
              '刘邦':'入关约法、任用三杰等创业与治道案例', '刘恒':'露台惜费等俭政案例', '刘彻':'蒲轮征贤与女巫出入的正反案例',
              '刘询':'诏儒讲经', '刘秀':'宾礼故人、夜分讲经等治道案例', '刘庄':'临雍拜老、爱惜郎官', '刘备':'君臣鱼水',
              '司马炎':'焚裘示俭与羊车游宴的正反案例', '刘裕':'留衲戒奢', '李世民':'纳谏、任贤、节用等贞观案例',
              '李隆基':'委任贤相、听谏与宠幸番将、侈费的正反案例', '李亨':'烧梨联句', '李纯':'不受贡献、延英忘倦、淮蔡成功等案例',
              '李忱':'屏书政要、焚香读疏', '赵匡胤':'敬受母教、碎七宝器、受言书屏等案例', '赵光义':'竟日观书、引衣容直',
              '赵祯':'仁厚、纳谏与恤民等仁宗案例', '赵顼':'轸念流民', '赵煦':'烛送词臣',
              '嬴政':'遣使求仙、焚书坑儒、大营宫室', '刘骜':'五侯擅权、市里微行、宠昵飞燕', '刘欣':'嬖佞戮贤',
              '刘志':'十侍乱政', '刘宏':'西邸鬻爵、列肆后宫', '曹叡':'芳林营建', '刘骏':'笑祖俭德', '萧衍':'舍身佛寺',
              '高洋':'纵酒妄杀', '高纬':'华林纵逸', '陈叔宝':'玉树新声', '杨广':'剪彩为花、游幸江都', '李显':'斜封除官、观灯市里',
              '李存勖':'宠幸伶人', '赵佶':'上清道会、应奉花石、任用六贼',
          }
          zhizhong_names = set('''刘邦 刘恒 刘启 刘彻 刘询 刘秀 刘庄 刘炟 刘肇 司马炎 萧赜 萧衍 拓跋嗣 拓跋宏 元恪 李渊 李世民 李适 李纯 李昂 李忱 柴荣 赵匡胤 赵光义 赵恒 赵祯 赵顼 赵构 赵昚 赵昀 完颜雍 完颜璟 铁木真 蒙哥 忽必烈 爱育黎拔力八达 朱元璋 朱棣 朱高炽 朱瞻基 朱见深 朱祐樘'''.split())

          def diji_window(name):
              r = rec(name)
              i1 = add_source(r, DIJI_INTRO); i2 = add_source(r, DIJI_TEXT)
              return {
                  'receiver':'明神宗（万历帝）帝王教育', 'carrier':'《帝鉴图说》',
                  'actual_use':f'将{name}的{diji_cases[name]}编入面向最高权力的善政/鉴戒教材',
                  'source_basis':'IMPERIAL_EDUCATION_PROGRAM_SCOPED_REVIEW'
              }, [i1, i2]

          def zhizhong_window(name):
              r = rec(name)
              i = add_source(r, ZHIZHONG)
              return {
                  'receiver':'清世宗雍正帝治道选编', 'carrier':'《钦定执中成宪》',
                  'actual_use':f'雍正亲自删定历代帝王治道材料时收入{name}嘉言善政，作为后世治道法鉴的一部分',
                  'source_basis':'IMPERIAL_GOVERNANCE_COMPENDIUM_SCOPED_REVIEW'
              }, [i]

          # 3) Mass one-window omissions -> A.
          diji_only_A = ['刘备','刘骜','刘欣','刘志','刘宏','曹叡','刘骏','高洋','高纬','陈叔宝','李显','李隆基','李亨','李存勖','赵煦','赵佶']
          for name in diji_only_A:
              win, idx = diji_window(name)
              set_paradigm(
                  name, 'A',
                  f'范式A。{name}不因后世名望加档；本轮反查《帝鉴图说》确认其具体统治行为已被编入面向明神宗的帝王教育，形成一个可信最高权力接收窗口。',
                  [win], idx,
                  '当前只闭合一个万历帝王教育窗口；同书多条故事合并计一次，不据文化知名度继续上调。',
                  '人物案例进入帝王教育计范式；其制度、事件或王朝后效仍只在深度维度处理。'
              )

          zhizhong_only_A = ['刘启','刘炟','刘肇','萧赜','拓跋嗣','拓跋宏','元恪','李渊','李适','李昂','柴荣','赵恒','赵构','赵昚','赵昀','完颜雍','完颜璟','蒙哥','忽必烈','爱育黎拔力八达','朱棣','朱高炽','朱瞻基','朱见深','朱祐樘']
          for name in zhizhong_only_A:
              win, idx = zhizhong_window(name)
              set_paradigm(
                  name, 'A',
                  f'范式A。雍正亲自删定《执中成宪》时把{name}的嘉言善政收入历代帝王治道法鉴，证明其人物/治世经验进入后世最高权力主动选择的政治教材；不把同名制度或王朝承接计入。',
                  [win], idx,
                  '目前只定位到一个雍正治道选编窗口；选入本身足以越过纯形象B，但不足证明多名独立最高权力反复实际使用。',
                  '治道选编中的人物化接收计范式；制度谱系与结构存续归深度。'
              )

          # 4) Two independent education/governance windows -> A+.
          two_window_Ap = ['刘庄','司马炎','萧衍','李纯','李忱','赵匡胤','赵光义']
          for name in two_window_Ap:
              dwin, didx = diji_window(name)
              zwin, zidx = zhizhong_window(name)
              set_paradigm(
                  name, 'A+',
                  f'范式A+。{name}的统治经验至少进入两个彼此独立的最高权力教育/治道窗口：明代《帝鉴图说》与清代雍正亲自删定的《执中成宪》。这证明传播已越过单一朝廷与单一选本，但现有硬证据仍以教育、选编为主。',
                  [dwin, zwin], didx+zidx,
                  '两个独立窗口足以达到A+；但不能仅靠两部帝王教材直接推到S-以上，须另见多次最高权力现实论政或行为使用。',
                  '只计人物/治世被主动选作教材；制度、礼仪、官制的延续不重复计范式。'
              )

          # 5) Liu Xiu: remove legitimacy-procedure reuse from paradigm; replace with person-centered Gaozong model, plus Ming/Qing education.
          r = rec('刘秀')
          gao_idx = add_source(r, {
              'kind':'HISTORICAL_WEB_SOURCE','title':'何玉红：中兴形象的构建——光武故事与宋高宗政治',
              'url':'https://www.nwnu.edu.cn/_t587/2018/0711/c3340a64919/page.htm',
              'evidence_note':'研究宋高宗从即位开始持续把汉光武作为中兴政治偶像，阅读/抄写《汉光武纪》，并在用兵、君臣、天命和政治自我定位中反复调用光武故事。',
              'verification_mode':'DOMESTIC_RESEARCH_SCOPED_REVIEW'
          })
          dwin, didx = diji_window('刘秀'); zwin, zidx = zhizhong_window('刘秀')
          set_paradigm(
              '刘秀','S',
              '范式S。原先把后世创业君主复用“即位—告天”受命程序算作刘秀范式，按V1.4撤回：那是合法性程序谱系，属于深度。真正的人物化高档证据来自宋高宗。何玉红研究显示，赵构从建炎创业开始明确把光武视作“可以为法”的中兴君主，亲自阅读、抄写《汉光武纪》，并在中兴自我定位、用兵、君臣关系等现实政治语境中反复调用光武故事。明代《帝鉴图说》和清代《执中成宪》又构成后续独立教育/治道接收。由此达到跨朝、多最高权力的人物化接收S，但不达S+。',
              [
