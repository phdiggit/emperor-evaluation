name: Temporary paradigm scan

on:
  push:
    branches:
      - codex/single-ruler-session-control

permissions:
  contents: read

jobs:
  scan:
    if: github.event.head_commit.message == '临时：核对高档范式联动'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/single-ruler-session-control
      - name: Print high-candidate foundations
        run: |
          python - <<'PY'
          import json, pathlib
          selected=set('''嬴政 刘秀 刘彻 刘询 萧衍 杨广 赵祯 赵顼 朱元璋 铁木真 玄烨 胤禛 弘历'''.split())
          root=pathlib.Path('docs/评分结算/历史影响/01-历史影响正式结算')
          for p in sorted(root.glob('*.json')):
              data=json.loads(p.read_text(encoding='utf-8'))
              for r in data.get('collections',{}).get('records',{}).get('records',[]):
                  if r.get('ruler_name') not in selected: continue
                  print('\n###', r['polity'], r['ruler_name'])
                  print('public/internal',r.get('public_grade'),r.get('internal_band'))
                  print('dimensions',json.dumps(r.get('dimensions',{}),ensure_ascii=False))
                  print('foundation',json.dumps(r.get('foundation',{}),ensure_ascii=False))
          PY
