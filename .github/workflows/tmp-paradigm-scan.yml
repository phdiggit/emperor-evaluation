              [{'receiver':'乾隆帝弘历','carrier':'《世宗宪皇帝圣训》与《执中成宪》','actual_use':'系统编纂、奉行并传布雍正治道与其亲定政治法鉴','source_basis':'PRIMARY_TEXT_DIGITAL_TRANSCRIPTION_SCOPED_REVIEW'}],
              [yong_idx,zidx],
