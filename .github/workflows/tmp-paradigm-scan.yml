              '雍正财政、中枢和继承制度被乾隆继续使用属于深度；这里只计乾隆主动编纂、奉行“雍正治道”的人物化接收。'
          )

          r = rec('弘历')
          qsheng_idx = add_source(r, {
              'kind':'HISTORICAL_WEB_SOURCE','title':'故宫博物院藏《大清高宗纯皇帝圣训》',
              'url':'https://www.dpm.org.cn/ancient/hall/161161.html',
              'evidence_note':'嘉庆敕编乾隆圣训三百卷、分四十门，确认后继最高权力把乾隆治道系统整理为政治训典。',
              'verification_mode':'IMPERIAL_COLLECTION_SCOPED_REVIEW'
          })
          jiaq_idx = add_source(r, {
              'kind':'HISTORICAL_WEB_SOURCE','title':'《仁宗睿皇帝实录》卷174',
              'url':'https://zh.wikisource.org/wiki/%E4%BB%81%E5%AE%97%E7%9D%BF%E7%9A%87%E5%B8%9D%E5%AF%A6%E9%8C%84/%E5%8D%B7174',
              'evidence_note':'嘉庆恭读乾隆圣训后，把其中原则用于后妃选择、书吏选取等现实制度要求，证明不只是例行编书而有具体政治使用。',
              'verification_mode':'PRIMARY_TEXT_DIGITAL_TRANSCRIPTION_READ'
          })
          set_paradigm(
              '弘历','A+',
              '范式A+。嘉庆不只是例行尊崇先帝：他敕编三百卷、四十门的《大清高宗纯皇帝圣训》，并在实录中明确“恭读”乾隆圣训，把其中原则用于后妃选择、书吏选取等现实制度要求。一个最高权力窗口内既有系统编纂又有可定位的现实使用，形成高质量重复接收。',
              [{'receiver':'嘉庆帝颙琰','carrier':'《大清高宗纯皇帝圣训》及嘉庆实录','actual_use':'系统编纂乾隆治道并在后妃、书吏等现实政治问题上援引遵行','source_basis':'PRIMARY_TEXT_AND_IMPERIAL_COLLECTION_SCOPED_REVIEW'}],
              [qsheng_idx,jiaq_idx],
              '目前高强证据集中于嘉庆一个最高权力窗口；系统编纂和多次实际使用不拆成多个接收者，因此取A+而非S-。',
              '乾隆时期形成的新疆、知识审查等结构后效归深度；这里只计嘉庆明确把乾隆圣训作为人物/治道标准使用。'
          )

          # 15) Augment existing clean high grades: Liu Bang S, Liu Heng S, Li Shimin S+.
          for name in ['刘邦','刘恒','李世民']:
              r = rec(name)
              dwin, didx = diji_window(name)
              zwin, zidx = zhizhong_window(name)
              review = r.setdefault('paradigm_review', {})
              review['receptions'] = review.get('receptions', []) + [dwin,zwin]
              review['source_ref_indices'] = sorted(set(review.get('source_ref_indices', []) + didx+zidx))
              add_note(r)
          # Liu Bang: explicitly stop using dynastic legality as decisive S evidence.
          r = rec('刘邦')
          r['paradigm_analysis'] += '\n\nV1.4补证与边界：东汉“同符高祖/立高祖之业”若仅承担汉家受命合法性，不单独作为高档增量；S档仍可由朱元璋明确“法其所为”的现实创业治道接收，加上明神宗《帝鉴图说》、清雍正《执中成宪》两个独立帝王教育/治道窗口支撑。'
          r['paradigm_review']['limitation'] = '高祖作为汉家法统来源本身不计人物范式；只计后世明确把刘邦本人创业、用人、少杀等治道作为现实参照或帝王教材。现有明初直接效法加明清独立教育/治道窗口足以守S，但未达系统多领域S+硬门。'
          # Liu Heng remains S; direct Tang/Ming uses already clean.
          r = rec('刘恒')
          r['paradigm_review']['limitation'] = '唐太宗、唐宪宗朝廷、朱元璋等对文帝惜费/俭政的直接政治使用，加明清独立帝王教育/治道窗口，足以守S；主题仍集中于俭政、慎刑等德目，不达系统多领域S+。'
          # Li Shimin remains sole S+ benchmark after explicit hard-gate review.
          r = rec('李世民')
          r['paradigm_review']['limitation'] = 'V1.4硬门复核通过：贞观治道不是单一德目，而有《帝范》《贞观政要》等专门稳定载体，覆盖君道、纳谏、用贤、法治等多类政治问题；金、明、清等不同政治环境的最高权力存在翻译、讲读、重刊、亲阅和现实论政等多次独立使用。教材收录只作辅助，不靠材料数量冲顶。'
          set_foundation(r, 'S+', '范式S+在V1.4硬门下维持：系统性、专门载体、跨朝跨环境、多领域、多次最高权力实际使用均可定位；总档同时仍受范围、深度与个人因果独立门槛约束。')
          changed['李世民'] = ('S+','S+')

          # 16) Liu Che depth S+: make political knowledge/ideology institutionalization a main chain, not auxiliary.
          r = rec('刘彻')
          nju_idx = add_source(r, {
              'kind':'HISTORICAL_WEB_SOURCE','title':'徐兴无：中国经学的制度特征及表达逻辑',
              'url':'https://www.nju.edu.cn/info/1056/325561.htm',
              'evidence_note':'用于汉武帝深度复核：五经博士把经典制度化为统一国家的政教宪章，经学与官学教育、人才选拔和政治合法性形成长期联结；后世载体虽变，国家化经典—教育—选官结构长期延展。',
              'verification_mode':'DOMESTIC_RESEARCH_SCOPED_REVIEW'
          })
          sdu_idx = add_source(r, {
              'kind':'HISTORICAL_WEB_SOURCE','title':'杨勇：“罢黜百家，独尊儒术”的历史考察——兼论“儒学国教化”这一概念的失当',
              'url':'https://lhpqk.sdu.edu.cn/CN/Y2019/V0/I6/79',
              'evidence_note':'《文史哲》2019年第6期。指出武帝前期儒家化察举与五经博士学官构成国家“尊儒”的两大制度骨干，同时强调不是一纸诏令完成、武帝时代仍存在多元与后续整合，作为归责与反夸大边界。',
              'verification_mode':'DOMESTIC_JOURNAL_SCOPED_REVIEW'
          })
          chains = r.setdefault('macro_chains', [])
          ideol_id = 'HI-RULER-HAN-LIUCHE-03'
          ideol = {
              'chain_id': ideol_id,
              'title': '经典—学官—选官联结推动国家政治知识与意识形态制度化',
              'narrative': '刘彻深度S+不能只靠刺史、河西和南疆等容易观察的制度/空间连续性。国内研究显示，武帝时期五经博士学官与儒家化察举成为国家“尊儒”的两大制度骨干；经典由学术资源进一步进入统一帝国的政教宪章、官方教育和人才入口。此后博士、太学、国子监、科举等具体载体持续变化，不能写成“汉武一纸独尊儒术、两千年不变”，但“国家确认经典—官方教育—人才选拔—政治论证/合法性”这一联结长期构成帝制政治知识结构的重要底层接口。归责同时保留文景前驱、董仲舒等专业思想资源、昭宣以后整合以及后世独立改造，不把整条儒学史寿命独占给刘彻。',
              'source_ref_indices':[nju_idx,sdu_idx],
              'chain_kind':'MACRO_TRANSFORMATION'
          }
          found = False
          for i,c in enumerate(chains):
              if c.get('chain_id') == ideol_id:
                  chains[i] = ideol; found = True
          if not found:
              chains.append(ideol)
          f = r.setdefault('foundation', {})
          ids = f.setdefault('chain_ids', [])
          if ideol_id not in ids:
              ids.append(ideol_id)
          f['joint_footprint_basis'] = '刘彻的S+深度由三类相互独立、又共同服务于帝国国家化的长期结构支撑：一是经典—学官—选官—政治知识/合法性的制度化联结；二是司隶、十三州刺史等中央—区域组织接口；三是河西及南部/西南治理空间的行政嵌入。范围S、深度S+在同一全国国家组织与空间重构足迹上共现，取内部S+基础；个人因果S-继续保留文景前驱、臣僚专业设计和后继独立改造分账。'
          r['grade_basis'] = '深度S+不再主要靠单一制度寿命。第一条主链是武帝朝把五经博士、官学与儒家化人才入口制度性结合，使经典知识进入国家政教、教育和选官方式；后世博士、太学、国子监、科举等载体不断改造，但“经典—官方教育—人才选拔—政治论证/合法性”的国家化接口长期延续。第二条是中央—区域组织层：司隶、十三州刺史开出跨郡监察/区域组织接口，东汉以后州的功能继续演变，计功能谱系而非同名机构不变。第三条是国家空间：河西四郡与驿传治理、西南和交趾等南部郡县嵌入形成跨代、部分跨西东汉的长期治理骨架。三条主链跨政治知识、国家组织、战略地理与边疆行政多个底层领域，共同满足S+深度；但文景前驱、董仲舒/主父偃/桑弘羊等专业责任、昭宣以后成熟和后世重构均明确分账。'
          dr = r.setdefault('depth_review', {})
          dr['basis'] = 'S+由三组独立长链共同闭合：①五经博士—官学—人才入口把经典知识制度化进国家政教，后世以不同载体长期延续“经典—教育—选官—政治合法性”接口；②司隶/十三州刺史开启中央—区域组织接口并在后世发生功能转型；③河西四郡及驿传、南部/西南郡县治理把新增战略空间嵌入持续国家治理。不是由一所太学、一个刺史机构或一块疆域单独冲顶。'
          dr['limits'] = '意识形态链不采用“汉武帝一纸罢黜百家、独尊儒术并原样延续两千年”的旧叙事：文景已有前驱，武帝朝仍存在多元政治知识，昭宣及东汉继续整合，后世学官与科举均属独立改造。组织链同样不把后世州制视为武帝刺史制原样延续；空间链保留秦制基线、西域都护等后继新建以及反复失控/重建截断。旧太学与晋书、通典材料只作辅助，S+由多域结构组合而非同名制度寿命推出。'
          dr['source_ref_indices'] = sorted(set(dr.get('source_ref_indices', []) + [nju_idx,sdu_idx]))
          add_note(r, '2026-09-15刘彻深度再审：将国家政治知识/意识形态制度化提升为S+主证据之一，以五经博士—官学—人才入口及其长期后继结构为核心，同时明确文景前驱、后世改造与“独尊儒术”简化叙事的边界。')

          # 17) Save shards.
          for path in sorted(dirty):
              files[path] and path.write_text(json.dumps(files[path], ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('CHANGED PARADIGM GRADES')
          for name,(a,b) in sorted(changed.items()):
              print(f'{name}: {a} -> {b}')
          from collections import Counter
          dist = Counter()
          for data in files.values():
              for rr in data.get('collections',{}).get('records',{}).get('records',[]):
                  dist[rr.get('dimensions',{}).get('paradigm',{}).get('grade','')] += 1
          print('POST DISTRIBUTION', dict(dist))
          PY

      - name: Regenerate and verify historical-impact views
        run: |
          python v4.py historical-impact-views --write
          python v4.py historical-impact-verify

      - name: Build and test reader
        run: |
          python reader/build_military_archive.py
          python reader/build.py
          python -m pytest tests/test_reader.py tests/test_reader_person_readability.py tests/test_reader_lazy_details.py tests/test_reader_military_archive.py tests/test_reader_military_archive_ref_policy.py tests/test_reader_military_archive_lineage.py -q

      - name: Remove temporary workflow and validate diff
        run: |
          git rm .github/workflows/tmp-paradigm-scan.yml
          git diff --check
          git status --short

      - name: Commit final remediation
        run: |
          set -euo pipefail
          git fetch origin codex/single-ruler-session-control
          remote_head="$(git rev-parse origin/codex/single-ruler-session-control)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved from $GITHUB_SHA to $remote_head; refusing stale push." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '收紧人物范式并完成系统补证'
          git push origin HEAD:codex/single-ruler-session-control
