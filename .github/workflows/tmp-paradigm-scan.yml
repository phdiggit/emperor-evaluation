name: Temporary paradigm scan

on:
  push:
    branches:
      - codex/single-ruler-session-control

permissions:
  contents: read

jobs:
  scan:
    if: github.event.head_commit.message == '临时：输出全池范式档位'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/single-ruler-session-control
      - name: Print paradigm scan
        run: |
          python - <<'PY'
          import json, pathlib
          from collections import Counter
          root = pathlib.Path('docs/评分结算/历史影响/01-历史影响正式结算')
          rows=[]
          for p in sorted(root.glob('*.json')):
              data=json.loads(p.read_text(encoding='utf-8'))
              for r in data.get('collections',{}).get('records',{}).get('records',[]):
                  pr=r.get('paradigm_review',{}) or {}
                  rows.append((r.get('polity',''), r.get('ruler_id',''), r.get('ruler_name',''), r.get('dimensions',{}).get('paradigm',{}).get('grade',''), pr.get('evidence_status','')))
          print('records', len(rows))
          print('distribution', dict(Counter(x[3] for x in rows)))
          print('POLITY\tRULER_ID\tNAME\tPARADIGM\tSTATUS')
          for row in rows:
              print('\t'.join(row))
          PY
