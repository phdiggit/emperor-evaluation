name: Run first-item reconciliation

on:
  push:
    branches:
      - codex/single-ruler-session-control

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/single-ruler-session-control
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Recover reconciliation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          lines = Path('.github/workflows/reconcile-first-item-20260903.yml').read_text(encoding='utf-8').splitlines()
          encoded = next(line.strip() for line in lines if line.strip().startswith('H4s'))
          encoded += '=' * (-len(encoded) % 4)
          Path('scripts').mkdir(exist_ok=True)
          Path('scripts/reconcile_first_item_20260903.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python -m py_compile scripts/reconcile_first_item_20260903.py

      - name: Patch Item 1 contracts and canonical inputs
        run: python scripts/reconcile_first_item_20260903.py

      - name: Rebuild Item 1 A B C and formal settlement
        run: |
          python v4.py first-item-a-registry
          python v4.py first-item-b-registry
          python v4.py first-item-c-registry

      - name: Verify targeted adjudications
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          formal = json.loads((root / 'docs/评分结算/第一项创业与政权取得能力/01-第一项创业与政权取得能力正式结算.json').read_text(encoding='utf-8'))
          a = json.loads((root / 'docs/评分结算/第一项创业与政权取得能力/战略决策能力/01-第一项A战略决策能力结算.json').read_text(encoding='utf-8'))
          c = json.loads((root / 'docs/评分结算/第一项创业与政权取得能力/军事夺取能力/01-第一项C军事夺取能力结算.json').read_text(encoding='utf-8'))
          by_name = {r['ruler_name']: r for r in formal['records'] if r.get('score_applicable')}
          a_by = {r['ruler_name']: r for r in a['records'] if r.get('score_applicable')}
          c_by = {r['ruler_name']: r for r in c['records'] if r.get('score_applicable')}
          assert 190 <= by_name['李世民']['first_item_score_points'] <= 200, by_name['李世民']
          assert 115 <= by_name['李渊']['first_item_score_points'] <= 125, by_name['李渊']
          assert 180 <= by_name['铁木真']['first_item_score_points'] <= 190, by_name['铁木真']
          assert c_by['铁木真']['C_score_points'] >= 75, c_by['铁木真']
          assert a_by['蒙哥']['A_score_points'] <= 6, a_by['蒙哥']
          print({name: (by_name[name]['canonical_rank'], by_name[name]['first_item_score_points']) for name in ['朱元璋','刘秀','刘邦','李世民','铁木真','李渊','李存勖','李嗣源','石勒','石虎','耶律阿保机','述律平','忽必烈','蒙哥']})
          PY

      - name: Guard third item and run tests
        shell: bash
        run: |
          if git diff --name-only | grep -E '^(config/third-item/|docs/评分结算/第三项军事与边疆净收益/|docs/分项规则/第三项军事与边疆净收益/)'; then
            echo 'Third-item files changed unexpectedly.' >&2
            exit 1
          fi
          git diff --check
          pytest -q

      - name: Commit generated reconciliation
        shell: bash
        run: |
          rm -f scripts/reconcile_first_item_20260903.py
          rm -f .github/workflows/reconcile-first-item-20260903.yml
          rm -f .github/workflows/reconcile-first-item-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'Reconcile shared first-item attribution and Temujin predecessor chain'
          git push origin HEAD:codex/single-ruler-session-control
