# temporary execution shell
name: Temporary fix reader JS

on:
  push:
    branches:
      - codex/single-ruler-session-control

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == '修复阅读层白屏'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/single-ruler-session-control
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e . -r reader/requirements.txt pytest

      - name: Fix broken JS string escapes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reader/index.template.html')
          text = p.read_text(encoding='utf-8')
          broken = "join('\n\n')"
          count = text.count(broken)
          if count == 0:
              raise SystemExit('broken newline joins not found')
          text = text.replace(broken, "join('\\\\n\\\\n')")
          p.write_text(text, encoding='utf-8', newline='\n')
          print('fixed broken newline joins:', count)
          PY

      - name: Rebuild and syntax-check browser scripts
        run: |
          python reader/build.py
          python reader/build.py --check
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('reader/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          js_scripts = [s for s in scripts if not s.lstrip().startswith('{')]
          if not js_scripts:
              raise SystemExit('no executable scripts extracted')
          out = Path('.tmp/reader-js-check')
          out.mkdir(parents=True, exist_ok=True)
          for i, script in enumerate(js_scripts):
              (out / f'{i}.js').write_text(script, encoding='utf-8')
          print('executable scripts:', len(js_scripts))
          PY
          for f in .tmp/reader-js-check/*.js; do node --check "$f"; done
          python -m pytest tests/test_reader.py tests/test_reader_person_readability.py tests/test_reader_lazy_details.py tests/test_reader_military_archive.py tests/test_reader_military_archive_ref_policy.py tests/test_reader_military_archive_lineage.py -q
          rm -rf .tmp/reader-js-check
          git diff --check

      - name: Commit fix
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-fix-reader-js.yml
          git fetch origin codex/single-ruler-session-control
          remote_head="$(git rev-parse origin/codex/single-ruler-session-control)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved from $GITHUB_SHA to $remote_head; refusing stale push." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '修复历史影响阅读层白屏'
          git push origin HEAD:codex/single-ruler-session-control
