name: One-off historical impact reaudit

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - .github/workflows/oneoff-historical-impact-reaudit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Apply scoped historical-impact adjudications
        run: python .tmp/apply_historical_impact_reaudit.py

      - name: Rebuild historical-impact reading view
        run: python v4.py historical-impact-views --write

      - name: Verify historical-impact source and view
        run: python v4.py historical-impact-verify

      - name: Check whitespace
        run: git diff --check

      - name: Commit formal source and reading view
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'docs/评分结算/历史影响/01-历史影响正式结算/西汉.json' \
            'docs/评分结算/历史影响/01-历史影响正式结算/东汉.json' \
            'docs/评分结算/历史影响/01-历史影响正式结算.md' \
            'docs/评分结算/历史影响/01-历史影响正式结算.json'
          if git diff --cached --quiet; then
            echo "No formal changes to commit"
            exit 0
          fi
          git commit -m '补全人物范式并重写刘彻深度依据'
          git push
