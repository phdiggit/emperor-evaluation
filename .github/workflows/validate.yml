name: Validate

on:
  pull_request:
    branches:
      - GPT
  push:
    branches:
      - GPT

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run unified validation entrypoint
        run: python scripts/validate/validate_all.py

      - name: Run focused validation tests
        run: python -m pytest -q tests/test_canonical_data_integrity.py tests/test_validate_all.py
