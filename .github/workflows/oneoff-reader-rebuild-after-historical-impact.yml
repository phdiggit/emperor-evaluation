name: One-off reader rebuild after historical impact

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - .github/workflows/oneoff-reader-rebuild-after-historical-impact.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e . -r reader/requirements.txt pytest

      - name: Build military archive indexes
        run: python reader/build_military_archive.py

      - name: Build reader
        run: python reader/build.py

      - name: Run reader tests
        run: python -m pytest tests/test_reader.py tests/test_reader_person_readability.py tests/test_reader_lazy_details.py tests/test_reader_military_archive.py tests/test_reader_military_archive_ref_policy.py tests/test_reader_military_archive_lineage.py -q

      - name: Commit generated reader artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- reader/index.html reader/data/people reader/data/military)" ]]; then
            echo "Generated reader artifacts are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reader/index.html reader/data/people reader/data/military
          git commit -m "重建综合阅读层"
          git push
