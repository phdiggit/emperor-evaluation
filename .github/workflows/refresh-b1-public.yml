name: Refresh B1 public projection

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - .github/workflows/refresh-b1-public.yml

permissions:
  contents: write

jobs:
  refresh-b1-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Refresh B1 formal public projection
        run: python -m emperor_v4.eval second-item-b1-public --write

      - name: Verify B1 formal settlement
        run: python -m emperor_v4.eval second-item-b1-verify

      - name: Commit deterministic B1 refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "docs/评分结算/净收益/第二项治国净收益"
          if git diff --cached --quiet; then
            echo "B1 public projection is already current"
            exit 0
          fi
          git commit -m "同步B1确定性公开投影"
          git push
