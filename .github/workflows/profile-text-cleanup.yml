name: One-shot profile text cleanup

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - .github/workflows/profile-text-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e . -r reader/requirements.txt pytest

      - name: Apply authorized text cleanup
        run: python -m emperor_v4.evaluation.profile_text_cleanup --apply

      - name: Verify all profile axes
        shell: bash
        run: |
          set -euo pipefail
          python -m emperor_v4.eval profile-m1-verify
          python -m emperor_v4.eval profile-current-verify --axis M2
          python -m emperor_v4.eval profile-m4-verify
          python -m emperor_v4.eval profile-m5-verify
          python -m emperor_v4.eval profile-c1-verify
          python -m emperor_v4.eval profile-c2-verify
          python -m emperor_v4.eval profile-c3-verify
          python -m emperor_v4.eval profile-c4-verify
          python -m emperor_v4.eval profile-c5-verify

      - name: Enforce profile text hard-error gate
        run: python -m emperor_v4.evaluation.profile_text_quality --fail-on error --output /tmp/profile-text-quality-after.json

      - name: Build reader
        run: python reader/build.py

      - name: Test reader
        run: python -m pytest tests/test_reader.py tests/test_reader_home_interactions.py tests/test_reader_readability.py -q

      - name: Check whitespace
        run: git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "no cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/评分结算/人物画像 reader/index.html
          git commit -m "清理人物画像正式文本质量问题"
          git push
