name: Temporary impact reader UX remediation

on:
  push:
    branches:
      - codex/single-ruler-session-control

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == '完成历史影响阅读链提交'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/single-ruler-session-control
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e . -r reader/requirements.txt pytest

      - name: Apply reader patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/tmp-impact-reader-ux.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          for i, line in enumerate(lines):
              if line.startswith('audit_panel_re = re.compile('):
                  lines[i] = '''audit_panel_re = re.compile(r'(<section id="history-evidence" class="panel evidence">)\\$\\{historySections\\(r\\)\\}<details><summary>历史影响 · 来源与核对范围</summary>.*?</details></section>', re.S)'''
                  break
          else:
              raise SystemExit('audit panel regex line not found')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python .github/scripts/tmp-impact-reader-ux.py

      - name: Rebuild and test reader
        run: |
          python reader/build_military_archive.py
          python reader/build.py
          python reader/build.py --check
          python -m pytest tests/test_reader.py tests/test_reader_person_readability.py tests/test_reader_lazy_details.py tests/test_reader_military_archive.py tests/test_reader_military_archive_ref_policy.py tests/test_reader_military_archive_lineage.py -q
          git diff --check

      - name: Commit reader remediation
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-impact-reader-ux.yml .github/scripts/tmp-impact-reader-ux.py
          git fetch origin codex/single-ruler-session-control
          remote_head="$(git rev-parse origin/codex/single-ruler-session-control)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch moved from $GITHUB_SHA to $remote_head; refusing stale push." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '优化历史影响阅读链'
          git push origin HEAD:codex/single-ruler-session-control
