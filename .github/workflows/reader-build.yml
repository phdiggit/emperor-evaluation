name: Build reader

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - reader/index.template.html
      - reader/link-effects.css
      - reader/build.py
      - config/project.yml
      - config/common/**
      - docs/评分结算/**
      - .github/workflows/reader-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e . -r reader/requirements.txt pytest

      - name: Build reader
        run: python reader/build.py

      - name: Test reader
        run: python -m pytest tests/test_reader.py -q

      - name: Check whitespace
        run: git diff --check

      - name: Commit generated page
        shell: bash
        run: |
          if git diff --quiet -- reader/index.html; then
            echo "reader/index.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader/index.html
          git commit -m "重建综合阅读层"
          git push
