name: Build reader

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - reader/index.template.html
      - reader/link-effects.css
      - reader/home-interactions.js
      - reader/readability.css
      - reader/readability.js
      - reader/person-readability.js
      - reader/first-item-reading.js
      - reader/second-item-reading.js
      - reader/second-item-public-alias.js
      - reader/second-item-institution-weight-polish.js
      - reader/second-item-institution-public-cleanup.js
      - reader/second-item-institution-scope-reading.js
      - reader/second-item-b1-public.js
      - reader/second-item-public-labels.js
      - reader/historical-impact-reading.js
      - reader/validate_first_item_docs.py
      - reader/build_first_item_reader_cache.py
      - reader/lazy-details.js
      - reader/public-copy.json
      - reader/second-item-summaries.json
      - reader/build.py
      - reader/build_military_archive.py
      - reader/military.html
      - reader/military-archive.js
      - reader/serve.py
      - reader/_build_military_archive_core.py
      - tests/test_reader.py
      - tests/test_reader_first_item_reading.py
      - tests/test_reader_person_readability.py
      - tests/test_reader_lazy_details.py
      - tests/test_reader_military_archive.py
      - tests/test_reader_military_archive_ref_policy.py
      - tests/test_reader_military_archive_lineage.py
      - config/project.yml
      - config/common/**
      - docs/评分结算/**
      - docs/公共成果/军事/01-战役登记.json
      - docs/公共成果/军事/01-战役登记/**
      - docs/公共成果/军事/02-武将人才等级.json
      - docs/公共成果/军事/02-武将人才等级/**
      - .github/workflows/reader-build.yml
  workflow_dispatch:

concurrency:
  group: reader-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  build-reader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e . -r reader/requirements.txt pytest

      - name: Validate first-item reading sources
        run: python reader/validate_first_item_docs.py

      - name: Build military archive indexes
        run: python reader/build_military_archive.py

      - name: Build reader
        run: python reader/build.py

      - name: Build first-item reader cache
        run: python reader/build_first_item_reader_cache.py

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('reader/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.S)
          executable = [body for attrs, body in scripts if 'application/json' not in attrs and not re.search(r'\bsrc\s*=', attrs)]
          if not executable:
            raise SystemExit('no executable browser scripts found')
          out = Path('.tmp/reader-js-check')
          out.mkdir(parents=True, exist_ok=True)
          for i, body in enumerate(executable):
              (out / f'{i}.js').write_text(body, encoding='utf-8')
          print('inline executable scripts:', len(executable))
          PY
          for file in .tmp/reader-js-check/*.js; do node --check "$file"; done
          node --check reader/first-item-reading.js
          node --check reader/second-item-reading.js
          node --check reader/second-item-public-alias.js
          node --check reader/second-item-institution-weight-polish.js
          node --check reader/second-item-institution-public-cleanup.js
          node --check reader/second-item-institution-scope-reading.js
          node --check reader/second-item-b1-public.js
          node --check reader/second-item-public-labels.js
          node --check reader/historical-impact-reading.js
          rm -rf .tmp/reader-js-check

      - name: Run behavior tests
        run: python -m pytest tests/test_reader.py tests/test_reader_first_item_reading.py tests/test_reader_person_readability.py tests/test_reader_lazy_details.py tests/test_reader_military_archive.py tests/test_reader_military_archive_ref_policy.py tests/test_reader_military_archive_lineage.py -q

      - name: Commit generated reader artifacts
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- reader/index.html reader/data/people reader/data/military reader/data/first-item)" ]]; then
            echo "Generated reader artifacts are already current"
            exit 0
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "This build is superseded by ${remote_head}; skip publishing stale generated artifacts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reader/index.html reader/data/people reader/data/military reader/data/first-item
          git commit -m "重建综合阅读层"
          git push

      - name: Request Pages build from generated branch HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site="$(curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          source_branch="$(printf '%s' "$site" | jq -r '.source.branch // empty')"
          source_path="$(printf '%s' "$site" | jq -r '.source.path // empty')"
          if [[ "$source_branch" != "$GITHUB_REF_NAME" || "$source_path" != "/" ]]; then
            echo "Unexpected Pages source: branch=${source_branch:-<none>} path=${source_path:-<none>}" >&2
            exit 1
          fi
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
