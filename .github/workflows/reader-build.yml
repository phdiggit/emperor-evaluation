name: Build reader

# Build from source and publish the validated artifact without source-branch writes.

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - reader/**
      - src/**
      - config/**
      - docs/**
      - archive/**
      - tests/**
      - index.html
      - pyproject.toml
      - .gitignore
      - .github/workflows/reader-build.yml
  workflow_dispatch:

concurrency:
  group: reader-build-v2-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-reader:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e . -r reader/requirements.txt pytest

      - name: Verify A public settlement
        run: python -m emperor_v4.eval second-item-a-verify

      - name: Verify B1 formal settlement
        run: python -m emperor_v4.eval second-item-b1-verify

      - name: Validate first-item reading sources
        run: python reader/validate_first_item_docs.py

      - name: Build military archive indexes
        run: python reader/build_military_archive.py

      - name: Verify public projections
        run: |
          python -m emperor_v4.eval second-item-c-public
          python -m emperor_v4.eval third-fourth-item-public-verify
          python -m emperor_v4.eval historical-impact-verify

      - name: Verify profile M1 formal settlement
        run: |
          python -m emperor_v4.eval profile-m1-verify
          python -m emperor_v4.eval profile-current-verify --axis M1

      - name: Build reader
        run: python reader/build.py

      - name: Build first-item reader cache
        run: python reader/build_first_item_reader_cache.py

      - name: Check generated reader parity
        run: |
          python reader/build.py --check
          python reader/build_first_item_reader_cache.py --check

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out = Path('.tmp/reader-js-check')
          out.mkdir(parents=True, exist_ok=True)
          total = 0
          for filename in ('reader/third-item-c.html', 'reader/index.html', 'reader/first-item-a.html', 'reader/first-item-b1.html', 'reader/first-item-b2.html', 'reader/second-item-b2.html'):
              page = Path(filename)
              scripts = re.findall(r'<script([^>]*)>(.*?)</script>', page.read_text(encoding='utf-8'), flags=re.S)
              executable = [body for attrs, body in scripts if 'application/json' not in attrs and not re.search(r'\bsrc\s*=', attrs)]
              if not executable:
                  raise SystemExit(f'no executable browser scripts found: {filename}')
              for i, body in enumerate(executable):
                  (out / f'{page.stem}-{i}.js').write_text(body, encoding='utf-8')
              total += len(executable)
          print('inline executable scripts:', total)
          PY
          for file in .tmp/reader-js-check/*.js; do node --check "$file"; done
          node --check reader/first-item-reading.js
          node --check reader/second-item-reading.js
          node --check reader/second-item-public-alias.js
          node --check reader/second-item-a-public.js
          node --check reader/second-item-b1-public.js
          node --check reader/second-item-public-labels.js
          node --check reader/third-item-a-public.js
          node --check reader/third-item-b-public.js
          node --check reader/third-item-c-public.js
          node --check reader/third-item-c-collection.js
          node --check reader/person-reading-notes.js
          rm -rf .tmp/reader-js-check

      - name: Verify authored M1 reading
        run: python -m pytest tests/test_profile_m1_authored_reading.py -q

      - name: Run behavior tests
        run: python -m pytest tests/test_cli_entrypoints.py tests/test_reader_site.py tests/test_reader.py tests/test_reader_public_boundaries.py tests/test_reader_first_item_reading.py tests/test_first_item_c_public.py tests/test_first_item_c_evidence.py tests/test_first_item_b1_cost_public.py tests/test_first_item_b2_public.py tests/test_first_item_b1_inputs.py tests/test_first_item_weights.py tests/test_first_item_public_outcomes.py tests/test_reader_person_readability.py tests/test_reader_second_public_text.py tests/test_second_item_c_public.py tests/test_reader_lazy_details.py tests/test_reader_military_archive.py tests/test_reader_military_archive_ref_policy.py tests/test_reader_military_archive_lineage.py tests/test_third_fourth_item_public.py tests/test_third_item_a_public_reading.py tests/test_third_item_b_public.py tests/test_third_item_c_public.py tests/test_third_item_c_reading_authority.py tests/test_reader_third_c_collection.py tests/test_historical_impact.py tests/test_historical_impact_source_collections.py -q

      - name: Check validated source is still current
        id: validated_release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Validated source was superseded by ${remote_head}; skip deployment."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.validated_release.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Stage validated Pages site
        if: steps.validated_release.outputs.publish == 'true'
        run: python v4.py reader --stage-only

      - name: Upload validated Pages artifact
        if: steps.validated_release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .tmp/pages-site

      - name: Deploy validated Pages artifact
        if: steps.validated_release.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

