name: Refresh third-fourth public projection

on:
  push:
    branches:
      - codex/single-ruler-session-control
    paths:
      - .github/workflows/refresh-third-fourth-public.yml

permissions:
  contents: write

jobs:
  refresh-third-fourth-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Refresh deterministic public projection
        run: python -m emperor_v4.eval third-fourth-item-public --write

      - name: Verify refreshed projection
        run: python -m emperor_v4.eval third-fourth-item-public-verify

      - name: Commit refreshed public fields
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            "docs/评分结算/净收益/第三项军事与边疆净收益" \
            "docs/评分结算/净收益/第四项文明与国家整合收益" \
            "config/third-item/third-item-result-credit-adjudications.json" \
            "config/third-item/third-item-military-net-loss-penalties.json"
          if git diff --cached --quiet; then
            echo "Public projection is already current"
            exit 0
          fi
          git commit -m "同步第三第四项确定性公开投影"
          git push
