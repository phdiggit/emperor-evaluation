<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0c0805;color:#dfc27b;font-family:"Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif}.page{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 18% 35%,#382512,#191008 39%,#0b0805 82%)}.page:before{content:"";position:absolute;inset:0;opacity:.08;background-image:repeating-radial-gradient(circle at 30% 40%,#f1d488 0 1px,transparent 1px 5px),repeating-linear-gradient(20deg,transparent 0 6px,rgba(241,212,136,.5) 7px 8px);mix-blend-mode:screen}.outer,.inner{position:absolute;pointer-events:none}.outer{left:18px;top:18px;width:1884px;height:1044px;border:1px solid rgba(214,164,72,.75)}.inner{left:30px;top:30px;width:1860px;height:1020px;border:1px solid rgba(214,164,72,.45)}.corner{position:absolute;width:52px;height:52px;border-color:#d6a448;opacity:.8}.tl{left:13px;top:13px;border-left:3px solid;border-top:3px solid}.tr{right:13px;top:13px;border-right:3px solid;border-top:3px solid}.bl{left:13px;bottom:13px;border-left:3px solid;border-bottom:3px solid}.br{right:13px;bottom:13px;border-right:3px solid;border-bottom:3px solid}.cloud{position:absolute;border:1px solid #8e6a2d;border-radius:50%;opacity:.19}.c1{left:44px;top:200px;width:170px;height:55px}.c2{right:94px;top:76px;width:250px;height:75px}.landscape{position:absolute;left:40px;right:45px;bottom:43px;height:182px;opacity:.14;background:linear-gradient(#b98b3b,#b98b3b) 0 100%/100% 2px no-repeat}.landscape:before{content:"";position:absolute;inset:34px 0 0;background:#b98b3b;clip-path:polygon(0 100%,0 82%,10% 70%,18% 80%,27% 57%,35% 78%,44% 37%,52% 76%,61% 56%,69% 73%,77% 24%,85% 67%,93% 46%,100% 74%,100% 100%)}.portrait-zone{position:absolute;left:20px;top:35px;width:620px;height:1000px;overflow:hidden}.halo{position:absolute;left:14px;top:55px;width:570px;height:570px;object-fit:contain;opacity:.46;mix-blend-mode:screen;transform:rotate(-17deg)}.portrait{position:absolute;left:-5px;top:60px;width:650px;height:auto;filter:sepia(.13) contrast(1.12) saturate(.92);mix-blend-mode:lighten}.portrait-zone:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 47% 31%,transparent 0 43%,rgba(10,7,4,.18) 72%,#0b0805 100%);pointer-events:none}.side-label{position:absolute;left:468px;top:160px;width:72px;height:170px;z-index:4;background:#6d1f12;border:2px double #d6a448;border-radius:4px;color:#f1d488;text-align:center;padding-top:12px;font-size:28px;font-weight:700;line-height:1.2;box-shadow:0 0 18px rgba(109,31,18,.7)}.info{position:absolute;left:590px;top:335px;width:520px;z-index:3}.name{height:154px;font-family:"STKaiti","KaiTi","Noto Serif SC",serif;font-size:132px;line-height:1.1;font-weight:900;letter-spacing:4px;background:linear-gradient(112deg,#8e5c1f,#ffe09b 32%,#b77c26 54%,#f0c976 77%,#865017);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 #3b260e,0 0 14px rgba(241,212,136,.2)}.subtitle{margin:18px 0 0 8px;font-size:38px;font-weight:600}.divider{position:relative;margin:26px 8px 0;width:430px;height:1px;background:#8e6a2d}.divider:after{content:"◆";position:absolute;left:208px;top:-13px;color:#d6a448;font-size:18px;background:#130b06;padding:0 10px}.years{margin:25px 8px 0;font-size:28px}.tag-title{position:absolute;left:770px;top:760px;width:200px;font-size:25px;letter-spacing:4px;text-align:center;color:#f1d488;z-index:4}.tag-title:before,.tag-title:after{content:"";position:absolute;top:18px;width:105px;border-top:1px solid #8e6a2d}.tag-title:before{left:-111px}.tag-title:after{right:-111px}.tags{position:absolute;left:500px;top:820px;width:710px;display:grid;grid-template-columns:repeat(4,145px);gap:18px;z-index:4}.tag{position:relative;height:48px;border:1px solid rgba(214,164,72,.78);outline:1px solid rgba(214,164,72,.35);outline-offset:-5px;background:rgba(12,7,3,.22);display:flex;align-items:center;justify-content:center;padding:0 8px;color:#dfc27b;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag:before,.tag:after{content:"";position:absolute;width:7px;height:7px;border-color:#d6a448}.tag:before{left:3px;top:3px;border-left:1px solid;border-top:1px solid}.tag:after{right:3px;bottom:3px;border-right:1px solid;border-bottom:1px solid}.radar-panel{position:absolute;left:1210px;top:155px;width:600px;height:700px;z-index:2}.radar{position:absolute;inset:0}
</style></head><body><main class="page" id="app"></main><script>window.renderCard=(data,radar)=>{const tags=data.labels.map(label=>`<div class="tag">${label}</div>`).join("");const side=data.sideLabel.split("").join("<br>");document.querySelector('#app').innerHTML=`<i class="outer"></i><i class="inner"></i><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="landscape"></i><section class="portrait-zone"><img class="halo" src="${data.theme.haloUrl}" alt=""><img class="portrait" src="${data.portraitUrl}" alt="${data.name}肖像"></section><div class="side-label">${side}</div><section class="info"><div class="name">${data.nameLarge}</div><div class="subtitle">${data.subtitle}</div><div class="divider"></div><div class="years">实际掌权：${data.years}</div></section><div class="tag-title">关键标签</div><section class="tags">${tags}</section><section class="radar-panel"><div class="radar">${radar}</div></section>`}</script></body></html>
