<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0f0905;color:#dfc27b;font-family:"Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif}.page{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 22% 28%,#2b1c10,#160e08 47%,#0f0905 100%)}.page:before{content:"";position:absolute;inset:0;opacity:.09;background-image:repeating-radial-gradient(circle at 30% 40%,#f1d488 0 1px,transparent 1px 5px),repeating-linear-gradient(20deg,transparent 0 6px,rgba(241,212,136,.5) 7px 8px);mix-blend-mode:screen}.outer,.inner{position:absolute;pointer-events:none}.outer{left:18px;top:18px;width:1884px;height:1044px;border:1px solid rgba(214,164,72,.75)}.inner{left:30px;top:30px;width:1860px;height:1020px;border:1px solid rgba(214,164,72,.45)}.corner{position:absolute;width:52px;height:52px;border-color:#d6a448;opacity:.8}.tl{left:13px;top:13px;border-left:3px solid;border-top:3px solid}.tr{right:13px;top:13px;border-right:3px solid;border-top:3px solid}.bl{left:13px;bottom:13px;border-left:3px solid;border-bottom:3px solid}.br{right:13px;bottom:13px;border-right:3px solid;border-bottom:3px solid}.palace{position:absolute;right:82px;bottom:53px;width:600px;height:95px;opacity:.14;background:#b98b3b;clip-path:polygon(0 100%,0 72%,10% 72%,10% 45%,20% 70%,30% 27%,40% 70%,50% 45%,60% 70%,70% 20%,80% 70%,90% 45%,100% 70%,100% 100%)}.mini-portrait{position:absolute;left:62px;top:62px;width:340px;height:235px;overflow:hidden;border:1px solid #d6a448;background:rgba(11,7,4,.72)}.mini-halo{position:absolute;left:-6px;top:-35px;width:270px;height:270px;opacity:.33;mix-blend-mode:screen}.mini-portrait img{position:absolute;left:10px;top:8px;width:255px;height:260px;object-fit:cover;object-position:46% 16%;filter:sepia(.1) contrast(1.1);mask-image:linear-gradient(to bottom,#000 0 72%,transparent 99%);-webkit-mask-image:linear-gradient(to bottom,#000 0 72%,transparent 99%)}.mini-label{position:absolute;left:320px;top:103px;width:56px;height:120px;z-index:2;background:#6d1f12;border:2px double #d6a448;color:#f1d488;text-align:center;line-height:24px;padding:10px 6px;font-size:20px;font-weight:700}.headline{position:absolute;left:470px;top:54px;width:860px;height:100px;margin:0;font-size:80px;line-height:1.1;font-weight:900;letter-spacing:2px;color:#d6a448;text-shadow:0 2px 0 #3b260e,0 0 14px rgba(241,212,136,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity{position:absolute;left:580px;top:210px;width:620px;height:48px;font-size:30px}.years{position:absolute;left:740px;top:274px;width:280px;height:40px;text-align:center;font-size:24px}.divider{position:absolute;left:540px;top:190px;width:640px;border-top:1px solid #8e6a2d}.mini-radar{position:absolute;left:1360px;top:54px;width:430px;height:270px}.cards{position:absolute;left:72px;top:332px;width:1776px;height:650px;display:grid;grid-template-columns:820px 820px;grid-template-rows:repeat(4,132px);gap:20px 136px}.card{position:relative;width:820px;height:132px;border:1px solid rgba(214,164,72,.66);background:linear-gradient(90deg,rgba(99,65,23,.18),rgba(14,8,4,.68));box-shadow:inset 0 0 18px rgba(214,164,72,.05)}.card:before{content:"";position:absolute;inset:5px;border:.5px solid rgba(214,164,72,.25);pointer-events:none}.card:after{content:"◆";position:absolute;right:12px;bottom:7px;color:rgba(214,164,72,.48);font-size:9px}.icon{position:absolute;left:22px;top:24px;width:70px;height:70px;border:1px solid #b98b3b;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#f1d488;font-size:36px}.axis{position:absolute;left:118px;top:19px;width:390px;height:38px;color:#f1d488;font-size:30px;font-weight:700}.text{position:absolute;left:118px;top:70px;width:530px;height:55px;color:#dfc27b;font-size:18px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.grade{position:absolute;left:690px;top:25px;width:96px;height:52px;border:1px solid #d6a448;outline:1px solid rgba(214,164,72,.3);outline-offset:-4px;background:#130c06;color:#f1d488;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}</style></head><body><main class="page" id="app"></main><script>window.renderCard=(data,radar)=>{const cards=data.cards.map(card=>`<article class="card"><div class="icon">${card.icon}</div><div class="axis">${card.axis}</div><div class="text">${card.text}</div><div class="grade">${card.grade}</div></article>`).join("");const side=data.sideLabel.split("").join("<br>");document.querySelector('#app').innerHTML=`<i class="outer"></i><i class="inner"></i><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><i class="palace"></i><section class="mini-portrait"><img class="mini-halo" src="${data.theme.haloUrl}" alt=""><img src="${data.portraitUrl}" alt="${data.name}肖像"></section><div class="mini-label">${side}</div><h1 class="headline">${data.tagline}</h1><div class="divider"></div><div class="identity">${data.name}｜${data.subtitle}</div><div class="years">${data.years}</div><section class="mini-radar">${radar}</section><section class="cards">${cards}</section>`}</script></body></html>
