schema_version: i5b-delegated-harm-attribution-contract-v1
status: active_negative_candidate_gate
trigger_rules: [appointment_delegation, team_building]
trigger_conduct:
  - private_appropriation
  - uncontrolled_looting
  - massacre
  - high_intensity_forced_labor
  - mutiny_or_treason
  - repeated_abuse_of_delegated_power
required_observations:
  - delegated_authority_boundary
  - actor_conduct
  - actual_public_harm
  - ruler_foreseeability_or_prior_notice
  - ruler_response_after_notice
  - later_restoration_or_retention
routing_rules:
  appointment_delegation: 任用、授权、监督或知情后处置形成皇帝责任时结算。
  team_building: 只结算皇帝在已知持续风险后仍长期保留其核心团队地位，不重复同一违法后果。
  governance_policy: 皇帝直接命令、制度化或知情纵容的公共损害转交相应治理或政策rule。
  actor_only: 受任者违令且风险不可预见，皇帝及时制止、惩处并补救时，主要归受任者个人。
effect_mapping:
  bounded_control_failure: {value: -0.30, harm: control_failure_without_broader_public_damage}
  limited_direct_damage: {value: -0.80, harm: clear_but_bounded_public_damage}
  major_direct_damage: {value: -1.80, harm: major_direct, ruler_responsibility: direct_or_knowing_tolerance}
  structural_continuing_damage: {value: -2.60, harm: cross_period_systemic, ruler_responsibility: direct_or_knowing_tolerance}
cross_rule_boundary:
  same_harm_settled_once: true
  team_retention_requires_later_independent_observation: true
  public_policy_harm_not_duplicated_in_appointment: true
response_policy:
  ruler_response_is_separate_observation: true
  response_may_change_attribution_or_net_harm: true
  response_must_not_be_encoded_in_effect_option_name: true
