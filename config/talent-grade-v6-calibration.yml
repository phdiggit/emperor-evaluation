schema_version: talent-grade-v6-calibration-policy-v1
policy_version: talent-grade-v6-calibration-v1
status: human_review_required
scope:
  inherited_v3_grade_versions:
    - talent-grade-v2
    - talent-grade-v4
    - talent-grade-v5
  current_review_batch:
    - all_v3_top
    - all_supplemental_profiles
principles:
  office_or_fame_is_not_an_achievement_cluster: true
  same_duty_chain_is_one_cluster: true
  repeated_similar_cases_are_one_cluster: true
  joint_participation_requires_personal_attribution: true
  proposals_without_implemented_results_do_not_pass_top: true
  distribution_is_an_alert_not_a_quota: true
top_gate:
  minimum_independent_major_clusters: 2
  minimum_national_or_foundational_or_decisive_theater_clusters: 1
  requires_clear_result_for_every_counted_cluster: true
  requires_high_personal_attribution: true
  requires_contemporary_first_tier_comparison: true
  failure_grade: important
historic_gate:
  minimum_independent_era_shaping_clusters: 3
  alternative_path:
    foundational_long_term_system_cluster: 1
    additional_independent_major_clusters: 2
  requires_cross_stage_persistence: true
  requires_high_personal_attribution: true
anchors:
  governance_top: [杜如晦, 姚崇, 宋璟]
  governance_historic: [房玄龄]
  institution_top: [李斯, 长孙无忌]
  military_top: [班超, 马援, 韩世忠]
  military_historic: [李绩, 苏定方]
distribution_alerts:
  important_to_top_minimum_ratio: 2.0
  top_to_historic_minimum_ratio: 3.0
  top_share_warning: 0.35
release:
  preserve_original_grade_and_version: true
  overwrite_v3_grade: false
  formal_scoring_allowed: false
