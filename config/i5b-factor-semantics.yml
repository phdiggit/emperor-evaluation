schema_version: i5b-factor-semantics-v1
status: fifth_item_b_factor_semantics_frozen
frozen_on: '2026-07-14'
scope: fifth_item_b_all_rules

common_contract:
  categorical_only: true
  numeric_score_or_rank_allowed: false
  numeric_projection_owned_by_scoring_policy: config/i5b-scoring-policy.yml
  context_kind_owns_factor_denominator: true
  evidence_lineage_required: true
  absence_inference_requires_bounded_coverage: true
  opened_regression_may_change_this_contract: false
  opened_regression_may_prove_unbiased_qualification: false

generic_owned_factor_terminal_protocol:
  applies_to: [talent_discovery, tolerate_talent, anti_nepotism, team_building]
  terminal_states: [not_applicable, insufficient_evidence]
  terminal_state_must_propagate_to_all_owned_factors: true

appointment_resolution_protocol:
  applies_to: [appointment_delegation]
  decision_statuses: [resolved, insufficient_coverage]
  insufficient_coverage_requires_null_option_code: true

rules:
  appointment_delegation:
    contract_version: appointment-delegation-factor-observation-v6
    context_kinds: [episode, rule_evidence_unit]
    observation_unit: upstream_frozen_canonical_slot
    join_key: slot_id
    model_may_create_merge_or_reorder_slots: false
    source_factor_owner: deterministic_lineage
    model_owned_factors:
      appointment_importance:
        option_codes:
          - nominal_or_light
          - real_bounded
          - major_affairs
          - critical_national_or_long_term
        decision_rules:
          - 只按授权当时的责任域判断，后续成果不得反向抬档
          - critical_national_or_long_term 需要国家全局、战略地域、制度形成或长期职责直接锚点；跨域本身只足以支持 major_affairs
          - major_affairs 需要重要军政或方面职责，但不满足国家全局或长期制度门槛
      appointment_effect:
        option_codes:
          - weak_feedback
          - normal_success
          - major_success
          - poor_result
          - major_direct_damage
          - structural_continuing_damage
        decision_rules:
          - major_success 需要异常显著且直接归属于人岗配置的反馈，不由战果规模自动推出
          - major_direct_damage 是重大但一次性的直接损害
          - structural_continuing_damage 另需跨期制度、组织能力或后续治理损害
      attribution_factor:
        option_codes: [indirect, direct, direct_under_pressure]
        decision_rules:
          - direct_under_pressure 必须有决策前的明确反对、负面指控或现实约束
          - 普通请求、进言和决策后的批评不构成 pressure
      context_factor:
        option_codes: [weak_but_applicable, clear, core_mechanism_direct]
        decision_rules:
          - core_mechanism_direct 同时需要皇帝行动、限定职责和直接反馈
          - clear 表示任用链成立且边界清楚，但未完整呈现核心机制三锚点
      continuity_factor:
        option_codes: [short_or_one_off, stable, long_term_multi_stage]
        decision_rules:
          - short_or_one_off 需要明确一次性事实或 bounded absence
          - stable 需要同一授权下至少两个可区分的履职、反馈、监督或损害观察
          - long_term_multi_stage 需要至少两次可区分的皇帝授权决定
    deterministic_factors:
      source_factor:
        option_codes: [weak_or_compressed, standard, complete_direct_chain]
        decision_rules:
          - 仅由 passage 与 Assertion lineage 的覆盖完整性生成
          - 不由模型输出，不进入模型因子一致率
    required_mechanical_observations:
      - jurisdiction_scope
      - cross_domain
      - institution_forming
      - duration
      - one_off_basis
      - explicit_ruler_action
      - scoped_responsibility
      - linked_feedback
      - distinct_authorization_count
      - distinct_observation_count
      - predecision_pressure_refs
    structured_gates:
      importance_critical_requires_any: [jurisdiction_scope_national_or_strategic, institution_forming, duration_long_term]
      attribution_under_pressure_requires_predecision_pressure_ref: true
      effect_requires_linked_feedback: true
      continuity_short_requires_one_off_basis: [explicit_one_off, bounded_absence]
      context_core_requires_all: [explicit_ruler_action, scoped_responsibility, linked_feedback]
      continuity_stable_min_distinct_observations: 2
      continuity_multi_stage_min_distinct_authorizations: 2

  talent_discovery:
    contract_version: talent-discovery-factor-agent-v2
    context_kinds: [episode]
    observation_unit: independent_preuse_recognition_chain
    factors:
      recognition_novelty:
        option_codes:
          - established_core
          - newly_visible_internal
          - newly_visible_outsider
          - cross_regime_or_camp_entry
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - novelty 以首次实质使用前的人才池状态判断
          - 既有核心成员的升迁或扩权为 established_core 或规则外事件
      recognition_basis:
        option_codes:
          - missing_or_posthoc
          - reputation_only_unverified
          - direct_observation_or_interview
          - recommendation_verified_by_ruler
          - reputation_then_direct_demonstration
          - work_product_then_interview
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - verified 档必须满足 verification_at 早于 first_substantive_use_at
          - 使用后表现不得反向充当使用前识才依据
      barrier_crossing:
        option_codes:
          - barrier_not_crossed
          - no_material_barrier
          - status_or_access_barrier_crossed
          - reluctance_or_access_barrier_crossed
          - cross_camp_barrier_crossed
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - crossed 档同时需要 explicit_barrier_refs 与 ruler_crossing_action_refs
          - 外来身份、被召入或最终获任本身不是障碍证据
      conversion_to_use:
        option_codes:
          - no_conversion
          - limited_trial_or_symbolic
          - direct_substantive_use
          - trial_then_scaled_use
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - 转化从 first_substantive_use_at 开始
          - trial_then_scaled_use 需要试用和后续扩大使用两个可区分阶段
    required_semantic_observations:
      - visibility_basis_at
      - verification_at
      - first_substantive_use_at
    structured_gates:
      verified_basis_requires_verification_before_first_use: true
      barrier_crossed_requires_all: [explicit_barrier_refs, ruler_crossing_action_refs]
      trial_then_scaled_use_min_distinct_stages: 2

  tolerate_talent:
    contract_version: tolerate-talent-factor-agent-v3
    context_kinds: [episode]
    observation_unit: subject_owned_feedback_safety_chain
    factors:
      feedback_reception:
        option_codes:
          - no_feedback_event
          - actively_solicited
          - accepted_without_conflict
          - accepted_after_conflict
          - tolerated_not_adopted
          - suppressed_or_punished
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - actively_solicited 需要 ruler request 早于反馈
          - accepted_without_conflict 需要直接采纳且没有先行冲突
          - accepted_after_conflict 需要冲突后发生独立的采纳观察
      talent_safety:
        option_codes:
          - actively_protected
          - safe_without_retaliation
          - localized_penalty
          - career_exclusion
          - severe_threat_or_coercion
          - personal_or_associative_harm
          - mixed_responsibility
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - safe_without_retaliation 需要晚于 ruler_response 的独立 positive_safety_followup
          - 未记载报复不得推出安全
          - severe_threat_or_coercion 用于明确严重威胁但未形成已实现人身伤害
      professional_autonomy:
        option_codes:
          - no_autonomy_issue
          - professional_judgment_respected
          - reasoned_override
          - political_override
          - sustained_blockage
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - political_override 是一次明确以政治偏好压过专业判断
          - sustained_blockage 需要重复或跨期堵塞反馈渠道
      conflict_repair_continuity:
        option_codes:
          - single_event_only
          - stable_without_conflict
          - timely_repair
          - delayed_partial_repair
          - formal_reversal_without_trust_repair
          - persistent_unrepaired
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - repair 与 continuity 档必须晚于 ruler_response 且 observation_id 独立
          - timely_repair 需要 timely、substantive_full 且 trust_restored=true
          - delayed_partial_repair 需要实质修复且 timing=delayed 或 scope=substantive_partial
          - formal_reversal_without_trust_repair 只允许 scope=formal_only，并需更晚的独立 continuity observation 显式证明信任未恢复
          - persistent_unrepaired 需要重复或跨期证据
          - 单次事件无法证明长期状态时使用 single_event_only
    required_semantic_observations:
      - subject_ownership_chain
      - positive_safety_followup
      - independent_repair_followup
      - independent_continuity_followup
      - repair_assessment
    structured_gates:
      subject_chain_order_fields_required: true
      positive_safety_followup_after_ruler_response: true
      positive_safety_followup_observation_must_differ: true
      repair_followup_after_ruler_response: true
      repair_followup_observation_must_differ: true
      continuity_followup_after_ruler_response: true
      continuity_followup_observation_must_differ: true
      repair_assessment_timing_values: [timely, delayed, not_established]
      repair_assessment_scope_values: [substantive_full, substantive_partial, formal_only, none]
      timely_repair_requires: {timing: timely, scope: substantive_full, trust_restored: true}
      delayed_partial_repair_requires_substantive_scope: [substantive_full, substantive_partial]
      delayed_partial_repair_requires_any: [timing_delayed, scope_substantive_partial]
      delayed_timing_requires_delay_basis_refs: true
      formal_reversal_requires: {scope: formal_only, trust_restored: false}
      formal_reversal_requires_later_independent_continuity: true
      formal_reversal_requires_bounded_nonrestoration_refs: true

  anti_nepotism:
    contract_version: anti-nepotism-factor-agent-v2
    context_kinds: [episode, aggregate_context]
    applicability_cases:
      pollution_event: applicable
      prevention_event: applicable
      correction_event: applicable
      outside_rule: not_applicable
      unresolved: insufficient_evidence
    factor_ownership:
      episode:
        - capability_basis
        - process_integrity
        - public_power_exposure
      aggregate_context: [network_effect]
    factors:
      capability_basis:
        option_codes:
          - verified_merit
          - mixed_merit_private
          - private_substitutes_merit
          - capability_disproved
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - verified_merit 需要私人关系之外的使用前能力或履职依据
          - mixed_merit_private 需要能力依据与私人关系影响同时成立
          - private_substitutes_merit 需要私人关系直接替代能力依据
          - capability_disproved 需要任用时已经存在明确不适任反馈
      process_integrity:
        option_codes:
          - open_or_formal
          - bounded_exception_reviewable
          - bypass_but_correctable
          - private_interference
          - channel_captured
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - channel_captured 只表示公共任命入口被控制，必须有 appointment_gate_control_refs
      public_power_exposure:
        option_codes:
          - nominal_or_nonpublic
          - bounded_operational
          - major_affairs
          - key_appointment_or_succession
          - system_wide_public_power
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - 只评价公共权力暴露，不重复表达程序入口或网络广度
          - nominal_or_nonpublic 不产生实质公共权责；bounded_operational 为有限业务职责
          - major_affairs 为重要军政权责；key_appointment_or_succession 为关键任免或继承事项
          - system_wide_public_power 需要跨领域或国家级公共权力直接暴露
      network_effect:
        option_codes:
          - isolated_no_network
          - repeated_bounded
          - cross_person_single_channel
          - cross_channel_capture
          - durable_capture
          - dismantled_by_ruler
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - cross_person_single_channel 至少两人且恰好一个明确渠道
          - cross_channel_capture 至少两人、至少两个公共渠道并有 control refs
          - durable_capture 另需跨期或重复任免事实
          - dismantled_by_ruler 必须绑定皇帝纠偏行动
    applicability_requirements:
      pollution_event:
        - private_relation_anchor_refs
        - public_appointment_or_office_effect_refs
        - ruler_responsibility_refs
      prevention_event:
        - private_relation_anchor_refs
        - proposed_public_appointment_refs
        - ruler_recusal_or_refusal_refs
      correction_event:
        - established_pollution_refs
        - ruler_correction_action_refs
    structured_gates:
      cross_person_single_channel: {min_people: 2, exact_channels: 1}
      cross_channel_capture: {min_people: 2, min_channels: 2, control_refs_required: true}
      durable_capture: {cross_channel_capture_required: true, cross_period_or_repeated_refs_required: true}

  team_building:
    contract_version: team-building-factor-agent-v3
    historical_qualification_contract_version: team-building-factor-agent-v1
    historical_qualification_carries_forward: false
    context_kinds: [ruler_time_window]
    observation_unit: frozen_ruler_time_window_member_set
    factors:
      talent_depth:
        option_codes:
          - multi_historic
          - multi_top
          - adequate_mixed
          - thin
          - not_applicable
          - insufficient_evidence
        priority_rules:
          - 只消费 talent_grade 能力轴，不得因负面政治风险降低人才档位
          - multi_historic 需要 historic_count >= 2
          - multi_top 需要 historic_count < 2 且 historic_or_top_count >= 2
          - adequate_mixed 需要 qualified_member_count >= 2 但不满足以上高档
          - thin 表示 qualified_member_count <= 1
      core_role_coverage:
        option_codes:
          - four_core
          - three_core
          - two_core
          - one_or_none
          - critical_long_vacancy
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - 核心角色固定为 decision、administration、military、correction
          - 先判断 critical_long_vacancy，再按 covered_core_role_count 取四、三、二、至多一类
      functional_complementarity:
        option_codes:
          - balanced_four
          - strong_three
          - ordinary_two
          - homogeneous
          - not_applicable
          - insufficient_evidence
        decision_rules:
          - balanced_four 需要四类核心功能齐全且不同人物的二分图最大匹配数为 4
          - strong_three 需要最大独立人物匹配数为 3；四类名义齐全但一人独占两类时仍为 strong_three
          - ordinary_two 需要最大独立人物匹配数为 2，少于两类为 homogeneous
      continuity_structure:
        option_codes:
          - durable_multi_stage
          - managed_turnover
          - stable_window
          - stable_but_narrow
          - fragmented
          - forced_turnover_collapse
          - not_applicable
          - insufficient_evidence
        priority_rules:
          - forced_turnover_collapse 与 fragmented 优先于所有正向档，只表达团队功能断裂，不重复归责私人网络或清洗事件
          - durable_multi_stage 不成立后，managed_turnover 在存在成员更替且更替前后核心功能不断裂时优先
          - durable_multi_stage 需要至少两个 stage snapshots、真实阶段边界、每阶段至少三类核心功能独立匹配且最长空缺不超过一年
          - managed_turnover 只在 durable_multi_stage 不成立时使用，并要求前任、后任和交接时点均有证据
          - stable_window 需要无实质更替且窗口覆盖完整
          - stable_but_narrow 表示连续但核心功能覆盖不超过两类
      confidant_dependency:
        option_codes:
          - distributed
          - bounded_anchor
          - elevated_single_person
          - single_point
          - centralized_ruler_bottleneck_without_confidant
          - not_applicable
          - insufficient_evidence
        priority_rules:
          - centralized_ruler_bottleneck_without_confidant 只用于皇帝亲断瓶颈且没有单一亲信依赖
          - single_point 表示一人是至少三类核心功能的唯一锚点
          - elevated_single_person 表示一人是两类核心功能的唯一锚点
          - bounded_anchor 表示存在核心协调者，但至多一类功能只能依赖该人且其他功能有独立锚点
          - distributed 表示没有人物独占两类核心功能且至少三类功能存在独立锚点
      negative_profile_exposure:
        option_codes:
          - none_observed
          - bounded_minor
          - material_exposure
          - core_role_concentration
          - historic_or_systemic_exposure
          - not_applicable
          - insufficient_evidence
        priority_rules:
          - 本因子只消费与 talent_grade 正交的 negative_talent_class、negative_talent_severity 和 negative_talent_version
          - 任何负面档都不得改写或降低同一人的 talent_grade
          - historic_or_systemic_exposure 优先：任一成员 severity=historic，或至少两名有实质风险成员共同成为三类以上核心功能的唯一锚点
          - core_role_concentration 表示一名 material/major 风险成员是至少两类核心功能的唯一锚点
          - material_exposure 表示存在 material/major 风险，但未达核心功能集中门槛
          - bounded_minor 表示只有 minor 风险且不构成核心功能唯一锚点
          - none_observed 需要完整覆盖且没有任何已接受负面画像；不得从未记载反推
    profile_snapshot_contract:
      source_policy_version: v3-person-profile-readonly-adapter-v1
      observed_source_versions: [talent-grade-v2, talent-grade-v4, talent-grade-v5]
      mixed_versions_require_explicit_per_profile_version: true
      accepted_source_states:
        identity_status: active
        review_status: accepted
        readiness_status: profile_complete
      talent_grade_mapping:
        historic_talent: historic
        top_talent: top
        important_talent: important
        usable_talent: usable
        ordinary_talent: ordinary
      negative_profile_mapping_version: negative-profile-team-v1
      profile_ref_and_snapshot_version_content_unique: true
      direct_v3_score_or_primary_key_reuse_forbidden: true
    required_structural_observations:
      - historic_count
      - top_count
      - historic_or_top_count
      - qualified_member_count
      - qualified_role_anchors
      - independent_role_matching
      - normalized_window
      - stage_snapshots
      - role_transitions
      - core_role_gap_intervals
      - profile_version_distribution
      - negative_profile_members
      - negative_profile_mapping_version
      - profile_identity_conflicts
    structured_gates:
      talent_multi_historic: {min_historic_count: 2}
      talent_multi_top: {max_historic_count: 1, min_historic_or_top_count: 2}
      balanced_four: {covered_core_roles: 4, independent_role_matching_size: 4}
      strong_three: {independent_role_matching_size: 3}
      core_role_coverage: {role_catalog: [decision, administration, military, correction], critical_long_vacancy_priority: true}
      durable_multi_stage: {min_stage_count: 2, min_roles_each_stage: 3, max_role_gap_years: 1, real_stage_boundary_required: true}
      managed_turnover: {durable_multi_stage_must_fail: true, min_transition_count: 1, max_transition_gap_years: 1, distinct_predecessor_successor_required: true}
      confidant_dependency: {single_point_min_sole_core_roles: 3, elevated_min_sole_core_roles: 2, distributed_min_independent_roles: 3}
      negative_profile_axis:
        orthogonal_to_talent_grade: true
        raw_class_severity_version_required: true
        none_observed_requires_complete_coverage: true
        core_role_concentration_min_sole_roles: 2
        systemic_min_risk_members: 2
        systemic_min_joint_sole_roles: 3
