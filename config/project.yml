schema_version: v4-settled-scoring-project-v1

project:
  code: emperor-evaluation-v4
  name: 皇帝综合评价体系 V4
  language: zh-CN
  status: fourth_item_reaudit_pending_semantic_closure

scoring_contract:
  governing_document: docs/项目总纲/皇帝综合评价体系评分标准.md
  common_positive_denominator: 637
  first_item_add_on_formula: F = 0.15 * 637 * (S1 / 240) ^ 1.25
  composite_formula: T = S2 + S3 + F + CIV4
  scored_items: [first_item, second_item, third_item, fourth_item]
  database_write: false
  cross_item_ranking_write: true
  composite_ranking_json: docs/评分结算/00-皇帝功业与治理净收益榜.json
  composite_ranking_markdown: docs/评分结算/00-皇帝功业与治理净收益榜.md

canonical_ruler_pool:
  status: current
  candidate_count: 201
  included_count: 184
  composite_ready_count: 174
  pending_second_item_count: 10
  pending_first_item_scope_count: 0
  pending_first_item_formal_settlement_count: 0
  first_item_outside_candidate_pool_count: 2
  excluded_count: 17
  json: config/common/canonical-ruler-pool.json
  markdown: docs/项目总纲/正式评价对象范围.md
  policy: effective independent highest power for at least 3 years; pending second-item settlement blocks composite readiness, not admission

formal_json_routing:
  status: current
  schema_version: formal-json-polity-router-v1
  shard_schema_version: formal-json-polity-shard-v1
  route_key: polity
  routed_file_count: 22
  loader: src/emperor_v4/evaluation/formal_json_store.py
  polity_source: canonical ruler id, source-item id and legacy id map to config/common/canonical-ruler-pool.json polity; unmatched historical records retain their explicit polity
  scope: tracked settlement JSON files at least 500KB
  exclusions: audit, review, acceptance and report JSON sidecars remain monolithic

