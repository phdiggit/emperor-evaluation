schema_version: v4-settled-scoring-project-v1

project:
  code: emperor-evaluation-v4
  name: 皇帝综合评价体系 V4
  language: zh-CN
  status: five_items_formally_settled

scoring_contract:
  governing_document: docs/项目总纲/皇帝综合评价体系评分标准.md
  common_positive_denominator: 775
  first_item_add_on_formula: F = 0.10 * 775 * (S1 / 240) ^ 1.25
  composite_formula: T = S_common + F + CIV4
  database_write: false
  cross_item_ranking_write: true
  composite_ranking_json: docs/评分结算/00-皇帝综合评价总榜.json
  composite_ranking_markdown: docs/评分结算/00-皇帝综合评价总榜.md

canonical_ruler_pool:
  status: current
  candidate_count: 201
  included_count: 184
  composite_ready_count: 174
  pending_second_item_count: 10
  pending_first_item_scope_count: 0
  pending_first_item_formal_settlement_count: 0
  first_item_outside_candidate_pool_count: 5
  excluded_count: 17
  json: config/common/canonical-ruler-pool.json
  markdown: docs/项目总纲/正式评价对象范围.md
  policy: effective independent highest power for at least 3 years; pending second-item settlement blocks composite readiness, not admission

formal_settlements:
  first_item:
    max_points: 240
    role: conditional_founder_add_on
    json: docs/评分结算/第一项创业与政权取得能力/01-第一项创业与政权取得能力正式结算.json
    markdown: docs/评分结算/第一项创业与政权取得能力/01-第一项创业与政权取得能力正式结算.md
  second_item:
    range: [-45, 405]
    role: common_governance
    json: docs/评分结算/第二项治国净收益/01-第二项治国净收益405分正式结算.json
    markdown: docs/评分结算/第二项治国净收益/01-第二项治国净收益405分正式结算.md
    ranking_population: COMPOSITE_READY
    ranking_json: docs/评分结算/第二项治国净收益/02-正式评价池排名.json
    ranking_markdown: docs/评分结算/第二项治国净收益/02-正式评价池排名.md
    c4_attribution_readjudications_json: config/second-item/c4-attribution-readjudications.json
  third_item:
    range: [-40, 250]
    role: common_military
    json: docs/评分结算/第三项军事与边疆净收益/02-第三项正式结算.json
    markdown: docs/评分结算/第三项军事与边疆净收益/02-第三项正式结算.md
    d_authority_mode: formal_settlement_patch_source
    d_json: docs/评分结算/第三项军事与边疆净收益/军事成本收益比/01-皇帝D项正式结算.json
    d_markdown: docs/评分结算/第三项军事与边疆净收益/军事成本收益比/01-皇帝D项正式结算.md
  fourth_item:
    range: [-67.5, 67.5]
    role: signed_civilization_add_on
    json: docs/评分结算/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json
    markdown: docs/评分结算/第四项文明与国家整合收益/02-第四项正式结算汇总.md
  fifth_item:
    range: [-18, 120]
    role: common_political_quality
    json: docs/评分结算/第五项统治者政治素质/04-第五项统治者政治素质正式结算.json
    markdown: docs/评分结算/第五项统治者政治素质/04-第五项统治者政治素质正式结算.md

