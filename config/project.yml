schema_version: v4-current-project-state-v1

project:
  code: emperor-evaluation-v4
  name: 皇帝综合评价体系 V4
  language: zh-CN
  active_implementation: v4
  v3_runtime_status: retired

current_scope:
  item: fifth_item_b
  shadow_only: true
  five_rule_wall_clock_budget_minutes: null
  wall_clock_budget_priority: observability_only
  person_retrieval_entry_limit: 12
  policy_entry_counts_against_person_limit: false

i5b_current_value:
  runner: emperor_v4.evaluation.i5b_current_value_runner
  dynasty_execution:
    same_dynasty_ruler_mode: serial
    governance_baseline_before_ruler_chain: true
    ruler_governance_increment_sources: [ruler_chronicle, person_biography]
    next_ruler_requires_previous_public_registry_accepted: true
  rulers:
    李世民:
      source_pack: eval/i5b_current_value/李世民/source-pack.json
      outcome_binding: eval/historical_outcome_bindings/李世民.json
      neutral_materials: eval/i5b_current_value/李世民/neutral-materials.json
      result: eval/i5b_current_value/李世民/result.json
      neutral_scan_backbone_material_token: TANG-EARLY-CONTINUOUS
      neutral_scan_backsource_works: [舊唐書, 新唐書]
      dynasty_governance_material_token: TANG
      dynasty_governance_period_terms: [貞觀, 贞观, 唐太宗]
    李渊:
      source_pack: eval/i5b_current_value/李渊/source-pack.json
      outcome_binding: eval/historical_outcome_bindings/李渊.json
      neutral_materials: eval/i5b_current_value/李渊/neutral-materials.json
      result: eval/i5b_current_value/李渊/result.json
      neutral_scan_backbone_material_token: TANG-EARLY-CONTINUOUS
      neutral_scan_backsource_works: [舊唐書, 新唐書]
      dynasty_governance_material_token: TANG
      dynasty_governance_period_terms: [武德, 唐高祖, 高祖, 李渊, 李淵]
    李治:
      source_pack: eval/i5b_current_value/李治/source-pack.json
      outcome_binding: eval/historical_outcome_bindings/李治.json
      neutral_materials: eval/i5b_current_value/李治/neutral-materials.json
      result: eval/i5b_current_value/李治/result.json
      neutral_scan_backbone_works: [資治通鑑]
      neutral_scan_backbone_page_ranges: {資治通鑑: [200, 203]}
      neutral_scan_backsource_works: [舊唐書, 新唐書]
      dynasty_governance_material_token: TANG
      dynasty_governance_period_terms: [永徽, 顯慶, 显庆, 龍朔, 龙朔, 麟德, 乾封, 總章, 总章, 咸亨, 上元, 儀鳳, 仪凤, 調露, 调露, 永隆, 開耀, 开耀, 永淳, 弘道, 唐高宗, 高宗, 李治]
    刘邦:
      source_pack: eval/i5b_current_value/刘邦/source-pack.json
      outcome_binding: eval/historical_outcome_bindings/刘邦.json
      neutral_materials: eval/i5b_current_value/刘邦/neutral-materials.json
      result: eval/i5b_current_value/刘邦/result.json
      neutral_scan_backbone_works: [資治通鑑]
      neutral_scan_backbone_page_ranges: {資治通鑑: [7, 12]}
      neutral_scan_backsource_works: [史記, 漢書]
      dynasty_governance_material_token: HAN
      dynasty_governance_period_terms: [高帝, 高祖, 漢王, 汉王, 劉邦, 刘邦]
  settlement_mode: policy_budget
  numeric_factor_source: config/i5b-scoring-policy.yml
  formal_45_point_score: false
  tier: false
  ranking: false

historical_outcome_registry:
  current_json: eval/historical_outcome_registry/current.json
  current_markdown: eval/historical_outcome_registry/current.md
  partition_root: eval/historical_outcome_registry
  cross_dynasty_outcome_partition_owners: {}
  audit_before_ruler_window_binding: true
  formal_writes_allowed: false

historical_person_profile_registry:
  current_json: eval/historical_person_profiles/current.json
  current_markdown: eval/historical_person_profiles/current.md
  partition_root: eval/historical_person_profiles
  audit_before_ruler_window_binding: true
  formal_writes_allowed: false

historical_quality_gold:
  schema: config/historical-quality-gold-manifest.schema.json
  comparator: emperor_v4.evaluation.historical_quality_gold
  comparison_mode: post_run_gold_only
  model_access_allowed: false
  rulers:
    李世民:
      manifest: eval/historical_quality_gold/李世民.json
      scope_completeness: full_ruler
    李渊:
      manifest: eval/historical_quality_gold/李渊.json
      scope_completeness: full_ruler
    刘邦:
      manifest: eval/historical_quality_gold/刘邦.json
      scope_completeness: full_ruler

person_profile_storage:
  canonical_profile_table: v4_person_profile.person_profiles
  canonical_identity_table: v4_person_profile.person_identity_registry

neutral_material_reuse:
  shared_chronicle_materials:
    TANG-EARLY-CONTINUOUS:
      works: [資治通鑑]
      page_ranges: {資治通鑑: [184, 199]}
      subjects: [李渊, 李世民]
      extraction_contract: shared-ruler-chronicle-neutral-v2
  public_outcome_and_profile_rules: docs/证据规则/公共成果登记与人物画像规则.md
  single_dynasty_governance_workflow: docs/证据规则/单朝代治理会话工作流.md
  single_emperor_session_workflow: docs/证据规则/单皇帝主控会话工作流.md
  unified_intake_contract: neutral-material-intake
  unified_intake_channels: [ruler_chronicle, person_biography, dynasty_governance]
  dynasty_governance_fact_requires: [fact_ref, source_refs]
  automatic_dedupe_requires_same_neutral_fact_ref: true
  semantic_similarity_auto_merge_allowed: false
  governance_projection_requires_all_fact_refs_resolved: true
  structured_output_contract: codex-structured-output-contract-v1
  schema_preflight_before_model_call: true
  single_canary_before_fanout: true
  tool_free_extraction_required: true
  ignored_manifest_fields_fail_closed: true
  result_schema_and_exact_quote_acceptance_required: true
  source_identity: [canonical_subject, source_page, source_revision, extraction_contract]
  shared_read_does_not_merge_responsibility: true
  raw_mediawiki_markup_allowed_for_model_scan: false
  dynasty_governance_output_schema: config/dynasty-neutral-governance-output.schema.json
  dynasty_governance_actor_contribution_phases_required: true
  dynasty_governance_quote_ignores_only: [layout_whitespace, numeric_editorial_note_anchor]
  dynasty_source_increment_output_schema: config/dynasty-neutral-source-increment-output.schema.json
  dynasty_material_settlement_contract: dynasty-neutral-material-settlement-v1
  dynasty_material_settlement_mixed_chain_partial_overlap_review_required: true
  dynasty_material_settlement_preserves_fact_variants: true
  dynasty_material_atomization_contract: dynasty-neutral-material-atomization-audit-v1
  historical_outcome_cluster_registry_schema: config/historical-outcome-cluster-registry.schema.json
  historical_character_normalization_allowed: false
  formal_writes_allowed: false

dynasty_governance_catalog:
  schema_version: dynasty-governance-catalog-v1
  person_or_ruler_chronicles_are_not_governance_books: true
  quality_requires_catalog_source_families: true
  selection_policy: resolve_configured_sections_to_fixed_revision_pages
  shared_current_root_contract: dynasty_neutral_materials/<dynasty_token>/current.json
  dynasties:
    秦:
      aliases: [秦朝]
      dynasty_token: QIN
      source_works:
        - work: 史記
          source_genre: official_history_treatise_and_core_governance_biography
          section_groups:
            central_policy: [秦始皇本紀, 李斯列傳]
            law_and_bureaucracy: [商君列傳, 李斯列傳]
            economy_and_public_works: [平準書, 河渠書]
          target_scope: 仅抽取秦政权实际实施、运行或产生可观察结果的官制、法律、财政、工程和地方治理事实；先秦制度背景不得单独成为秦朝事实。
          domain_focus: [官制, 法律刑狱, 财政经济, 工程交通, 地方治理]
    西汉:
      aliases: [汉, 前汉]
      dynasty_token: HAN
      source_works:
        - work: 漢書
          source_genre: official_history_treatises
          section_groups:
            bureaucracy: [百官公卿表]
            law: [刑法志]
            economy: [食貨志, 溝洫志]
            ritual_education: [禮樂志]
            public_religion: [郊祀志]
            frontier: [西域傳]
            knowledge_context: [藝文志]
          target_scope: 仅抽取西汉实际实施、运行或产生可观察结果的官制、选官、法律、财政、水利、军政、边疆、教育与公共礼制事实；艺文目录只作知识背景，不得独立登记为治理成果。
          domain_focus: [官制, 选官, 法律刑狱, 财政经济, 水利, 军制边政, 教育礼制]
    东汉:
      aliases: [后汉]
      dynasty_token: EASTERN-HAN
      source_works:
        - work: 後漢書
          source_genre: official_history_treatises
          section_groups:
            bureaucracy: [百官志]
            ritual_and_public_order: [禮儀志, 祭祀志]
            frontier: [西羌傳, 南匈奴列傳]
          target_scope: 仅抽取东汉实际实施、运行或产生可观察结果的中央官制、公共礼制与边疆治理事实；郡国静态清单不作为默认扫描范围。
          domain_focus: [官制, 公共礼制, 边疆治理]
        - work: 東漢會要
          source_genre: institutional_compendium
          section_groups:
            education_and_selection: [學校, 選舉]
            law_and_discipline: [刑法, 黨錮]
            economy_and_relief: [食貨, 賑貸, 水利]
            military: [兵]
          target_scope: 补足《后汉书》没有独立刑法、食货和兵志造成的制度缺口；只抽取东汉已经实施、运行或产生结果的事实，并回指其所引原始史料。
          domain_focus: [教育选官, 法律监察, 财政民生, 军制]
    三国:
      aliases: [曹魏, 蜀汉, 孙吴]
      dynasty_token: THREE-KINGDOMS
      source_works:
        - work: 三國會要
          source_genre: institutional_compendium
          section_groups:
            bureaucracy: [職官]
            selection: [選舉]
            economy: [食貨]
            law: [刑法]
            military: [兵]
            education: [學校]
            public_society: [庶政, 戶口, 風俗]
            frontier: [四夷]
            public_ritual: [禮]
          target_scope: 按魏、蜀、吴分别抽取实际实施、运行或产生可观察结果的制度事实，必须保留政权归属，不得把三国制度合并成同一事实；礼制仅保留具有公共社会影响的部分。
          domain_focus: [官制, 选官, 法律刑狱, 财政民生, 军制, 教育, 社会治理, 边疆]
    两晋十六国:
      aliases: [西晋, 东晋, 十六国]
      dynasty_token: JIN-SIXTEEN-KINGDOMS
      source_works:
        - work: 晉書
          source_genre: official_history_treatises_and_records
          section_groups:
            bureaucracy: [職官志]
            law: [刑法志]
            economy: [食貨志]
            military: [兵, 軍]
            ritual_and_culture: [禮志, 樂志]
          target_scope: 分别保留西晋、东晋和十六国政权归属，只抽取实际实施、运行或产生可观察结果的制度与治理事实；礼乐只保留教育、社会规范或公共负担事实。
          domain_focus: [官制, 法律刑狱, 财政民生, 军制, 教育礼乐]
    南北朝:
      aliases: [南朝, 北朝, 北魏, 东魏, 西魏, 北齐, 北周, 刘宋, 南齐, 梁, 陈]
      dynasty_token: SOUTHERN-NORTHERN
      source_works:
        - work: 隋書
          source_genre: official_history_treatises_covering_pre_sui_polities
          section_groups:
            bureaucracy: [百官志]
            law: [刑法志]
            economy: [食貨志]
            ritual_and_culture: [禮儀, 音樂]
          target_scope: 仅抽取隋以前南北朝各政权实际实施的制度事实，逐条保留具体政权和年代；不得把隋制反投到前朝；礼乐只保留教育、社会规范、共同体整合或公共负担事实。
          domain_focus: [官制, 法律刑狱, 财政民生, 军制边政, 教育礼乐]
    隋:
      aliases: [隋朝]
      dynasty_token: SUI
      source_works:
        - work: 隋書
          source_genre: official_history_treatises
          section_groups:
            bureaucracy: [百官志]
            law: [刑法志]
            economy: [食貨志]
            ritual_and_culture: [禮儀, 音樂]
          target_scope: 仅抽取隋代实际实施、运行或产生可观察结果的官制、选官、法律、财政、军政及具有公共影响的礼乐事实。
          domain_focus: [官制, 选官, 法律刑狱, 财政民生, 军制, 教育礼乐]
    唐:
      aliases: [武周]
      dynasty_token: TANG
      source_works:
        - work: 唐會要
          source_genre: institutional_compendium
          section_groups:
            bureaucracy: [官號, 省, 臺, 寺, 監]
            selection: [選舉, 貢舉]
            economy: [戶口, 租庸調, 賦稅, 鹽鐵]
            law: [刑法, 斷獄]
            military: [府兵, 軍]
          target_scope: 仅抽取唐代实际实施、运行或产生可观察结果的制度事实，并保存具体纪年；前代沿革只作唐制承继或改革背景。
          domain_focus: [官制, 选官, 法律刑狱, 财政民生, 军制边政]
        - work: 唐六典
          source_genre: administrative_code
          section_groups:
            central_government: [三師, 三公, 尚書省, 門下省, 中書省]
            supervision_and_justice: [御史臺, 大理寺, 刑部]
            finance_and_people: [戶部, 度支, 倉部]
            military: [兵部, 衛尉寺, 諸衛]
          target_scope: 只抽取可与唐代实际运行、改革或可观察结果相连接的制度结构；纯静态官名表不得独立登记为治理成果。
          domain_focus: [中央官制, 监察司法, 财政民生, 军制]
        - work: 貞觀政要
          source_genre: reign_governance_discourse
          page_titles:
            - 貞觀政要/卷01
            - 貞觀政要/卷02
            - 貞觀政要/卷03
            - 貞觀政要/卷04
            - 貞觀政要/卷05
            - 貞觀政要/卷06
            - 貞觀政要/卷07
            - 貞觀政要/卷08
            - 貞觀政要/卷09
            - 貞觀政要/卷10
          section_groups:
            political_operation: [君道, 政體, 求諫, 納諫]
            appointments_and_responsibility: [任賢, 擇官, 封建]
            law_economy_security: [公平, 刑法, 儉約, 征伐, 安邊]
            education_and_culture: [崇儒學, 文史, 禮樂]
          target_scope: 复用既有固定 revision 与逐字引文，只补贞观时期治理举措、运行、公共结果、代价及君臣责任；人物品行和一般言论不独立登记为公共治理成果。
          domain_focus: [政治运行, 任用责任, 法律刑狱, 财政民生, 国家安全, 教育文化]
        - work: 新唐書
          source_genre: official_history_geography_context
          page_titles:
            - 新唐書/卷037
            - 新唐書/卷038
            - 新唐書/卷039
            - 新唐書/卷040
            - 新唐書/卷041
            - 新唐書/卷042
            - 新唐書/卷043上
            - 新唐書/卷043下
          section_groups:
            geography_context: [地理志]
          target_scope: 只抽取人口、交通、物产、行政区划、边疆形势及区域灾害的治理背景和可观察变化；静态地名沿革只作四轴基线，禁止独立包装为治理成果。
          domain_focus: [人口与区域生产, 交通地理, 行政区划, 边疆安全, 灾害背景]
    五代十国:
      aliases: [后梁, 后唐, 后晋, 五代后汉, 后周, 十国]
      dynasty_token: FIVE-DYNASTIES-TEN-KINGDOMS
      source_works:
        - work: 五代會要
          source_genre: institutional_compendium
          section_groups:
            bureaucracy: [官制, 職官]
            selection: [選舉, 貢舉]
            economy: [戶口, 賦稅, 鹽鐵]
            law: [刑法, 斷獄]
            military: [軍, 兵]
            education: [褒崇先聖, 經籍, 弘文館, 集賢院]
            public_society: [戶口, 逃戶, 奴婢, 道路, 橋梁, 疏鑿利人]
            frontier: [回鶻, 吐渾, 契丹, 黨項, 高麗, 渤海]
          target_scope: 按五代及十国具体政权分别抽取实际实施、运行或产生结果的制度事实，禁止跨政权合并；优先卷八至十、二十及二十五至三十中的教育、刑法、户口、工程与边疆事实。
          domain_focus: [官制, 选官, 法律刑狱, 财政民生, 军制, 教育, 社会治理, 边疆]
    辽:
      aliases: [契丹, 西辽]
      dynasty_token: LIAO
      source_works:
        - work: 遼史
          source_genre: official_history_treatises
          section_groups:
            social_organization: [營衛]
            bureaucracy: [百官志]
            law: [刑法志]
            economy: [食貨志]
            military: [兵衛志]
            identity_integration: [禮志, 國樂, 本國拜儀]
          target_scope: 仅抽取辽及明确可归属西辽的实际制度和治理事实；营卫用于覆盖部族组织和南北制度，礼乐只保留共同体整合或公共社会影响；制度名称不得替代实施与结果证据。
          domain_focus: [部族与南北制度, 官制, 法律刑狱, 财政民生, 军制, 共同体整合]
    宋:
      aliases: [北宋, 南宋]
      dynasty_token: SONG
      source_works:
        - work: 宋會要輯稿
          source_genre: institutional_compendium
          section_groups:
            bureaucracy: [職官]
            selection: [選舉]
            economy: [食貨]
            law: [刑法]
            military: [兵]
            education_and_knowledge: [崇儒]
            religion_and_society: [道釋]
            frontier_and_external_relations: [蕃夷]
          target_scope: 仅抽取宋代实际实施、运行或产生可观察结果的制度事实，保存具体纪年并区分北宋、南宋；礼类不全扫，只有公共社会影响明确时定向补入。
          domain_focus: [官制, 选官, 法律刑狱, 财政民生, 军制边政, 教育知识, 宗教社会]
    西夏:
      aliases: [夏国]
      dynasty_token: WESTERN-XIA
      source_works:
        - work: 天盛改舊新定律令
          source_genre: primary_legal_and_administrative_code
          section_groups:
            bureaucracy: [司序行文門, 官階封爵門]
            law: [罪則, 斷獄]
            economy: [田土, 賦稅, 倉庫]
            military: [軍事, 兵]
          target_scope: 只抽取能够与西夏实际运行、执行或结果相连接的法律与行政事实；法典静态条文不得自动视为已实施成果。
          domain_focus: [官制, 法律刑狱, 财政民生, 军制]
        - work: 西夏書事
          source_genre: polity_chronicle
          section_groups:
            implementation: [詔, 定制, 置, 改, 行]
            culture_and_society: [文字, 學校, 佛, 僧, 禮俗]
          target_scope: 仅用于补充法典制度的实际颁行、改革和结果，以及文字、学校、宗教和社会规范的实际运行；不作为第二条皇帝连续主干。
