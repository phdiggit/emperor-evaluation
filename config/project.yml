schema_version: v4-settled-scoring-project-v1

project:
  code: emperor-evaluation-v4
  name: 皇帝综合评价体系 V4
  language: zh-CN
  status: five_items_formally_settled

scoring_contract:
  governing_document: docs/项目总纲/皇帝综合评价体系评分标准.md
  common_positive_denominator: 775
  first_item_add_on_formula: F = 0.10 * 775 * (S1 / 240) ^ 1.25
  composite_formula: T = S_common + F + CIV4
  database_write: false
  cross_item_ranking_write: false

formal_settlements:
  first_item:
    max_points: 240
    role: conditional_founder_add_on
    json: docs/评分结算/第一项创业与政权取得能力/01-第一项创业与政权取得能力正式结算.json
    markdown: docs/评分结算/第一项创业与政权取得能力/01-第一项创业与政权取得能力正式结算.md
  second_item:
    range: [-45, 405]
    role: common_governance
    json: docs/评分结算/第二项治国净收益/01-第二项治国净收益405分正式结算.json
    markdown: docs/评分结算/第二项治国净收益/01-第二项治国净收益405分正式结算.md
  third_item:
    range: [-40, 250]
    role: common_military
    json: docs/评分结算/第三项军事与边疆净收益/02-第三项正式结算.json
    markdown: docs/评分结算/第三项军事与边疆净收益/02-第三项正式结算.md
  fourth_item:
    range: [-67.5, 67.5]
    role: signed_civilization_add_on
    json: docs/评分结算/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json
    markdown: docs/评分结算/第四项文明与国家整合收益/02-第四项正式结算汇总.md
  fifth_item:
    range: [-18, 120]
    role: common_political_quality
    json: docs/评分结算/第五项统治者政治素质/04-第五项统治者政治素质正式结算.json
    markdown: docs/评分结算/第五项统治者政治素质/04-第五项统治者政治素质正式结算.md

retained_build_chain:
  input_roots:
    common: config/common
    first_item: config/first-item
    third_item: config/third-item
    military: config/military
  battle_registry: docs/公共成果/军事/01-战役登记.json
  military_talent_registry: docs/公共成果/军事/02-武将人才等级.json
  military_cost_benefit_registry: docs/公共成果/军事/03-军事行动成本和收益登记.json
  first_item_commands: [first-item-a-registry, first-item-b-registry, first-item-c-registry]
  third_item_commands: [third-item-d-settlement, third-item-current-settlement]
  verification_command: formal-settlements-verify
