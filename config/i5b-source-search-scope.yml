schema_version: i5b-source-search-scope-v4

neutral_material_defaults:
  scan_start:
    polity_founder: verified_independent_foundation_activity
    non_founder: accession
  scan_end: death_or_loss_of_rule
  person_material_mode: candidate_official_biographies_only
  prohibit_full_biography_collection_scan: true
  fragmented_regime_person_fallback:
    - polity_official_biography
    - official_history_zai_ji_shi_jia_or_guo_zhuan
    - polity_chronicle_named_person_aggregation
  fragmented_regime_standalone_biography_required: false
  max_backbone_pages_per_ruler: 64

