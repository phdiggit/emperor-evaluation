schema_version: talent-grade-v10-targeted-correction-policy-v1
policy_version: talent-grade-v10-targeted-correction-v1
status: human_frozen
scope:
  corrected_profiles: [陈群, 苏定方]
  full_high_tier_reaudit_required: false
corrections:
  institution_historic_gate:
    requires_state_foundational_structure_reconstruction: true
    requires_one_of:
      - multi_module_realized_results
      - durable_net_positive_structural_effect
    single_long_lived_mixed_effect_institution_max_grade: top
  military_outcome_taxonomy:
    battle_victory_and_final_objective_unmet_is_not_defeat: true
    final_objective_unmet_reduces_mission_completion: true
    victory_levels:
      - battle_victory
      - decisive_heavy_defeat
      - strategic_destruction_or_state_conquest
  historic_gate_uses_v9_contract:
    requires_era_shaping_height: true
    requires_one_of:
      - repeated_high_stakes_delivery
      - foundational_long_term_legacy
      - multiple_independent_top_level_domains
    third_high_materiality_result_is_not_mandatory: true
    military_legacy_is_not_mandatory_when_repeated_delivery_passes: true
release:
  preserve_v9_rows: true
  overwrite_prior_calibration: false
  formal_scoring_allowed: false
