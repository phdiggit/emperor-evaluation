schema_version: rule-test-set-admission-v1
policy_version: i5b-rule-test-set-admission-v1
status: active_shadow_policy
item_code: i5b_talent_and_delegation

shared_policy:
  reusable_assets:
    - evidence_coverage_contract
    - fixed_revision_source_lineage
    - codex_win_batch_execution
    - duration_and_token_audit
    - open_then_sealed_protocol
    - qualification_thresholds
  qualification_thresholds:
    decision_status_accuracy_min: 1.0
    factor_exact_match_rate_min: 0.85
    false_abstention_max: 0
    material_side_structure_exact_rate_min: 1.0
    unsafe_false_resolution_max: 0
    nonadjacent_error_max: 0
    direction_error_max: 0

sizing_profiles:
  standard_event:
    open_development_units: 8
    sealed_holdout_units: 4
    use_when: 事件边界清楚，但仍需验证适用性、归责和有限因子档位
  high_causal:
    open_development_units: 12
    sealed_holdout_units: 8
    use_when: 负向因果、跨规则去重或结构拆分存在高风险
  aggregate_window:
    open_development_units: 8
    sealed_holdout_units: 4
    use_when: 统计单位是皇帝时间窗，且必须先冻结 canonical 人物集合和画像快照

performance_baseline:
  source_run: i5b_remaining_sealed_holdout_once
  units_per_call: 4
  max_workers: 4
  duration_per_parallel_wave_sec: 96.427
  tokens_per_call: 19897
  optimization_objective: wall_clock_latency_first

rules:
  - priority: 1
    rule_code: appointment_delegation
    current_stage: portfolio_36_completed_not_qualified
    admission_decision: completed_not_qualified
    input_type: hybrid
    test_unit_type: rule_evidence_unit
    sizing_profile: null
    existing_regression_units: 36
    prerequisites:
      - {code: rule_contract, status: satisfied}
      - {code: factor_schema, status: satisfied}
      - {code: open_and_sealed_protocol, status: satisfied}
      - {code: factor_semantics_contract_v6, status: satisfied}
    rule_specific_requirements:
      - 任用、责任域和反馈形成最小充分授权弧
      - 同侧多个授权弧的拆分与合并必须先由确定性合同约束
      - 正负材料分开且不重复结算战役或治理成果
    known_blockers:
      - sealed 中 3 个单元材料侧结构与 Gold 不一致
      - 新增 4 个边界单元虽补齐最低配额，但因子一致率 0.7917，仍未通过资格门
      - 旧 qualifier 的 event_group 字符串排序会交叉配对同侧材料；v6 已冻结 slot_id 与机械观察合同
    next_action: v6 因子语义已冻结；先为 open gap-closure 冻结合法上游 slot，再决定是否建立新 sealed

  - priority: 2
    rule_code: talent_discovery
    current_stage: open_passed_sealed_completed_not_qualified
    admission_decision: completed_not_qualified
    input_type: episode
    test_unit_type: rule_evidence_unit
    sizing_profile: null
    existing_regression_units: 12
    prerequisites:
      - {code: rule_contract, status: satisfied}
      - {code: factor_schema, status: satisfied}
      - {code: shared_scored_runner, status: satisfied}
      - {code: initial_gold_cases, status: satisfied}
      - {code: factor_semantics_contract_v3, status: satisfied}
    rule_specific_requirements:
      - 证明识别依据发生在正式任用和后世成名之前
      - 普通升迁和既有核心人物授权必须进入不适用反例
      - 与 appointment_delegation 只共享证据，不重复结算岗位适配和成果
    known_blockers:
      - sealed 因子一致率 0.8125，低于 0.85 资格门
    next_action: v2 合同已冻结使用前时间轴与障碍双证据；旧资产只作 opened regression，不重跑或改 Gold

  - priority: 3
    rule_code: tolerate_talent
    current_stage: open_passed_sealed_completed_not_qualified
    admission_decision: completed_not_qualified
    input_type: episode
    test_unit_type: rule_evidence_unit
    sizing_profile: null
    existing_regression_units: 20
    prerequisites:
      - {code: rule_contract, status: satisfied}
      - {code: factor_schema, status: satisfied}
      - {code: negative_causality_gate, status: satisfied}
      - {code: opened_regression_contract_v2, status: satisfied}
    rule_specific_requirements:
      - 区分直言冲突、一般刑罚、臣子重大过错与皇帝压制责任
      - 负向材料必须证明人才安全或组织纠错受到实际损害
      - 冲突后的授权修复与持续堵塞反馈不得合并为同一方向
    known_blockers:
      - sealed 适用性 0.875、因子一致率 0.53125，未通过资格门
    next_action: v3 合同已冻结无冲突采纳、严重威胁、主体所有权以及有序独立后续观察；旧资产只作 opened regression

  - priority: 4
    rule_code: anti_nepotism
    current_stage: open_passed_sealed_completed_not_qualified
    admission_decision: completed_not_qualified
    input_type: hybrid
    test_unit_type: rule_evidence_unit
    sizing_profile: null
    existing_regression_units: 20
    prerequisites:
      - {code: rule_contract, status: satisfied}
      - {code: factor_schema, status: satisfied}
      - {code: network_aggregation_boundary, status: satisfied}
      - {code: opened_regression_contract_v2, status: satisfied}
    rule_specific_requirements:
      - 单个亲属或近幸任职不得自动判负
      - 个案能力、程序、岗位责任和长期网络影响必须分层
      - episode 贡献与 aggregate_context 的结构性污染不得重复结算
    known_blockers:
      - sealed 适用性 0.75、因子一致率 0.09375，暴露严重泛化失败
    next_action: v2 合同已冻结适用性枚举、context_kind 因子所有权及网络人数/渠道/跨期门槛；旧资产只作 opened regression

  - priority: 5
    rule_code: team_building
    current_stage: historical_v1_open_and_sealed_qualified
    admission_decision: completed_qualified
    qualification_contract_version: team-building-factor-agent-v1
    current_semantics_contract_version: team-building-factor-agent-v3
    qualification_carries_forward: false
    input_type: ruler_time_window
    test_unit_type: ruler_time_window
    sizing_profile: null
    existing_regression_units: 12
    prerequisites:
      - {code: canonical_person_set, status: satisfied}
      - {code: person_profile_snapshot, status: satisfied}
      - {code: frozen_time_window_contract, status: satisfied}
      - {code: factor_semantics_contract_v3, status: satisfied}
    rule_specific_requirements:
      - 每个皇帝时间窗内同一人物只计一次
      - 人才质量只能来自版本化 PersonProfileSnapshot
      - 岗位覆盖、功能互补和单一亲信依赖使用集合级 Gold
    known_blockers:
      - 旧 Gold 的 multi_historic、strong_three 与 durable_multi_stage 三个邻档不满足 v2 机械门槛，只保留为已开封回归差异
      - V3 实库审计发现旧 open/sealed 画像与当前 accepted 画像有 37 个严格版本或档位差异，其中陈平同 profile_ref 在两集异档
    next_action: v3 分开 talent_grade 与 negative profile 正交轴，并冻结人物计数、独立角色匹配和阶段/交接结构；历史 v1 资格不改写且不继承，v3 保持 shadow-only
