# Canonical owner names stay as personal names. Aliases here are lookup terms only.
# `scopes` disambiguates generic titles such as 高祖/太宗/文帝.
刘邦:
  - alias: 汉高祖
    alias_type: temple_name
  - alias: 高祖
    alias_type: temple_name
    scopes: [刘邦]
  - alias: 汉王
    alias_type: title
  - alias: 沛公
    alias_type: title
刘盈:
  - alias: 汉惠帝
    alias_type: posthumous_name
  - alias: 惠帝
    alias_type: posthumous_name
    scopes: [刘邦, 刘盈, 吕雉]
吕雉:
  - alias: 吕后
    alias_type: title
  - alias: 高后
    alias_type: posthumous_name
    scopes: [刘邦, 刘盈, 吕雉]
刘恒:
  - alias: 汉文帝
    alias_type: posthumous_name
  - alias: 文帝
    alias_type: posthumous_name
    scopes: [刘邦, 刘盈, 吕雉, 刘恒]
  - alias: 孝文帝
    alias_type: posthumous_name
  - alias: 代王
    alias_type: title
刘彻:
  - alias: 汉武帝
    alias_type: posthumous_name
  - alias: 武帝
    alias_type: posthumous_name
    scopes: [刘彻]
刘秀:
  - alias: 汉光武帝
    alias_type: posthumous_name
  - alias: 光武帝
    alias_type: posthumous_name
刘庄:
  - alias: 汉明帝
    alias_type: posthumous_name
  - alias: 明帝
    alias_type: posthumous_name
    scopes: [刘秀, 刘庄]
嬴政:
  - alias: 秦始皇
    alias_type: title
  - alias: 始皇帝
    alias_type: title
李渊:
  - alias: 唐高祖
    alias_type: temple_name
  - alias: 高祖
    alias_type: temple_name
    scopes: [李渊, 李世民, 李治]
李世民:
  - alias: 唐太宗
    alias_type: temple_name
  - alias: 太宗
    alias_type: temple_name
    scopes: [李渊, 李世民, 李治]
  - alias: 秦王
    alias_type: title
李治:
