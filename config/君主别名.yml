    alias_type: temple_name
  - alias: 高宗
    alias_type: temple_name
    scopes: [李世民, 李治, 武则天]
  - alias: 永徽
    alias_type: reign_title
    scopes: [李治]
  - alias: 显庆
    alias_type: reign_title
    scopes: [李治]
武则天:
