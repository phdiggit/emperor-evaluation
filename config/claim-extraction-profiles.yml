schema_version: 1
contract: assertion-extraction-profile-v1
profiles:
  political_action_atomic_v1:
    output_contract: assertion-extraction-contract-v2
    purpose: 从已接受 passage 抽取可复核的原子政治行动事实
    required_chains: []
    prohibitions:
      - 不做规则路由、factor 判断或评分
      - 不使用模型记忆补写原文未支持的事实
      - 每条事实必须绑定唯一 passage support
  talent_discovery_chain_v1:
    output_contract: assertion-extraction-contract-v2
    purpose: 抽取人才发现链中可独立复核的事实环节
    required_chains:
      - 进入统治者有效人才池前的阵营、身份或任用关系
      - 统治者在任用前识别其才能的当时依据，包括人物当场言论、判断、行动或事迹，必须单独抽取
      - 统治者明知阵营、身份、派系或偏见障碍仍完成引入或拔擢
      - 识别转化为实际任用
    prohibitions:
      - 不要求统治者此前从未听说该人物
      - 不用任职后的成就、纳谏或历史名声倒推任用前识才
      - 同一 passage 中多个独立前序阵营、身份或任用关系必须分别保留，不选代表项替代
      - 不用器重、知名等结论替代原文所载的识才言论、行动或当时依据
      - 不抽取与发现链无直接关系的战役过程、地理移动、礼遇、封爵或后续一般任务
      - 缺少环节时只抽原文直接支持的部分并声明 coverage gap
      - 不做规则路由、factor 判断或评分
  tolerate_talent_chain_v1:
    output_contract: assertion-extraction-contract-v2
    purpose: 抽取人才反馈、统治者回应、表达安全与信用修复链中可独立复核的原子事实
    required_chains:
      - 人才向统治者或正式通道提出批评、建议、异议或纠正意见
      - 统治者对该反馈的采纳、拒绝、留任、惩罚、疏远或制度回应
      - 反馈前后的人身、职位与表达安全变化，必须保留时间顺序
      - 信用撤销、名誉处置与后续修复必须分别抽取，不得合并为净结论
    prohibitions:
      - 不把谏诤次数线性展开为多个独立收益事实
      - 不因未见惩罚就推断表达安全，也不因继续任职就推断建议已被采纳
      - 不把制度通道的建立与个人使用该通道产生的收益重复抽取为同一事实
      - 不用身后修复抵销此前的信用撤销或惩罚
      - 不用历史名声、忠臣评价或后世结论补写原文未支持的反馈与回应
      - 每条事实必须绑定唯一 passage support；重叠证据按 equivalent evidence 处理
      - 缺少反馈、回应、安全或修复环节时只抽原文直接支持的部分并声明 coverage gap
      - 不做规则路由、factor 判断或评分
