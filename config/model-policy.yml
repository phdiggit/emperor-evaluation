schema_version: model-policy-v2
model_policy:
  default: denied
  operating_principle: ambiguity_slow_lane_only

  deterministic_first:
    required: true
    cache_lookup_before_call: true
    finite_value_validation_after_call: true

  allowed_uses:
    - source_candidate_discovery
    - assertion_extraction_draft
    - episode_merge_split_suggestion
    - episode_boundary_relation_suggestion
    - episode_pair_disposition_suggestion
    - person_identity_ambiguity_review
    - contradiction_detection_draft
    - rule_projection_draft_when_ambiguous
    - rule_factor_option_proposal_when_ambiguous
    - reviewer_worklist_generation
    - shadow_difference_explanation_draft

  requires_gate:
    - accepted_source_passage
    - canonical_person_creation
    - canonical_episode_acceptance
    - episode_relation_acceptance
    - rule_evidence_unit_acceptance
    - rule_judgment_acceptance
    - scoring_release
    - production_cutover

  prohibited_uses:
    - invent_source
    - establish_historical_fact_without_gate
    - overwrite_source_text
    - silently_merge_conflicting_events
    - merge_cross_structure_episode_core
    - merge_unanchored_legacy_claim_fanout
    - directly_publish_formal_judgment
    - directly_publish_formal_score
    - supply_factor_numeric_value_or_score
    - create_or_merge_canonical_person_without_identity_gate
    - production_database_write
    - production_cutover_decision

workflow_agent_routing:
  authority: draft_only
  task_contract:
    explicit_stage_required: true
    explicit_model_argument_required: true
    explicit_reasoning_effort_required: true
    escalation_reason_required: true
    worker_repository_write_allowed: false
    worker_formal_fact_acceptance_allowed: false
    worker_formal_scoring_allowed: false

  profiles:
    luna_low:
      model: gpt-5.6-luna
      reasoning_effort: low
    luna_medium:
      model: gpt-5.6-luna
      reasoning_effort: medium
    terra_medium:
      model: gpt-5.6-terra
      reasoning_effort: medium
    terra_high:
      model: gpt-5.6-terra
      reasoning_effort: high
    sol_high:
      model: gpt-5.6-sol
      reasoning_effort: high

  stages:
    dynasty_governance_neutral_extraction:
      allowed_use: assertion_extraction_draft
      primary_profile: luna_low
      escalation_profile: luna_medium
      escalation_triggers:
        - classical_chinese_subject_ellipsis
        - overlapping_event_boundaries
        - contradictory_passages
    named_subject_source_discovery:
      allowed_use: source_candidate_discovery
      primary_profile: luna_medium
      escalation_profile: terra_high
      escalation_triggers:
        - conflicting_sources
        - actor_or_ruler_attribution_ambiguous
        - source_lineage_uncertain
    independent_cross_source_retrieval:
      allowed_use: source_candidate_discovery
      primary_profile: terra_medium
      escalation_profile: terra_high
      escalation_triggers:
        - conflicting_sources
        - cross_person_institution_inference
        - negative_evidence_requires_context
    legacy_hint_disposition:
      allowed_use: reviewer_worklist_generation
      primary_profile: luna_low
      escalation_profile: terra_medium
      escalation_triggers:
        - multiple_candidate_events
        - cross_rule_attribution
        - insufficient_route_context
    assertion_extraction:
      allowed_use: assertion_extraction_draft
      primary_profile: luna_medium
      escalation_profile: terra_high
      escalation_triggers:
        - classical_chinese_subject_ellipsis
        - overlapping_event_boundaries
        - contradictory_passages
    person_rebuild_minimum_claim:
      allowed_use: assertion_extraction_draft
      primary_profile: luna_low
      escalation_profile: luna_medium
      escalation_triggers:
        - focal_subject_identity_not_explicit
        - accusation_and_direct_action_mixed
        - political_risk_disposition_missing
    episode_candidate_normalization:
      allowed_use: episode_merge_split_suggestion
      primary_profile: luna_medium
      escalation_profile: terra_high
      escalation_triggers:
        - cross_source_event_identity
        - shared_institution_and_personal_benefit
        - duplicate_settlement_risk
    candidate_inventory_review:
      allowed_use: reviewer_worklist_generation
      primary_profile: terra_high
      escalation_profile: sol_high
      escalation_triggers:
        - cross_person_institution_inference
        - unresolved_material_conflict
        - historical_coverage_attestation
    i5b_source_review_projection:
      allowed_use: rule_projection_draft_when_ambiguous
      primary_profile: luna_low
      escalation_profile: luna_medium
      escalation_triggers:
        - classical_chinese_subject_ellipsis
        - unresolved_material_conflict
    final_gate_review_support:
      allowed_use: reviewer_worklist_generation
      primary_profile: sol_high
      escalation_profile: null
      escalation_triggers: []
