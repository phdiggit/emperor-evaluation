schema_version: canonical-ruler-admission-adjudications-v1
status: CURRENT
policy:
  minimum_effective_power_years: 3
  requires_independent_highest_decision_power: true
  pending_second_item_requires_local_evidence_refs: true

actual_power_window_overrides:
  李存勖:
    actual_power_window: 908—926年
    basis: 908年李克用去世后，李存勖承接晋王与河东最高军政责任，已实际独立承制、任官、调兵并主导晋政权创业与灭梁路径；923年称帝是名义变化，不是实际权力起点。窗口连续至926年，不把李克用此前权力窗口倒灌给李存勖。
    evidence_refs:
      - docs/史料通读产物/五代十国/资治通鉴/volume-266.source-summary.md
      - docs/史料通读产物/五代十国/资治通鉴/volume-267.source-summary.md
      - docs/史料通读产物/五代十国/资治通鉴/volume-272.source-summary.md
  冯太后:
    actual_power_window: "[[465, 467], [476, 490]]"
    basis: 首次临朝与复临朝是两个本人最高权力窗口，中间拓跋弘本人主政期不得并入。
    evidence_refs:
      - config/third-item/third-item-result-credit-adjudications.json
      - docs/公共成果/军事/03-军事行动成本和收益登记.json
  王莽:
    actual_power_window: 6—23年实际最高主政
    basis: 6年起摄政主政已满足实际最高权力口径，不以8年称帝作为实际权力起点。
    evidence_refs:
      - docs/公共成果/军事/03-军事行动成本和收益登记.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  刘裕:
    actual_power_window: 404—422年实际掌权至宋帝
    basis: 404年起兵并控制东晋中枢后的实际最高主政链连续至422年。
    evidence_refs:
      - docs/史料通读产物/唐以前编年/两晋/卷113-通读总结.md
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  刘祜:
    actual_power_window: 121—125年亲政
    basis: 106—121年邓绥临朝不得归为刘祜独立最高决策；本人可结算窗口从邓绥去世后的121年起算。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  刘志:
    actual_power_window: 150—168年亲政
    basis: 146—150年梁妠临朝不得与刘志重复归责；本人窗口从150年亲政起算。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json

third_item_window_adjudications:
  FORMAL_SCORE_INVALIDATED_PENDING_READJUDICATION:
    rulers: [李治, 武则天, 玄烨, 司马曜, 宇文邕, 高湛, 高纬, 嬴政, 李谅祚, 李秉常, 李乾顺]
    basis: 规范人物池的实际最高权力窗口与当前第三项消费窗口存在实质冲突，且现有第三项正式记录仍消费非本人独立最高权力阶段、把共同掌权阶段完整归给单一主体，或把仍由前任实际掌权的阶段切给继任者。李治、武则天需重裁660—683共享权力；玄烨、司马曜、宇文邕、嬴政的第三项仍以名义即位而非亲政起点建立A/B/C/D窗口；高湛、高纬在565—569太上皇实际掌权期存在主体错切；李谅祚、李秉常、李乾顺仍按幼主名义在位期消费长期军事结果与成本。完成逐人起终锚、逐链授权责任和成本窗口重裁前，旧第三项分不得进入综合榜。共享或摄政关系不得机械对半，必须逐链实证归责。
    evidence_refs:
      - config/common/canonical-ruler-pool.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/国防安全/01-皇帝AB项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事体系有效性/01-皇帝C项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事成本收益比/01-皇帝D项正式结算.json
      - docs/分项规则/第三项军事与边疆净收益/国防安全/00-规则与结算合同.md
  ACCEPTED_AFTER_WINDOW_NARROWING:
    rulers: [冯太后, 刘肇, 刘祜, 刘志]
    basis: 现有第三项正式记录已经把实际最高权力窗口与名义在位期拆开：冯太后仅消费465—467与476—490两个临朝窗口；刘肇从92年六月亲政起算并将此前窦氏期只作继承基线；刘祜严格只消费121—125亲政期；刘志从150年亲政起算。窗口前事实只允许作为继承状态、客观基线或明确排除材料，不产生本人信用或成本。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/国防安全/01-皇帝AB项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事成本收益比/01-皇帝D项正式结算.json
      - docs/分项规则/第三项军事与边疆净收益/国防安全/00-规则与结算合同.md
second_item_window_adjudications:
  ACCEPTED_AFTER_WINDOW_NARROWING:
    rulers: [冯太后, 刘肇, 刘祜, 刘志, 司马曜, 宇文邕, 嬴政, 高纬, 玄烨]
    basis: 第二项计分主因位于本人实际最高权力窗口；窗口前材料仅允许作继承基线、背景或明确不计分约束。刘祜、刘志已完成C1—C4逐轴重审，其余对象经现有四轴证据复核，正式分值均可保留。
    evidence_refs:
      - docs/评分结算/净收益/第二项治国净收益/制度行政/01-A制度建设与实际运行方向卡.json
      - docs/评分结算/净收益/第二项治国净收益/制度行政/02-B1官僚治理与行政执行方向卡.json
      - docs/评分结算/净收益/第二项治国净收益/制度行政/03-B2反馈纠错与权力约束方向卡.json
      - docs/评分结算/净收益/第二项治国净收益/财政民生/01-C1正式结算.json
      - docs/评分结算/净收益/第二项治国净收益/财政民生/02-C2正式结算.json
      - docs/评分结算/净收益/第二项治国净收益/财政民生/03-C3正式结算.json
exclusions:
  溥仪:
    reason_code: EXCLUDED_NO_EFFECTIVE_POWER
    reason: 清帝在本项目时段内没有可持续、独立的最高决策权；复辟窗口亦不足一年。
  刘盈:
    reason_code: EXCLUDED_LIMITED_INDEPENDENT_POWER
    reason: 吕后强势主政下仅保留有限本人选择，不能把政权运行结果稳定归为本人最高决策。
  司马炽:
    reason_code: EXCLUDED_LIMITED_INDEPENDENT_POWER
    reason: 实际权力长期受司马越制约，现有材料只能辨认有限本人选择，不足以支撑统一尺度的最高统治者评价。
  陈霸先:
    reason_code: EXCLUDED_EFFECTIVE_POWER_LT_3_YEARS
    reason: 557—559年实际最高统治不足3年。
  司马绍:
