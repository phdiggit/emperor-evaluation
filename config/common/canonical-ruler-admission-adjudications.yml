schema_version: canonical-ruler-admission-adjudications-v1
status: CURRENT
policy:
  minimum_effective_power_years: 3
  requires_independent_highest_decision_power: true
  pending_second_item_requires_local_evidence_refs: true

first_item_scope_notes:
  玄烨: 1673—1683三藩—台湾再统一适用第一项。三藩旧地恢复270按50%折为135，1683年台湾郑氏空间按第一项主要区域60的半幅覆盖记新增30，原始有效信用165；清初共同项目原始总量1015封顶后归一，玄烨等效信用162.56、A=19.5。三藩既有清廷控制的“深化信用”不另加分，避免与恢复及第二项治理重复。

actual_power_window_overrides:
  李存勖:
    actual_power_window: 908—926年
    basis: 908年李克用去世后，李存勖承接晋王与河东最高军政责任，已实际独立承制、任官、调兵并主导晋政权创业与灭梁路径；923年称帝是名义变化，不是实际权力起点。窗口连续至926年，不把李克用此前权力窗口倒灌给李存勖。
    evidence_refs:
      - docs/史料通读产物/五代十国/资治通鉴/volume-266.source-summary.md
      - docs/史料通读产物/五代十国/资治通鉴/volume-267.source-summary.md
      - docs/史料通读产物/五代十国/资治通鉴/volume-272.source-summary.md
  冯太后:
    actual_power_window: "[[465, 467], [476, 490]]"
    basis: 首次临朝与复临朝是两个本人最高权力窗口，中间拓跋弘本人主政期不得并入。
    evidence_refs:
      - config/third-item/third-item-result-credit-adjudications.json
      - docs/公共成果/军事/03-军事行动成本和收益登记.json
  王莽:
    actual_power_window: 6—23年实际最高主政
    basis: 6年起摄政主政已满足实际最高权力口径，不以8年称帝作为实际权力起点。
    evidence_refs:
      - docs/公共成果/军事/03-军事行动成本和收益登记.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  刘裕:
    actual_power_window: 404—422年实际掌权至宋帝
    basis: 404年起兵并控制东晋中枢后的实际最高主政链连续至422年。
    evidence_refs:
      - docs/史料通读产物/唐以前编年/两晋/卷113-通读总结.md
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  刘祜:
    actual_power_window: 121—125年亲政
    basis: 106—121年邓绥临朝不得归为刘祜独立最高决策；本人可结算窗口从邓绥去世后的121年起算。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  刘志:
    actual_power_window: 150—168年亲政
    basis: 146—150年梁妠临朝不得与刘志重复归责；本人窗口从150年亲政起算。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  刘肇:
    actual_power_window: 92—105年亲政；88—92年窦氏主政期另标共享
    third_item_overlap_status: NO_OVERLAP_IN_SCORING_WINDOW
    basis: 刘肇当前正式评价窗口从92年亲政起算；88—92年窦氏主政期不进入本人的第三项计分窗口，因此不存在当前A/B/C/D并行重复消费。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  李治:
    actual_power_window: 649—683年；660年后与武则天共享部分权力
    third_item_overlap_status: COMPONENT_REVIEW_COMPLETE
    overlap_review_id: THIRD-OVERLAP-TANG-LIZHI-WUZETIAN-660-683
    overlapping_ruler_ids: [RULER-TANG-LIZHI, RULER-TANG-WUZETIAN]
    basis: 660—683年属于李治与武则天共享部分最高权力的政治窗口；现有百济、高句丽、唐罗等正式战役卡把任将、出兵与收束军令直接定位到李治，故第三项采用李治为单一记账主体。吐蕃父卡明确不能闭合单一政治责任中心，保留为共享背景与证据边界，但仍按正式军令签发主体的统一规则只在李治账消费；该选择不表示武则天没有政治影响。
    evidence_refs:
      - docs/公共成果/军事/01-战役登记/qin_tang-22.json
      - docs/公共成果/军事/01-战役登记/qin_tang-03.json
      - docs/公共成果/军事/01-战役登记/qin_tang-21.json
      - docs/公共成果/军事/01-战役登记/qin_tang-19.json
  武则天:
    actual_power_window: 660—705年由参政、临朝到称帝的连续实际权力期
    third_item_overlap_status: COMPONENT_REVIEW_COMPLETE
    overlap_review_id: THIRD-OVERLAP-TANG-LIZHI-WUZETIAN-660-683
    overlapping_ruler_ids: [RULER-TANG-LIZHI, RULER-TANG-WUZETIAN]
    basis: 武则天的规范实际权力期从660年开始，但660—683年同一国家军事结果已按具名任将、出兵和收束军令由李治作为第三项单一记账主体消费；武则天不重复取得该阶段A/B/C/D信用或承担同一成本，684年以后再进入本人独立第三项窗口。此处只处理绩效账唯一消费，不否定共享政治权力。
    evidence_refs:
      - docs/公共成果/军事/01-战役登记/qin_tang-22.json
      - docs/公共成果/军事/01-战役登记/qin_tang-03.json
      - docs/公共成果/军事/01-战役登记/qin_tang-21.json
      - docs/公共成果/军事/01-战役登记/qin_tang-19.json
  玄烨:
    actual_power_window: 1669—1722年亲政
    third_item_window_status: COMPONENT_REVIEW_COMPLETE
    basis: 1661—1669辅政期只作继承状态；第三项本人信用、体系表现与成本从1669年亲政起算。现有计分链均始于1673年以后，无须删除当前计分链。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  嬴政:
    actual_power_window: 前238—前210年亲政
    third_item_window_status: COMPONENT_REVIEW_COMPLETE
    basis: 前246—前238年吕不韦主政期只作继承状态；第三项当前计分的匈奴、长城与岭南链均发生于亲政后，现值不因切窗改变。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  司马曜:
    actual_power_window: 376—396年亲政
    third_item_window_status: COMPONENT_REVIEW_COMPLETE
    basis: 372—376年褚太后临朝期只作继承状态；现有第三项计分链均发生于378年以后，起终安全档不变。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  宇文邕:
    actual_power_window: 572—578年诛宇文护后亲政
    third_item_window_status: COMPONENT_REVIEW_COMPLETE
    basis: 560—572年宇文护实际主政期退出本人第三项信用与成本；566年信州链及564年宕昌控制包删除，灭北齐统一链仅保留572—577本人阶段的能力观察并继续按第一项去重。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  高湛:
    actual_power_window: 561—569年含太上皇实际掌权期
    third_item_window_status: COMPONENT_REVIEW_COMPLETE
    basis: 565年禅位不构成实际权力终点；窗口延长至569年失去最高权力。新增阶段没有独立计分链，现有A/B/C/D值不变。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
  高纬:
    actual_power_window: 569—577年亲政至亡国
    third_item_window_status: COMPONENT_REVIEW_COMPLETE
    basis: 565—569年高湛仍以太上皇实际掌权，该阶段退出高纬本人第三项；现有计分链均发生于573年以后，起点状态改在569年承接，现值不变。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json

third_item_window_adjudications:
  FORMAL_SCORE_INVALIDATED_PENDING_READJUDICATION:
    rulers: [李谅祚, 李秉常, 李乾顺]
    basis: 李谅祚、李秉常、李乾顺仍按幼主名义在位期消费长期军事结果与成本。完成逐人起终锚、逐链授权责任和成本窗口重裁前，旧第三项分不得进入综合榜。共享或摄政关系不得机械对半，必须逐链实证归责。
    evidence_refs:
      - config/common/canonical-ruler-pool.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/国防安全/01-皇帝AB项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事体系有效性/01-皇帝C项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事成本收益比/01-皇帝D项正式结算.json
      - docs/分项规则/第三项军事与边疆净收益/国防安全/00-规则与结算合同.md
  ACCEPTED_AFTER_SHARED_WINDOW_ADJUDICATION:
    rulers: [李治, 武则天]
    basis: 660—683年共享权力已完成A/B/C/D同值重裁。百济、高句丽、唐罗等具名任将、出兵与收束军令由李治作为第三项单一记账主体消费；武则天不重复取得同阶段成果或承担同一成本，自684年起进入独立第三项窗口。吐蕃父卡不能进一步拆分共同中枢责任，已作为公开证据缺口保留；单一记账只防止重复评价，不表示李治独占全部历史责任。
    evidence_refs:
      - config/third-item/third-item-result-credit-adjudications.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/国防安全/01-皇帝AB项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事体系有效性/01-皇帝C项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事成本收益比/01-皇帝D项正式结算.json
      - docs/分项规则/第三项军事与边疆净收益/国防安全/00-规则与结算合同.md
  ACCEPTED_AFTER_WINDOW_READJUDICATION:
    rulers: [玄烨, 嬴政, 司马曜, 宇文邕, 高湛, 高纬]
    basis: 六人已按规范实际最高权力窗口完成A/B/C/D同值复核。玄烨、嬴政、司马曜、高湛、高纬的现有计分链均位于修正后的本人窗口内，只更新起终窗口与公开边界；宇文邕另删除572亲政前的信州链与宕昌控制包，按572—578窗口重算。
    evidence_refs:
      - config/third-item/third-item-result-credit-adjudications.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/国防安全/01-皇帝AB项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事体系有效性/01-皇帝C项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事成本收益比/01-皇帝D项正式结算.json
  ACCEPTED_AFTER_WINDOW_NARROWING:
    rulers: [冯太后, 刘肇, 刘祜, 刘志]
    basis: 现有第三项正式记录已经把实际最高权力窗口与名义在位期拆开：冯太后仅消费465—467与476—490两个临朝窗口；刘肇从92年六月亲政起算并将此前窦氏期只作继承基线；刘祜严格只消费121—125亲政期；刘志从150年亲政起算。窗口前事实只允许作为继承状态、客观基线或明确排除材料，不产生本人信用或成本。
    evidence_refs:
      - docs/评分结算/净收益/第三项军事与边疆净收益/02-第三项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/国防安全/01-皇帝AB项正式结算.json
      - docs/评分结算/净收益/第三项军事与边疆净收益/军事成本收益比/01-皇帝D项正式结算.json
      - docs/分项规则/第三项军事与边疆净收益/国防安全/00-规则与结算合同.md
second_item_window_adjudications:
  ACCEPTED_SHARED_WINDOW_SINGLE_ACCOUNTING_NO_MACRO_SPLIT:
    rulers: [李治, 武则天]
    basis: 660—683年为李治与武则天共享部分最高权力的政治窗口。第二项的宏观民生、财政、社会安全和整体官僚运行结果无法在不重复计分的前提下可靠拆成个人比例，故继续由在位皇帝李治作为单一绩效记账主体消费；武则天在共享期可明确闭合的个人决策、人才、组织、制度与政治责任仍进入人物画像和历史影响，但不复制同一宏观第二项状态分。自684年起武则天进入独立第二项窗口。该规则仅解决绩效唯一消费，不否定共享政治权力。
    overlap_review_id: SECOND-OVERLAP-TANG-LIZHI-WUZETIAN-660-683
    overlapping_ruler_ids: [RULER-TANG-LIZHI, RULER-TANG-WUZETIAN]
    score_change: NONE
    evidence_refs:
      - docs/评分结算/净收益/第二项治国净收益/01-第二项治国净收益正式结算.json
      - docs/项目总纲/皇帝人物画像评估体系合同.md
