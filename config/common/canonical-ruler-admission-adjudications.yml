  ACCEPTED_AFTER_WINDOW_NARROWING:
    rulers: [冯太后, 刘肇, 刘祜, 刘志, 司马曜, 宇文邕, 嬴政, 高纬, 玄烨]
    basis: 第二项计分主因位于本人实际最高权力窗口；窗口前材料仅允许作继承基线、背景或明确不计分约束。刘祜、刘志已完成C1—C4逐轴重审，其余对象经现有四轴证据复核，正式分值均可保留。
    evidence_refs:
      - docs/评分结算/净收益/第二项治国净收益/制度行政/01-A制度建设与实际运行方向卡.json
      - docs/评分结算/净收益/第二项治国净收益/制度行政/02-B1官僚治理与行政执行方向卡.json
      - docs/评分结算/净收益/第二项治国净收益/制度行政/03-B2反馈纠错与权力约束方向卡.json
      - docs/评分结算/净收益/第二项治国净收益/财政民生/01-C1正式结算.json
      - docs/评分结算/净收益/第二项治国净收益/财政民生/02-C2正式结算.json
      - docs/评分结算/净收益/第二项治国净收益/财政民生/03-C3正式结算.json
