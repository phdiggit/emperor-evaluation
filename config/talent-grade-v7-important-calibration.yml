schema_version: talent-grade-v7-important-calibration-policy-v1
policy_version: talent-grade-v7-important-calibration-v1
status: human_review_required
scope:
  current_effective_grade: important
  reviewed_profile_count: 157
principles:
  promotion_and_demotion_are_both_allowed: true
  office_or_fame_is_not_an_achievement_cluster: true
  same_duty_chain_is_one_cluster: true
  repeated_similar_cases_are_one_cluster: true
  joint_participation_requires_personal_attribution: true
  proposals_without_implemented_results_do_not_pass: true
  political_risk_is_orthogonal_to_talent_grade: true
  distribution_is_an_alert_not_a_quota: true
top_gate:
  inherited_from: talent-grade-v6-calibration-v1
  minimum_independent_major_clusters: 2
  minimum_national_or_foundational_or_decisive_theater_clusters: 1
  requires_clear_result_for_every_counted_cluster: true
  requires_high_personal_attribution: true
  requires_contemporary_first_tier_comparison: true
important_gate:
  primary_path:
    minimum_important_clusters: 1
    minimum_scale: central_policy_or_regional_governance_or_major_campaign_or_important_institution_or_field_representative
    requires_implemented_clear_result: true
    requires_medium_or_high_personal_attribution: true
  alternative_path:
    minimum_independent_medium_clusters: 2
    requires_implemented_clear_result: true
    requires_medium_or_high_personal_attribution: true
  failure_grade: usable
usable_gate:
  requires_stable_competence_or_local_or_assisting_result: true
  failure_grade: ordinary
distribution_alerts:
  important_to_top_minimum_ratio: 2.0
  usable_to_important_minimum_ratio: 0.2
release:
  preserve_prior_grade_and_version: true
  overwrite_v3_grade: false
  formal_scoring_allowed: false
