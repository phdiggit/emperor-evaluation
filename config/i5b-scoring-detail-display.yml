schema_version: i5b-scoring-detail-display-v1
status: human_readable_factor_translation

common_factors:
  attribution_factor:
    label_zh: 皇帝归责强度
    description_zh: 判断行为和结果能够多直接地归属于皇帝本人。
    options:
      indirect: {label_zh: 间接归责, description_zh: 仅能通过制度位置或下属行为间接归责。}
      direct: {label_zh: 直接归责, description_zh: 皇帝本人明确作出决定或处置。}
      direct_under_pressure: {label_zh: 压力下直接归责, description_zh: 皇帝在明确反对、指控或现实压力存在时仍亲自决定。}
  source_factor:
    label_zh: 史源完整度
    description_zh: 衡量史源、Assertion与结果链的直接性和完整性。
    options:
      weak_or_compressed: {label_zh: 薄弱或压缩材料, description_zh: 材料可用但摘录压缩、链条不完整或只能弱支撑。}
      standard: {label_zh: 标准直接材料, description_zh: 核心事实有直接史源支撑，但未形成完整行动结果链。}
      complete_direct_chain: {label_zh: 完整直接链, description_zh: 行动、对象、结果和归责均有直接且连贯的史源支撑。}
  context_factor:
    label_zh: 规则机制贴合度
    description_zh: 衡量材料与当前规则核心机制的贴合程度。
    options:
      weak_but_applicable: {label_zh: 边界适用, description_zh: 属于规则范围，但只触及外围机制。}
      clear: {label_zh: 明确适用, description_zh: 规则链条成立且边界清楚。}
      core_mechanism_direct: {label_zh: 直击核心机制, description_zh: 材料直接展示规则要评价的皇帝行动、对象和反馈。}

rules:
  talent_discovery:
    factors:
      direction_sign:
        label_zh: 识才方向
        description_zh: 区分成功识才与错失、压制人才。
        options:
          positive: {label_zh: 正向识才, description_zh: 皇帝有效发现并转化人才。}
          missed_or_suppressed_discovery: {label_zh: 错失或压制识才, description_zh: 可识别人才被忽视、阻断或压制。}
      discovery_level:
        label_zh: 发现强度
        description_zh: 衡量从被动获知到跨障碍主动识别的强度。
        options:
          passive_reputation: {label_zh: 被动闻名, description_zh: 主要依靠既有名望进入视野。}
          recommendation_entry: {label_zh: 荐举进入, description_zh: 经他人荐举进入候选池，皇帝验证有限。}
          attributable_interview_trial_or_appointment: {label_zh: 皇帝验证并试用, description_zh: 皇帝通过面试、试用或首次实质任命完成可归责验证。}
          difficult_cross_boundary_discovery: {label_zh: 跨障碍识才, description_zh: 皇帝主动跨越阵营、身份或接近障碍完成识别。}
      talent_quality_factor:
        label_zh: 人才质量档
        description_zh: 使用版本化人物画像中的有效人才档。
        options:
          ordinary: {label_zh: 普通人才, description_zh: 能力和贡献处于一般可用以下或边界水平。}
          usable: {label_zh: 可用人才, description_zh: 能稳定承担有限职责。}
          important: {label_zh: 重要人才, description_zh: 在重要职责或成果中有明确作用。}
          top: {label_zh: 顶级人才, description_zh: 属于同时代相关领域第一梯队。}
          historic: {label_zh: 历史级人才, description_zh: 在多个国家级成果或长期结构中具有时代塑造作用。}
      channel_factor:
        label_zh: 识才渠道
        description_zh: 衡量识才是单一个案、跨身份渠道还是可重复机制。
        options:
          single_case: {label_zh: 单一个案, description_zh: 只有一次可定位的识才事件。}
          cross_identity_or_camp: {label_zh: 跨身份或阵营, description_zh: 识才突破既有身份、门第或阵营边界。}
          repeatable_discovery_mechanism: {label_zh: 可重复识才机制, description_zh: 多个独立案例证明同一稳定渠道持续运行。}
  appointment_delegation:
    factors:
      appointment_importance:
        label_zh: 任用责任重要度
        description_zh: 只按授权当时的责任域和权力范围判断。
        options:
          nominal_or_light: {label_zh: 名义或轻量职责, description_zh: 权限有限，主要是名义、顾问或轻量任务。}
          real_bounded: {label_zh: 实质但有界职责, description_zh: 有真实权限，但责任域明确且有限。}
          major_affairs: {label_zh: 重要军政职责, description_zh: 承担重要军政、方面或中枢职责。}
          critical_national_or_long_term: {label_zh: 国家关键或长期职责, description_zh: 直接涉及国家全局、战略地域、制度形成或长期总责。}
      appointment_effect:
        label_zh: 人岗配置结果
        description_zh: 衡量任用本身产生的直接履职反馈和损益。
        options:
          weak_feedback: {label_zh: 弱反馈, description_zh: 只有有限履职或结果证据。}
          normal_success: {label_zh: 正常成功, description_zh: 人岗适配并产生稳定、可归责的正常结果。}
          major_success: {label_zh: 重大成功, description_zh: 产生异常显著且直接归属于人岗配置的结果。}
          exceptional_success: {label_zh: 极重大成功, description_zh: 人岗配置直接改变国家战略格局或形成基础制度成果，且受任者贡献高度直接。}
          bounded_control_failure: {label_zh: 个案控制失误, description_zh: 授权或监督失误成立，但未证明超出个案的公共损害。}
          limited_direct_damage: {label_zh: 有限直接损害, description_zh: 已形成明确、直接但范围有限的公共损害。}
          major_direct_damage: {label_zh: 重大直接损害, description_zh: 产生重大、一次性的直接损害。}
          structural_continuing_damage: {label_zh: 持续结构损害, description_zh: 损害跨期影响制度、组织能力或后续治理。}
      continuity_factor:
        label_zh: 授权连续性
        description_zh: 衡量一次性任用、稳定履职或多阶段重复授权。
        options:
          short_or_one_off: {label_zh: 短期或一次性, description_zh: 明确为一次任务或缺乏持续观察。}
          stable: {label_zh: 稳定授权, description_zh: 同一授权下有至少两个可区分的履职或反馈观察。}
          long_term_multi_stage: {label_zh: 长期多阶段授权, description_zh: 至少两次可区分的皇帝授权决定形成跨阶段复用。}
  team_building:
    factors:
      talent_quality_factor:
        label_zh: 团队成员人才档
        description_zh: 每名成员进入正向人才池的基础值。
        options:
          ordinary: {label_zh: 普通, description_zh: 普通人才基础值。}
          usable: {label_zh: 可用, description_zh: 可用人才基础值。}
          important: {label_zh: 重要, description_zh: 重要人才基础值。}
          top: {label_zh: 顶级, description_zh: 顶级人才基础值。}
          historic: {label_zh: 历史级, description_zh: 历史级人才基础值。}
      negative_talent_severity_value:
        label_zh: 负向人才严重度
        description_zh: 衡量窗口内已实现负向行为的严重程度。
        options:
          limited: {label_zh: 有限风险, description_zh: 已形成政治风险，但影响局限且可控。}
          material: {label_zh: 实质风险, description_zh: 已造成明确的人事、治理或军事损害。}
          serious: {label_zh: 严重风险, description_zh: 对关键机构、重大事务或团队稳定造成严重损害。}
          major: {label_zh: 重大风险, description_zh: 危及政权核心安全、储位秩序或国家级事务。}
          systemic: {label_zh: 系统性风险, description_zh: 造成跨阶段、跨机构或时代级结构损害。}
      role_complementarity_factor:
        label_zh: 角色互补度
        description_zh: 衡量决策、行政、军事、纠错四类核心角色覆盖。
        options:
          homogeneous: {label_zh: 同质化, description_zh: 核心角色高度集中。}
          ordinary_two: {label_zh: 普通双角色, description_zh: 稳定覆盖两个核心角色。}
          strong_three: {label_zh: 强三角色, description_zh: 稳定覆盖三个核心角色。}
          balanced_four: {label_zh: 四角色均衡, description_zh: 四类核心角色均有有效成员。}
      long_term_stability_factor:
        label_zh: 团队长期稳定性
        description_zh: 衡量团队结构在窗口内是否持续、可管理并跨阶段运行。
        options:
          fragmented: {label_zh: 碎片化, description_zh: 团队结构短促或彼此割裂。}
          forced_turnover_collapse: {label_zh: 强制更替崩塌, description_zh: 频繁清洗或强制更替导致结构失效。}
          stable_but_narrow: {label_zh: 稳定但狭窄, description_zh: 团队稳定但角色或人才层次过窄。}
          stable_window: {label_zh: 窗口内稳定, description_zh: 在当前观察窗口内保持稳定。}
          managed_turnover: {label_zh: 可管理更替, description_zh: 人员更替存在但核心功能持续。}
          durable_multi_stage: {label_zh: 跨阶段持久, description_zh: 多阶段保持角色互补和核心功能。}
  tolerate_talent:
    factors:
      feedback_entry:
        label_zh: 反馈入口强度
        description_zh: 衡量从单次采纳、重复反馈、跨阶段持续、高密度跨领域谏诤到正式反馈通道持续运行的层级。次数不线性累加，高档必须同时有时间、领域和独立事件覆盖。
        options:
          single_acceptance_or_tolerance: {label_zh: 单次采纳或容忍, description_zh: 只证明一次建议被采纳，或一次表达未受压制。}
          repeated_feedback_retained: {label_zh: 多次反馈且仍被保留, description_zh: 同一臣子有两个以上独立反馈事件，皇帝未因此排斥其履职；尚不证明长期跨阶段。}
          durable_multi_stage_feedback: {label_zh: 跨阶段持续反馈, description_zh: 反馈和容纳跨越统治期的多个明显阶段，且有独立后续证明表达者持续履职。仅几次跨阶段采纳最高落在此档。}
          exceptional_dense_cross_domain_remonstrance: {label_zh: 高密度跨领域长期犯颜, description_zh: 在长时段内存在大量可分辨谏诤，覆盖多个重大政务领域，包含逆耳或犯颜情形，且皇帝仍持续容纳、采用并保留其反馈职责。不得只凭一个模糊次数或史料篇幅推出。}
          institutionalized_feedback_entry:
            label_zh: 制度化反馈入口
            description_zh: 皇帝预先建立正式反馈通道，且该通道跨多个独立事件持续运行；通常应面向多名表达者或正式职能主体。不能由某一臣子反复进谏、单次求言诏令或事后采纳推出。
            current_projection_status: accepted_shadow_material
            current_projection_status_zh: 已有已接受的shadow投影材料
            contract_reachability: reached_in_shadow
            contract_reachability_zh: 已在李世民求谏机制shadow材料中达到
            accepted_ref: TT-LSM-INSTITUTIONAL-REM-01
            candidate_refs: [TT-O04, TT-S04]
            missing_for_candidates: [repeated_channel_operation, positive_safety_followup, independent_continuity_followup]
      expression_safety:
        label_zh: 表达安全
        description_zh: 衡量表达者在反馈之后的人身、职业和持续表达安全。
        options:
          tense_or_case_dependent: {label_zh: 紧张或依赖个案, description_zh: 表达受到威胁、冲突或个案恩免影响。}
          basically_safe: {label_zh: 基本安全, description_zh: 有晚于回应的独立观察证明未遭报复并继续履职。}
          actively_protected_or_encouraged: {label_zh: 主动保护或鼓励, description_zh: 皇帝明确保护表达者或持续鼓励其反馈。}
      protection_repair:
        label_zh: 保护与修复
        description_zh: 衡量冲突后是否恢复职位、信用或反馈关系。
        options:
          none: {label_zh: 无特殊保护修复, description_zh: 未发生需要计分的保护或修复动作。}
          restoration_or_rehabilitation: {label_zh: 恢复或平反, description_zh: 皇帝恢复职位、名誉或撤销部分损害。}
          active_protection_or_trust_repair: {label_zh: 主动保护或完整修复, description_zh: 皇帝主动保护表达者或实质恢复完整信任。}
      handling_severity:
        label_zh: 处置严重度
        description_zh: 衡量因反馈或专业独立遭受的已实现处置。
        options:
          symbolic_or_light: {label_zh: 象征性或轻处分, description_zh: 信用撤销、轻微惩戒或有限公开压制。}
          demotion_or_suppression: {label_zh: 贬黜或压制, description_zh: 已实现职业贬黜、排除或表达压制。}
          imprisonment_or_severe_nonpermanent_harm: {label_zh: 监禁或严重非永久伤害, description_zh: 已实现监禁、酷刑以外的严重伤害或长期职业损害。}
          execution_or_forced_suicide: {label_zh: 处死或逼令自尽, description_zh: 已导致本人被处死或被迫自尽。}
          clan_or_systemic_purge: {label_zh: 集团或系统清洗, description_zh: 伤害扩展到家族、群体或制度性清洗。}
      target_fault_factor:
        label_zh: 对象过错校准
        description_zh: 根据表达者自身过错校准负向归责，避免把坐实重大过错全部算成容才失败。
        options:
          framed_or_harmed_for_feedback: {label_zh: 因反馈受害或被构陷, description_zh: 没有重大过错，伤害直接由反馈触发。}
          minor_fault_disproportionate_harm: {label_zh: 轻过重罚, description_zh: 有轻微过错但处置明显失衡。}
          fault_unknown: {label_zh: 过错未知, description_zh: 现有证据无法确定对象过错。}
          disputed_suspicion: {label_zh: 争议嫌疑, description_zh: 存在嫌疑但未形成可靠坐实链。}
          major_fault_but_excessive_harm: {label_zh: 重大过错但处置过重, description_zh: 重大过错成立，但伤害仍超过必要范围。}
          proven_rebellion_residual_talent_harm: {label_zh: 谋反坐实后的极弱残余, description_zh: 谋反坐实，仅保留极弱的过度伤害残余。}
  anti_nepotism:
    factors:
      selection_openness:
        label_zh: 选任开放度
        description_zh: 衡量选任是否抵抗私人关系并保持能力或正式程序基础。
        options:
          avoids_private_interference_case: {label_zh: 个案抵抗私人干预, description_zh: 在单一个案中拒绝私人关系干预。}
          merit_or_formal_basis: {label_zh: 能力或正式程序选任, description_zh: 选任明确基于能力、功绩或正式程序。}
          cross_identity_open_selection: {label_zh: 跨身份开放选任, description_zh: 稳定突破亲缘、门第、地域或阵营边界。}
          institutionalized_anti_nepotism: {label_zh: 制度化防亲, description_zh: 形成可重复、可审计的制度性防亲机制。}
      institutionalization:
        label_zh: 防亲制度化程度
        description_zh: 衡量防亲行为是单次、重复惯例还是持久制度。
        options:
          single_event: {label_zh: 单次事件, description_zh: 只有一次可定位的防亲或纠偏。}
          repeated_stable_practice: {label_zh: 重复稳定实践, description_zh: 多次独立事件证明稳定惯例。}
          durable_institution: {label_zh: 持久制度, description_zh: 形成正式、持续且可审计的制度。}
      office_weight:
        label_zh: 公共职位权重
        description_zh: 衡量私人关系污染或防亲作用涉及的公共权力重要度。
        options:
          ordinary: {label_zh: 普通职位, description_zh: 一般公共职位或有限权力。}
          important: {label_zh: 重要职位, description_zh: 重要中枢、方面或专业权力。}
          central_military_or_succession: {label_zh: 中枢军权或继承关键, description_zh: 涉及中枢核心、军权或继承秩序。}
      favoritism_intensity:
        label_zh: 私人偏任强度
        description_zh: 衡量私人关系替代能力和程序的程度。
        options:
          visible_private_relation: {label_zh: 可见私人关系, description_zh: 私人关系可见，但未证明替代能力。}
          private_relation_over_merit: {label_zh: 私情压过能力, description_zh: 私人关系明确压过能力或程序。}
          continuing_core_appointment_interference: {label_zh: 持续干预核心任用, description_zh: 私人关系跨期干预核心职位。}
          systemic_private_network_capture: {label_zh: 私人网络系统俘获, description_zh: 私人网络系统性控制关键任用和公共权力。}
      displacement_harm:
        label_zh: 排挤与结构损害
        description_zh: 衡量私人偏任对合格人才、关键职位和组织结构的损害。
        options:
          optics_only: {label_zh: 仅观感损害, description_zh: 主要损害公信力，未证明实质排挤。}
          qualified_people_or_key_office_harmed: {label_zh: 合格人才或关键职位受损, description_zh: 已排挤合格人才或污染关键职位。}
          team_policy_or_expression_structure_harmed: {label_zh: 团队政策或表达结构受损, description_zh: 破坏团队互补、政策质量或反馈结构。}
          durable_institutional_pollution: {label_zh: 持久制度污染, description_zh: 私人网络造成跨期制度性污染。}
