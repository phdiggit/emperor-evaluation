<script>
"use strict";
const DATA=JSON.parse(document.getElementById('reader-data').textContent), screen=document.getElementById('screen');
const byId=new Map(DATA.records.map(r=>[r.ruler_id,r]));
const state={q:'',polity:'',scope:'main',sort:'time',compare:[],grade:'',differences:false,filtersOpen:false,homeView:'simple'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>typeof v==='number'?v.toFixed(2):'—';
const scoreNumber=v=>typeof v==='number'?v.toFixed(1):'—';
const conf=v=>({HIGH:'高',MEDIUM:'中',LOW:'低'}[v]||v||'未声明');
const pos=v=>({HIGH:'高位',MID:'中位',LOW:'低位'}[v]||v||'');
const mode=v=>({FULL_GRADE:'完整定档',BOUNDED_PROFILE:'有界画像',MATERIAL_DENSITY_LIMITED:'材料密度受限',NOT_APPLICABLE:'不适用',EPISODE_TAG:'仅有局部情境证据',NO_GRADE:'证据不足，无档结案'}[v]||v||'未声明');
const dimNames={scope:'影响范围',depth_duration:'深度与持续',personal_causality:'个人因果',paradigm:'政治范式'};
const sourceRepoBase=()=>DATA.source_repository&&DATA.source_revision?'https://github.com/'+DATA.source_repository.split('/').map(encodeURIComponent).join('/')+'/blob/'+encodeURIComponent(DATA.source_revision)+'/':'';
const validatedRawUrl=p=>{const path=String(p||'').split('#',1)[0].replace(/^\.\.\//,'');if(DATA.source_repository&&DATA.source_revision)return 'https://raw.githubusercontent.com/'+DATA.source_repository.split('/').map(encodeURIComponent).join('/')+'/'+encodeURIComponent(DATA.source_revision)+'/'+path.split('/').map(encodeURIComponent).join('/');return '../'+path+'?raw=1'};
const href=p=>{p=p.replace(/\.md:(\d+)(?:-(\d+))?$/,(_,a,b)=>'.md#L'+a+(b?'-L'+b:''));const [path,...fragment]=p.split('#');const hash=fragment.length?'#'+encodeURIComponent(fragment.join('#')):'';const base=sourceRepoBase();if(base&&/^(?:docs|config|archive)\//.test(path))return base+path.split('/').map(encodeURIComponent).join('/')+hash;return '../'+path.split('/').map(encodeURIComponent).join('/')+hash};
const personId=()=>{try{return decodeURIComponent(location.hash.slice(8).split('/')[0])}catch{return ''}};
const personView=()=>{const parts=location.hash.slice(8).split('/');return parts.length>1?parts[1]:''};
const link=(p,label,subject)=>{if(!p)return '';if(/^https?:\/\//.test(p))return `<a href="${esc(p)}" target="_blank" rel="noopener">${esc(label)}</a>`;if(DATA.source_availability[p]===false)return `<span class="unavailable-source">历史引用（当前文件不可用）：${esc(p)}</span>`;let url=href(p);const person=subject||byId.get(personId());if(person&&!/^https?:\/\//.test(url)&&/\.(md|json)$/.test(p.split('#')[0])){const [path,hash]=url.split('#');url=path+'?person='+encodeURIComponent(person.ruler_id)+'&name='+encodeURIComponent(person.ruler_name)+(hash?'#'+hash:'')}return `<a href="${url}" target="_blank" rel="noopener">${esc(label)}</a>`};
const letters={G5:'S',G4:'A',G3:'B',G2:'C',G1:'D',G0:'E'};
const shortNames={M1:'军事统帅',M2:'外交博弈',M4:'内部联盟',M5:'组织执行',C1:'战略判断',C2:'学习纠错',C3:'用人授权',C4:'制度设计',C5:'权力运用与克制'};
const ungraded=a=>a?.adjudication_state==='EVIDENCE_INSUFFICIENT_CLOSED';
const pending=a=>!!a&&(a.display_point_only||['UNRESOLVED_EVIDENCE_GAP','REASSESSMENT_REQUIRED'].includes(a.adjudication_state));
// Display geometry follows the 18 public levels, never the legacy score.
const profileLevelIndex=a=>!a||ungraded(a)||pending(a)||!letters[a.axis_grade]||!['LOW','MID','HIGH'].includes(a.position)||a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?null:Number(a.axis_grade.slice(1))*3+({LOW:0,MID:1,HIGH:2}[a.position]);
const radarValue=a=>{const level=profileLevelIndex(a);return level===null?null:level/17*100};
const grade=a=>!a?'未覆盖':ungraded(a)?'无档结案':pending(a)?(a.adjudication_state==='REASSESSMENT_REQUIRED'?'待重裁':a.adjudication_state==='UNRESOLVED_EVIDENCE_GAP'?'待补证':'历史显示点'):a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?'不适用':!letters[a.axis_grade]?'未定档':!['LOW','MID','HIGH'].includes(a.position)?'位置未定':letters[a.axis_grade]+({LOW:'−',MID:'',HIGH:'+'}[a.position]);

// Public identity is supplied by the formal source; never infer a title from a name.
function personLabel(r){return String(r?.impact?.identity_label||r?.ruler_name||'');}
const powerContextNote='掌权时期只作为人物背景；人物画像可采用各时期能反映本人表现、且可明确归责的事件。不同评价采用的事件范围并不完全相同，各项具体范围以各自依据为准。';
const impactDimensionQuestions={scope:'实际改变覆盖了哪些政治空间、政治主体或国家关键接口？',depth_duration:'改变有多深，持续多久？',personal_causality:'哪些变化真正依赖本人？',paradigm:'后世最高权力是否把本人或其治世作为政治参照并实际使用？'};
function impactScaleNote(){return '<p class="subline impact-scale-note">四维分项与总等级使用不同刻度；不能按相同字母直接比较，也不做平均。</p>';}
function impactTechnicalHelp(){return '<details class="impact-technical"><summary>总等级为什么和四维字母不同？</summary><p>总等级发布时使用更粗的刻度：S+→S+ · S→S · S−→A · A+→B · A→C · B→D · C→E。四维保留更细的中间档，因此同一个字母不能跨两套刻度直接比较。</p></details>';}

const groupNames={first:'奠基与统一：原分及折算',method:'治国：制度与行政',finance:'治国：民生与社会',handoff:'治国：政权交接',strategic:'军事：战略收益与国防',military:'军事：体系与成本',civilization:'文明与国家整合'};
const netComponentLabels={
 'A统一贡献':'统一成果','B1创业难度与效率':'起点、强敌与速度','B2组织与整合':'创业组织与政治整合','C军事统帅与战争解题':'本人统帅','军事成本扣分':'军事代价',
 'A制度建设':'制度建设与实际运行','B1官僚治理':'官僚治理与行政执行','B2反馈与约束':'反馈纠错与权力约束',
 'C1民生':'民生状况','C2经济财政':'经济与财政','C3社会安全':'社会安全','C4恢复与成本':'恢复能力与额外代价',
 'D1继任行政连续性':'继任后的行政连续性','D3政权交接稳定':'政权交接稳定性'
};
const publicNetComponentLabel=item=>item?.public_component_label||netComponentLabels[item?.label]||item?.label||'';
const impactMeaning={'S+':'最高量级历史影响',S:'超重大历史影响',A:'重大长期历史影响',B:'重大历史影响',C:'显著历史影响',D:'有限但真实影响',E:'弱历史影响'};
const readingTerms={PS0:'仅有结果或资源背景',PS1:'局部正确选择',PS2:'完整独立决策周期',PS3:'可跨情境迁移的强模式',PS4:'不同约束下反复兑现的罕见模式',DW0:'未能归责本人的负面结果',DW1:'已纠正且未复发的局部误判',DW2:'造成显著损失但已恢复或未同类复发的错误',DW3:'同类机制重复失败、反馈后加码或优势下崩盘',DW4:'跨机制与阶段的稳定失能',AM1:'局部制度接口',AM2:'全国重要子系统',AM3:'国家核心系统',AM4:'国家基本运行架构重构'};
function readerText(t){return String(t??'').replace(/\b(?:PS[0-4]|DW[0-4]|AM[1-4])\b/g,k=>readingTerms[k]).replace(/\b(?:MI1(?:_CASE)?|MI2(?:_LIFECYCLE)?|MI3(?:_SUSTAINED_SYSTEMIC)?|MI4(?:_CROSS_PHASE_SYSTEMIC)?)\b/g,k=>materialIntensityNames[k]||k).replace(/\b(?:POSITIVE|NEGATIVE|MIXED_POSITIVE|MIXED_NEGATIVE|MIXED_BALANCED|MIXED|LIMITATION)\b/g,k=>formalDirectionNames[k]||k).replace(/G([0-5])[- /]*(LOW|MID|HIGH)/g,(_,g,p)=>grade({axis_grade:'G'+g,position:p})).replace(/G([0-5])/g,(_,g)=>letters['G'+g]+'档').replace(/EPISODE_TAG/g,'局部情境证据').replace(/BOUNDED_PROFILE/g,'有明确适用边界的画像').replace(/FULL_GRADE/g,'完整定档').replace(/\bE1\b/g,'少量情境材料').replace(/\bE2\b/g,'多个独立情境材料').replace(/\bE3\b/g,'主要命题已有代表性材料').replace(/\bC5\b/g,'权力运用与克制').replace(/COUNTEREVIDENCE_FOUND/g,'已找到明确反例')}

function impactTotalPublicText(h){

function compareNetPublicLevel(item,key){

   const n=Object.prototype.hasOwnProperty.call(cn,raw)?cn[raw]:Number(raw);
   return isCost?(costs[n]||raw):(grades[n]||raw);
  });
 }
 if(key==='civilization'){
  const magnitude={1:'局部、短期或低强度变化',2:'清晰但有限的变化',3:'主要领域的稳定改变',4:'跨场景或系统性改变'};

   const n=Object.prototype.hasOwnProperty.call(cn,raw)?cn[raw]:Number(raw);
   return magnitude[n]||raw;
  });
 }
 return readerText(text);
}

const materialIntensityNames={MI1:'单一情境',MI1_CASE:'单一情境',MI2:'完整生命周期情境',MI2_LIFECYCLE:'完整生命周期情境',MI3:'持续系统性情境',MI3_SUSTAINED_SYSTEMIC:'持续系统性情境',MI4:'跨阶段系统性情境',MI4_CROSS_PHASE_SYSTEMIC:'跨阶段系统性情境'};
const formalDirectionNames={POSITIVE:'正向',NEGATIVE:'负向',MIXED_POSITIVE:'混合偏正',MIXED_NEGATIVE:'混合偏负',MIXED_BALANCED:'正负大致平衡',MIXED:'正负混合',LIMITATION:'限制／边界'};
function nonEmptyFormal(value){
 if(Array.isArray(value))return value.length>0;
 if(value&&typeof value==='object')return Object.keys(value).length>0;
 return value!==null&&value!==undefined&&String(value).trim()!=='';
}
function contextDirection(c){
 if(!nonEmptyFormal(c?.direction))return '';

 return Object.prototype.hasOwnProperty.call(formalDirectionNames,raw)?formalDirectionNames[raw]:'未设中文展示，请查原始记录';
}
function contextIntensityEntries(c){
 return ['intensity','material_intensity']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>[k,c[k]]);
}
function contextIntensity(c){
 const entries=contextIntensityEntries(c);
 if(!entries.length)return '未列';
 const rawValues=entries.map(([,v])=>String(v));
 const publicValues=rawValues.map(value=>materialIntensityNames[value]||value);
 if(publicValues.length>1&&publicValues.some(value=>value!==publicValues[0]))return '上游字段不一致，请查原始记录';
 const raw=rawValues[0];
 return Object.prototype.hasOwnProperty.call(materialIntensityNames,raw)
  ? materialIntensityNames[raw]
  : '未设中文展示，请查原始记录';
}

}

}
function formalContextRawIntensity(c){

 const attrs=['attribution','attribution_basis','role_attribution']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>c[k]);
 const limits=['limitations','limitation']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>c[k]);
 const chips=[];
 const details=[];
 if(direction)chips.push(formalMetaChip('方向',direction,'context-direction'));
 if(showIntensity&&intensityEntries.length)chips.push(formalMetaChip('材料强度',contextIntensity(c),'context-intensity'));
 for(const value of attrs)details.push(formalMetaField('归责',value));
 for(const value of limits)details.push(formalMetaField('限制',value));
 if(!chips.length&&!details.length)return '';
 return `<div class="formal-context-meta">${chips.length?`<div class="formal-context-chips">${chips.join('')}</div>`:''}${details.length?`<div class="formal-context-meta-details">${details.join('')}</div>`:''}</div>`;

const prudentAxisNames={C1:"民生",C2:"经济财政",C3:"社会安全"};
const prudentStateGrades={1:"E",2:"D",3:"C",4:"B",5:"A",6:"S"};
const prudentLossLabels={0:"未见独立有效低谷",1:"有局部或短时损害",2:"出现明显低谷",3:"出现严重低谷"};
const prudentHandoffGrades={0:"E",1:"D",2:"C",3:"B",4:"A",5:"S"};
const prudentCostLabels={0:"无实质军事成本",1:"局部常规军事成本",2:"有限军事成本",3:"明显军事成本",4:"大规模或持续显著军事成本",5:"严重军事成本",6:"极端军事成本",7:"灾难性军事耗竭"};
const prudentPositions={LOW:"低位",MID:"中位",HIGH:"高位",HIGHEST:"极端上沿"};
function prudentAxisName(value){return prudentAxisNames[String(value||"")]||String(value||"未列");}
function prudentStateText(value){
 const m=String(value||"").match(/^C[123]-([1-6])$/);
 return m?`${prudentStateGrades[Number(m[1])]||m[1]}档`:String(value||"未列");
}
function prudentLossText(value){
 const m=String(value||"").match(/^L([0-3])$/);
 return m?(prudentLossLabels[Number(m[1])]||String(value)):String(value||"未列");
}
function prudentEndpointText(value){
 const m=String(value||"").match(/^C[123]-([1-6])\/L([0-3])$/);
 return m?`${prudentStateGrades[Number(m[1])]||m[1]}档｜${prudentLossLabels[Number(m[2])]||`低谷L${m[2]}`}`:String(value||"未列");
}
function prudentCostText(value){
 const m=String(value||"").match(/^C([0-7])[- /]*(LOW|MID|HIGH|HIGHEST)$/i);
 if(!m)return String(value||"未列");
 return `${prudentCostLabels[Number(m[1])]||`军事成本第${m[1]}级`}·${prudentPositions[m[2].toUpperCase()]||m[2]}`;
}
function prudentGeneralText(value){
 return String(value??"")
  .replace(/低置信逐轴终裁的合法端点/g,"当前史料允许的逐项审慎范围")
  .replace(/逐人条件档位与联动/g,"逐项可支持的判断范围及关联调整")
  .replace(/候选端点/g,"审慎范围端点")
  .replace(/合法端点/g,"审慎范围端点")
  .replace(/新增史料可以重开/g,"新增史料出现时可重新复核")
  .replace(/本轮/g,"当前")
  .replace(/倒填|倒灌/g,"计入本人")
  .replace(/主态/g,"主要状态")
  .replace(/交班/g,"任期结束")
  .replace(/另计L/g,"低谷另行计算");
}
function prudentCostReviewText(value){
 return prudentGeneralText(value)
  .replace(/C([0-7])[- /]*(LOW|MID|HIGH|HIGHEST)/gi,(_,level,position)=>prudentCostText(`C${level}-${position}`))
  .replace(/\bC([0-7])\b/g,(_,level)=>prudentCostLabels[Number(level)]||`军事成本第${level}级`)
  .replace(/更高档准入路径/g,"支持更高成本判断的证据路径")
  .replace(/准入路径/g,"支持该判断的证据路径")
  .replace(/现档/g,"当前判断");
}
function prudentAxisReviewText(value){
 const cn={一:"E",二:"D",三:"C",四:"B",五:"A",六:"S"};
 return prudentGeneralText(value)
  .replace(/本轴/g,"本项")
  .replace(/(定|保留|未到|反推)([一二三四五六])档/g,(_,verb,n)=>`${verb}${cn[n]}档`)
  .replace(/(交班|任期结束)([一二三四五六])档/g,(_,label,n)=>`任期结束${cn[n]}档`);
}
function prudentIssueText(value){
 return prudentGeneralText(value)
  .replace(/D1现([0-5])/g,(_,n)=>`行政连续性当前为${prudentHandoffGrades[Number(n)]||n}档`)
  .replace(/D3现([0-5])/g,(_,n)=>`交接稳定当前为${prudentHandoffGrades[Number(n)]||n}档`)
  .replace(/D1固定([0-5])/g,(_,n)=>`行政连续性固定为${prudentHandoffGrades[Number(n)]||n}档`)
  .replace(/D3固定([0-5])/g,(_,n)=>`交接稳定固定为${prudentHandoffGrades[Number(n)]||n}档`)
  .replace(/复核候选([0-5])—([0-5])（[^）]*）/g,(_,a,b)=>`审慎候选为${prudentHandoffGrades[Number(a)]||a}档—${prudentHandoffGrades[Number(b)]||b}档`)
  .replace(/(^|[；。])([0-5])须/g,(_,prefix,n)=>`${prefix}${prudentHandoffGrades[Number(n)]||n}档须`)
  .replace(/(^|[；。])([0-5])—([0-5])已/g,(_,prefix,a,b)=>`${prefix}${prudentHandoffGrades[Number(a)]||a}档—${prudentHandoffGrades[Number(b)]||b}档已`)
  .replace(/\bD1\b/g,"行政连续性")
  .replace(/\bD3\b/g,"交接稳定")
  .replace(/低侧封顶公式/g,"交接短板上限规则")
  .replace(/当前命题/g,"当前争议");
}
function evidenceAssessment(n, expanded=false){
 const a=n?.evidence_assessment;if(!a)return '';

 const context=n?.governance_context;
 const scopeLine=context?`<small class="evidence-assessment">治理背景：${esc(context.scale_label)}／${esc(context.complexity_label)}（非计分；未校准规模难度）</small>`:'';
 const scopeDetail=context?`<p>治理规模／复杂度：${esc(context.scale_label)}／${esc(context.complexity_label)}。${esc(context.basis)}此栏仅说明本人窗口的治理对象，不改变正式分数或名次；因此跨规模名次不能理解为已经消除治理难度差异。</p>`:'';
 const prudent=n?.prudent_score_interval;
 const prudentLine=prudent?`<small class="evidence-assessment">现有史料审慎分数区间：${number(prudent.lower)}—${number(prudent.upper)}（非统计概率）</small>`:'';
 const projection=n?.prudent_rank_projection;
 const projectionText=projection?(projection.best===projection.worst?`第 ${projection.best} 名`:`第 ${projection.best}—${projection.worst} 名`):'';
 const projectionLine=projection?`<small class="evidence-assessment">审慎分位置投影：${projectionText}（其他人物正式分固定；非联合区间）</small>`:'';
 if(!expanded)return `${scopeLine}${prudentLine}${projectionLine}<small class="evidence-assessment">${labels}</small>`;
 const ranges=a.verified_score_range?`<p>已闭合情景分数范围：${a.verified_score_range.map(number).join('—')}；名次范围：${a.verified_rank_range.join('—')}。</p>`:'';
 const prudentDetails=prudent?`<p>现有史料审慎分数区间：${number(prudent.lower)}—${number(prudent.upper)}。${esc(prudentGeneralText(prudent.basis))}</p>${prudent.cost_review?`<h4>军事成本的审慎边界</h4><p>当前判断：${esc(prudentCostText(prudent.cost_review.current_grade))}；现有史料允许的审慎上端：${esc(prudentCostText(prudent.cost_review.candidate_max_grade))}。</p><p>${esc(prudentCostReviewText(prudent.cost_review.review_gate))}</p><p>当前判断依据：${esc(prudentCostReviewText(prudent.cost_review.current_cost_basis))}</p>`:""}`:"";
 const projectionDetails=projection?`<p>审慎分位置投影：${projectionText}。${esc(projection.basis)}</p>`:"";
 const prudentAxes=(prudent?.axis_reviews||[]).map(x=>{const endpoints=(x.allowed_endpoints||[]).map(prudentEndpointText).join("、");return `<h4>${esc(prudentAxisName(x.axis))}的审慎边界</h4><p>当前判断：${esc(prudentStateText(x.current_grade))}；低谷：${esc(prudentLossText(x.current_loss_grade))}。</p>${endpoints?`<p>现有史料允许的审慎判断：${esc(endpoints)}。</p>`:""}<p>${esc(prudentAxisReviewText(x.endpoint_rule))}</p><p>为什么保留这个范围：${esc(prudentAxisReviewText(x.review_gate))}</p>`;}).join("");
 const prudentLinks=(prudent?.linked_reviews||[]).map(x=>`<h4>${esc(x.question)}</h4><p>如果这一争议采用仍被证据允许的另一种判断，对总分的条件影响为 ${x.conditional_delta_range.map(number).join("—")} 分。${esc(prudentIssueText(x.basis))}</p>`).join("");
 const issues=(a.public_issues||[]).map(x=>`<h4>${esc(x.question)}</h4><p>${esc(prudentIssueText(x.basis))}</p><p>限制：${esc(prudentIssueText(x.limitations))}</p>`).join("");
 const alternatives=(a.supported_alternatives||[]).map(x=>`<h4>${esc(x.question)}</h4><p>此解释下：${number(x.total_score)}分（分差 ${x.delta>=0?'+':''}${number(x.delta)}），第${x.rank}名。</p><p>${esc(x.public_basis)}</p><p>限制：${esc(x.public_limitations)}</p>`).join('');
 return `${scopeLine}<details class="evidence-assessment"><summary>${labels}</summary>${scopeDetail}${prudentDetails}${projectionDetails}${prudentAxes}${prudentLinks}<p>${esc(prudentGeneralText(a.public_basis))}</p>${ranges}${alternatives}${issues}</details>`;

function profileComparableText(value){

function profileDistinctGradeBasis(value,primary){

 const section=label=>`<tr class="comparison-section"><th colspan="3">${label}</th></tr>`;
 screen.innerHTML=`<h1>同题对照，各读其因。</h1><p class="muted">按相同维度展开双方依据，保留不同起点、责任窗口与材料限制。</p><p class="subline power-context-note">${esc(powerContextNote)}</p><div class="compare-select">${[a,b].map((r,i)=>`<button data-replace-compare="${i}">${esc(personLabel(r))} · 更换</button>`).join('<span>与</span>')}<button data-swap-compare>交换左右</button></div><label class="difference-toggle"><input type="checkbox" id="differences" ${state.differences?'checked':''}>突出当前展示值／档位差异</label>${governanceCompareWarning}<p class="subline">只突出当前展示值或档位不同的可比较项目；不追逐低于页面显示精度的细小点值差，也不表示差异已经超出审慎位置投影、证据厚度或判断把握。同档也不等于表现相同。</p><div class="table-wrap comparison-scroll"><table class="comparison"><thead><tr><th>阅读问题</th><th>${esc(personLabel(a))}</th><th>${esc(personLabel(b))}</th></tr></thead><tbody>${row('掌权背景（各项范围另见依据）',r=>esc(r.actual_power_window||'未列'),false)}${section('统治绩效')}${row('统治绩效',r=>r.net?`<b>${scoreNumber(r.net.total_score)}</b>`:esc(missingNetLabel(r)))}${row('审慎位置投影',r=>r.net?(prudentPositionText(r.net)||'未列'):'—',false)}${row('规则点位（点估计）',r=>r.net?`第 ${r.net.rank} 名`:'—',false)}${row('治理背景（非计分；未校准规模难度）',r=>r.net?(governanceContextText(r.net)||'未列'):'—',false)}${row('史料与权重说明',r=>{if(!r.net)return '—';const w=r.net.weight_sensitivity?.all_scenarios;return `<details><summary>展开说明</summary>${evidenceAssessment(r.net,true)}${w?`<p><strong>权重敏感性：</strong>固定正式裁决，仅改变已声明权重情景，名次第 ${w.best}—${w.worst} 名。</p>`:''}<p class="subline">审慎位置固定权重并只移动本人现有史料审慎区间；权重敏感性固定裁决而改变权重，两者不能互相替代。</p></details>`},false)}${row('治国成效',r=>scoreNumber(r.net?.second_item_score))}${row('军事与边疆',r=>scoreNumber(r.net?.third_item_score))}${row('奠基与统一附加',r=>compareFirstAddOn(r))}${row('文明与国家整合',r=>r.net?signedAdjustment(r.net.fourth_item_adjustment):'—')}${row('分项构成',r=>r.net?`<details><summary>展开分项</summary>${netGroups(r)}</details>`:esc(missingNetLabel(r)),false)}${section('人物画像 · 八轴能力')}${DATA.capability_axes.map(axisRow).join('')}${section('人物画像 · 权力运用风格')}${DATA.independent_axes.map(axisRow).join('')}${section('历史影响')}${row('历史影响量级',r=>`<b class="impact-grade">${esc(r.impact.public_grade)}</b>`)}${row('影响性质',r=>esc(r.impact.impact_nature),false)}${section('历史影响 · 四维分项（与总等级不同尺，不取平均）')}${Object.entries(dimNames).map(([k,n])=>row(n,r=>esc(r.impact.dimensions[k]?.grade))).join('')}${row('量级置信度',r=>conf(r.impact.confidence),false)}${row('主链与归责依据',(r,i)=>`<details><summary>展开历史影响依据</summary>${historySections(r,`-compare-${i}`,true)}</details>`,false)}${row('继续阅读',r=>`<button data-person="${r.ruler_id}">查看${esc(personLabel(r))} →</button>`,false)}</tbody></table></div>${gradeHelp('profile')}${gradeHelp('impact')}`;
 const emphasize=()=>document.querySelector('.comparison')?.classList.toggle('emphasize-differences',state.differences);
 document.getElementById('differences').onchange=e=>{state.differences=e.target.checked;emphasize()};
 emphasize();
}

function guide(){nav('guide');screen.innerHTML=`<div class="eyebrow">Reading guide</div><h1>三个问题，一份人物理解。</h1><section class="panel guide-quick"><h2>30秒读懂</h2><div class="guide-quick-grid"><div><strong>看结果</strong><p>统治绩效看实际做成了什么，也把可归责代价算进去。</p></div><div><strong>看怎么做事</strong><p>人物画像看面对问题时如何判断、组织、用人和行动。</p></div><div><strong>看留下什么</strong><p>历史影响看本人退出后，改变了多大范围，又持续了多久。</p></div><div><strong>三者可以不一致</strong><p>能力强不保证结果一定好；影响很大也不等于影响一定正面。</p></div></div></section><details class="guide-more"><summary>继续看详细口径与边界</summary><div class="three"><section class="panel net"><h2>01 看结果</h2><p>统治绩效评价实际结果、统治手段与可归责代价。先看总分，再看治国、军事、奠基附加与文明整合的构成。</p><p>仅有正式入榜资格的人物显示排名。未入榜、不适用与零分分别表达。</p></section><section class="panel profile"><h2>02 看人物画像</h2><p>八轴分别观察军事、外交、联盟、组织、判断、学习、用人与制度设计等能力。已完成裁决的能力从E−到S+分18级展示；证据不足、待补证、待重裁或不适用都会单独标明，不会自动按低等级处理。逐轴可查看等级、主要表现、反例与适用范围。</p><p>权力运用与克制是九轴画像中的独立行为风格项，与八个能力轴一起展示。雷达不计算面积得分，不生成全能指数。</p></section><section class="panel impact"><h2>03 看后效</h2><p>历史影响评价一个人改变历史路径的范围、深度与持续时间，以及其中有多少能够归于本人。历史影响总等级直接读取正式裁决，不由其他分数换算。</p><p>正向、负向或混合性质单列。高影响可以伴随净损害。</p><p>阅读顺序：先看影响范围、深度与持续，再看本人归责；政治范式只作有限补充。</p>${impactScaleNote()}${impactTechnicalHelp()}</section></div><section class="panel guide-rank-context"><h2>审慎位置、规则点位与治理背景</h2><div class="guide-term-grid"><div><strong>审慎位置投影</strong><p>页面优先展示这一范围。它只把本人的审慎分数区间放回当前正式榜，其他人物仍固定在正式分；不是所有人物同时变化后的联合名次区间。</p></div><div><strong>规则点位（点估计）</strong><p>按当前正式裁决和基准权重得到的单一点排序，用于留存当前规则下的结算位置；它不表示细小分差具有同等精度的历史优劣含义。主页面总分只显示1位小数以避免制造虚假精度；排序与规则点位仍按未舍入的正式结算值计算，因此显示同分的人仍可能有先后。</p></div><div><strong>现有史料审慎分数区间</strong><p>固定现有权重，只在当前史料已经允许的裁决端点之间计算；不是统计置信区间，也不是未来史料的绝对边界。</p></div><div><strong>权重敏感性</strong><p>固定人物正式裁决，只改变项目已经声明的权重情景。它反映规则权重变化，与史料不确定性是两条不同问题。</p></div><div><strong>治理背景</strong><p>治理规模与复杂度只用于说明实际掌权窗口面对的治理对象和结构，当前不计分、不加难度奖励，也不改变正式名次。当前榜单没有对区域、广域与超广域治理难度做分数校准，因此跨规模名次应与这一背景一起读。</p></div></div></section><section class="panel evidence"><h2>结论不一致时，读什么？</h2><p>先看统治绩效的损益构成，再读能力轴的行为情境，最后检查历史影响的共同主链与反事实。一次行动可能有能力表现、实际成本和长期后效；来源相同不表示三个体系评价同一命题。</p><p>本阅读层展示已经裁定的事实和限制。尚未正式裁定的跨体系因果解释，不从字母或分数差自动生成。</p><p><strong>材料标签怎样读？</strong> “材料强度”描述情境的持续性、作用范围和机制化程度；“来源覆盖”描述公开证据包的来源是否足够，两者不是同一尺度，也都不表示正负方向、能力高低或得分。只有正式记录明确发布相应字段时页面才展示；没有这类标签只表示上游没有发布，不等于证据弱，页面也不会自行补判。</p><p>正式评价对象 ${DATA.main_count} 人，统治绩效入榜 ${DATA.ranked_count} 人；历史影响另有 ${DATA.supplementary_count} 位补充历史样本，不计入正式评价对象统计。</p><p class="subline">这是离线交互设计样稿。展示数据来自构建时的正式结算；更新正式记录后重新构建阅读页。</p><p class="sources">${link('docs/项目总纲/皇帝综合评价体系合同.md','三体系总合同 ↗')}${link('config/project.yml','入口配置 ↗')}${link('docs/项目总纲/历史影响评价总则.md','历史影响合同 ↗')}${link('docs/项目总纲/皇帝人物画像评估体系合同.md','画像合同 ↗')}${link('docs/项目总纲/皇帝统治绩效评价合同.md','统治绩效合同 ↗')}</p></section></details>`;}
document.getElementById('home-nav').onclick=()=>go('#overview');document.getElementById('compare-nav').onclick=()=>go('#compare');document.getElementById('guide-nav').onclick=()=>go('#guide');
screen.addEventListener('click',e=>{const section=e.target.closest('[data-section]');if(section){e.preventDefault();document.getElementById(section.dataset.section)?.scrollIntoView({behavior:'smooth',block:'start'});return}const chain=e.target.closest('[data-chain]');if(chain){e.preventDefault();const target=document.getElementById('chain-'+chain.dataset.chain);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const reason=e.target.closest('[data-reason]');if(reason){e.preventDefault();const target=document.getElementById('reason-'+reason.dataset.reason);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-pick-compare')){const id=b.dataset.pickCompare;if(!state.compare.includes(id)){if(state.compareReplace===0)state.compare.unshift(id);else state.compare.push(id)}state.compareReplace=null;compare();return}if(b.hasAttribute('data-remove-compare')){state.compare=state.compare.filter(id=>id!==b.dataset.removeCompare);compare();return}if(b.hasAttribute('data-replace-compare')){state.compareReplace=Number(b.dataset.replaceCompare);state.compare=state.compare.filter((_,i)=>i!==state.compareReplace);history.replaceState(null,'','#compare');compare();return}if(b.hasAttribute('data-swap-compare')){state.compare.reverse();compare();return}if(b.hasAttribute('data-person'))go('#person/'+b.dataset.person);if(b.hasAttribute('data-home'))go('#overview');if(b.hasAttribute('data-person-compare')){const id=b.dataset.personCompare;state.compare=[id];state.compareReplace=null;go('#compare')}if(b.hasAttribute('data-select')){const id=b.dataset.select;if(state.compare.includes(id))state.compare=state.compare.filter(x=>x!==id);else if(state.compare.length<2)state.compare.push(id);else{document.getElementById('selection').textContent='已选两人，请先取消一人，或进入对照页替换。';return}renderRows()}});
function route(){const h=location.hash;if(h.startsWith('#person/'))person(byId.get(personId()));else if(h==='#compare')compare();else if(h.startsWith('#compare/')){let ids;try{ids=h.slice(9).split('/').map(decodeURIComponent)}catch{ids=[]}if(ids.length===2&&ids[0]!==ids[1]&&ids.every(id=>byId.has(id))){state.compare=ids;compare()}else{nav('compare');screen.innerHTML='<p>对照地址无效，请重新选择两位人物。</p><button data-home>返回人物总览</button>'}}else if(h==='#guide')guide();else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script></body></html>
