<body><header><strong>帝王三镜</strong><span>结果 · 能力 · 后效</span><nav aria-label="主导航"><button id="home-nav">人物总览</button><button id="compare-nav">并列对照</button><button id="guide-nav">如何阅读</button></nav></header><main id="screen"></main>
<script type="application/json" id="reader-data">__READER_DATA__</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById('reader-data').textContent), screen=document.getElementById('screen');
const byId=new Map(DATA.records.map(r=>[r.ruler_id,r]));
const state={q:'',polity:'',scope:'main',sort:'time',compare:[],grade:'',differences:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>typeof v==='number'?v.toFixed(2):'—';
const conf=v=>({HIGH:'高',MEDIUM:'中',LOW:'低'}[v]||v||'未声明');
const pos=v=>({HIGH:'高位',MID:'中位',LOW:'低位'}[v]||v||'');
const mode=v=>({FULL_GRADE:'完整定档',BOUNDED_PROFILE:'有界画像',MATERIAL_DENSITY_LIMITED:'材料密度受限',NOT_APPLICABLE:'不适用',EPISODE_TAG:'仅有局部情境证据',NO_GRADE:'证据不足，无档结案'}[v]||v||'未声明');
const dimNames={scope:'影响范围',depth_duration:'深度与持续',personal_causality:'个人因果',paradigm:'政治范式'};
const href=p=>{p=p.replace(/\.md:(\d+)(?:-(\d+))?$/,(_,a,b)=>'.md#L'+a+(b?'-L'+b:''));const [path,...fragment]=p.split('#');return '../'+path.split('/').map(encodeURIComponent).join('/')+(fragment.length?'#'+encodeURIComponent(fragment.join('#')):'')};
const personId=()=>{try{return decodeURIComponent(location.hash.slice(8))}catch{return ''}};
const link=(p,label,subject)=>{if(!p)return '';if(/^https?:\/\//.test(p))return `<a href="${esc(p)}" target="_blank" rel="noopener">${esc(label)}</a>`;if(DATA.source_availability[p]===false)return `<span class="unavailable-source">历史引用（当前文件不可用）：${esc(p)}</span>`;let url=href(p);const person=subject||byId.get(personId());if(person&&/\.(md|json)$/.test(p.split('#')[0])){const [path,hash]=url.split('#');url=path+'?person='+encodeURIComponent(person.ruler_id)+'&name='+encodeURIComponent(person.ruler_name)+(hash?'#'+hash:'')}return `<a href="${url}" target="_blank" rel="noopener">${esc(label)}</a>`};
const letters={G5:'S',G4:'A',G3:'B',G2:'C',G1:'D',G0:'E'};
const shortNames={M1:'军事统帅',M2:'外交博弈',M4:'内部联盟',M5:'组织执行',C1:'战略判断',C2:'学习纠错',C3:'用人授权',C4:'制度设计',C5:'权力克制'};
const ungraded=a=>a?.adjudication_state==='EVIDENCE_INSUFFICIENT_CLOSED';
const pending=a=>!!a&&(a.display_point_only||['UNRESOLVED_EVIDENCE_GAP','REASSESSMENT_REQUIRED'].includes(a.adjudication_state));
const radarValue=a=>!a||ungraded(a)||pending(a)||!letters[a.axis_grade]||!['LOW','MID','HIGH'].includes(a.position)||a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?null:a.radar_value;
const grade=a=>!a?'未覆盖':ungraded(a)?'无档结案':pending(a)?(a.adjudication_state==='REASSESSMENT_REQUIRED'?'待重裁':a.adjudication_state==='UNRESOLVED_EVIDENCE_GAP'?'待补证':'历史显示点'):a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?'不适用':!letters[a.axis_grade]?'未定档':!['LOW','MID','HIGH'].includes(a.position)?'位置未定':letters[a.axis_grade]+({LOW:'−',MID:'',HIGH:'+'}[a.position]);

const groupNames={first:'奠基与统一：原分及折算',method:'治国：制度与行政',finance:'治国：财政与民生',handoff:'治国：交接质量',strategic:'军事：战略收益与国防',military:'军事：体系与成本',civilization:'文明与国家整合'};
const impactMeaning={'S+':'文明／国家主路径重塑',S:'超重大历史影响',A:'重大长期历史影响',B:'重大历史影响',C:'显著历史影响',D:'有限但真实影响',E:'弱历史影响'};
const readingTerms={PS0:'仅有结果或资源背景',PS1:'局部正确选择',PS2:'完整独立决策周期',PS3:'可跨情境迁移的强模式',PS4:'不同约束下反复兑现的罕见模式',DW0:'未能归责本人的负面结果',DW1:'已纠正且未复发的局部误判',DW2:'造成显著损失但已恢复或未同类复发的错误',DW3:'同类机制重复失败、反馈后加码或优势下崩盘',DW4:'跨机制与阶段的稳定失能',AM1:'局部制度接口',AM2:'全国重要子系统',AM3:'国家核心系统',AM4:'国家基本运行架构重构'};
function readerText(t){return String(t??'').replace(/\b(?:PS[0-4]|DW[0-4]|AM[1-4])\b/g,k=>readingTerms[k]).replace(/G([0-5])[- /]*(LOW|MID|HIGH)/g,(_,g,p)=>grade({axis_grade:'G'+g,position:p})).replace(/G([0-5])/g,(_,g)=>letters['G'+g]+'档').replace(/EPISODE_TAG/g,'局部情境证据').replace(/BOUNDED_PROFILE/g,'有明确适用边界的画像').replace(/FULL_GRADE/g,'完整定档').replace(/MI4(?:_CROSS_PHASE_SYSTEMIC)?/g,'跨阶段系统性情境').replace(/MI3(?:_SUSTAINED_SYSTEMIC)?/g,'持续系统性情境').replace(/MI2(?:_LIFECYCLE)?/g,'完整生命周期情境').replace(/MI1(?:_CASE)?/g,'单一情境').replace(/\bE1\b/g,'少量情境材料').replace(/\bE2\b/g,'多个独立情境材料').replace(/\bE3\b/g,'主要命题已有代表性材料')}
function axisProse(t){if(typeof t==='string')return prose(readerText(t));if(Array.isArray(t))return t.length?t.map(axisProse).join(''):prose('未另列说明');if(t&&typeof t==='object'){const labels={positive_parent_refs:'正向情境引用',counter_parent_refs:'反例情境引用'};return `<details><summary>查看结构化情境引用</summary>${Object.entries(t).map(([k,v])=>`<div class="label">${esc(labels[k]||k)}</div>${axisProse(v)}`).join('')}</details>`}return prose('未另列说明')}
function excerpt(t){return `<div class="excerpt">${format(Array.isArray(t)?t.join('；'):t||'尚无独立说明')}</div>`}
function netGroups(r){return Object.entries(r.net.component_details||{}).map(([key,items])=>`<details><summary>${esc(groupNames[key]||key)}</summary><p class="subline">以下包含原始指标、折算与小计，不逐行相加。</p>${items.map(x=>`<div class="component"><span>${esc(x.label)} <small>${esc(x.grade)} ${esc(x.note)}</small></span><b>${x.value==null?'—':esc(x.value)} ${esc(x.unit)}</b></div>`).join('')}</details>`).join('')}
const impactAuditSource=s=>{
 const name=[s?.document,s?.path,s?.title,s?.kind].filter(Boolean).join(' ');
 return s?.kind==='IMPORTED_ADJUDICATION'||/裁决清单|历史审计|重审持续记录|阶段复裁|整改报告/.test(name);
};
function impactSourceLabel(s){
 if(s?.title)return s.title;
 if(s?.path)return s.path.split('/').pop();
 if(s?.document)return s.document;
 return ({LOCAL_FORMAL_DOCUMENT:'项目正式材料',HISTORICAL_WEB_SOURCE:'史料／研究来源'}[s?.kind]||'来源');
}
function impactSourceList(r,indices,labelText='本节依据'){
 const refs=r.impact?.source_refs||[];
 const selected=[...new Set((indices||[]).filter(Number.isInteger))].map(i=>refs[i]).filter(s=>s&&!impactAuditSource(s));
 if(!selected.length)return '';
 return `<details class="impact-source-list"><summary>${esc(labelText)}</summary><ul>${selected.map(s=>{const target=s.url||s.path||'';const title=impactSourceLabel(s);const head=target?link(target,title,r):`<span>${esc(title)}</span>`;const note=s.evidence_note?`<div class="subline">${esc(readerText(s.evidence_note))}</div>`:'';return `<li>${head}${note}</li>`}).join('')}</ul></details>`;
}
function impactDimensionHead(h,key,title,question){
 return `<div class="impact-dimension-head"><h3>${esc(title)}</h3><span class="badge">${esc(h.dimensions?.[key]?.grade||'—')}</span></div><p class="subline">${esc(question)}</p>`;
}
function historySections(r){
 const h=r.impact,chains=h.macro_chains||[];
 const scopeReview=h.scope_review||{},depthReview=h.depth_review||{},causalReview=h.causal_review||{},paradigmReview=h.paradigm_review||{};
 const scopeIndices=[...(scopeReview.source_ref_indices||[]),...chains.flatMap(c=>c.source_ref_indices||[])];
 const depthIndices=depthReview.source_ref_indices||[];
 const causalIndices=causalReview.source_ref_indices||[];
 const paradigmIndices=paradigmReview.source_ref_indices||[];
 const scopeBasis=scopeReview.basis||h.foundation?.joint_footprint_basis||h.grade_basis;
 const scopeLimit=[scopeReview.limits,scopeReview.limit,h.dimensions?.scope?.boundary_note].filter(Boolean).join('\\n\\n');
 const depthBasis=depthReview.basis||h.dimensions?.depth_duration?.boundary_note||'';
 const depthLimit=[depthReview.limits,depthReview.limit,h.dimensions?.depth_duration?.boundary_note].filter(Boolean).join('\\n\\n');
 const causalBasis=causalReview.basis||causalReview.decision||'';
 const counterfactual=h.nearest_feasible_counterfactual||h.counterfactual_entry?.functional_alternative||causalReview.strongest_alternative||'';
 const causalLimit=[causalReview.limit,h.dimensions?.personal_causality?.boundary_note].filter(Boolean).join('\\n\\n');
 const paradigmLimit=[paradigmReview.limitation,paradigmReview.depth_separation,h.dimensions?.paradigm?.boundary_note].filter(Boolean).join('\\n\\n');
 const evidenceBoundary=[h.confidence_basis,h.source_review_scope,h.source_trace?.limit].filter(Boolean).join('\\n\\n');
 return `<h2 class="evidence-card-title">历史影响依据</h2><details><summary>公众总档为什么这样定？</summary>${prose(h.grade_basis)}</details><section class="impact-core-chains"><h3>核心历史主链</h3><p class="subline">先看真正改变了什么，再分别判断覆盖范围、持续深度、个人归责和后世范式。</p>${chains.map(c=>`<details id="chain-${c.chain_id}"><summary>${esc(c.title)}</summary>${prose(c.narrative)}${impactSourceList(r,c.source_ref_indices,'本链依据')}</details>`).join('')}</section><section id="history-dimension-scope" class="impact-dimension-section">${impactDimensionHead(h,'scope','影响范围','回答“实际改变覆盖到多大政治空间，哪些部分不能继续外推”。')}${prose(scopeBasis)}${scopeLimit?`<div class="label">范围边界</div>${prose(scopeLimit)}`:''}${impactSourceList(r,scopeIndices,'范围与主链依据')}</section><section id="history-dimension-depth_duration" class="impact-dimension-section">${impactDimensionHead(h,'depth_duration','深度与持续','回答“本人退出后，哪些结构仍继续约束后继，延续到哪里为止”。')}${prose(depthBasis)}${depthLimit?`<div class="label">持续边界与截断点</div>${prose(depthLimit)}`:''}${impactSourceList(r,depthIndices,'深度依据')}</section><section id="history-dimension-personal_causality" class="impact-dimension-section">${impactDimensionHead(h,'personal_causality','个人因果','回答“这些变化有多少真正依赖本人，而不是前制、臣下、时代趋势或后继者”。')}${causalBasis?`<div class="label">因果判断</div>${prose(causalBasis)}`:''}${counterfactual?`<div class="label">如果没有这个人</div>${prose(counterfactual)}`:''}${h.personal_causal_boundary?`<div class="label">本人、团队与时代如何分账</div>${prose(h.personal_causal_boundary)}`:''}${causalLimit?`<div class="label">因果边界</div>${prose(causalLimit)}`:''}${impactSourceList(r,causalIndices,'因果依据')}</section><section id="history-dimension-paradigm" class="impact-dimension-section">${impactDimensionHead(h,'paradigm','政治范式','回答“后世最高权力是否真的把这个人或其治道当作榜样、反例或现实政治参照”。')}${prose(h.paradigm_analysis)}${paradigmLimit?`<div class="label">范式边界</div>${prose(paradigmLimit)}`:''}${impactSourceList(r,paradigmIndices,'范式依据')}</section><section id="history-judgment-boundary" class="impact-dimension-section impact-boundary"><div class="impact-dimension-head"><h3>判断边界</h3><span class="subline">置信度 ${conf(h.confidence)}</span></div>${evidenceBoundary?prose(evidenceBoundary):'<p class="subline">当前正式记录未另列补充边界。</p>'}</section><p class="sources impact-reading-links">${link(DATA.sources.impact_reader,'历史影响完整阅读页 ↗')}${link(DATA.sources.impact,'正式记录入口 ↗')}</p>`;

const format=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function prose(t){if(Array.isArray(t))return t.length?t.map(prose).join(''):'';if(t&&typeof t==='object')return Object.entries(t).map(([k,v])=>`<div class="label">${esc(k)}</div>${prose(v)}`).join('');if(!t)return '';return String(t).split(/\n\s*\n/).map(block=>`<p class="prose">${format(block)}</p>`).join('')}
function contexts(a){const labels={positive_parent_refs:'正向表现',counter_parent_refs:'反例与下沿',negative_parent_refs:'负向表现',mixed_parent_refs:'正负混合表现'};return Object.entries(a.counterpattern).map(([key,refs])=>`<div class="label">${esc(labels[key]||key)}</div>${Array.isArray(refs)&&refs.length?refs.map(id=>{const c=a.context_lookup?.[id];return c?`<div class="context-story">${axisProse(c.cycle_basis||c.basis)}<details class="metadata"><summary>该情境的来源</summary><p class="subline">${esc(id)}</p>${(c.source_refs||[]).map(ref=>/^(docs\/|config\/|archive\/|https?:\/\/)/.test(ref)?link(ref,'来源原文 ↗'):prose(ref)).join('')}</details></div>`:prose('情境引用：'+id)}).join(''):'<p class="subline">当前未列独立情境。</p>'}`).join('')}

function radar(r){
 const codes=DATA.capability_axes, point=(i,v)=>{const a=i*Math.PI*2/codes.length-Math.PI/2;return[150+Math.cos(a)*v*.83,118+Math.sin(a)*v*.83]};
 const points=v=>codes.map((_,i)=>point(i,v).join(',')).join(' ');
 const complete=codes.every(c=>Number.isFinite(radarValue(r.axes[c])));
 return `<svg class="radar" viewBox="0 0 300 240" role="img" aria-label="八轴能力形状，具体档位见下方列表；不比较面积">${[25,50,75,100].map(v=>`<polygon points="${points(v)}" fill="none" stroke="#deded3"/>`).join('')}${codes.map((c,i)=>{const p=point(i,100),t=point(i,123);return `<line x1="150" y1="118" x2="${p[0]}" y2="${p[1]}" stroke="#deded3"/><text x="${t[0]}" y="${t[1]+4}" text-anchor="middle">${esc(shortNames[c]||c)}</text>`}).join('')}${complete?`<polygon points="${codes.map((c,i)=>point(i,radarValue(r.axes[c])).join(',')).join(' ')}" fill="#28655926" stroke="#286559" stroke-width="2"/>`:''}${codes.map((c,i)=>{const v=radarValue(r.axes[c]);if(!Number.isFinite(v))return '';const p=point(i,v);return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#286559"/>`}).join('')}</svg>`;
}
function axisRows(r,codes){return codes.map(c=>`<div class="axis-row compact-axis"><a href="#reason-${c}" data-reason="${c}">${esc(shortNames[c]||DATA.axis_specs[c].name)}</a><b class="axis-letter ${pending(r.axes[c])||ungraded(r.axes[c])?'pending':''}">${grade(r.axes[c])}</b></div>`).join('')}

function gradeHelp(kind){
 if(kind==='impact')return `<details class="grade-help"><summary>影响等级怎样读？</summary><p>这是历史改变的量级，不是能力或功绩等级。总档与四维分别裁定，不求平均。</p>${DATA.impact_grades.map(g=>`<p><b>${esc(g)}</b> · ${esc(impactMeaning[g])}</p>`).join('')}</details>`;

}

 for(const [id,key] of [['scope','scope'],['sort','sort'],['impact-filter','grade']])document.getElementById(id).value=state[key];

function renderRows(){let rows=DATA.records.filter(r=>r.supplementary===(state.scope==='supplementary')&&(!state.polity||r.polity===state.polity)&&(!state.grade||r.impact.public_grade===state.grade)&&(!state.q||(r.ruler_name+r.polity+r.impact.identity_label).includes(state.q.trim())));
 rows.sort((a,b)=>{if(state.sort==='net')return (b.net?.total_score??-Infinity)-(a.net?.total_score??-Infinity)||a.ruler_id.localeCompare(b.ruler_id);if(state.sort==='impact')return DATA.impact_grades.indexOf(a.impact.public_grade)-DATA.impact_grades.indexOf(b.impact.public_grade)||a.ruler_id.localeCompare(b.ruler_id);return (a.impact.reading_start_year??Infinity)-(b.impact.reading_start_year??Infinity)||a.ruler_id.localeCompare(b.ruler_id)});
 document.getElementById('count').textContent=`显示 ${rows.length} 人`;

function person(r){
 nav('');if(!r){screen.innerHTML='<p>未找到该人物。</p><button data-home>返回人物总览</button>';return}
 screen.innerHTML=`<button class="back" data-home>← 人物总览</button><div class="person-head"><div><div class="eyebrow">${esc(r.polity)} / 三套评价</div><h1>${esc(r.impact.identity_label||r.ruler_name)}</h1><p class="muted">实际权力窗口：${esc(r.actual_power_window)} ${r.supplementary?'<span class="scope-label">· 历史影响补充样本</span>':''}</p></div><button data-person-compare="${r.ruler_id}">选择另一人对照 →</button></div><nav class="person-nav" aria-label="人物页章节"><a href="#person-outcome" data-section="person-outcome">净收益概览</a><a href="#person-capability" data-section="person-capability">九轴画像</a><a href="#person-impact" data-section="person-impact">历史影响概览</a><a href="#person-evidence" data-section="person-evidence">展开依据</a></nav><div class="three overview-panels">${netPanel(r)}<section id="person-capability" class="panel profile"><div class="eyebrow">02 / 人物画像</div><h2>人物画像</h2><p class="subline">八轴能力与权力风格分别评价</p>${r.supplementary?'<p>不在本展示画像主池内。</p>':`<h3>八轴能力</h3><div class="compact-axes">${axisRows(r,DATA.capability_axes)}</div><div class="style-axis"><h3>权力运用风格</h3>${axisRows(r,DATA.independent_axes)}</div>`}${gradeHelp('profile')}<p class="sources"><a href="#profile-evidence" data-section="profile-evidence">查看表现、反例与限制 ↓</a></p></section>${impactPanel(r)}</div><section id="person-evidence" class="evidence reading-wide"><h2>结论背后的依据</h2><p class="muted">三套结论各自成立。按想了解的问题展开，不把同一字母当成相同尺度。</p>${r.net?`<section class="panel"><h3>净收益构成</h3>${netGroups(r)}</section>`:''}<section id="profile-evidence" class="panel evidence"><h2>人物画像依据</h2>${!r.supplementary?`<details><summary>查看八轴能力雷达</summary>${radar(r)}<p class="subline">只展示能力结构；C5不并入能力图，不按面积、均值或比例比较整体能力。</p></details>${DATA.axis_order.map(c=>axisEvidence(r,c)).join('')}`:'<p>该补充样本不在本展示画像主池内。</p>'}</section><section id="history-evidence" class="panel evidence">${historySections(r)}</section></section>`;
}

function compare(){
 nav('compare');if(state.compare.length<2){comparePicker();return}
 const [a,b]=state.compare.map(id=>byId.get(id));history.replaceState(null,'','#compare/'+state.compare.map(encodeURIComponent).join('/'));
 const row=(label,fn)=>{const left=fn(a),right=fn(b);if(state.differences&&left===right)return '';return `<tr><td>${label}</td><td>${left}</td><td>${right}</td></tr>`};
 const axisRow=c=>{if(state.differences&&grade(a.axes[c])===grade(b.axes[c]))return '';return `<tr><td>${esc(DATA.axis_specs[c].name)}</td>${[a,b].map((r,i)=>`<td>${r.axes[c]?axisEvidence(r,c,'-compare-'+i):'未覆盖'}</td>`).join('')}</tr>`};
 const section=label=>`<tr class="comparison-section"><th colspan="3">${label}</th></tr>`;
 screen.innerHTML=`<h1>同题对照，各读其因。</h1><p class="muted">按相同维度展开双方依据，保留不同起点、责任窗口与材料限制。</p><div class="compare-select">${[a,b].map((r,i)=>`<button data-replace-compare="${i}">${esc(r.impact.identity_label||r.ruler_name)} · 更换</button>`).join('<span>与</span>')}<button data-swap-compare>交换左右</button></div><label class="difference-toggle"><input type="checkbox" id="differences" ${state.differences?'checked':''}>隐藏相同数值／等级</label><p class="subline">同档仍可能有不同事实、置信度和限制。启用后会同时隐藏这些同档行的依据；取消勾选即可查看。</p><div class="table-wrap comparison-scroll"><table class="comparison"><thead><tr><th>阅读问题</th><th>${esc(a.ruler_name)}</th><th>${esc(b.ruler_name)}</th></tr></thead><tbody>${row('实际权力窗口',r=>esc(r.actual_power_window))}${section('净收益')}${row('净收益',r=>r.net?`<b>${number(r.net.total_score)}</b> · 第 ${r.net.rank} 名`:'未入榜')}${[['治国净收益','second_item_score'],['军事与边疆','third_item_score'],['奠基与统一附加','first_item_add_on'],['文明与国家整合','fourth_item_adjustment']].map(([n,k])=>row(n,r=>number(r.net?.[k]))).join('')}${row('构成与依据',r=>r.net?`<details><summary>展开构成</summary>${netGroups(r)}</details>`:'本展示未覆盖')}${section('人物画像 · 八轴能力')}${DATA.capability_axes.map(axisRow).join('')}${section('人物画像 · 权力运用风格')}${DATA.independent_axes.map(axisRow).join('')}${section('历史影响')}${row('历史影响总档',r=>`<b class="impact-grade">${esc(r.impact.public_grade)}</b> · ${esc(r.impact.impact_nature)}`)}${Object.entries(dimNames).map(([k,n])=>row(n,r=>esc(r.impact.dimensions[k]?.grade))).join('')}${row('量级置信度',r=>conf(r.impact.confidence))}${row('主链与归责依据',r=>`<details><summary>展开历史影响依据</summary>${historySections(r)}</details>`)}${row('继续阅读',r=>`<button data-person="${r.ruler_id}">查看${esc(r.ruler_name)} →</button>`)}</tbody></table></div>${gradeHelp('profile')}${gradeHelp('impact')}`;
 document.getElementById('differences').onchange=e=>{state.differences=e.target.checked;compare()};
}

function guide(){nav('guide');screen.innerHTML=`<div class="eyebrow">Reading guide</div><h1>三个问题，一份人物理解。</h1><div class="three"><section class="panel net"><h2>01 看结果</h2><p>净收益评价实际留下的收益与损害。先看总分，再看治国、军事、奠基附加与文明整合的构成。</p><p>仅有正式入榜资格的人物显示排名。未入榜、不适用与零分分别表达。</p></section><section class="panel profile"><h2>02 看人物画像</h2><p>八轴评价判断、联盟、组织、学习、用人与制度设计等能力。已裁能力从E−到S+分18级展示；待补证与待重裁分别标明，历史值不绘入雷达。M2终局未显示能力者发布E，范围说明随依据保留。逐轴看等级、反例与适用范围。</p><p>C5权力运用风格与克制是九轴画像中的独立行为风格轴，与八个能力轴一起展示。雷达不计算面积得分，不生成全能指数。</p></section><section class="panel impact"><h2>03 看后效</h2><p>历史影响评价改变的范围、深度与持续、个人因果和政治范式。公众总档来自已裁结论。</p><p>正向、负向或混合性质单列。高影响可以伴随净损害。</p></section></div><section class="panel evidence"><h2>结论不一致时，读什么？</h2><p>先看净收益的损益构成，再读能力轴的行为情境，最后检查历史影响的共同主链与反事实。一次行动可能有能力表现、实际成本和长期后效；来源相同不表示三个体系评价同一命题。</p><p>本阅读层展示已经裁定的事实和限制。尚未正式裁定的跨体系因果解释，不从字母或分数差自动生成。</p><p>主池 ${DATA.main_count} 人，净收益入榜 ${DATA.ranked_count} 人，历史影响另有 ${DATA.supplementary_count} 位补充样本；补充样本不加入主池统计。</p><p class="subline">这是离线交互设计样稿。展示数据来自构建时的正式结算；更新正式记录后重新构建阅读页。</p><p class="sources">${link('docs/项目总纲/皇帝综合评价体系合同.md','三体系总合同 ↗')}${link('config/project.yml','入口配置 ↗')}${link('docs/项目总纲/历史影响评价总则.md','历史影响合同 ↗')}${link('docs/项目总纲/皇帝人物画像评估体系合同.md','画像合同 ↗')}${link('docs/项目总纲/皇帝统治净收益评价合同.md','净收益合同 ↗')}</p></section>`;}
document.getElementById('home-nav').onclick=()=>go('#overview');document.getElementById('compare-nav').onclick=()=>go('#compare');document.getElementById('guide-nav').onclick=()=>go('#guide');
screen.addEventListener('click',e=>{const section=e.target.closest('[data-section]');if(section){e.preventDefault();document.getElementById(section.dataset.section)?.scrollIntoView({behavior:'smooth',block:'start'});return}const chain=e.target.closest('[data-chain]');if(chain){e.preventDefault();const target=document.getElementById('chain-'+chain.dataset.chain);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const reason=e.target.closest('[data-reason]');if(reason){e.preventDefault();const target=document.getElementById('reason-'+reason.dataset.reason);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-pick-compare')){const id=b.dataset.pickCompare;if(!state.compare.includes(id)){if(state.compareReplace===0)state.compare.unshift(id);else state.compare.push(id)}state.compareReplace=null;compare();return}if(b.hasAttribute('data-remove-compare')){state.compare=state.compare.filter(id=>id!==b.dataset.removeCompare);compare();return}if(b.hasAttribute('data-replace-compare')){state.compareReplace=Number(b.dataset.replaceCompare);state.compare=state.compare.filter((_,i)=>i!==state.compareReplace);history.replaceState(null,'','#compare');compare();return}if(b.hasAttribute('data-swap-compare')){state.compare.reverse();compare();return}if(b.hasAttribute('data-person'))go('#person/'+b.dataset.person);if(b.hasAttribute('data-home'))go('#overview');if(b.hasAttribute('data-person-compare')){const id=b.dataset.personCompare;state.compare=[id];state.compareReplace=null;go('#compare')}if(b.hasAttribute('data-select')){const id=b.dataset.select;if(state.compare.includes(id))state.compare=state.compare.filter(x=>x!==id);else if(state.compare.length<2)state.compare.push(id);else{document.getElementById('selection').textContent='已选两人，请先取消一人，或进入对照页替换。';return}renderRows()}});
function route(){const h=location.hash;if(h.startsWith('#person/'))person(byId.get(personId()));else if(h==='#compare')compare();else if(h.startsWith('#compare/')){let ids;try{ids=h.slice(9).split('/').map(decodeURIComponent)}catch{ids=[]}if(ids.length===2&&ids[0]!==ids[1]&&ids.every(id=>byId.has(id))){state.compare=ids;compare()}else{nav('compare');screen.innerHTML='<p>对照地址无效，请重新选择两位人物。</p><button data-home>返回人物总览</button>'}}else if(h==='#guide')guide();else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script></body></html>
