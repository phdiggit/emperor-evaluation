<body><header><strong>帝王三镜</strong><span>结果 · 能力 · 后效</span><nav aria-label="主导航"><button id="home-nav">人物总览</button><button id="compare-nav">并列对照</button><button id="guide-nav">如何阅读</button><details class="reader-settings"><summary><span id="reader-settings-label">阅读设置</span></summary><div class="reader-settings-panel"><label for="performance-tier-mode">绩效展示方案</label><select id="performance-tier-mode" aria-describedby="tier-preview-note reader-settings-boundary"><option value="merit">当前方案：圣明平庸昏</option><option value="letter">旧方案：百分制与字母档</option></select><p id="tier-preview-note">综合与分项分开评价；文明显示净增量。</p><p id="reader-settings-boundary">切换只改变分数和档位的显示方式，不改变正式评分、排名或史事依据。人物画像与历史影响保持各自的尺度。</p></div></details></nav></header><main id="screen"></main>

<script>
"use strict";
const DATA=JSON.parse(document.getElementById('reader-data').textContent), screen=document.getElementById('screen');
const byId=new Map(DATA.records.map(r=>[r.ruler_id,r]));
async function requireReaderTextVersion(text, expected) {
 const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text.replace(/\r\n/g,'\n')));
 const actual = Array.from(new Uint8Array(bytes), byte=>byte.toString(16).padStart(2,'0')).join('');
 if (!expected || actual !== expected) throw Object.assign(new Error('阅读资料已更新，请刷新页面后继续。'), {readerVersionMismatch:true});
 return text;
}
const state={q:'',polity:'',scope:'main',sort:'time',compare:[],grade:'',scale:'',differences:false,filtersOpen:false,homeView:'simple'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>typeof v==='number'?v.toFixed(2):'—';
const scoreNumber=v=>typeof v==='number'?v.toFixed(1):'—';
function performanceScore(net, key='total') {
 const value=net?.public_scores?.[key];
 if(value?.state==='NOT_APPLICABLE')return '不适用';
 if(value?.state==='NO_CONFIRMED_CHANGE')return '未确认独立变化';
 if(value?.state!=='SCORED')return '—';
 if(key==='total'&&meritTierPreview&&value.trial_tier){
  const t=value.trial_tier;
  return `<span class="merit-tier-result" data-tier="${esc(t.code)}"><span class="merit-tier-name">${esc(t.display_label)}</span><span class="merit-tier-score">${t.score.toFixed(1)}<small>分</small></span>${t.boundary_neighbor?`<span class="merit-tier-boundary" title="分数距档界不超过${DATA.public_score_scale?.merit_trial?.boundary_distance??1}分；这是数值位置提示，不是史料置信度。">近${esc(t.boundary_neighbor)}档界</span>`:''}</span>`;
 }
 if(key!=='total'&&meritTierPreview&&value.trial_rating){
  const t=value.trial_rating;
  if(t.kind==='signed_increment')return `<span class="increment-result" data-direction="${t.score>0?'positive':t.score<0?'negative':'balanced'}"><span>${t.score>0?'+':''}${t.score.toFixed(1)}<small>净增量${t.score===0?' · 正负相抵':''}</small></span><small class="increment-balance">正向 +${t.positive_gross.toFixed(1)} · 负向 ${t.negative_gross?'−':''}${t.negative_gross.toFixed(1)}</small></span>`;
  return `<span class="component-score-result">${t.score.toFixed(1)}<small>分 · ${esc(t.grade)}</small></span>`;
 }
 if(meritTierPreview)return '<span class="muted">展示数据待同步</span>';
 return `${value.score.toFixed(1)} <span class="performance-grade">${esc(value.grade)}</span>`;
}
let meritTierPreview=true;
function meritTrialHelp(){
 const trial=DATA.public_score_scale?.merit_trial;
 if(!trial)return '';
 const counts=new Map();
 for(const r of DATA.records){const code=r.net?.public_scores?.total?.trial_tier?.code;if(code)counts.set(code,(counts.get(code)||0)+1);}
 const interval=(t,i,key)=>t[key]==null?'低于 '+trial.bands[i-1][key]:i===0?t[key]+' 及以上':t[key]+' 至不足 '+trial.bands[i-1][key];
 const levels=trial.bands.flatMap(t=>[...(t.levels||[])].reverse());
 return `<details class="merit-trial-help"><summary>档位与分数怎么读？</summary><p>档位表示综合绩效水平，分数表示同一量尺上的位置，名次表示当前入榜人物的排序。分数按原分固定换算，不按排名或人数分配；增加人物不会改变已有分数与档位。</p><div class="table-wrap"><table><thead><tr><th>档位</th><th>评价含义</th><th>展示分数</th></tr></thead><tbody>${trial.bands.map((t,i)=>`<tr><td>${esc(t.label)}</td><td>${esc(t.meaning)}</td><td>${interval(t,i,'minimum_score')}</td></tr>`).join('')}</tbody></table></div><p>每档分上、中、下；这表示档内分数位置，不是三次独立的历史裁决。上始终高于中、中高于下，昏档亦同。“圣”只表示综合绩效褒评，不表示人格完美；画像与历史影响独立阅读。</p><details><summary>十五级分数区间</summary><div class="table-wrap"><table><thead><tr><th>档位</th><th>展示分数</th></tr></thead><tbody>${levels.map((t,i)=>`<tr><td>${esc(t.label)}</td><td>${t.minimum_score} 至${i?'不足 '+levels[i-1].minimum_score:'不足 100'}</td></tr>`).join('')}</tbody></table></div></details><p>距大档边界不超过${trial.boundary_distance}分时提示相邻档位。边界两侧的近分人物表现可能相近；提示不代表史料置信度或改判概率。小数用于细分显示，不表示历史判断精确到0.1分。</p><details><summary>全池分布与换算依据</summary><div class="merit-trial-distribution">${trial.bands.map(t=>`<span>${esc(t.label)} <b>${counts.get(t.code)||0}</b> 人</span>`).join('')}</div><p>原分门槛：${trial.bands.map((t,i)=>`${esc(t.label)} ${interval(t,i,'minimum_raw')}`).join('；')}。分布用来检查量尺，不是预设配额。原分零点不等于功过相抵；低分本身也不单独证明某种损害。</p><p>总分含合同规定的结果、过程与能力分量。当前仍是阅读尺度试校准，参考现有结算、主要档界两侧的人物表现及其证据，不代表全池逐人重新裁决。切回原方案可作对照；正式原分与名次不变。</p></details></details>`;
}
function scoreReadingNote(net, key='total') {
 const value=net?.public_scores?.[key];
 if(value?.state==='NOT_APPLICABLE')return '不在本项评价范围，不代表0分或能力差。';
 if(value?.state==='NO_CONFIRMED_CHANGE')return '尚未确认可独立计入的变化，不等于正负相抵。';
 if(value?.state!=='SCORED')return '';
 if(key==='total')return '综合展示分由计分原分换算；名次按原分排序。';
 if(key==='fourth'&&meritTierPreview)return '净增量＝正向贡献减负向损害；直接计入原分总分。';
 return '本项展示分由原分单独换算，不能与其他展示分相加。';
}
function performanceScaleHelp(net){
 const meta=DATA.public_score_scale;
 if(!meta)return '';
 const ranges=meta.bands.map((b,i)=>`${esc(b.grade)}：${b.minimum}${i?'—不足'+meta.bands[i-1].minimum:'—100'}分`).join('；');
 const raw=net?`<p>计分原分 ${number(net.total_score)} = 治国 ${number(net.second_item_score)} + 军事 ${number(net.third_item_score)} + 奠基附加 ${number(net.first_item_add_on)} + 文明调整 ${number(net.fourth_item_adjustment)}。</p>`:'';
 const component=meta.component_trial;
 const scales=meritTierPreview?[meta.scales.total_trial,...Object.values(component?.scales||{})]:Object.entries(meta.scales).filter(([key])=>key!=='total_trial').map(([,s])=>s);
 const componentBands=component?.bands||[];
 const founderBands=component?.founder_bands||[];
 const curveNote=meritTierPreview?'奠基以附加折算前的净分换算，适用者零净分对应0；治国与军事低于零的原分保留负向层次。文明净增量不经过这条曲线。':'原方案中，综合、奠基、治国与军事的原分零点对应40，文明的原分零点对应60。五项都按各自锚点换算；奠基以附加折算前的净分换算，不适用仍不补零。';

function powerProse(value){
 if(Array.isArray(value))return value.map(powerProse).join('');
 if(typeof value!=='string')return axisProse(value);
 const sentences=value.match(/[^。；\n]+[。；]?|\n/g)||[];
 const paragraphs=[];let current='';
 for(const sentence of sentences){
  if(sentence==='\n'){if(current){paragraphs.push(current);current='';}continue;}
  if(current&&current.length+sentence.length>160){paragraphs.push(current);current='';}
  current+=sentence;
 }
 if(current)paragraphs.push(current);
 return paragraphs.map(axisProse).join('');
}

const prudentAxisNames={C1:"民生",C2:"经济财政",C3:"社会安全"};

function profileDistinctGradeBasis(value,primary){

  // passage's counterevidence to fit the card.
  const details = record.net?.component_details || {};
  const texts = values => [...new Set(values.map(value => String(value || "").trim().replace(/。；/g, "。")).filter(Boolean))];
  if (major === "first") {
    if (record.net?.first_item_status === "NOT_APPLICABLE") {
      return {paragraphs: ["本人的评价范围不包含建国、复国或统一创业。"], linkLabel: "查看评价范围"};
    }
    const outcome = (details.first || []).find(item => item.reader_public_outcome)?.reader_public_outcome;
    return {paragraphs: texts([outcome?.public_scope?.replace("闭合荆襄", "巩固荆襄")]), linkLabel: "查看成果、难度与本人作用"};
  }
  if (major === "second") {
    return {paragraphs: texts([record.net?.reader_governance_summary]), linkLabel: "查看治国表现与依据"};
  }
  if (major === "third") {
    // C's capability evidence may include founding wars whose outcomes and
    // costs belong to the first item. It is not the third-item overview.
    return {paragraphs: texts([record.net?.reader_military_summary]), linkLabel: "查看战略成果、战事与代价"};
  }
  // The authored conclusion weighs the existing gains and losses. Zero can
  // mean cancellation or no established result; never infer prose from it.
  return {paragraphs: texts([record.net?.reader_civilization_summary]), linkLabel: "查看具体变化与依据"};
}

function compareMajorReading(record, major) {
 if(!record.net)return esc(missingNetLabel(record));
 const reading=majorCardReading(record,major);
 const paragraphs=reading.paragraphs.map(text=>`<p>${esc(text)}</p>`).join('');
 return `<div class="compare-major-score">${performanceScore(record.net,major)}</div><div class="compare-major-reading">${paragraphs||'<p class="muted">暂无分项摘要，可查看完整依据。</p>'}</div><a class="compare-major-link" href="#net/${encodeURIComponent(record.ruler_id)}/${major}">${esc(reading.linkLabel)} →</a>`;
}

function compare(){
 nav('compare');if(state.compare.length<2){comparePicker();return}
 const [a,b]=state.compare.map(id=>byId.get(id));history.replaceState(null,'','#compare/'+state.compare.map(encodeURIComponent).join('/'));
 const firstRawScore=n=>{const value=n?.first_item_raw_score;return typeof value==='number'&&Number.isFinite(value)?value:null};
 const compareFirstAddOn=r=>performanceScore(r?.net,'first');
 const signedAdjustment=value=>{const n=Number(value);return Number.isFinite(n)&&n>0?'+'+scoreNumber(n):scoreNumber(value);};
 const governanceContextText=n=>{const c=n?.governance_context;return c?`${c.scale_label} · ${c.complexity_label}`:'';};
 const governanceContextDiffers=()=>{
  const left=a?.net?.governance_context,right=b?.net?.governance_context;
  if(!left||!right)return false;
  return left.scale_label!==right.scale_label||left.complexity_label!==right.complexity_label;
 };
 const governanceCompareWarning=governanceContextDiffers()
  ? '<p class="notice compare-governance-warning">两人面对的治理范围或结构不同，可在表中对照。</p>'
  : '';
 // Same grade does not mean same evidence. Keep every row, and only mark
 // comparable values for visual emphasis; narrative rows are never classified.
 const personCell=(r,body)=>`<td data-compare-person="${esc(personLabel(r))}">${body}</td>`;
 const row=(label,fn,comparable=true,value=null)=>{const left=fn(a,0),right=fn(b,1);const same=value?value(a)===value(b):left===right;return `<tr${comparable?` data-compare-equal="${same}"`:''}><td>${label}</td>${personCell(a,left)}${personCell(b,right)}</tr>`};
 const majorRow=(label,key)=>row(label,r=>compareMajorReading(r,key),true,r=>r.net?performanceScore(r.net,key):missingNetLabel(r));
 const axisRow=c=>{const stateLabel=r=>r.supplementary?'不在人物画像正式评价范围':grade(r.axes[c]);const same=stateLabel(a)===stateLabel(b);return `<tr data-compare-equal="${same}"><td>${esc(DATA.axis_specs[c].name)}${c==='C5'?'<small class="c5-inline-hint">S端＝更克制</small>':''}${same?'<small class="compare-same-note">同档或同状态，依据分别保留</small>':''}</td>${[a,b].map((r,i)=>personCell(r,r.supplementary?'<span class="muted">不在人物画像正式评价范围</span>':r.axes[c]?axisEvidence(r,c,'-compare-'+i):'未覆盖')).join('')}</tr>`};
 const section=(label,id='')=>`<tr class="comparison-section"${id?` id="compare-section-${id}"`:''}><th colspan="3">${label}</th></tr>`;
 const contents=[['net','统治绩效'],['profile','人物画像'],['impact','历史影响']];
 screen.innerHTML=`<h1>人物对照</h1><div class="compare-select">${[a,b].map((r,i)=>`<button data-replace-compare="${i}">${esc(personLabel(r))} · 更换</button>`).join('<span>与</span>')}<button data-swap-compare>交换左右</button></div><label class="difference-toggle"><input type="checkbox" id="differences" ${state.differences?'checked':''}>突出分数与档位差异</label>${governanceCompareWarning}${performanceScaleHelp()}<nav class="compare-contents" aria-label="对照目录">${contents.map(([id,label])=>`<button type="button" data-compare-section="${id}">${label}</button>`).join("")}</nav><div class="table-wrap comparison-scroll"><table class="comparison"><thead><tr><th>阅读问题</th><th>${esc(personLabel(a))}</th><th>${esc(personLabel(b))}</th></tr></thead><tbody>${row('掌权时期',r=>esc(r.actual_power_window||'未列'),false)}${section('统治绩效','net')}${row('治理范围与结构',r=>r.net?governanceScope(r.net):'—',false)}${row('统治绩效 · 展示分',r=>r.net?`<b>${performanceScore(r.net)}</b>`:esc(missingNetLabel(r)))}${row(rankRescoreLabel,r=>r.net?esc(rankIfRescored(r.net)):'—',false)}${row('按当前评分排名',r=>r.net?`第 ${r.net.rank} 名`:'—',false)}${row('史料与权重说明',r=>{if(!r.net)return '—';const w=r.net.weight_sensitivity?.all_scenarios;return `<details><summary>展开说明</summary>${evidenceAssessment(r.net,true)}${w?`<p><strong>权重敏感性：</strong>固定正式裁决，仅改变已声明权重情景，名次第 ${w.best}—${w.worst} 名。</p>${founderWeightReading(r.net)}`:''}<p class="subline">${rankRescoreExplanation}权重测算则沿用当前评分，查看改变计分权重会怎样影响排名。</p></details>`},false)}${majorRow('治国成效','second')}${majorRow('军事与边疆','third')}${majorRow('政权奠基与统一','first')}${majorRow('文明与国家整合','fourth')}${row('治下状态、恢复与治理机制',r=>r.net?`<details><summary>展开治理状态</summary>${governanceReading(r,false)}</details>`:'—',false)}${row('计分原分构成',r=>r.net?`<details><summary>展开分项</summary>${netGroups(r)}</details>`:esc(missingNetLabel(r)),false)}${section('人物画像 · 八轴能力','profile')}${DATA.capability_axes.map(axisRow).join('')}${section('人物画像 · 权力运用风格')}${DATA.independent_axes.map(axisRow).join('')}${section('历史影响','impact')}${row('历史影响量级',r=>`<b class="impact-home-meaning">${esc(impactMeaning[r.impact.public_grade]||'未列')}<small>综合档位 ${esc(r.impact.public_grade)}</small></b>`)}${row('影响性质',r=>esc(r.impact.impact_nature),false)}${section('历史影响 · 四个方面')}${Object.entries(dimNames).map(([k,n])=>row(n,r=>impactDimensionGrade(k,r.impact.dimensions[k]?.grade))).join('')}${row('判断把握',r=>conf(r.impact.confidence),false)}${row('主链与归责依据',(r,i)=>`<details><summary>展开历史影响依据</summary>${historySections(r,`-compare-${i}`,true)}</details>`,false)}${row('继续阅读',r=>`<button data-person="${r.ruler_id}">查看${esc(personLabel(r))} →</button>`,false)}</tbody></table></div>${gradeHelp('profile')}${gradeHelp('impact')}`;
 for(const button of screen.querySelectorAll('[data-compare-section]')){
  button.onclick=()=>document.getElementById('compare-section-'+button.dataset.compareSection)?.scrollIntoView({block:'start'});
 }
 const emphasize=()=>document.querySelector('.comparison')?.classList.toggle('emphasize-differences',state.differences);
 document.getElementById('differences').onchange=e=>{state.differences=e.target.checked;emphasize()};
 emphasize();
}

function founderWeightReading(n){
 const ranks=n?.weight_sensitivity?.scenario_ranks;
 if(!ranks)return '';
 const scenarios=(DATA.weight_sensitivity?.scenarios||[]).filter(s=>s.common_tilt===0&&s.fourth_item_multiplier===1).sort((a,b)=>a.first_item_coefficient-b.first_item_coefficient);
 if(!scenarios.length)return '';
 const entries=scenarios.map(s=>`${Math.round(s.first_item_coefficient*100)}%：第 ${ranks[s.id]} 名`);
 return `<p><strong>仅提高奠基权重：</strong>${entries.join('；')}。其他三项和指数保持不变，正式名次仍采用20%。</p>`;
}
function guide(){
 nav('guide');
 screen.innerHTML=`<h1>如何阅读帝王三镜</h1>
 <div class="three">
  <section class="panel net"><h2>统治绩效</h2><p>看治国、军事、奠基与统一、文明与国家整合的成效和代价。</p></section>
  <section class="panel profile"><h2>人物画像</h2><p>八项能力看判断、用人和行动。权力运用与克制单独描述行事风格。</p></section>
  <section class="panel impact"><h2>历史影响</h2><p>看改变波及多广、持续多久、有多少归于本人，以及后世如何借鉴。影响大小与正负性质分别列出。</p></section>
 </div>
 <details class="guide-more"><summary>名次、史料分歧与三套评价</summary>
  <div class="guide-term-grid">
   <div><strong>绩效榜</strong><p>综合档位与展示分表达整体水平；奠基、治国和军事分别读分，文明默认显示正负净增量。展示分不能相加；名次按完整计分原分排序，治理范围与复杂度作为背景列出。</p></div>
   <div><strong>已测算解释下</strong><p>${rankRescoreExplanation}</p></div>
   <div><strong>换一套计分权重</strong><p>沿用同样的史料判断，测算各项权重变化时的名次。</p></div>
   <div><strong>人物画像与历史影响</strong><p>画像各项分别定档。历史影响的综合档位和四个分项各用自己的刻度。</p></div>
  </div>
 </details>${performanceScaleHelp()}
 <p><button type="button" data-home>浏览人物 →</button></p>`;
}
document.getElementById('home-nav').onclick=()=>{
 if(state.sort==='net'){
  state.sort='time';
  if(location.hash==='#overview'){renderRows();return}
 }
 go('#overview');
};document.getElementById('compare-nav').onclick=()=>go('#compare');document.getElementById('guide-nav').onclick=()=>go('#guide');
screen.addEventListener('click',e=>{const section=e.target.closest('[data-section]');if(section){e.preventDefault();const target=document.getElementById(section.dataset.section);for(let node=target;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;target?.scrollIntoView({behavior:'smooth',block:'start'});return}const chain=e.target.closest('[data-chain]');if(chain){e.preventDefault();const target=document.getElementById('chain-'+chain.dataset.chain);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const reason=e.target.closest('[data-reason]');if(reason){e.preventDefault();const target=document.getElementById('reason-'+reason.dataset.reason);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-governance-peers')){Object.assign(state,{scale:b.dataset.governancePeers,q:'',polity:'',grade:'',scope:'main',sort:'net'});go('#overview');return}if(b.hasAttribute('data-pick-compare')){
 const id=b.dataset.pickCompare;
 if(state.compare.includes(id))return;
 if(b.hasAttribute('data-replace-index')){
  const replacement=Number(b.dataset.replaceIndex);
  const ids=state.compare.map((current,index)=>index===replacement?id:current);
  go('#compare/'+ids.map(encodeURIComponent).join('/'));
 }else{
  state.compare.push(id);
  compare();
 }
 return;
}
if(b.hasAttribute('data-remove-compare')){state.compare=state.compare.filter(id=>id!==b.dataset.removeCompare);compare();return}if(b.hasAttribute('data-replace-compare')){comparePicker(Number(b.dataset.replaceCompare));return}
if(b.hasAttribute('data-cancel-compare')){compare();return}
if(b.hasAttribute('data-swap-compare')){state.compare.reverse();compare();return}if(b.hasAttribute('data-person'))go('#person/'+b.dataset.person);if(b.hasAttribute('data-home'))go('#overview');if(b.hasAttribute('data-person-compare')){const id=b.dataset.personCompare;state.compare=[id];go('#compare')}if(b.hasAttribute('data-select')){const id=b.dataset.select;if(state.compare.includes(id))state.compare=state.compare.filter(x=>x!==id);else if(state.compare.length<2)state.compare.push(id);else{document.getElementById('selection').textContent='已选两人，请先取消一人，或进入对照页替换。';return}renderRows()}});
function route(){const h=location.hash;if(h.startsWith('#person/'))person(byId.get(personId()));else if(h==='#compare')compare();else if(h.startsWith('#compare/')){let ids;try{ids=h.slice(9).split('/').map(decodeURIComponent)}catch{ids=[]}if(ids.length===2&&ids[0]!==ids[1]&&ids.every(id=>byId.has(id))){state.compare=ids;compare()}else{nav('compare');screen.innerHTML='<p>对照地址无效，请重新选择两位人物。</p><button data-home>返回人物总览</button>'}}else if(h==='#guide')guide();else home();window.scrollTo(0,0)}
document.getElementById('performance-tier-mode').value=meritTierPreview?'merit':'letter';
document.getElementById('performance-tier-mode').onchange=event=>{
 meritTierPreview=event.target.value==='merit';
 document.getElementById('tier-preview-note').textContent=meritTierPreview?'综合与分项分开评价；文明显示净增量。':'旧方案使用百分制与S+至E−分档；文明也换算为展示分。';
 document.getElementById('reader-settings-label').textContent=meritTierPreview?'阅读设置':'阅读设置 · 旧方案';
 route();
};
bindNarrativeLinks();
window.addEventListener('hashchange',route);route();
</script></body></html>
