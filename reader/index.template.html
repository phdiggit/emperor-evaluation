<body><header><strong>帝王三镜</strong><span>结果 · 能力 · 后效</span><nav aria-label="主导航"><button id="home-nav">人物总览</button><button id="compare-nav">并列对照</button><button id="guide-nav">如何阅读</button></nav></header><main id="screen"></main>
<script type="application/json" id="reader-data">__READER_DATA__</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById('reader-data').textContent), screen=document.getElementById('screen');
const byId=new Map(DATA.records.map(r=>[r.ruler_id,r]));
const state={q:'',polity:'',scope:'main',sort:'time',compare:[],grade:'',differences:false,filtersOpen:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>typeof v==='number'?v.toFixed(2):'—';
const conf=v=>({HIGH:'高',MEDIUM:'中',LOW:'低'}[v]||v||'未声明');
const pos=v=>({HIGH:'高位',MID:'中位',LOW:'低位'}[v]||v||'');
const mode=v=>({FULL_GRADE:'完整定档',BOUNDED_PROFILE:'有界画像',MATERIAL_DENSITY_LIMITED:'材料密度受限',NOT_APPLICABLE:'不适用',EPISODE_TAG:'仅有局部情境证据',NO_GRADE:'证据不足，无档结案'}[v]||v||'未声明');
const dimNames={scope:'影响范围',depth_duration:'深度与持续',personal_causality:'个人因果',paradigm:'政治范式'};
const href=p=>{p=p.replace(/\.md:(\d+)(?:-(\d+))?$/,(_,a,b)=>'.md#L'+a+(b?'-L'+b:''));const [path,...fragment]=p.split('#');return '../'+path.split('/').map(encodeURIComponent).join('/')+(fragment.length?'#'+encodeURIComponent(fragment.join('#')):'')};
const personId=()=>{try{return decodeURIComponent(location.hash.slice(8))}catch{return ''}};
const link=(p,label,subject)=>{if(!p)return '';if(/^https?:\/\//.test(p))return `<a href="${esc(p)}" target="_blank" rel="noopener">${esc(label)}</a>`;if(DATA.source_availability[p]===false)return `<span class="unavailable-source">历史引用（当前文件不可用）：${esc(p)}</span>`;let url=href(p);const person=subject||byId.get(personId());if(person&&/\.(md|json)$/.test(p.split('#')[0])){const [path,hash]=url.split('#');url=path+'?person='+encodeURIComponent(person.ruler_id)+'&name='+encodeURIComponent(person.ruler_name)+(hash?'#'+hash:'')}return `<a href="${url}" target="_blank" rel="noopener">${esc(label)}</a>`};
const letters={G5:'S',G4:'A',G3:'B',G2:'C',G1:'D',G0:'E'};
const shortNames={M1:'军事统帅',M2:'外交博弈',M4:'内部联盟',M5:'组织执行',C1:'战略判断',C2:'学习纠错',C3:'用人授权',C4:'制度设计',C5:'权力克制'};
const ungraded=a=>a?.adjudication_state==='EVIDENCE_INSUFFICIENT_CLOSED';
const pending=a=>!!a&&(a.display_point_only||['UNRESOLVED_EVIDENCE_GAP','REASSESSMENT_REQUIRED'].includes(a.adjudication_state));
// Display geometry follows the 18 public levels, never the legacy score.
const profileLevelIndex=a=>!a||ungraded(a)||pending(a)||!letters[a.axis_grade]||!['LOW','MID','HIGH'].includes(a.position)||a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?null:Number(a.axis_grade.slice(1))*3+({LOW:0,MID:1,HIGH:2}[a.position]);
const radarValue=a=>{const level=profileLevelIndex(a);return level===null?null:level/17*100};
const grade=a=>!a?'未覆盖':ungraded(a)?'无档结案':pending(a)?(a.adjudication_state==='REASSESSMENT_REQUIRED'?'待重裁':a.adjudication_state==='UNRESOLVED_EVIDENCE_GAP'?'待补证':'历史显示点'):a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?'不适用':!letters[a.axis_grade]?'未定档':!['LOW','MID','HIGH'].includes(a.position)?'位置未定':letters[a.axis_grade]+({LOW:'−',MID:'',HIGH:'+'}[a.position]);

// Public identity is supplied by the formal source; never infer a title from a name.
function personLabel(r){return String(r?.impact?.identity_label||r?.ruler_name||'');}
const powerContextNote='掌权时期仅作人物背景，不是统一取证边界。人物画像可采用各时期能反映本人表现、且可明确归责的事件；各项具体范围见依据。';
const impactDimensionQuestions={scope:'实际改变覆盖多大范围？',depth_duration:'改变有多深，持续多久？',personal_causality:'哪些变化真正依赖本人？',paradigm:'后世如何实际沿用其治道？'};
function impactScaleNote(){return '<p class="subline impact-scale-note">四维分项与总等级使用不同刻度；不能按相同字母直接比较，也不做平均。</p>';}
function impactTechnicalHelp(){return '<details class="impact-technical"><summary>技术说明：正式档位与公开等级</summary><p>最终内部裁判带 → 公众等级：S+→S+ · S→S · S−→A · A+→B · A→C · B→D · C→E。内部裁判带不是四维中的某一个字母。</p></details>';}

const groupNames={first:'奠基与统一：原分及折算',method:'治国：制度与行政',finance:'治国：财政与民生',handoff:'治国：交接质量',strategic:'军事：战略收益与国防',military:'军事：体系与成本',civilization:'文明与国家整合'};
const impactMeaning={'S+':'文明／国家主路径重塑',S:'超重大历史影响',A:'重大长期历史影响',B:'重大历史影响',C:'显著历史影响',D:'有限但真实影响',E:'弱历史影响'};
const readingTerms={PS0:'仅有结果或资源背景',PS1:'局部正确选择',PS2:'完整独立决策周期',PS3:'可跨情境迁移的强模式',PS4:'不同约束下反复兑现的罕见模式',DW0:'未能归责本人的负面结果',DW1:'已纠正且未复发的局部误判',DW2:'造成显著损失但已恢复或未同类复发的错误',DW3:'同类机制重复失败、反馈后加码或优势下崩盘',DW4:'跨机制与阶段的稳定失能',AM1:'局部制度接口',AM2:'全国重要子系统',AM3:'国家核心系统',AM4:'国家基本运行架构重构'};
function readerText(t){return String(t??'').replace(/\b(?:PS[0-4]|DW[0-4]|AM[1-4])\b/g,k=>readingTerms[k]).replace(/G([0-5])[- /]*(LOW|MID|HIGH)/g,(_,g,p)=>grade({axis_grade:'G'+g,position:p})).replace(/G([0-5])/g,(_,g)=>letters['G'+g]+'档').replace(/EPISODE_TAG/g,'局部情境证据').replace(/BOUNDED_PROFILE/g,'有明确适用边界的画像').replace(/FULL_GRADE/g,'完整定档').replace(/\bE1\b/g,'少量情境材料').replace(/\bE2\b/g,'多个独立情境材料').replace(/\bE3\b/g,'主要命题已有代表性材料').replace(/\bC5\b/g,'权力运用与克制').replace(/COUNTEREVIDENCE_FOUND/g,'已找到明确反例')}
function paradigmReceptionProse(review){
 const receptions=Array.isArray(review?.receptions)?review.receptions.filter(r=>r&&typeof r==='object'):[];
 if(!receptions.length)return '';
 return `<div class="label">实际接收窗口</div>${receptions.map(r=>`<div class="context-story impact-reception"><div class="label">接收者</div><p class="prose">${esc(r.receiver||'未注明')}</p><div class="label">载体</div><p class="prose">${esc(r.carrier||'未注明')}</p><div class="label">实际用途</div>${prose(r.actual_use||'未另列说明')}</div>`).join('')}`;
}
function axisProse(t){if(typeof t==='string')return prose(readerText(t));if(Array.isArray(t))return t.length?t.map(axisProse).join(''):prose('未另列说明');if(t&&typeof t==='object'){const labels={positive_parent_refs:'正向情境引用',counter_parent_refs:'反例情境引用'};return `<details><summary>查看结构化情境引用</summary>${Object.entries(t).map(([k,v])=>`<div class="label">${esc(labels[k]||k)}</div>${axisProse(v)}`).join('')}</details>`}return prose('未另列说明')}
function excerpt(t){return `<div class="excerpt">${format(Array.isArray(t)?t.join('；'):t||'尚无独立说明')}</div>`}
function netGroups(r){return Object.entries(r.net.component_details||{}).map(([key,items])=>`<details><summary>${esc(groupNames[key]||key)}</summary><p class="subline">以下包含原始指标、折算与小计，不逐行相加。</p>${items.map(x=>`<div class="component"><span>${esc(x.public_component_label||x.label)} <small>${esc(x.public_level_label||x.grade)} ${esc(x.note)}</small></span><b>${x.value==null?'—':esc(x.value)} ${esc(x.unit)}</b></div>`).join('')}</details>`).join('')}
const impactAuditSource=s=>{
 const name=[s?.document,s?.path,s?.title,s?.kind].filter(Boolean).join(' ');
 return s?.kind==='IMPORTED_ADJUDICATION'||/裁决清单|历史审计|重审持续记录|阶段复裁|整改报告/.test(name);
};
function impactSourceLabel(s){
 if(s?.title)return s.title;
 if(s?.path)return s.path.split('/').pop();
 if(s?.document)return s.document;
 return ({LOCAL_FORMAL_DOCUMENT:'项目正式材料',HISTORICAL_WEB_SOURCE:'史料／研究来源'}[s?.kind]||'来源');
}
function impactSourceList(r,indices,labelText='本节依据'){
 const refs=r.impact?.source_refs||[];
 const selected=[...new Set((indices||[]).filter(Number.isInteger))].map(i=>refs[i]).filter(s=>s&&!impactAuditSource(s));
 if(!selected.length){
  const declared=(indices||[]).some(Number.isInteger);

const format=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function prose(t){if(Array.isArray(t))return t.length?t.map(prose).join(''):'';if(t&&typeof t==='object')return Object.entries(t).map(([k,v])=>`<div class="label">${esc(k)}</div>${prose(v)}`).join('');if(!t)return '';return String(t).split(/\n\s*\n/).map(block=>`<p class="prose">${format(block)}</p>`).join('')}
// Display names follow the profile contract, section 2.3. No prose-based classification.
const materialIntensityNames={MI1_CASE:'单一情境',MI2_LIFECYCLE:'完整生命周期情境',MI3_SUSTAINED_SYSTEMIC:'持续系统性情境',MI4_CROSS_PHASE_SYSTEMIC:'跨阶段系统性情境'};
const formalDirectionNames={POSITIVE:'正向',NEGATIVE:'负向',MIXED_POSITIVE:'混合偏正',MIXED_NEGATIVE:'混合偏负',MIXED:'正负混合',LIMITATION:'限制／边界'};
function nonEmptyFormal(value){
 if(Array.isArray(value))return value.length>0;
 if(value&&typeof value==='object')return Object.keys(value).length>0;
 return value!==null&&value!==undefined&&String(value).trim()!=='';
}
function contextDirection(c){
 if(!nonEmptyFormal(c?.direction))return '';
 const raw=String(c.direction);
 return Object.prototype.hasOwnProperty.call(formalDirectionNames,raw)?formalDirectionNames[raw]:raw;
}
function contextIntensityEntries(c){
 return ['intensity','material_intensity']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>[k,c[k]]);
}
function contextIntensity(c){
 const entries=contextIntensityEntries(c);
 if(!entries.length)return '未列';
 const rawValues=entries.map(([,v])=>String(v));
 if(rawValues.length>1&&rawValues.some(v=>v!==rawValues[0]))return '上游字段不一致，请查原始记录';
 const raw=rawValues[0];
 return Object.prototype.hasOwnProperty.call(materialIntensityNames,raw)
  ? materialIntensityNames[raw]
  : '未设中文展示，请查原始记录';
}
function formalMetaField(label,value,extraClass=''){
 if(!nonEmptyFormal(value))return '';
 return `<div class="formal-context-meta-row ${extraClass}"><strong>${esc(label)}</strong>${axisProse(value)}</div>`;
}
function formalContextMetadata(c,{showIntensity=true}={}){
 const direction=contextDirection(c);
 const intensityEntries=contextIntensityEntries(c);
 const attrs=['attribution','attribution_basis','role_attribution']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>c[k]);
 const limits=['limitations','limitation']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>c[k]);
 const parts=[];
 if(direction)parts.push(formalMetaField('正式方向',direction));
 if(showIntensity&&intensityEntries.length){
  parts.push(formalMetaField('材料强度',contextIntensity(c),'context-intensity'));
  const raw=intensityEntries.map(([k,v])=>`${k}=${typeof v==='string'?v:JSON.stringify(v)}`).join('；');
  parts.push(`<p class="subline formal-context-raw">正式字段：${esc(raw)}</p>`);
 }
 for(const value of attrs)parts.push(formalMetaField('归责',value));
 for(const value of limits)parts.push(formalMetaField('限制',value));
 return parts.length?`<div class="formal-context-meta">${parts.join('')}</div>`:'';
}
function formalContextSources(c){
 const refs=[...(c?.source_refs||[]),...(c?.cycle_anchor_refs||[]),...(c?.direct_process_refs||[])].filter(ref=>typeof ref==='string'&&ref);
 return [...new Set(refs)];
}

 return `<div class="context-story formal-context-story">${title}${formalContextMetadata(c,options)}${body?axisProse(body):''}${sources}</div>`;

function netPanel(r){
 const n=r.net;
 return `<section id="person-outcome" class="panel net"><div class="eyebrow">01 / 统治结果</div><h2>统治绩效</h2><p class="subline">按现行合同评价统治绩效</p>${n?`<div class="big">${number(n.total_score)}</div><span class="badge">统治绩效第 ${n.rank} 名 / ${DATA.ranked_count}</span>${[['治国净收益',n.second_item_score],['军事与边疆',n.third_item_score],['奠基与统一附加',n.first_item_add_on],['文明与国家整合',n.fourth_item_adjustment]].map(([k,v])=>`<div class="component"><span>${k}</span><b>${number(v)}</b></div>`).join('')}<p class="subline">分差不表示历史贡献的倍数，也不是百分制。</p><details><summary>总分口径与权重敏感性</summary><p>总分由上列四项构成。它包含合同规定的结果与过程分量，不是货币收益减成本；零分也不代表每个方面都没有收益或损害。</p><p>第一项${n.first_item_status==='APPLICABLE'?`原分为 ${number(n.first_item_raw_score)}，按公式折算为附加分 ${number(n.first_item_add_on)}；原分不再重复相加`:'不适用，附加分为0；不代表能力失败'}。</p><p class="subline">${esc(DATA.formula)}</p>${n.weight_sensitivity?.all_scenarios?`<p>固定现有裁决，在已声明的 ${DATA.weight_sensitivity.scenario_count} 种权重情景中，名次范围为第 ${n.weight_sensitivity.all_scenarios.best}—${n.weight_sensitivity.all_scenarios.worst} 名。</p><p class="subline">这是有限权重情景的结果，不是置信区间，也不包含史料或裁决不确定性。正式名次仍使用基准权重。</p>`:''}${link('docs/项目总纲/皇帝统治绩效评价合同.md','计分合同与情景设定 ↗')}</details>`:`<div class="big">—</div><p>${r.supplementary?'历史影响补充样本，不纳入此处统治绩效主池统计。':'未进入统治绩效总榜，不能按零分理解。'}</p><p class="subline">${esc(({PENDING_SECOND_ITEM_FORMAL_SETTLEMENT:'第二项正式结算待补',PENDING_THIRD_ITEM_FORMAL_SETTLEMENT:'第三项正式结算待补',PENDING_FIRST_ITEM_FORMAL_SETTLEMENT:'第一项正式结算待补',SUPPLEMENTARY:'历史影响池外补充样本'}[r.settlement_readiness]||r.settlement_readiness))}</p>`}<p class="sources">${link(DATA.sources.net_reader,'统治绩效完整依据 ↗')}</p></section>`;
}

function impactPanel(r){const h=r.impact;return `<section id="person-impact" class="panel impact"><div class="eyebrow">03 / 历史后效</div><h2>历史影响</h2><p class="subline">路径改变的规模、深度与归责</p><p class="subline">先看范围与深度定基础，再看本人归责；政治范式只作有限补充。</p><div class="big" style="color:var(--red)">${esc(h.public_grade)}</div><p>${esc(impactMeaning[h.public_grade]||'')}</p><span class="badge">${esc(h.impact_nature)}</span> <span class="subline">置信度 ${conf(h.confidence)}</span>${impactScaleNote()}<div class="dimensions">${Object.entries(dimNames).map(([k,n])=>`<div class="impact-dimension-card"><a href="#history-dimension-${k}" data-section="history-dimension-${k}" aria-label="查看${esc(n)}依据"><span>${esc(n)}</span><b>${esc(h.dimensions[k]?.grade||'—')}</b><small class="impact-dimension-question">${esc(impactDimensionQuestions[k]||'查看本维度依据')}</small><small>查看依据 ↓</small></a></div>`).join('')}</div>${gradeHelp('impact')}<p class="sources"><a href="#history-evidence" data-section="history-evidence">查看历史影响依据 ↓</a></p></section>`}

function axisEvidence(r,c,suffix=''){
 const a=r.axes[c],spec=DATA.axis_specs[c];if(!a)return '';
 const structuredCounter=a.counterpattern&&typeof a.counterpattern==='object'&&!Array.isArray(a.counterpattern);
 const formalMaterials=structuredCounter?contexts(a):representativeContexts(a);
 const counterText=!structuredCounter&&a.counterpattern?'<div class="label">反例与限制</div>'+axisProse(a.counterpattern):'';
 return `<details id="reason-${c}${suffix}" class="axis-evidence"><summary>${esc(spec.name)} <span class="badge">${grade(a)}</span></summary>${ungraded(a)?'<p class="notice">证据审查已结案，本轴不发布等级或分数；不表示能力低下。</p>':''}${pending(a)?'<p class="notice">本轴当前尚未完成裁决；历史保留值不作为现行等级或雷达值。</p>':''}<div class="label">正式记录中的人物表现</div>${axisProse(a.typical_pattern||a.not_applicable_reason||'本轴未另列人物表现，请展开裁决详情。')}${a.assessment_basis==='NO_DEMONSTRATED_CAPABILITY'?'<p class="notice">本轴E为终局证据认定：现有材料未显示外交能力。它与已证实外交失能的裁决分开，不表示史料已证明潜在能力为零。</p>':''}${a.applicability_basis?'<div class="label">适用范围</div>'+axisProse(a.applicability_basis):''}${formalMaterials}${publicEvidencePoints(a)}${counterText}<details class="metadata adjudication"><summary>裁决详情：定档、档内定位与限制</summary><div class="label">定档依据（原文）</div>${axisProse(a.grade_basis)}<div class="label">档内定位（原文）</div>${axisProse(a.position_basis)}<div class="label">限制与证据边界（原文）</div>${axisProse(a.limitations)}${axisProse(a.evidence_assessment_basis)}${a.no_grade_closure?`<div class="label">复查范围</div>${axisProse(a.no_grade_closure.review_scope)}<div class="label">证据缺口</div>${axisProse(a.no_grade_closure.evidence_gap)}<div class="label">重开条件</div>${axisProse(a.no_grade_closure.reopen_condition)}`:''}</details><details class="metadata"><summary>材料与正式记录</summary><p class="subline">${esc(mode(a.output_mode))} · 置信度 ${esc(conf(a.confidence))} · 材料级别 ${esc(a.axis_evidence_level||'未声明')} · ${c} ${ungraded(a)?'无档结案（不发布数值）':pending(a)?'历史保留值（不作当前等级）：':'正式档位：'}${esc(a.axis_grade||'')} ${esc(pos(a.position))} · ${pending(a)?'历史数值':'雷达投影'} ${a.radar_value??'无'}</p>${(a.source_refs||[]).map(ref=>/^(docs\/|config\/|archive\/|https?:\/\/)/.test(ref)?'<p class="sources">'+link(ref,ref)+'</p>':prose(ref)).join('')}<p class="sources">${link(spec.markdown,'本轴完整阅读页 ↗',r)}${link(spec.json+'#ruler_id='+r.ruler_id,'正式记录入口 ↗')}</p></details></details>`;
}

function person(r){
 nav('');if(!r){screen.innerHTML='<p>未找到该人物。</p><button data-home>返回人物总览</button>';return}
 screen.innerHTML=`<button class="back" data-home>← 人物总览</button><div class="person-head"><div><div class="eyebrow">${esc(r.polity)} / 三套评价</div><h1>${esc(personLabel(r))}</h1><p class="muted">掌权背景：${esc(r.actual_power_window||'未列')} ${r.supplementary?'<span class="scope-label">· 历史影响补充样本</span>':''}</p></div><button data-person-compare="${r.ruler_id}">选择另一人对照 →</button></div><p class="subline power-context-note">${esc(powerContextNote)}</p><nav class="person-nav" aria-label="人物页章节"><a href="#person-outcome" data-section="person-outcome">统治绩效概览</a><a href="#person-capability" data-section="person-capability">九轴画像</a><a href="#person-impact" data-section="person-impact">历史影响概览</a><a href="#person-evidence" data-section="person-evidence">展开依据</a></nav><div class="three overview-panels">${netPanel(r)}<section id="person-capability" class="panel profile"><div class="eyebrow">02 / 人物画像</div><h2>人物画像</h2><p class="subline">八轴能力与权力风格分别评价</p>${r.supplementary?'<p>不在本展示画像主池内。</p>':`<h3>八轴能力</h3><div class="compact-axes">${axisRows(r,DATA.capability_axes)}</div><div class="style-axis"><h3>权力运用风格</h3>${axisRows(r,DATA.independent_axes)}</div>`}${gradeHelp('profile')}<p class="sources"><a href="#profile-evidence" data-section="profile-evidence">查看表现、反例与限制 ↓</a></p></section>${impactPanel(r)}</div><section id="person-evidence" class="evidence reading-wide"><h2>结论背后的依据</h2><p class="muted">三套结论各自成立。按想了解的问题展开，不把同一字母当成相同尺度。</p>${r.net?`<section class="panel"><h3>统治绩效构成</h3>${netGroups(r)}</section>`:''}<section id="profile-evidence" class="panel evidence"><h2>人物画像依据</h2>${!r.supplementary?`<details><summary>查看八轴能力雷达</summary>${radar(r)}<p class="subline">E−在中心，S+在外缘，相邻等级等距。只展示能力结构；权力运用与克制不并入能力图，不按面积、均值或比例比较整体能力。</p></details>${DATA.axis_order.map(c=>axisEvidence(r,c)).join('')}`:'<p>该补充样本不在本展示画像主池内。</p>'}</section><section id="history-evidence" class="panel evidence">${historySections(r)}</section></section>`;
}

function compare(){
 nav('compare');if(state.compare.length<2){comparePicker();return}
 const [a,b]=state.compare.map(id=>byId.get(id));history.replaceState(null,'','#compare/'+state.compare.map(encodeURIComponent).join('/'));
 // Same grade does not mean same evidence. Keep every row, and only mark
 // comparable values for visual emphasis; narrative rows are never classified.
 const row=(label,fn,comparable=true)=>{const left=fn(a,0),right=fn(b,1);return `<tr${comparable?` data-compare-equal="${left===right}"`:''}><td>${label}</td><td>${left}</td><td>${right}</td></tr>`};
 const axisRow=c=>{const same=grade(a.axes[c])===grade(b.axes[c]);return `<tr data-compare-equal="${same}"><td>${esc(DATA.axis_specs[c].name)}${same?'<small class="compare-same-note">同档或同状态，依据分别保留</small>':''}</td>${[a,b].map((r,i)=>`<td>${r.axes[c]?axisEvidence(r,c,'-compare-'+i):'未覆盖'}</td>`).join('')}</tr>`};
 const section=label=>`<tr class="comparison-section"><th colspan="3">${label}</th></tr>`;
 screen.innerHTML=`<h1>同题对照，各读其因。</h1><p class="muted">按相同维度展开双方依据，保留不同起点、责任窗口与材料限制。</p><p class="subline power-context-note">${esc(powerContextNote)}</p><div class="compare-select">${[a,b].map((r,i)=>`<button data-replace-compare="${i}">${esc(personLabel(r))} · 更换</button>`).join('<span>与</span>')}<button data-swap-compare>交换左右</button></div><label class="difference-toggle"><input type="checkbox" id="differences" ${state.differences?'checked':''}>突出分数／等级差异</label><p class="subline">只突出数值、等级或状态不同的项目，不隐藏任何依据；同档不等于表现相同。</p><div class="table-wrap comparison-scroll"><table class="comparison"><thead><tr><th>阅读问题</th><th>${esc(personLabel(a))}</th><th>${esc(personLabel(b))}</th></tr></thead><tbody>${row('掌权背景（非统一取证期）',r=>esc(r.actual_power_window||'未列'))}${section('统治绩效')}${row('统治绩效',r=>r.net?`<b>${number(r.net.total_score)}</b> · 第 ${r.net.rank} 名`:'未入榜')}${[['治国净收益','second_item_score'],['军事与边疆','third_item_score'],['奠基与统一附加','first_item_add_on'],['文明与国家整合','fourth_item_adjustment']].map(([n,k])=>row(n,r=>number(r.net?.[k]))).join('')}${row('构成与依据',r=>r.net?`<details><summary>展开构成</summary>${netGroups(r)}</details>`:'本展示未覆盖',false)}${section('人物画像 · 八轴能力')}${DATA.capability_axes.map(axisRow).join('')}${section('人物画像 · 权力运用风格')}${DATA.independent_axes.map(axisRow).join('')}${section('历史影响')}${row('历史影响总档',r=>`<b class="impact-grade">${esc(r.impact.public_grade)}</b> · ${esc(r.impact.impact_nature)}`)}${section('历史影响 · 四维分项（与总等级不同尺，不取平均）')}${Object.entries(dimNames).map(([k,n])=>row(n,r=>esc(r.impact.dimensions[k]?.grade))).join('')}${row('量级置信度',r=>conf(r.impact.confidence))}${row('主链与归责依据',(r,i)=>`<details><summary>展开历史影响依据</summary>${historySections(r,`-compare-${i}`,true)}</details>`,false)}${row('继续阅读',r=>`<button data-person="${r.ruler_id}">查看${esc(personLabel(r))} →</button>`,false)}</tbody></table></div>${gradeHelp('profile')}${gradeHelp('impact')}`;
 const emphasize=()=>document.querySelector('.comparison')?.classList.toggle('emphasize-differences',state.differences);
 document.getElementById('differences').onchange=e=>{state.differences=e.target.checked;emphasize()};
 emphasize();
}

function guide(){nav('guide');screen.innerHTML=`<div class="eyebrow">Reading guide</div><h1>三个问题，一份人物理解。</h1><div class="three"><section class="panel net"><h2>01 看结果</h2><p>统治绩效评价实际结果、统治手段与可归责代价。先看总分，再看治国、军事、奠基附加与文明整合的构成。</p><p>仅有正式入榜资格的人物显示排名。未入榜、不适用与零分分别表达。</p></section><section class="panel profile"><h2>02 看人物画像</h2><p>八轴评价判断、联盟、组织、学习、用人与制度设计等能力。已裁能力从E−到S+分18级展示；待补证与待重裁分别标明，历史值不绘入雷达。M2终局未显示能力者发布E，范围说明随依据保留。逐轴看等级、反例与适用范围。</p><p>权力运用与克制是九轴画像中的独立行为风格项，与八个能力轴一起展示。雷达不计算面积得分，不生成全能指数。</p></section><section class="panel impact"><h2>03 看后效</h2><p>历史影响评价改变的范围、深度与持续、个人因果和政治范式。公众总档来自已裁结论。</p><p>正向、负向或混合性质单列。高影响可以伴随净损害。</p><p>阅读顺序：先看影响范围、深度与持续，再看本人归责；政治范式只作有限补充。</p>${impactScaleNote()}${impactTechnicalHelp()}</section></div><section class="panel evidence"><h2>结论不一致时，读什么？</h2><p>先看统治绩效的损益构成，再读能力轴的行为情境，最后检查历史影响的共同主链与反事实。一次行动可能有能力表现、实际成本和长期后效；来源相同不表示三个体系评价同一命题。</p><p>本阅读层展示已经裁定的事实和限制。尚未正式裁定的跨体系因果解释，不从字母或分数差自动生成。</p><p>主池 ${DATA.main_count} 人，统治绩效入榜 ${DATA.ranked_count} 人，历史影响另有 ${DATA.supplementary_count} 位补充样本；补充样本不加入主池统计。</p><p class="subline">这是离线交互设计样稿。展示数据来自构建时的正式结算；更新正式记录后重新构建阅读页。</p><p class="sources">${link('docs/项目总纲/皇帝综合评价体系合同.md','三体系总合同 ↗')}${link('config/project.yml','入口配置 ↗')}${link('docs/项目总纲/历史影响评价总则.md','历史影响合同 ↗')}${link('docs/项目总纲/皇帝人物画像评估体系合同.md','画像合同 ↗')}${link('docs/项目总纲/皇帝统治绩效评价合同.md','统治绩效合同 ↗')}</p></section>`;}
document.getElementById('home-nav').onclick=()=>go('#overview');document.getElementById('compare-nav').onclick=()=>go('#compare');document.getElementById('guide-nav').onclick=()=>go('#guide');
screen.addEventListener('click',e=>{const section=e.target.closest('[data-section]');if(section){e.preventDefault();document.getElementById(section.dataset.section)?.scrollIntoView({behavior:'smooth',block:'start'});return}const chain=e.target.closest('[data-chain]');if(chain){e.preventDefault();const target=document.getElementById('chain-'+chain.dataset.chain);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const reason=e.target.closest('[data-reason]');if(reason){e.preventDefault();const target=document.getElementById('reason-'+reason.dataset.reason);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-pick-compare')){const id=b.dataset.pickCompare;if(!state.compare.includes(id)){if(state.compareReplace===0)state.compare.unshift(id);else state.compare.push(id)}state.compareReplace=null;compare();return}if(b.hasAttribute('data-remove-compare')){state.compare=state.compare.filter(id=>id!==b.dataset.removeCompare);compare();return}if(b.hasAttribute('data-replace-compare')){state.compareReplace=Number(b.dataset.replaceCompare);state.compare=state.compare.filter((_,i)=>i!==state.compareReplace);history.replaceState(null,'','#compare');compare();return}if(b.hasAttribute('data-swap-compare')){state.compare.reverse();compare();return}if(b.hasAttribute('data-person'))go('#person/'+b.dataset.person);if(b.hasAttribute('data-home'))go('#overview');if(b.hasAttribute('data-person-compare')){const id=b.dataset.personCompare;state.compare=[id];state.compareReplace=null;go('#compare')}if(b.hasAttribute('data-select')){const id=b.dataset.select;if(state.compare.includes(id))state.compare=state.compare.filter(x=>x!==id);else if(state.compare.length<2)state.compare.push(id);else{document.getElementById('selection').textContent='已选两人，请先取消一人，或进入对照页替换。';return}renderRows()}});
function route(){const h=location.hash;if(h.startsWith('#person/'))person(byId.get(personId()));else if(h==='#compare')compare();else if(h.startsWith('#compare/')){let ids;try{ids=h.slice(9).split('/').map(decodeURIComponent)}catch{ids=[]}if(ids.length===2&&ids[0]!==ids[1]&&ids.every(id=>byId.has(id))){state.compare=ids;compare()}else{nav('compare');screen.innerHTML='<p>对照地址无效，请重新选择两位人物。</p><button data-home>返回人物总览</button>'}}else if(h==='#guide')guide();else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script></body></html>
