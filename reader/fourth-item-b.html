<main><h1>谁获得了学习与进身机会，谁又被挡在门外？</h1>
<p>这里看学校是否实际教学、谁能入学、学成后能否跨地域或身份进入新的岗位。制度名称、名臣数量和典籍体量本身不代替结果。先比较本人继承的状态，再看覆盖、持续性和限制；零分分别说明未确认独立变化、材料复核后不计分与正负相抵。</p>
<p>收录第四项现有全部 <span id="total">201</span> 条人物记录，按姓名排列。每人的实际主政时期和综合评价就绪状态分别标明；保留的单项记录不表示已进入综合评价池，也不据此另作排名。</p>

const DATA=JSON.parse(document.getElementById('fourth-b-data').textContent);
document.getElementById('entries').innerHTML=DATA.map(r=>`<article class="person" id="${esc(r.ruler_id)}"><h2>${esc(r.ruler_name)}</h2><p class="meta">${esc(r.polity)} · ${esc(r.pool_note)}</p>${FourthItemBReading.heading(r.item)}${FourthItemBReading.html(r.item,r)}</article>`).join('');
const entries=[...document.querySelectorAll('article.person')];document.getElementById('search').addEventListener('input',event=>{const q=event.target.value.trim();let count=0;for(const entry of entries){entry.hidden=q!==''&&!entry.textContent.includes(q);if(!entry.hidden)count++;}document.getElementById('count').textContent=count;});
if(location.hash){const entry=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(entry)entry.scrollIntoView();}
</script></body></html>
