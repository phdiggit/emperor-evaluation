<header><a href="index.html">帝王三镜</a> · <a href="index.html#guide">如何阅读</a></header>
<main><h1>哪些知识得到生产、保存和传播，哪些受到破坏？</h1>
<p>看统治者促成了哪些知识的创作、保存与传播，又给文化带来哪些损失。</p>
<label for="search">搜索人物、经历、史源或零值说明</label><input id="search" type="search" autocomplete="off"><p role="status">当前显示 <span id="count">__COUNT__</span> 人。<span id="location-note"></span></p>
<section id="entries" aria-label="知识生产与文化生态全池阅读"></section></main>
<script id="fourth-c-data" type="application/json">__PAYLOAD__</script>
<script src="source-links.js"></script><script src="fourth-item-reasons.js"></script>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(path,label){
  const url=ReaderSourceLinks.externalSource(path);
  return url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`:esc(ReaderSourceLinks.citationTitle(path,label));
}
</script><script src="fourth-item-c-public.js"></script><script>
const DATA=JSON.parse(document.getElementById('fourth-c-data').textContent);
document.getElementById('entries').innerHTML=DATA.map(r=>`<article class="person" id="${esc(r.ruler_id)}"><h2>${esc(r.display_name || r.ruler_name)}</h2><p class="meta">${esc(r.polity)} · ${esc(r.pool_note)}</p>${FourthItemCReading.heading(r.item,{collection:true})}${FourthItemCReading.html(r.item,r,{collection:true})}</article>`).join('');
ReaderCollectionSearch.bindCards([...document.querySelectorAll('article.person')],{
 bodyStart:'.fourth-c-public-reading',
 input:document.getElementById('search'),
 count:document.getElementById('count'),
 note:document.getElementById('location-note')
});
</script></body></html>
