/* Link affordance for pointer users: visible but deliberately quieter than buttons. */
#screen a {
  border-radius: 3px;
  text-decoration-thickness: 1px;
  text-underline-offset: .2em;
  text-decoration-color: color-mix(in srgb, currentColor 42%, transparent);
}

/* Buttons and disclosure headings share one restrained interaction language. */
header nav button,
#screen button,
#screen summary {
  transition: color .16s ease, background-color .16s ease, border-color .16s ease,
              box-shadow .16s ease, transform .16s ease;
}

#screen summary {
  border-radius: 4px;
  list-style: none;
  padding: 3px 28px 3px 5px;
  margin-left: -5px;
  position: relative;
}

#screen summary::-webkit-details-marker {
  display: none;
}

#screen summary::after {
  content: "›";
  position: absolute;
  right: 7px;
  top: 50%;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
  transform: translateY(-50%);
  transform-origin: 50% 50%;
  transition: color .16s ease, transform .18s ease;
}

#screen details[open] > summary::after {
  color: var(--red);
  transform: translateY(-50%) rotate(90deg);
}

/* Ruler names behave like textual entry points rather than generic controls. */
#screen td.name button {
  position: relative;
  border-radius: 2px;
  transition: color .16s ease, transform .16s ease;
}

#screen td.name button::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: -3px;
  height: 1px;
  background: currentColor;
  transition: right .18s ease;
}

/* Home-table cells are direct entry points into the matching person-page section. */
#screen .home-click-row,
#screen .home-jump-cell {
  transition: background-color .16s ease, box-shadow .16s ease;
}

#screen .home-jump-cell {
  cursor: pointer;
  position: relative;
}

#screen .home-jump-cell::after {
  content: "↗";
  position: absolute;
  right: 8px;
  top: 6px;
  color: var(--muted);
  font-size: 11px;
  opacity: 0;
  transform: translate(-2px, 2px);
  transition: opacity .16s ease, transform .16s ease, color .16s ease;
}

#screen .home-jump-cell:focus-visible,
#screen .impact-grade[data-home-grade]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: -3px;
}

#screen .inline-table-filter {
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--green);
  font-size: inherit;
  line-height: inherit;
}

#screen .impact-grade[data-home-grade] {
  cursor: pointer;
  border-radius: 3px;
  padding: 0 2px;
  margin-left: -2px;
  transition: color .16s ease, background-color .16s ease, box-shadow .16s ease;
}

@media (hover: hover) and (pointer: fine) {
  #screen a {
    background-image: linear-gradient(currentColor, currentColor);
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 0 1px;
    transition: color .16s ease, background-size .2s ease, background-color .16s ease, box-shadow .16s ease;
  }

  #screen a:hover {
    color: var(--red);
    background-size: 100% 1px;
    background-color: color-mix(in srgb, var(--gold) 9%, transparent);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--gold) 22%, transparent);
    text-decoration-color: transparent;
  }

  #screen .axis-row a:hover,
  #screen .compact-axis a:hover,
  #screen .person-nav a:hover {
    text-decoration: none;
  }

  #screen .person-nav a:hover {
    color: var(--ink);
    background-color: color-mix(in srgb, var(--gold) 13%, transparent);
    box-shadow: none;
  }

  header nav button:hover,
  #screen button:hover {
    transform: translateY(-1px);
    border-color: color-mix(in srgb, var(--gold) 58%, var(--line));
    background-color: color-mix(in srgb, var(--gold) 8%, transparent);
    box-shadow: 0 4px 10px color-mix(in srgb, var(--ink) 9%, transparent);
  }

  header nav button.active:hover,
  #screen button.primary:hover {
    background-color: color-mix(in srgb, var(--ink) 92%, var(--gold));
    border-color: var(--ink);
    color: white;
  }

  #screen .candidate-grid button:hover {
    background-color: color-mix(in srgb, var(--gold) 11%, #fcfbf7);
  }

  #screen td.name button:hover {
    color: var(--red);
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    transform: translateX(2px);
  }

  #screen td.name button:hover::after {
    right: 0;
  }

  #screen summary:hover {
    color: var(--red);
    background-color: color-mix(in srgb, var(--gold) 8%, transparent);
  }

  #screen summary:hover::after {
    color: var(--red);
  }

  #screen .home-click-row:hover {
    background-color: color-mix(in srgb, var(--gold) 3%, transparent);
  }

  #screen .home-jump-cell:hover {
    background-color: color-mix(in srgb, var(--gold) 9%, transparent);
    box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--gold) 34%, transparent);
  }

  #screen .home-jump-cell:hover::after {
    color: var(--red);
    opacity: .72;
    transform: translate(0, 0);
  }

  #screen .inline-table-filter:hover {
    color: var(--red);
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    transform: none;
    text-decoration: underline;
    text-underline-offset: .18em;
  }

  #screen .impact-grade[data-home-grade]:hover {
    color: color-mix(in srgb, var(--red) 88%, var(--ink));
    background-color: color-mix(in srgb, var(--red) 7%, transparent);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--red) 18%, transparent);
  }

  header nav button:active,
  #screen button:active {
    transform: translateY(0);
    box-shadow: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  #screen a,
  header nav button,
  #screen button,
  #screen summary,
  #screen summary::after,
  #screen td.name button,
  #screen td.name button::after,
  #screen .home-click-row,
  #screen .home-jump-cell,
  #screen .home-jump-cell::after,
  #screen .impact-grade[data-home-grade] {
    transition: none;
  }

  header nav button:hover,
  #screen button:hover,
  #screen td.name button:hover,
  #screen .home-jump-cell:hover::after {
    transform: none;
  }
}

function compareNetPublicLevel(item,key){

   const n=Object.prototype.hasOwnProperty.call(cn,raw)?cn[raw]:Number(raw);
   return isCost?(costs[n]||raw):(grades[n]||raw);

 }
 if(key==='civilization'){

 }
 return readerText(text);
}

const materialIntensityNames={MI1:'单一情境',MI1_CASE:'单一情境',MI2:'完整生命周期情境',MI2_LIFECYCLE:'完整生命周期情境',MI3:'持续系统性情境',MI3_SUSTAINED_SYSTEMIC:'持续系统性情境',MI4:'跨阶段系统性情境',MI4_CROSS_PHASE_SYSTEMIC:'跨阶段系统性情境'};

function nonEmptyFormal(value){

function contextIntensityEntries(c){

}
function contextIntensity(c){

 if(!entries.length)return '未列';
 const rawValues=entries.map(([,v])=>String(v));
 const publicValues=rawValues.map(value=>materialIntensityNames[value]||value);
 if(publicValues.length>1&&publicValues.some(value=>value!==publicValues[0]))return '上游字段不一致，请查原始记录';
 const raw=rawValues[0];
 return Object.prototype.hasOwnProperty.call(materialIntensityNames,raw)
  ? materialIntensityNames[raw]

}

const missingNetLabels={
 PENDING_SECOND_ITEM_FORMAL_SETTLEMENT:'治国成效待正式结算',

};
function missingNetLabel(r){
 if(r?.supplementary)return '不在本评价范围';
 return missingNetLabels[r?.settlement_readiness]||'未入榜';
}
function signedAdjustment(value){
 const n=Number(value);
 return Number.isFinite(n)&&n>0?'+'+number(n):number(value);
}
function firstRawScore(n){
 const value=n?.first_item_raw_score;
 return typeof value==='number'&&Number.isFinite(value)?value:null;
}
function firstAddOnValue(n){
 if(!n||n.first_item_status!=='APPLICABLE')return '—';
 return number(n.first_item_add_on);
}
function firstAddOnNote(n){
 if(!n)return '';
 if(n.first_item_status==='NOT_APPLICABLE')return '不适用；总分按0计入';
 if(n.first_item_status!=='APPLICABLE')return '正式状态未发布；阅读层不判断是否适用';
 if(firstRawScore(n)===0)return '本项适用，但未形成正向净收益';

}

function evidenceAssessment(n, expanded=false){
 const a=n?.evidence_assessment;if(!a)return '';
 const labels=`${esc(a.score_label)} · ${esc(a.rank_label)}`;
 const context=n?.governance_context;
 const scopeLine=context?`<small class="evidence-assessment">治理背景：${esc(context.scale_label)}／${esc(context.complexity_label)}（非计分）</small>`:'';
 const scopeDetail=context?`<p>治理规模／复杂度：${esc(context.scale_label)}／${esc(context.complexity_label)}。${esc(context.basis)}此栏仅说明本人窗口的治理对象，不改变正式分数或名次。</p>`:'';
 const prudent=n?.prudent_score_interval;
 const prudentLine=prudent?`<small class="evidence-assessment">现有史料审慎分数区间：${number(prudent.lower)}—${number(prudent.upper)}（非统计概率）</small>`:'';
 const projection=n?.prudent_rank_projection;
 const projectionText=projection?(projection.best===projection.worst?`第 ${projection.best} 名`:`第 ${projection.best}—${projection.worst} 名`):'';
 const projectionLine=projection?`<small class="evidence-assessment">审慎分位置投影：${projectionText}（其他人物正式分固定；非联合区间）</small>`:'';
 if(!expanded)return `${scopeLine}${prudentLine}${projectionLine}<small class="evidence-assessment">${labels}</small>`;
 const ranges=a.verified_score_range?`<p>已闭合情景分数范围：${a.verified_score_range.map(number).join('—')}；名次范围：${a.verified_rank_range.join('—')}。</p>`:'';
 const prudentDetails=prudent?`<p>现有史料审慎分数区间：${number(prudent.lower)}—${number(prudent.upper)}。${esc(prudent.basis)}</p>${prudent.cost_review?`<p>军事成本：现${esc(prudent.cost_review.current_grade)}，复核上端${esc(prudent.cost_review.candidate_max_grade)}；${esc(prudent.cost_review.review_gate)}</p><p>现档依据：${esc(prudent.cost_review.current_cost_basis)}</p>`:''}`:'';
 const projectionDetails=projection?`<p>审慎分位置投影：${projectionText}。${esc(projection.basis)}</p>`:'';
 const prudentAxes=(prudent?.axis_reviews||[]).map(x=>`<p>${esc(x.axis)}：现${esc(x.current_grade)}／${esc(x.current_loss_grade)}；本轮合法端点：${x.allowed_endpoints.map(esc).join('、')}。${esc(x.endpoint_rule)}；${esc(x.review_gate)}</p>`).join('');
 const prudentLinks=(prudent?.linked_reviews||[]).map(x=>`<h4>${esc(x.question)}</h4><p>单命题条件分差：${x.conditional_delta_range.map(number).join('—')}。${esc(x.basis)}</p>`).join('');
 const issues=(a.public_issues||[]).map(x=>`<h4>${esc(x.question)}</h4><p>${esc(x.basis)}</p><p>限制：${esc(x.limitations)}</p>`).join('');
 const alternatives=(a.supported_alternatives||[]).map(x=>`<h4>${esc(x.question)}</h4><p>此解释下：${number(x.total_score)}分（分差 ${x.delta>=0?'+':''}${number(x.delta)}），第${x.rank}名。</p><p>${esc(x.public_basis)}</p><p>限制：${esc(x.public_limitations)}</p>`).join('');
 return `${scopeLine}<details class="evidence-assessment"><summary>${labels}</summary>${scopeDetail}${prudentDetails}${projectionDetails}${prudentAxes}${prudentLinks}<p>${esc(a.public_basis)}</p>${ranges}${alternatives}${issues}</details>`;
}

 if(!review)return '';
 const fields=[['本人归责','attribution'],['反馈','feedback'],['恢复','recovery'],['残余损失','residual_loss'],['裁决','decision_basis']];
 return `<details class="metadata"><summary>军事失败与恢复复核</summary>${axisProse(review.basis)}${review.cases.map(item=>`<section><h4>${esc(item.label)}</h4><p class="subline">${item.negative_tier?'本人负向后果档：'+esc(item.negative_tier):'未单列纯负档；按已登记的实际损害复核'}</p>${axisProse(item.consequence)}${fields.map(([label,key])=>`<div class="label">${label}</div>${axisProse(item[key])}`).join('')}</section>`).join('')}</details>`;
}
function axisEvidenceScope(a,c){
 if(c!=='M1')return {coverage:readerText(a.axis_evidence_level||''),modeLabel:mode(a.output_mode),detail:''};
 const scope=a.evidence_scope;
 if(!scope)return {coverage:'',modeLabel:'正式证据说明尚未载入',detail:''};
 return {coverage:scope.material_coverage_label,modeLabel:scope.conclusion_mode_label,detail:'<div class="label">材料底池与本人能力证据</div>'+axisProse(scope.material_coverage_basis)+axisProse(scope.ability_evidence_label)+axisProse(scope.attribution_boundary)+axisProse(scope.confidence_basis)+axisProse(scope.grade_boundary)};
}
function axisEvidence(r,c,suffix=''){
 const a=r.axes[c],spec=DATA.axis_specs[c];if(!a)return '';
 const evidenceScope=axisEvidenceScope(a,c),evidenceLevel=evidenceScope.coverage;
 const structuredCounter=a.counterpattern&&typeof a.counterpattern==='object'&&!Array.isArray(a.counterpattern);
 const formalMaterials=structuredCounter?contexts(a):representativeContexts(a);
 const counterText=!structuredCounter&&a.counterpattern?'<div class="label">反例与限制</div>'+axisProse(a.counterpattern):'';
 const further=`${evidenceScope.detail}${m1FailureReview(a)}${formalMaterials}${publicEvidencePoints(a)}${counterText}<details class="metadata adjudication"><summary>裁决详情：定档、档内定位与限制</summary><div class="label">定档依据（原文）</div>${axisProse(a.grade_basis)}<div class="label">档内定位（原文）</div>${axisProse(a.position_basis)}<div class="label">限制与证据边界（原文）</div>${axisProse(a.limitations)}${axisProse(a.evidence_assessment_basis)}${a.no_grade_closure?`<div class="label">复查范围</div>${axisProse(a.no_grade_closure.review_scope)}<div class="label">证据缺口</div>${axisProse(a.no_grade_closure.evidence_gap)}<div class="label">重开条件</div>${axisProse(a.no_grade_closure.reopen_condition)}`:''}</details>`;
 return `<details id="reason-${c}${suffix}" class="axis-evidence"><summary>${esc(spec.name)} <span class="badge">${grade(a)}</span>${evidenceLevel?'<small class="axis-evidence-level">材料覆盖：'+esc(evidenceLevel)+'</small>':''}</summary>${ungraded(a)?'<p class="notice">证据审查已结案，本轴不发布等级或分数；不表示能力低下。</p>':''}${pending(a)?'<p class="notice">本轴当前尚未完成裁决；历史保留值不作为现行等级或雷达值。</p>':''}<div class="label">这个判断主要依据什么表现？</div>${axisProse(a.typical_pattern||a.not_applicable_reason||'本轴未另列人物表现，请展开裁决详情。')}${a.assessment_basis==='NO_DEMONSTRATED_CAPABILITY'?'<p class="notice">本轴E为终局证据认定：现有材料未显示外交能力。它与已证实外交失能的裁决分开，不表示史料已证明潜在能力为零。</p>':''}${a.applicability_basis?'<div class="label">适用范围</div>'+axisProse(a.applicability_basis):''}<details class="axis-further-check"><summary>进一步核对：代表情境、反例与限制</summary>${further}</details><details class="metadata"><summary>原始记录与专业信息</summary><p class="subline">展示模式：${esc(evidenceScope.modeLabel)} · 判断把握：${esc(conf(a.confidence))}${evidenceLevel?' · 材料覆盖：'+esc(evidenceLevel):''} · ${ungraded(a)?'当前状态：无档结案':pending(a)?'当前状态：'+grade(a):a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?'当前状态：不适用':'公开等级：'+grade(a)}</p>${[...new Set([...(a.source_refs||[]),...(a.evidence_scope?.source_refs||[])])].map(ref=>/^(docs\/|config\/|archive\/|https?:\/\/)/.test(ref)?'<p class="sources">'+link(ref,ref)+'</p>':prose(ref)).join('')}<p class="sources">${link(spec.markdown,'本轴完整阅读页 ↗',r)}${link(spec.json+'#ruler_id='+r.ruler_id,'正式记录入口 ↗')}</p></details></details>`;
}

function compare(){
 nav('compare');if(state.compare.length<2){comparePicker();return}
 const [a,b]=state.compare.map(id=>byId.get(id));history.replaceState(null,'','#compare/'+state.compare.map(encodeURIComponent).join('/'));
 const missingNetLabel=r=>r?.supplementary?'不在本评价范围':({
   PENDING_SECOND_ITEM_FORMAL_SETTLEMENT:'治国成效待正式结算',
   PENDING_THIRD_ITEM_FORMAL_SETTLEMENT:'军事与边疆待正式结算',
   PENDING_FIRST_ITEM_FORMAL_SETTLEMENT:'奠基与统一待正式结算',
   SUPPLEMENTARY:'不在本评价范围'
 }[r?.settlement_readiness]||'未入榜');
 const firstRawScore=n=>{const value=n?.first_item_raw_score;return typeof value==='number'&&Number.isFinite(value)?value:null};
 const compareFirstAddOn=r=>!r?.net?'—':r.net.first_item_status==='NOT_APPLICABLE'?'不适用':r.net.first_item_status!=='APPLICABLE'?'状态未发布':firstRawScore(r.net)===0?'0.00 · 本项适用':number(r.net.first_item_add_on);
 const signedAdjustment=value=>{const n=Number(value);return Number.isFinite(n)&&n>0?'+'+number(n):number(value);};
 // Same grade does not mean same evidence. Keep every row, and only mark
 // comparable values for visual emphasis; narrative rows are never classified.
 const row=(label,fn,comparable=true)=>{const left=fn(a,0),right=fn(b,1);return `<tr${comparable?` data-compare-equal="${left===right}"`:''}><td>${label}</td><td>${left}</td><td>${right}</td></tr>`};
 const axisRow=c=>{const same=grade(a.axes[c])===grade(b.axes[c]);return `<tr data-compare-equal="${same}"><td>${esc(DATA.axis_specs[c].name)}${c==='C5'?'<small class="c5-inline-hint">S端＝更克制</small>':''}${same?'<small class="compare-same-note">同档或同状态，依据分别保留</small>':''}</td>${[a,b].map((r,i)=>`<td>${r.axes[c]?axisEvidence(r,c,'-compare-'+i):'未覆盖'}</td>`).join('')}</tr>`};
 const section=label=>`<tr class="comparison-section"><th colspan="3">${label}</th></tr>`;
 screen.innerHTML=`<h1>同题对照，各读其因。</h1><p class="muted">按相同维度并排阅读双方结论和依据，同时保留各自的历史起点、实际掌权时期与材料限制。</p><p class="subline power-context-note">${esc(powerContextNote)}</p><div class="compare-select">${[a,b].map((r,i)=>`<button data-replace-compare="${i}">${esc(personLabel(r))} · 更换</button>`).join('<span>与</span>')}<button data-swap-compare>交换左右</button></div><label class="difference-toggle"><input type="checkbox" id="differences" ${state.differences?'checked':''}>突出分数／等级差异</label><p class="subline">只突出数值、等级或状态不同的项目，不隐藏任何依据；同档不等于表现相同。</p><div class="table-wrap comparison-scroll"><table class="comparison"><thead><tr><th>阅读问题</th><th>${esc(personLabel(a))}</th><th>${esc(personLabel(b))}</th></tr></thead><tbody>${row('掌权背景（各项范围另见依据）',r=>esc(r.actual_power_window||'未列'))}${section('统治绩效')}${row('统治绩效',r=>r.net?`<b>${number(r.net.total_score)}</b> · 第 ${r.net.rank} 名${evidenceAssessment(r.net)}`:esc(missingNetLabel(r)))}${row('治国成效',r=>number(r.net?.second_item_score))}${row('军事与边疆',r=>number(r.net?.third_item_score))}${row('奠基与统一附加',r=>compareFirstAddOn(r))}${row('文明与国家整合',r=>r.net?signedAdjustment(r.net.fourth_item_adjustment):'—')}${row('分项构成',r=>r.net?`<details><summary>展开分项</summary>${netGroups(r)}</details>`:esc(missingNetLabel(r)),false)}${section('人物画像 · 八轴能力')}${DATA.capability_axes.map(axisRow).join('')}${section('人物画像 · 权力运用风格')}${DATA.independent_axes.map(axisRow).join('')}${section('历史影响')}${row('历史影响等级',r=>`<b class="impact-grade">${esc(r.impact.public_grade)}</b> · ${esc(r.impact.impact_nature)}`)}${section('历史影响 · 四维分项（与总等级不同尺，不取平均）')}${Object.entries(dimNames).map(([k,n])=>row(n,r=>esc(r.impact.dimensions[k]?.grade))).join('')}${row('判断把握',r=>conf(r.impact.confidence))}${row('主链与归责依据',(r,i)=>`<details><summary>展开历史影响详情</summary>${historySections(r,`-compare-${i}`,true)}</details>`,false)}${row('继续阅读',r=>`<button data-person="${r.ruler_id}">查看${esc(personLabel(r))} →</button>`,false)}</tbody></table></div>${gradeHelp('profile')}${gradeHelp('impact')}`;
 const emphasize=()=>document.querySelector('.comparison')?.classList.toggle('emphasize-differences',state.differences);
 document.getElementById('differences').onchange=e=>{state.differences=e.target.checked;emphasize()};
 emphasize();
}

function guide(){nav('guide');screen.innerHTML=`<div class="eyebrow">阅读指南</div><h1>三个问题，一份人物理解。</h1><section class="panel guide-quick"><h2>30秒读懂</h2><div class="guide-quick-grid"><div><strong>看结果</strong><p>统治绩效看实际做成了什么，也把可归责代价算进去。</p></div><div><strong>看怎么做事</strong><p>人物画像看面对问题时如何判断、组织、用人和行动。</p></div><div><strong>看留下什么</strong><p>历史影响看本人退出后，改变了多大范围，又持续了多久。</p></div><div><strong>三者可以不一致</strong><p>能力强不保证结果一定好；影响很大也不等于影响一定正面。</p></div></div></section><details class="guide-more"><summary>继续看详细口径与边界</summary><div class="three"><section class="panel net"><h2>01 看结果</h2><p>统治绩效评价实际结果、统治手段与可归责代价。先看总分，再看治国、军事、奠基附加与文明整合的构成。</p><p>仅有正式入榜资格的人物显示排名。未入榜、不适用与零分分别表达。</p></section><section class="panel profile"><h2>02 看人物画像</h2><p>八轴分别观察军事、外交、联盟、组织、判断、学习、用人与制度设计等能力。已完成裁决的能力从E−到S+分18级展示；证据不足、待补证、待重裁或不适用都会单独标明，不会自动按低等级处理。逐轴可查看等级、主要表现、反例与适用范围。</p><p>权力运用与克制单独描述掌权者使用权力的方式，不当作能力高低。雷达只帮助观察八项能力的结构差异，不计算面积得分，也不生成“全能指数”。</p></section><section class="panel impact"><h2>03 看后效</h2><p>历史影响评价一个人改变历史路径的范围、深度与持续时间，以及其中有多少能够归于本人。历史影响等级直接读取正式裁决，不由其他分数换算。</p><p>正向、负向或混合性质单列。高影响可以伴随净损害。</p><p>阅读顺序：先看影响范围、深度与持续，再看本人归责；政治范式只作有限补充。</p>${impactScaleNote()}${impactTechnicalHelp()}</section></div><section class="panel evidence"><h2>结论不一致时，读什么？</h2><p>先看统治绩效的构成与依据，再读能力轴的行为情境，最后检查历史影响的共同主链与反事实。一次行动可能有能力表现、实际成本和长期后效；来源相同不表示三个体系评价同一命题。</p><p>本阅读层只整理已经正式裁定的结论、依据和限制，不会根据字母或分数差自动给人物贴额外标签。</p><p><strong>材料标签怎样读？</strong> “材料强度”描述情境的持续性、作用范围和机制化程度；“来源覆盖”描述公开证据包的来源是否足够，两者不是同一尺度，也都不表示正负方向、能力高低或得分。只有正式记录明确发布相应字段时页面才展示；没有这类标签只表示上游没有发布，不等于证据弱，页面也不会自行补判。</p><p>正式评价对象 ${DATA.main_count} 人，统治绩效入榜 ${DATA.ranked_count} 人；历史影响另有 ${DATA.supplementary_count} 位补充历史样本，不计入正式评价对象统计。</p><p class="subline">本站是正式结算数据的只读阅读层；正式记录更新后，页面随之重建。</p><p class="sources">${link('docs/项目总纲/皇帝综合评价体系合同.md','三体系总合同 ↗')}${link('config/project.yml','入口配置 ↗')}${link('docs/项目总纲/历史影响评价总则.md','历史影响合同 ↗')}${link('docs/项目总纲/皇帝人物画像评估体系合同.md','画像合同 ↗')}${link('docs/项目总纲/皇帝统治绩效评价合同.md','统治绩效合同 ↗')}</p></section></details>`;}
document.getElementById('home-nav').onclick=()=>go('#overview');document.getElementById('compare-nav').onclick=()=>go('#compare');document.getElementById('guide-nav').onclick=()=>go('#guide');
screen.addEventListener('click',e=>{const section=e.target.closest('[data-section]');if(section){e.preventDefault();document.getElementById(section.dataset.section)?.scrollIntoView({behavior:'smooth',block:'start'});return}const chain=e.target.closest('[data-chain]');if(chain){e.preventDefault();const target=document.getElementById('chain-'+chain.dataset.chain);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const reason=e.target.closest('[data-reason]');if(reason){e.preventDefault();const target=document.getElementById('reason-'+reason.dataset.reason);if(target){target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}return}const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-pick-compare')){const id=b.dataset.pickCompare;if(!state.compare.includes(id)){if(state.compareReplace===0)state.compare.unshift(id);else state.compare.push(id)}state.compareReplace=null;compare();return}if(b.hasAttribute('data-remove-compare')){state.compare=state.compare.filter(id=>id!==b.dataset.removeCompare);compare();return}if(b.hasAttribute('data-replace-compare')){state.compareReplace=Number(b.dataset.replaceCompare);state.compare=state.compare.filter((_,i)=>i!==state.compareReplace);history.replaceState(null,'','#compare');compare();return}if(b.hasAttribute('data-swap-compare')){state.compare.reverse();compare();return}if(b.hasAttribute('data-person'))go('#person/'+b.dataset.person);if(b.hasAttribute('data-home'))go('#overview');if(b.hasAttribute('data-person-compare')){const id=b.dataset.personCompare;state.compare=[id];state.compareReplace=null;go('#compare')}if(b.hasAttribute('data-select')){const id=b.dataset.select;if(state.compare.includes(id))state.compare=state.compare.filter(x=>x!==id);else if(state.compare.length<2)state.compare.push(id);else{document.getElementById('selection').textContent='已选两人，请先取消一人，或进入对照页替换。';return}renderRows()}});
function route(){const h=location.hash;if(h.startsWith('#person/'))person(byId.get(personId()));else if(h==='#compare')compare();else if(h.startsWith('#compare/')){let ids;try{ids=h.slice(9).split('/').map(decodeURIComponent)}catch{ids=[]}if(ids.length===2&&ids[0]!==ids[1]&&ids.every(id=>byId.has(id))){state.compare=ids;compare()}else{nav('compare');screen.innerHTML='<p>对照地址无效，请重新选择两位人物。</p><button data-home>返回人物总览</button>'}}else if(h==='#guide')guide();else home();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();

    MAJOR_CIVILIZATIONAL_CORRECTION:"重大纠偏",
    STRUCTURAL_NON_DURABLE:"核心结构",
    DURABILITY_EVIDENCE_PENDING:"耐久性待核",
  };
  let scheduled = false;

  function finite(value) {
    if (value == null || value === "") return null;
    const n = Number(value);
    return Number.isFinite(n) ? n : null;
  }

  function fmt(value, digits = 1) {
    const n = finite(value);
    return n == null ? "—" : n.toFixed(digits);
  }

  function personRecord() {
    if (typeof byId === "undefined") return null;
    const match = location.hash.match(/^#person\/([^/?#]+)/);
    if (!match) return null;
    try { return byId.get(decodeURIComponent(match[1])) || null; } catch { return null; }
  }

  function netRecord() {
    if (typeof byId === "undefined") return null;
    const match = location.hash.match(/^#net\/([^/?#]+)/);
    if (!match) return null;
    try { return byId.get(decodeURIComponent(match[1])) || null; } catch { return null; }
  }

  function compareRecords() {
    if (typeof byId === "undefined" || !location.hash.startsWith("#compare/")) return [];
    return location.hash.slice(9).split("/").filter(Boolean).slice(0, 2).map(id => {
      try { return byId.get(decodeURIComponent(id)) || null; } catch { return null; }
    }).filter(Boolean);
  }

  function itemMap(record, key) {
    return new Map((record?.net?.component_details?.[key] || []).map(item => [item.label, item]));
  }

  function secondItems(record) {
    const result = new Map();
    for (const key of SECOND_GROUPS) {
      for (const item of record?.net?.component_details?.[key] || []) result.set(item.label, item);
    }
    return result;
  }

  function secondTotals(record) {
    const method = itemMap(record, "method");
    const finance = itemMap(record, "finance");
    const handoff = itemMap(record, "handoff");
    return {
      method: finite(method.get("治理手段")?.value),
      finance: finite(finance.get("治理结果")?.value),
      handoff: finite(handoff.get("交接得分")?.value),
      total: finite(record?.net?.second_item_score ?? handoff.get("第二项合计")?.value),
    };
  }

  function positionSuffix(text) {
    const lower = String(text || "").toLowerCase();
    if (/lower|low/.test(lower)) return "-";
    if (/upper|high/.test(lower)) return "+";
    return "";
  }

  function publicMethodGrade(item) {
    const text = String(item?.grade || "");
    const band = text.match(/\bG([0-5])\b/i);
    if (!band) return "";
    return `${PUBLIC_GRADE[`G${band[1]}`] || ""}${positionSuffix(text)}`;
  }

  function stateGradeMeta(item) {
    const match = String(item?.grade || "").match(/\bC[123]-(\d)\s*\/\s*L([0-3])\b/i);
    if (!match) return null;
    const band = Number(match[1]);
    const loss = Number(match[2]);
    return {grade:STATE_GRADE[band] || "",lossText:LOSS_TEXT[loss] || ""};
  }

  function publicHandoffGrade(item) {
    const level = Number(item?.value);
    return Number.isInteger(level) ? HANDOFF_GRADE[level] || "" : "";
  }

  function boundaryExcerpt(item) {
    const text = String(item?.reader_boundary || "").trim();
    if (!text) return "";
    return "适用范围与限制见展开说明";
  }

  // The public layer owns these text nodes. The structural renderer respects
  // the data-public-* markers instead of restoring its intermediate copy.
  // Write real text: CSS generated content is not a replacement for readable DOM.
  function setPublicText(node, text, key, className) {
    if (!node || !text) return;
    node.classList.add(className);
    if (node.dataset[key] !== text) node.dataset[key] = text;
    if (node.textContent !== text) node.textContent = text;
  }

  function writePublicCopy(node, text) {
    setPublicText(node, text, "publicCopy", "second-item-public-copy");
  }

  function writePublicScore(node, text) {
    setPublicText(node, text, "publicScore", "second-item-public-score");
  }

  function setPublicGrade(span, valueNode, grade, noteParts) {
    if (!span || !grade) return;
    const note = noteParts.filter(Boolean).join("｜");
    span.classList.add("second-item-public-grade-ready");
    if (span.dataset.publicGradeNote !== note) span.dataset.publicGradeNote = note;
    let noteNode = span.querySelector(":scope > .second-item-scale-note");
    if (!noteNode) {
      noteNode = document.createElement("small");
      noteNode.className = "second-item-scale-note";
      span.append(noteNode);
    }
    if (noteNode.textContent !== note) noteNode.textContent = note;
    setPublicText(valueNode, grade, "publicValue", "second-item-public-value");
  }

  function patchMethodGrades(root, record) {
    if (!root || !record?.net) return;
    const items = itemMap(record, "method");
    if (!items.size) return;
    for (const detail of root.querySelectorAll(".net-metric-detail[data-second-source-label]")) {
      const sourceLabel = detail.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const grade = publicMethodGrade(item);
      if (!item || !grade || !METHOD_MAX[sourceLabel]) continue;
      const summary = detail.querySelector(":scope > summary");
      setPublicGrade(summary?.querySelector(":scope > span"), summary?.querySelector(":scope > b"), grade,
        [`原始表现指数 ${Number(item.value).toFixed(1)} / ${METHOD_MAX[sourceLabel]}（合成输入，不单独加分）`, boundaryExcerpt(item)]);
    }
    for (const span of root.querySelectorAll(".component > span[data-second-source-label]")) {
      const sourceLabel = span.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const grade = publicMethodGrade(item);
      if (!item || !grade || !METHOD_MAX[sourceLabel]) continue;
      setPublicGrade(span, span.parentElement?.querySelector(":scope > b"), grade,
        [`原始表现指数 ${Number(item.value).toFixed(1)} / ${METHOD_MAX[sourceLabel]}（合成输入，不单独加分）`, boundaryExcerpt(item)]);
    }
  }

  function patchFinanceGrades(root, record) {
    if (!root || !record?.net) return;
    const items = itemMap(record, "finance");
    if (!items.size) return;
    for (const detail of root.querySelectorAll(".net-metric-detail[data-second-source-label]")) {
      const sourceLabel = detail.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const meta = stateGradeMeta(item);
      if (!item || !meta?.grade || !FINANCE_MAX[sourceLabel]) continue;
      const summary = detail.querySelector(":scope > summary");
      setPublicGrade(summary?.querySelector(":scope > span"), summary?.querySelector(":scope > b"), meta.grade,
        [`结算分 ${Number(item.value).toFixed(1)}`, meta.lossText, boundaryExcerpt(item)]);
    }
    for (const span of root.querySelectorAll(".component > span[data-second-source-label]")) {
      const sourceLabel = span.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const meta = stateGradeMeta(item);
      if (!item || !meta?.grade || !FINANCE_MAX[sourceLabel]) continue;
      setPublicGrade(span, span.parentElement?.querySelector(":scope > b"), meta.grade,
        [`结算分 ${Number(item.value).toFixed(1)}`, meta.lossText, boundaryExcerpt(item)]);
    }
  }

  function patchHandoffGrades(root, record) {
    if (!root || !record?.net) return;
    const items = itemMap(record, "handoff");
    if (!items.size) return;
    for (const detail of root.querySelectorAll(".net-metric-detail[data-second-source-label]")) {
      const sourceLabel = detail.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const grade = publicHandoffGrade(item);
      if (!item || !grade || !HANDOFF_LABELS[sourceLabel]) continue;
      const summary = detail.querySelector(":scope > summary");
      setPublicGrade(summary?.querySelector(":scope > span"), summary?.querySelector(":scope > b"), grade,
        [HANDOFF_LABELS[sourceLabel], boundaryExcerpt(item)]);
    }
    for (const span of root.querySelectorAll(".component > span[data-second-source-label]")) {
      const sourceLabel = span.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const grade = publicHandoffGrade(item);
      if (!item || !grade || !HANDOFF_LABELS[sourceLabel]) continue;
      setPublicGrade(span, span.parentElement?.querySelector(":scope > b"), grade,
        [HANDOFF_LABELS[sourceLabel], boundaryExcerpt(item)]);
    }
  }

  function patchGradeGroups(root, record) {
    patchMethodGrades(root, record);
    patchFinanceGrades(root, record);
    patchHandoffGrades(root, record);
  }

  function publicEnumText(value) {
    let text = String(value ?? "").trim();
    for (const [from, to] of Object.entries(PUBLIC_ITEM_LABELS)) text = text.replaceAll(from, to);
    for (const [from, to] of Object.entries(PUBLIC_ROLE_LABELS)) text = text.replace(new RegExp("\\b" + from + "\\b", "g"), to);
    text = text
      .replace(/(?:现有材料|现材料|现有证据)?\s*未(?:独立)?闭合\s*R4/gi, "现有证据尚未证明跨朝代长期接收")
      .replace(/(?:现有材料|现材料|现有证据)?\s*未(?:独立)?闭合\s*R3/gi, "现有证据尚未证明被多个后继统治阶段持续采用")
      .replace(/闭合\s*R4/gi, "已证明跨朝代长期接收")
      .replace(/闭合\s*R3/gi, "已证明被多个后继统治阶段持续采用")
      .replace(/R3\s*\/\s*R4/gi, "长期接收")
      .replace(/R3\s*门(?:槛)?/gi, "长期接收门槛")
      .replace(/\bR4\b/gi, "跨朝代长期接收")
      .replace(/\bR3\b/gi, "被多个后继统治阶段持续采用")
      .replace(/\bR[12]\b/gi, "后世接收范围有限")
      .replace(/\bR0\b/gi, "本人任内运行证据")
      .replace(/\bG([0-5])\s*[-/]\s*([A-Za-z-]+)\b/gi, (_, band, position) => `${PUBLIC_GRADE[`G${band}`] || ""}${positionSuffix(position)}`)
      .replace(/\bG([0-5])\b/g, (_, band) => PUBLIC_GRADE[`G${band}`] || band)
      .replace(/\bC[123]-([1-6])\s*\/\s*L([0-3])\b/g, (_, band, loss) => `${STATE_GRADE[Number(band)] || band}档；${LOSS_TEXT[Number(loss)] || ""}`)
      .replace(/\bC[123]-([1-6])\b/g, (_, band) => `${STATE_GRADE[Number(band)] || band}档`)
      .replace(/\bD3-([0-5])\b/g, (_, level) => `${HANDOFF_GRADE[Number(level)] || level}档`)
      .replace(/\bH([0-5])\b/g, (_, level) => `${HANDOFF_GRADE[Number(level)] || level}档`)
      .replace(/\bL([0-3])\b/g, (_, level) => LOSS_TEXT[Number(level)] || "");
    return text.trim();
  }

  function publicTechnicalText(value) {
    return publicEnumText(value)
      .replace(/正式方向指数/g, "原始表现指数")
      .replace(/方向指数/g, "原始表现指数");
  }

  function publicFinanceText(value) {
    return publicEnumText(value)
      .replace(/第?([一二三四五六1-6])档/g, (_, level) => `${FINANCE_ORDINAL_GRADE[level] || level}档`);
  }

  function publicCalculationText(value) {
    let text = publicTechnicalText(value);
    for (const [from, to] of Object.entries(SECOND_CALC_LABELS)) text = text.replaceAll(from, to);
    return text;
  }

  // Only contract-defined enum labels are translated. Sentences, negation,
  // responsibility and boundaries are otherwise preserved verbatim.
  function publicText(value) {
    return publicEnumText(value);
  }

  const FINANCE_BASE_SCORES = {
    "C1民生": {1:5.7,2:17.1,3:32.0,4:54.9,5:74.3,6:80.0},
    "C2经济财政": {1:1.8,2:7.0,3:14.9,4:23.6,5:29.8,6:35.0},
    "C3社会安全": {1:5.0,2:16.0,3:28.0,4:40.0,5:52.0,6:60.0},
  };
  const FINANCE_LOSS_RATE = {0:0,1:0.03,2:0.07,3:0.12};

  function secondMethodExpandedHow(label) {
    const record = netRecord() || personRecord();
    const method = itemMap(record, "method");
    if (!method.size) return "";
    if (label === "A制度建设" || label === "B1官僚治理") {
      const a = finite(method.get("A制度建设")?.value);
      const b1 = finite(method.get("B1官僚治理")?.value);
      const ab = finite(method.get("AB计分块")?.value);
      if (a == null || b1 == null || ab == null) return "";
      const high = Math.max(a, b1);
      const low = Math.min(a, b1);
      return `制度建设与官僚治理不各自直接加分，而是组成同一主块：0.8 × [较高表现指数 ${fmt(high)} + 0.5 × 较低表现指数 ${fmt(low)}] = ${fmt(ab)} 分。`;
    }
    if (label === "B2反馈与约束") {
      const b2 = finite(method.get("B2反馈与约束")?.value);
      const converted = finite(method.get("B2折算")?.value);
      if (b2 == null || converted == null) return "";
      return `反馈与约束单独占45分：45 / 80 × 当前表现指数 ${fmt(b2)} = ${fmt(converted)} 分。`;
    }
    return "";
  }

  function secondHandoffExpandedHow() {
    const record = netRecord() || personRecord();
    const handoff = itemMap(record, "handoff");
    const total = handoff.get("交接得分");
    if (!total) return "";
    const how = publicTechnicalText(total.reader_how || "");
    return how ? `${how} 其中0—5只作为 E—S 档在合成公式中的权重，公开裁决仍使用 E—S，并不是另一套数字档位。` : "";
  }

  function secondScoreHowDetails(item, label) {
    const details = document.createElement("details");
    details.className = "second-item-score-how";
    details.append(makeTextBlock("summary", "", "这个分怎么算？"));
    const rows = [];
    const add = (name, value) => { if (value) rows.push([name, value]); };

    if (METHOD_MAX[label]) {
      const grade = publicMethodGrade(item);
      add("当前裁决", [grade ? `${grade}档` : "", `原始表现指数 ${fmt(item.value)} / ${METHOD_MAX[label]}`].filter(Boolean).join(" · "));
      const formal = publicTechnicalText(item.reader_how || "该原始表现指数进入制度与行政合成，不作为本轴直接得分。");
      const expanded = secondMethodExpandedHow(label);
      add("换算规则", [formal, expanded].filter(Boolean).join(" "));
      add("当前结果", "作为制度与行政合成输入，不单独加分");
    } else if (["C1民生","C2经济财政","C3社会安全"].includes(label)) {
      const meta = stateGradeMeta(item);
      const band = String(item?.grade || "").match(/\bC[123]-(\d)\s*\/\s*L([0-3])\b/i);
      const base = band ? FINANCE_BASE_SCORES[label]?.[Number(band[1])] : null;
      const rate = band ? FINANCE_LOSS_RATE[Number(band[2])] : null;
      add("当前裁决", [meta?.grade ? `${meta.grade}档` : "", meta?.lossText || ""].filter(Boolean).join(" · "));
      if (base != null && rate != null) add("换算规则", `主态基础分 ${base} × (1 − ${Math.round(rate * 100)}%低谷修正)，最终保留1位小数。`);
      else add("换算规则", publicFinanceText(item.reader_how || ""));
      add("当前结果", `${fmt(item.value)} 分`);
    } else if (label === "C4恢复与成本") {
      add("当前裁决", "恢复、本人可归责恶化与额外民力成本合并结算");
      add("换算规则", publicFinanceText(item.reader_how || ""));
      add("当前结果", `${Number(item.value) > 0 ? "+" : ""}${fmt(item.value)} 分`);
    } else if (HANDOFF_LABELS[label]) {
      const grade = publicHandoffGrade(item);
      add("当前裁决", grade ? `${grade}档` : "");
      const formal = publicTechnicalText(item.reader_how || "");
      const expanded = secondHandoffExpandedHow();
      add("换算规则", [formal, expanded].filter(Boolean).join(" "));
      add("当前结果", grade ? `${grade}档` : "");
    } else {
      add("换算规则", publicTechnicalText(item.reader_how || ""));
      add("当前结果", item.value == null ? "—" : `${fmt(item.value)}${item.unit ? " " + item.unit : ""}`);
    }

    if (!rows.length) return null;
    for (const [name,value] of rows) {
      details.append(makeTextBlock("p", "prose", name + "：" + value));
    }
    return details;
  }

  globalThis.SecondItemScoreHowDetails = secondScoreHowDetails;

  function materialChip(text, className = "") {
    const value = publicText(text);
    if (!value) return null;
    const chip = document.createElement("span");
    chip.className = `adjudication-material-chip ${className}`.trim();
    chip.textContent = value;
    return chip;
  }

  function materialCard(data = {}) {
    const card = document.createElement("li");
    card.className = "adjudication-material-card" + (data.supplement ? " is-supplement" : "");
    for (const [key, value] of Object.entries(data.dataset || {})) if (value != null && value !== "") card.dataset[key] = String(value);

    const head = document.createElement("div");
    head.className = "adjudication-material-head";
    const title = document.createElement("strong");
    title.textContent = publicText(data.title || "裁决材料");
    head.append(title);

    const meta = document.createElement("div");
    meta.className = "adjudication-material-meta";
    for (const [value, className] of [
      [data.direction, "direction"],
      [data.strength, "strength"],
      ...(Array.isArray(data.tags) ? data.tags.map(tag => [tag, "tag"]) : []),
      [data.contribution, "contribution"],
    ]) {
      const chip = materialChip(value, className);
      if (chip) meta.append(chip);
    }
    if (meta.childNodes.length) head.append(meta);
    card.append(head);

    const body = publicText(data.body);
    if (body) card.append(makeTextBlock("p", "adjudication-material-basis", body));

    const scope = publicText(data.scope);
    const boundary = publicText(data.boundary);
    if (scope || boundary) {
      const details = document.createElement("details");
      details.className = "adjudication-material-boundary";
      details.append(makeTextBlock("summary", "", "范围与边界"));
      if (scope) {
        const box = makeTextBlock("div", "adjudication-material-scope", "");
        box.append(makeTextBlock("strong", "", "具体范围"), makeTextBlock("p", "", scope));
        details.append(box);
      }
      if (boundary) {
        const box = makeTextBlock("div", "adjudication-material-scope", "");
        box.append(makeTextBlock("strong", "", "判断边界"), makeTextBlock("p", "", boundary));
        details.append(box);
      }
      card.append(details);
    }

    const footer = publicText(data.footer);
    if (footer) card.append(makeTextBlock("small", "adjudication-material-footer", footer));
    return card;
  }

  function materialGroup(title, cards) {
    if (!cards.length) return document.createDocumentFragment();
    const section = document.createElement("section");
    section.className = "adjudication-material-group";
    section.append(makeTextBlock("h4", "", publicText(title)));
    const list = document.createElement("ul");
    list.className = "adjudication-material-list";
    list.replaceChildren(...cards);
    section.append(list);
    return section;
  }

  function renderB2MaterialGroups(evidence) {
    const groups = {positive:[], negative:[], mixed:[]};
    for (const entry of evidence || []) {
      const direction = String(entry?.public_direction || "");
      const key = direction.startsWith("正向") ? "positive" : direction.startsWith("负向") ? "negative" : "mixed";
      groups[key].push(materialCard({
        title: entry?.public_label || entry?.public_role,
        direction,
        tags: entry?.public_tags || [],
        body: entry?.public_basis,
        boundary: entry?.public_boundary,
        dataset: {publicEvidenceId: entry?.id || ""},
      }));
    }
    const wrapper = document.createElement("div");
    wrapper.className = "adjudication-material-groups b2-material-groups";
    wrapper.append(
      materialGroup("正向反馈与约束", groups.positive),
      materialGroup("负向反馈失灵", groups.negative),
      materialGroup("正负并存或阶段变化", groups.mixed)
    );
    return wrapper;
  }

  function financeRoleKey(role) {
    const value = String(role || "").trim();
    if (value === "主要状态") return "state";
    if (value === "低谷") return "loss";
    if (value === "边界") return "boundary";
    if (value === "恢复" || value === "责任范围") return "recovery";
    if (value === "状态恶化" || value === "额外代价") return "cost";
    return "other";
  }

  function renderFinanceMaterialGroups(label, evidence) {
    const groups = {state:[], loss:[], recovery:[], cost:[], boundary:[], other:[]};
    for (const entry of evidence || []) {
      const role = String(entry?.public_role || "").trim();
      const key = financeRoleKey(role);
      groups[key].push(materialCard({
        title: publicFinanceText(entry?.public_label || role || "正式裁决材料"),
        tags: role ? [role] : [],
        body: publicFinanceText(entry?.public_basis),
        boundary: publicFinanceText(entry?.public_boundary),
        dataset: {publicEvidenceId: entry?.id || ""},
      }));
    }
    const wrapper = document.createElement("div");
    wrapper.className = "adjudication-material-groups finance-material-groups";
    if (label === "C4恢复与成本") {
      wrapper.append(
        materialGroup("恢复与归责", groups.recovery),
        materialGroup("恶化与额外代价", groups.cost),
        materialGroup("重复计算与评价边界", groups.boundary),
      );
    } else {
      wrapper.append(
        materialGroup("主要状态", groups.state),
        materialGroup("低谷与损失", groups.loss),
        materialGroup("评价边界", groups.boundary),
      );
    }
    if (groups.other.length) wrapper.append(materialGroup("其他正式材料", groups.other));
    return wrapper;
  }


  function renderHandoffMaterialGroups(label, evidence) {
    const groups = {preparation:[], result:[], continuity:[], other:[]};
    for (const entry of evidence || []) {
      const role = String(entry?.public_role || "").trim();
      const key = role === "事前安排" ? "preparation"
        : (role === "交接结果" || role === "终局事实") ? "result"
        : role === "前任行政资产承接" ? "continuity"
        : "other";
      groups[key].push(materialCard({
        title: entry?.public_label || role || "交接裁决材料",
        tags: role ? [role] : [],
        body: entry?.public_basis,
        boundary: entry?.public_boundary,
        dataset: {publicEvidenceId: entry?.id || ""},
      }));
    }
    const wrapper = document.createElement("div");
    wrapper.className = "adjudication-material-groups handoff-material-groups";
    if (label === "D1继任行政连续性") {
      wrapper.append(materialGroup("行政承接与连续性", groups.continuity));
    } else {
      wrapper.append(
        materialGroup("事前安排", groups.preparation),
        materialGroup("实际交接与终局事实", groups.result),
      );
    }
    if (groups.other.length) wrapper.append(materialGroup("其他正式材料", groups.other));
    return wrapper;
  }


  globalThis.SecondItemMaterialCards = Object.freeze({
    card: materialCard,
    group: materialGroup,
    publicEnumText,
  });

  function publicFacts(item) {
    const evidence = Array.isArray(item?.reader_public_evidence_items) ? item.reader_public_evidence_items : [];
    if (evidence.length) {
      return evidence.map(entry => {
        if (!entry || typeof entry !== "object") return "";
        const label = String(entry.public_label || "").trim();
        const direction = String(entry.public_direction || "").trim();
        const basis = publicText(entry.public_basis || "");
        const boundary = publicText(entry.public_boundary || "");
        return [
          [label, direction].filter(Boolean).join(" · "),
          basis,
          boundary ? `边界：${boundary}` : "",
        ].filter(Boolean).join("；");
      }).map(publicText).filter(Boolean);
    }
    const highlights = (Array.isArray(item?.reader_highlights) ? item.reader_highlights : [])
      .map(publicText).filter(Boolean);
    if (highlights.length) return highlights;
    const summary = publicText(item?.reader_summary || "");
    return summary ? [summary] : [];
  }

  function makeTextBlock(tagName, className, text) {
    const node = document.createElement(tagName);
    if (className) node.className = className;
    node.textContent = text;
    return node;
  }

  function makeDetails(title, text, className = "") {
    if (!text) return null;
    const details = document.createElement("details");
    if (className) details.className = className;
    const summary = document.createElement("summary");
    summary.textContent = title;
    details.append(summary, makeTextBlock("p", "prose", text));
    return details;
  }

  function publicEvidenceList(evidence) {
    const list = makeTextBlock("ul", "second-item-public-evidence", "");
    for (const entry of evidence) {
      const card = makeTextBlock("li", "second-item-public-evidence-card", "");
      const title = [publicText(entry.public_label || entry.public_role), publicText(entry.public_direction)].filter(Boolean).join(" · ");
      if (title) card.append(makeTextBlock("strong", "", title));
      card.append(makeTextBlock("p", "prose", publicText(entry.public_basis)));
      const boundary = makeDetails("适用范围与限制", publicText(entry.public_boundary));
      if (boundary) card.append(boundary);
      list.append(card);
    }
    return list;
  }

  function patchMetricBodies(record) {
    if (!record?.net || !location.hash.match(/^#net\/[^/?#]+\/second(?:\/|$)/)) return;
    const items = secondItems(record);
    const root = document.getElementById("net-major-body");
    if (!root) return;
    for (const detail of root.querySelectorAll(".net-metric-detail[data-second-source-label]")) {
      const label = detail.dataset.secondSourceLabel || "";
      // Dedicated A/B1 renderers own these bodies. Do not overwrite them when
      // their asynchronous formal data load triggers the shared observer.
      if (label === "A制度建设" || label === "B1官僚治理") continue;
      const item = items.get(label);
      if (!item || item.reader_kind !== "judgment") continue;
      const body = detail.querySelector(":scope > .net-metric-body");
      if (!body) continue;
      const key = [item.reader_summary || "", JSON.stringify(item.reader_public_evidence_items || []), ...(item.reader_highlights || []), item.reader_boundary || "", item.reader_how || "", item.reader_full_basis || ""].join("|");
      if (body.dataset.secondPublicBodyKey === key && body.querySelector(":scope > .second-item-public-reading")) continue;
      const audit = body.querySelector(":scope > .net-audit-sources");
      if (audit) audit.remove();
      let formal = body.querySelector(":scope > .net-formal-basis-raw");
      if (formal) formal.remove();
      const raw = String(item.reader_full_basis || "").trim();
      if (!formal && raw && raw !== String(item.reader_summary || "").trim()) {
        formal = makeDetails("正式裁决原文（未改写）", raw, "net-formal-basis-raw");
      }
      body.innerHTML = "";
      const reading = document.createElement("div");
      reading.className = "second-item-public-reading";
      reading.append(makeTextBlock("div", "label", "为什么这样判断"));
      const evidence = item.reader_public_evidence_items;
      const facts = publicFacts(item);
      if (label === "B2反馈与约束" && Array.isArray(evidence) && evidence.length) {
        reading.append(renderB2MaterialGroups(evidence));
      } else if (["C1民生","C2经济财政","C3社会安全","C4恢复与成本"].includes(label) && Array.isArray(evidence) && evidence.length) {
        reading.append(renderFinanceMaterialGroups(label, evidence));
      } else if (["D1继任行政连续性","D3政权交接稳定"].includes(label) && Array.isArray(evidence) && evidence.length) {
        reading.append(renderHandoffMaterialGroups(label, evidence));
      } else if (Array.isArray(evidence) && evidence.length) {
        reading.append(publicEvidenceList(evidence));
      } else if (facts.length > 1) {
        const list = document.createElement("ul");
        for (const fact of facts) list.append(makeTextBlock("li", "", fact));
        reading.append(list);
      } else if (facts.length === 1) {
        reading.append(makeTextBlock("p", "prose", facts[0]));
      } else {
        reading.append(makeTextBlock("p", "prose", "当前尚未提供公开说明，请查看正式记录。"));
      }
      body.append(reading);
      const financeItem = ["C1民生","C2经济财政","C3社会安全","C4恢复与成本"].includes(label);
      const boundaryDetails = makeDetails("范围与边界", financeItem ? publicFinanceText(item.reader_boundary || "") : publicText(item.reader_boundary || ""));
      if (boundaryDetails) body.append(boundaryDetails);
      const howDetails = secondScoreHowDetails(item, label);
      if (howDetails) body.append(howDetails);
      if (formal) body.append(formal);
      if (audit) body.append(audit);
      body.dataset.secondPublicBodyKey = key;
    }
  }

  function patchCalculationRows(root, record) {
    if (!root || !record?.net) return;
    for (const key of SECOND_GROUPS) {
      const panel = root.querySelector(`#net-group-${key}`);
      const details = panel?.querySelector(":scope > .net-calculations");
      if (!details) continue;
      const rows = Array.from(details.querySelectorAll(":scope > .component"));
      const visible = SECOND_CALC_VISIBLE[key];
      const calculations = (record.net.component_details?.[key] || [])
        .filter(item => item.reader_kind === "calculation" && item.value != null && (!visible || visible.has(item.label)));
      const summary = details.querySelector(":scope > summary");
      if (summary) summary.textContent = "本组小计怎么形成？";
      rows.forEach((row, index) => {
        const item = calculations[index];
        if (!item) return;
        const strong = row.querySelector("strong");
        const small = row.querySelector("small");
        if (strong) strong.textContent = SECOND_CALC_LABELS[item.label] || publicText(item.public_component_label || item.label);
        if (small) small.textContent = publicCalculationText(item.reader_how || "");
      });
    }
  }

  function patchGroupIntros(record) {
    if (!record?.net || !location.hash.match(/^#net\/[^/?#]+\/second(?:\/|$)/)) return;
    const values = secondTotals(record);
    writePublicCopy(document.querySelector('[data-second-intro="method"]'),
      `这一组看国家机器如何建立规则、配置官僚并形成反馈约束。当前合计 ${fmt(values.method)} 分；公开层先看等级和历史依据，具体表现指数与折算放在展开内容里。`);
    writePublicCopy(document.querySelector('[data-second-intro="finance"]'),
      `这一组看统治时期普通家庭、经济财政和社会安全的主要状态，再结合任内低谷、恢复与额外代价形成结果判断。当前合计 ${fmt(values.finance)} 分。`);
    writePublicCopy(document.querySelector('[data-second-intro="handoff"]'),
      "统治如何收尾，会直接影响国家机器和继承秩序能否平稳延续。行政连续性看旧国家机器有多少被接住，交接稳定看继承过程是否顺利；两项均以 S—E 六档显示。");
  }

  function patchScorePresentation(record) {
    if (!record?.net) return;
    const totals = secondTotals(record);
    if (location.hash.match(/^#net\/[^/?#]+\/(?:all)?$/)) {
      const card = Array.from(document.querySelectorAll(".net-major-card")).find(node => /\/second(?:\/|$)/.test(node.getAttribute("href") || ""));
      if (card) {
        if (totals.total != null) writePublicScore(card.querySelector(".big"), `${fmt(totals.total)} 分`);
        if ([totals.method, totals.finance, totals.handoff].every(value => value != null)) {
          writePublicCopy(card.querySelector(":scope > .second-item-card-breakdown"),
            `制度与行政 ${fmt(totals.method)} · 民生与社会 ${fmt(totals.finance)} · 政权交接 ${fmt(totals.handoff)}`);
        }
      }
    }
    if (location.hash.match(/^#net\/[^/?#]+\/second(?:\/|$)/)) {
      const summary = document.querySelector(".second-item-reader-summary");
      const cards = summary?.querySelectorAll(".second-item-total-grid > div");
      if (cards?.length >= 3) {
        const values = [totals.method, totals.finance, totals.handoff];
        cards.forEach((card, index) => { if (values[index] != null) writePublicScore(card.querySelector("b"), `${fmt(values[index])} 分`); });
        writePublicCopy(cards[1]?.querySelector("small"), "民生、经济财政、社会安全、恢复与额外代价");
      }
      const intro = document.querySelector(".net-detail-page > .panel");
      const scoreLine = intro?.querySelector(":scope > p.subline");
      if (totals.total != null) writePublicCopy(scoreLine, `治国成效：${fmt(totals.total)} 分。先看结论，再展开到各项依据。`);
    }
    if (location.hash.startsWith("#person/")) {
      const panel = document.getElementById("person-outcome");
      for (const row of panel?.querySelectorAll(":scope > .component") || []) {
        const span = row.querySelector("span");
        if (!span || !span.textContent.trim().startsWith("治国成效")) continue;
        if (totals.total != null) writePublicScore(row.querySelector("b"), `${fmt(totals.total)} 分`);
      }
    }
  }

  function patchCompareScores(records) {
    if (records.length < 2 || !location.hash.startsWith("#compare/")) return;
    const row = Array.from(screenEl.querySelectorAll(".comparison tbody tr")).find(item => item.cells?.[0]?.textContent.trim() === "治国成效");
    if (!row) return;
    records.forEach((record, index) => {
      const score = finite(record?.net?.second_item_score);
      const cell = row.cells?.[index + 1];
      if (!cell || score == null) return;
      writePublicScore(cell.querySelector("b"), `${fmt(score)} 分`);
    });
  }

  function replaceText(node, replacements) {
    if (!node) return;
    let next = node.textContent;
    for (const [from, to] of replacements) next = next.replaceAll(from, to);
    if (next !== node.textContent) node.textContent = next;
  }

  function patchPersonOutcomeLink() {
    const record = personRecord();
    const panel = document.getElementById("person-outcome");
    if (!record || !panel) return;
    const row = Array.from(panel.querySelectorAll(":scope > .component")).find(component => {
      const label = component.querySelector("span")?.textContent.trim() || "";
      return label.startsWith("治国成效") || label.startsWith("治国净收益");
    });
    if (!row || row.querySelector(":scope > .net-overview-jump")) return;
    const anchor = document.createElement("a");
    anchor.className = "net-overview-jump";
    anchor.href = `#net/${encodeURIComponent(record.ruler_id)}/second`;
    anchor.setAttribute("aria-label", `查看${record.ruler_name}的治国成效计分逻辑`);
    while (row.firstChild) anchor.append(row.firstChild);
    row.append(anchor);
  }

  function patchShellLanguage() {
    const head = document.querySelector(".net-detail-head");
    replaceText(head?.querySelector(".eyebrow"), [["净收益计分", "统治绩效"]]);
    replaceText(head?.querySelector("h1"), [["净收益计分总览", "统治绩效构成"], ["治国净收益", "治国成效"]]);
    replaceText(head?.querySelector(".muted"), [["总榜净收益", "统治绩效总分"]]);
    const nav = document.querySelector(".net-major-nav");
    if (nav) nav.setAttribute("aria-label", "统治绩效详情");
    const secondNav = Array.from(nav?.querySelectorAll("a") || []).find(a => /\/second(?:\/|$)/.test(a.getAttribute("href") || ""));
    if (secondNav && secondNav.textContent !== "治国成效") secondNav.textContent = "治国成效";
    for (const cardTitle of document.querySelectorAll(".net-major-card h2")) {
      replaceText(cardTitle, [["治国净收益", "治国成效"], ["净收益计分总览", "统治绩效构成"]]);
    }
    const reading = document.querySelector("#person-evidence .net-reading[data-net-compact='done']");
    if (reading) {
      const section = reading.closest("section.panel");
      const heading = section?.querySelector(":scope > h2, :scope > h3");
      if (heading?.textContent.trim() === "净收益构成") heading.textContent = "统治绩效构成";
      for (const link of reading.querySelectorAll("a")) replaceText(link, [["净收益计分页", "统治绩效详情"], ["净收益计分", "统治绩效"]]);
      for (const intro of reading.querySelectorAll("p.reading-intro")) replaceText(intro, [["独立净收益计分页", "独立统治绩效详情页"]]);
    }
    for (const message of screenEl.querySelectorAll(".empty p, .empty[role='status']")) {
      replaceText(message, [
        ["净收益计分详情加载失败", "统治绩效详情加载失败"],
        ["净收益详情地址无效", "统治绩效详情地址无效"],
        ["净收益正式结算", "统治绩效正式结算"],
        ["净收益计分逻辑", "统治绩效详情"],
      ]);
    }
  }

  function patchPublicGrades() {
    const net = netRecord();
    if (net && location.hash.match(/^#net\/[^/?#]+\/second(?:\/|$)/)) {
      const root = document.getElementById("net-major-body");
      patchGradeGroups(root, net);
      patchMetricBodies(net);
      patchCalculationRows(root, net);
      patchGroupIntros(net);
    }
    const person = personRecord();
    if (person) patchGradeGroups(screenEl, person);
    const records = compareRecords();
    if (records.length) {
      const rows = Array.from(screenEl.querySelectorAll(".comparison tbody tr"));
      const structureRow = rows.find(row => ["分项构成", "构成与依据"].includes(row.cells?.[0]?.textContent.trim()));
      if (structureRow) records.forEach((record, index) => patchGradeGroups(structureRow.cells[index + 1], record));
      patchCompareScores(records);
    }
  }

  function patch() {
    ensureStyles();
    patchPersonOutcomeLink();
    patchShellLanguage();
    patchPublicGrades();
    const net = netRecord();
    if (net) patchScorePresentation(net);
    const person = personRecord();
    if (person) patchScorePresentation(person);
  }

  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      patch();
    });
  }

  new MutationObserver(schedule).observe(screenEl, {childList:true, subtree:true, characterData:true});
  window.addEventListener("hashchange", schedule);
  schedule();
})();

</script><script>
"use strict";

// A 制度建设专用阅读器：只消费构建后人物记录中的正式人物级公开投影。
// 不回读制度节点正式分片，也不在浏览器中重新组合裁决来源。
(() => {
  const screen = document.getElementById("screen");
  if (!screen) return;

  let scheduled = false;

  function currentRecord() {
    if (typeof byId === "undefined") return null;
    const match = location.hash.match(/^#net\/([^/?#]+)\/second(?:\/|$)/);
    if (!match) return null;
    try { return byId.get(decodeURIComponent(match[1])) || null; } catch { return null; }
  }

  function methodItem(record) {
    return (record?.net?.component_details?.method || []).find(item => item.label === "A制度建设") || null;
  }

  function make(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function detailsBlock(title, text, className = "") {
    const value = String(text || "").trim();
    if (!value) return null;
    const details = make("details", className);
    details.append(make("summary", "", title), make("p", "prose", value));
    return details;
  }

  function groupKey(entry) {
    const direction = String(entry?.public_direction || "");
    if (direction.startsWith("正向")) return "positive";
    if (direction.startsWith("负向")) return "negative";
    if (direction) return "mixed";
    return "other";
  }

  function groups(evidence) {
    const result = {positive:[], negative:[], mixed:[], other:[]};
    for (const entry of evidence || []) result[groupKey(entry)].push(entry);
    return result;
  }

  function card(entry) {
    const api = globalThis.SecondItemMaterialCards;
    if (api?.card) return api.card({
      title: entry?.public_label || "制度建设材料",
      direction: entry?.public_direction,
      tags: entry?.public_tags || [],
      body: entry?.public_basis,
      boundary: entry?.public_boundary,
    });

    const li = make("li", "second-item-a-card");
    li.append(make("strong", "", entry?.public_label || "制度建设材料"));
    if (entry?.public_basis) li.append(make("p", "", entry.public_basis));
    return li;
  }

  function section(title, entries) {
    const api = globalThis.SecondItemMaterialCards;
    if (api?.group) return api.group(title, entries.map(card));
    if (!entries.length) return document.createDocumentFragment();
    const wrapper = make("section", "second-item-a-group");
    wrapper.append(make("h4", "", title));
    const list = make("ul", "second-item-a-list");
    list.replaceChildren(...entries.map(card));
    wrapper.append(list);
    return wrapper;
  }

  function publicKey(item) {
    return JSON.stringify([
      item?.reader_summary || "",
      item?.reader_boundary || "",
      item?.reader_public_evidence_items || [],
      item?.reader_how || "",
    ]);
  }

  function appendDedicatedAudit(body, item, record) {
    const api = globalThis.SecondItemMaterialCards;
    const details = make("details", "second-item-dedicated-audit");
    details.append(make("summary", "", "原始记录与计算口径"));
    const how = api?.publicEnumText ? api.publicEnumText(item?.reader_how || "") : String(item?.reader_how || "").trim();
    if (how) details.append(make("p", "prose", how));
    const refs = [...new Set([item?.source, item?.applied_source, ...(item?.reader_source_refs || [])].filter(Boolean))];
    if (refs.length && typeof link === "function") {
      const holder = make("p", "sources");
      holder.innerHTML = refs.map((ref, i) => link(ref, i ? "补充正式记录 ↗" : "正式记录 ↗", record)).join("");
      details.append(holder);
    }
    body.append(details);
  }

  function ensureStyles() {
    if (document.getElementById("second-item-a-public-style")) return;
    const style = document.createElement("style");
    style.id = "second-item-a-public-style";
    style.textContent = `
      .second-item-a-reading{margin:4px 0 8px}
      .second-item-a-intro{margin:4px 0 14px;line-height:1.75}
      .second-item-a-summary{margin:10px 0 16px;padding:11px 13px;border-left:3px solid var(--gold);background:#f1eee6;font-size:12px;line-height:1.75}
      .second-item-a-group{margin:14px 0 18px}
      .second-item-a-group>h4{margin:0 0 8px;font-size:15px}
      .second-item-a-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
      .second-item-a-card{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:#fff}
