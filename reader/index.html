/* Link affordance for pointer users: visible but deliberately quieter than buttons. */
#screen a {
  border-radius: 3px;
  text-decoration-thickness: 1px;
  text-underline-offset: .2em;
  text-decoration-color: color-mix(in srgb, currentColor 42%, transparent);
}

/* Buttons and disclosure headings share one restrained interaction language. */
header nav button,
#screen button,
#screen summary {
  transition: color .16s ease, background-color .16s ease, border-color .16s ease,
              box-shadow .16s ease, transform .16s ease;
}

#screen summary {
  border-radius: 4px;
  list-style: none;
  padding: 3px 28px 3px 5px;
  margin-left: -5px;
  position: relative;
}

#screen summary::-webkit-details-marker {
  display: none;
}

#screen summary::after {
  content: "›";
  position: absolute;
  right: 7px;
  top: 50%;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
  transform: translateY(-50%);
  transform-origin: 50% 50%;
  transition: color .16s ease, transform .18s ease;
}

#screen details[open] > summary::after {
  color: var(--red);
  transform: translateY(-50%) rotate(90deg);
}

/* Ruler names behave like textual entry points rather than generic controls. */
#screen td.name button {
  position: relative;
  border-radius: 2px;
  transition: color .16s ease, transform .16s ease;
}

#screen td.name button::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: -3px;
  height: 1px;
  background: currentColor;
  transition: right .18s ease;
}

/* Home-table cells are direct entry points into the matching person-page section. */
#screen .home-click-row,
#screen .home-jump-cell {
  transition: background-color .16s ease, box-shadow .16s ease;
}

#screen .home-jump-cell {
  cursor: pointer;
  position: relative;
}

#screen .home-jump-cell::after {
  content: "↗";
  position: absolute;
  right: 8px;
  top: 6px;
  color: var(--muted);
  font-size: 11px;
  opacity: 0;
  transform: translate(-2px, 2px);
  transition: opacity .16s ease, transform .16s ease, color .16s ease;
}

#screen .home-jump-cell:focus-visible,
#screen .impact-grade[data-home-grade]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: -3px;
}

#screen .inline-table-filter {
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--green);
  font-size: inherit;
  line-height: inherit;
}

#screen .impact-grade[data-home-grade] {
  cursor: pointer;
  border-radius: 3px;
  padding: 0 2px;
  margin-left: -2px;
  transition: color .16s ease, background-color .16s ease, box-shadow .16s ease;
}

@media (hover: hover) and (pointer: fine) {
  #screen a {
    background-image: linear-gradient(currentColor, currentColor);
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 0 1px;
    transition: color .16s ease, background-size .2s ease, background-color .16s ease, box-shadow .16s ease;
  }

  #screen a:hover {
    color: var(--red);
    background-size: 100% 1px;
    background-color: color-mix(in srgb, var(--gold) 9%, transparent);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--gold) 22%, transparent);
    text-decoration-color: transparent;
  }

  #screen .axis-row a:hover,
  #screen .compact-axis a:hover,
  #screen .person-nav a:hover {
    text-decoration: none;
  }

  #screen .person-nav a:hover {
    color: var(--ink);
    background-color: color-mix(in srgb, var(--gold) 13%, transparent);
    box-shadow: none;
  }

  header nav button:hover,
  #screen button:hover {
    transform: translateY(-1px);
    border-color: color-mix(in srgb, var(--gold) 58%, var(--line));
    background-color: color-mix(in srgb, var(--gold) 8%, transparent);
    box-shadow: 0 4px 10px color-mix(in srgb, var(--ink) 9%, transparent);
  }

  header nav button.active:hover,
  #screen button.primary:hover {
    background-color: color-mix(in srgb, var(--ink) 92%, var(--gold));
    border-color: var(--ink);
    color: white;
  }

  #screen .candidate-grid button:hover {
    background-color: color-mix(in srgb, var(--gold) 11%, #fcfbf7);
  }

  #screen td.name button:hover {
    color: var(--red);
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    transform: translateX(2px);
  }

  #screen td.name button:hover::after {
    right: 0;
  }

  #screen summary:hover {
    color: var(--red);
    background-color: color-mix(in srgb, var(--gold) 8%, transparent);
  }

  #screen summary:hover::after {
    color: var(--red);
  }

  #screen .home-click-row:hover {
    background-color: color-mix(in srgb, var(--gold) 3%, transparent);
  }

  #screen .home-jump-cell:hover {
    background-color: color-mix(in srgb, var(--gold) 9%, transparent);
    box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--gold) 34%, transparent);
  }

  #screen .home-jump-cell:hover::after {
    color: var(--red);
    opacity: .72;
    transform: translate(0, 0);
  }

  #screen .inline-table-filter:hover {
    color: var(--red);
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    transform: none;
    text-decoration: underline;
    text-underline-offset: .18em;
  }

  #screen .impact-grade[data-home-grade]:hover {
    color: color-mix(in srgb, var(--red) 88%, var(--ink));
    background-color: color-mix(in srgb, var(--red) 7%, transparent);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--red) 18%, transparent);
  }

  header nav button:active,
  #screen button:active {
    transform: translateY(0);
    box-shadow: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  #screen a,
  header nav button,
  #screen button,
  #screen summary,
  #screen summary::after,
  #screen td.name button,
  #screen td.name button::after,
  #screen .home-click-row,
  #screen .home-jump-cell,
  #screen .home-jump-cell::after,
  #screen .impact-grade[data-home-grade] {
    transition: none;
  }

  header nav button:hover,
  #screen button:hover,
  #screen td.name button:hover,
  #screen .home-jump-cell:hover::after {
    transform: none;
  }
}

  margin-top: 22px;
}

.net-ledger {
  margin-top: 8px;
  opacity: .84;
}

.net-ledger > summary {
  color: var(--green);
}

.net-ledger > details {
  margin-left: 14px;
}

.net-ledger .component {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
}

.net-score-links {
  grid-column: 1 / -1;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: -3px;
  font-size: 12px;
}

.net-score-links a {
  font-weight: 500;
}

@media (max-width: 700px) {
  #rows .table-wrap {
    overflow: visible;
    border: 0;
    background: transparent;
  }

  #rows table,
  #rows tbody {
    display: block;
    width: 100%;
  }

  #rows thead {
    display: none;
  }

  #rows tbody {
    display: grid;
    gap: 14px;
  }

  #rows tr.home-click-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto auto auto auto;
    gap: 0 14px;
    padding: 15px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fcfbf7;
    box-shadow: 0 2px 8px color-mix(in srgb, var(--ink) 5%, transparent);
  }

  #rows tr.home-click-row > td {
    display: block;
    min-width: 0;
    padding: 10px 0;
    border-bottom: 0;
    white-space: normal;
  }

  #rows tr.home-click-row > td::before {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .04em;
  }

  #rows tr.home-click-row > td:nth-child(1) {
    grid-column: 1 / -1;
    grid-row: 1;
    padding-top: 0;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  #rows tr.home-click-row > td:nth-child(1)::before {
    display: none;
  }

  #rows tr.home-click-row > td:nth-child(2) {
    grid-column: 1;
    grid-row: 2;
  }

  #rows tr.home-click-row > td:nth-child(2)::before {
    content: "净收益";
  }

  #rows tr.home-click-row > td:nth-child(4) {
    grid-column: 2;
    grid-row: 2;
  }

  #rows tr.home-click-row > td:nth-child(4)::before {
    content: "历史影响";
  }

  #rows tr.home-click-row > td:nth-child(3) {
    grid-column: 1 / -1;
    grid-row: 3;
    border-top: 1px solid var(--line);
  }

  #rows tr.home-click-row > td:nth-child(3)::before {
    content: "人物画像";
  }

  #rows tr.home-click-row > td:nth-child(5) {
    grid-column: 1 / -1;
    grid-row: 4;
    padding-bottom: 0;
    border-top: 1px solid var(--line);
  }

  #rows tr.home-click-row > td:nth-child(5)::before {
    content: "对照";
  }

  #rows tr.home-click-row > td:nth-child(5) button {
    width: 100%;
  }

  #rows .overview-axes {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px 16px;
    font-size: 12px;
  }

  #rows .overview-style {
    margin-top: 8px;
    padding-top: 8px;
  }

  #rows .number {
    font-size: 27px;
  }

  #rows .impact-grade {
    font-size: 28px;
  }

  #rows .home-jump-cell::after {
    display: none;
  }

  #rows td.name button {
    font-size: 23px;
  }

  #rows td.name small {
    margin-top: 5px;
  }

  .impact-summary {
    padding: 9px 10px;
  }

  .net-public-group {
    margin-top: 24px;
    padding-top: 18px;
  }

  .net-public-item {
    padding: 10px 11px;
  }

  .net-public-item > .component {
    align-items: start;
  }

  .net-public-item > .component b {
    font-size: 18px;
  }

  .net-calculations {
    padding: 9px 10px;
  }

  .net-ledger > details {
    margin-left: 8px;
  }

  .net-ledger .component {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .net-score-links {
    gap: 10px;
    margin-top: 2px;
  }
}
</style>
</head>

<script>
"use strict";
const DATA=JSON.parse(document.getElementById('reader-data').textContent), screen=document.getElementById('screen');
const byId=new Map(DATA.records.map(r=>[r.ruler_id,r]));
const state={q:'',polity:'',scope:'main',sort:'time',compare:[],grade:'',differences:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>typeof v==='number'?v.toFixed(2):'—';
const conf=v=>({HIGH:'高',MEDIUM:'中',LOW:'低'}[v]||v||'未声明');
const pos=v=>({HIGH:'高位',MID:'中位',LOW:'低位'}[v]||v||'');
const mode=v=>({FULL_GRADE:'完整定档',BOUNDED_PROFILE:'有界画像',MATERIAL_DENSITY_LIMITED:'材料密度受限',NOT_APPLICABLE:'不适用',EPISODE_TAG:'仅有局部情境证据',NO_GRADE:'证据不足，无档结案'}[v]||v||'未声明');
const dimNames={scope:'影响范围',depth_duration:'深度与持续',personal_causality:'个人因果',paradigm:'政治范式'};
const href=p=>{p=p.replace(/\.md:(\d+)(?:-(\d+))?$/,(_,a,b)=>'.md#L'+a+(b?'-L'+b:''));const [path,...fragment]=p.split('#');return '../'+path.split('/').map(encodeURIComponent).join('/')+(fragment.length?'#'+encodeURIComponent(fragment.join('#')):'')};
const personId=()=>{try{return decodeURIComponent(location.hash.slice(8))}catch{return ''}};
const link=(p,label,subject)=>{if(!p)return '';if(/^https?:\/\//.test(p))return `<a href="${esc(p)}" target="_blank" rel="noopener">${esc(label)}</a>`;if(DATA.source_availability[p]===false)return `<span class="unavailable-source">历史引用（当前文件不可用）：${esc(p)}</span>`;let url=href(p);const person=subject||byId.get(personId());if(person&&/\.(md|json)$/.test(p.split('#')[0])){const [path,hash]=url.split('#');url=path+'?person='+encodeURIComponent(person.ruler_id)+'&name='+encodeURIComponent(person.ruler_name)+(hash?'#'+hash:'')}return `<a href="${url}" target="_blank" rel="noopener">${esc(label)}</a>`};
const letters={G5:'S',G4:'A',G3:'B',G2:'C',G1:'D',G0:'E'};
const shortNames={M1:'军事统帅',M2:'外交博弈',M4:'内部联盟',M5:'组织执行',C1:'战略判断',C2:'学习纠错',C3:'用人授权',C4:'制度设计',C5:'权力克制'};
const ungraded=a=>a?.adjudication_state==='EVIDENCE_INSUFFICIENT_CLOSED';
const pending=a=>!!a&&(a.display_point_only||['UNRESOLVED_EVIDENCE_GAP','REASSESSMENT_REQUIRED'].includes(a.adjudication_state));
const radarValue=a=>!a||ungraded(a)||pending(a)||!letters[a.axis_grade]||!['LOW','MID','HIGH'].includes(a.position)||a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?null:a.radar_value;
const grade=a=>!a?'未覆盖':ungraded(a)?'无档结案':pending(a)?(a.adjudication_state==='REASSESSMENT_REQUIRED'?'待重裁':a.adjudication_state==='UNRESOLVED_EVIDENCE_GAP'?'待补证':'历史显示点'):a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?'不适用':!letters[a.axis_grade]?'未定档':!['LOW','MID','HIGH'].includes(a.position)?'位置未定':letters[a.axis_grade]+({LOW:'−',MID:'',HIGH:'+'}[a.position]);

const groupNames={first:'奠基与统一：原分及折算',method:'治国：制度与行政',finance:'治国：财政与民生',handoff:'治国：交接质量',strategic:'军事：战略收益与国防',military:'军事：体系与成本',civilization:'文明与国家整合'};
const impactMeaning={'S+':'文明／国家主路径重塑',S:'超重大历史影响',A:'重大长期历史影响',B:'重大历史影响',C:'显著历史影响',D:'有限但真实影响',E:'弱历史影响'};
const readingTerms={PS0:'仅有结果或资源背景',PS1:'局部正确选择',PS2:'完整独立决策周期',PS3:'可跨情境迁移的强模式',PS4:'不同约束下反复兑现的罕见模式',DW0:'未能归责本人的负面结果',DW1:'已纠正且未复发的局部误判',DW2:'造成显著损失但已恢复或未同类复发的错误',DW3:'同类机制重复失败、反馈后加码或优势下崩盘',DW4:'跨机制与阶段的稳定失能',AM1:'局部制度接口',AM2:'全国重要子系统',AM3:'国家核心系统',AM4:'国家基本运行架构重构'};
function readerText(t){return String(t??'').replace(/\b(?:PS[0-4]|DW[0-4]|AM[1-4])\b/g,k=>readingTerms[k]).replace(/G([0-5])[- /]*(LOW|MID|HIGH)/g,(_,g,p)=>grade({axis_grade:'G'+g,position:p})).replace(/G([0-5])/g,(_,g)=>letters['G'+g]+'档').replace(/EPISODE_TAG/g,'局部情境证据').replace(/BOUNDED_PROFILE/g,'有明确适用边界的画像').replace(/FULL_GRADE/g,'完整定档').replace(/MI4(?:_CROSS_PHASE_SYSTEMIC)?/g,'跨阶段系统性情境').replace(/MI3(?:_SUSTAINED_SYSTEMIC)?/g,'持续系统性情境').replace(/MI2(?:_LIFECYCLE)?/g,'完整生命周期情境').replace(/MI1(?:_CASE)?/g,'单一情境').replace(/\bE1\b/g,'少量情境材料').replace(/\bE2\b/g,'多个独立情境材料').replace(/\bE3\b/g,'主要命题已有代表性材料')}
function axisProse(t){if(typeof t==='string')return prose(readerText(t));if(Array.isArray(t))return t.length?t.map(axisProse).join(''):prose('未另列说明');if(t&&typeof t==='object'){const labels={positive_parent_refs:'正向情境引用',counter_parent_refs:'反例情境引用'};return `<details><summary>查看结构化情境引用</summary>${Object.entries(t).map(([k,v])=>`<div class="label">${esc(labels[k]||k)}</div>${axisProse(v)}`).join('')}</details>`}return prose('未另列说明')}
function excerpt(t){return `<div class="excerpt">${format(Array.isArray(t)?t.join('；'):t||'尚无独立说明')}</div>`}
function netGroups(r){return Object.entries(r.net.component_details||{}).map(([key,items])=>`<details><summary>${esc(groupNames[key]||key)}</summary><p class="subline">以下包含原始指标、折算与小计，不逐行相加。</p>${items.map(x=>`<div class="component"><span>${esc(x.label)} <small>${esc(x.grade)} ${esc(x.note)}</small></span><b>${x.value==null?'—':esc(x.value)} ${esc(x.unit)}</b></div>`).join('')}</details>`).join('')}
function historySections(r){const h=r.impact;return `<h3 class="section-title">历史影响依据</h3><details><summary>历史影响等级为什么这样定？</summary>${prose(h.grade_basis)}</details>${(h.macro_chains||[]).map(c=>`<details id="chain-${c.chain_id}"><summary>${esc(c.title)}</summary>${prose(c.narrative)}</details>`).join('')}<details><summary>如果没有这个人，会有什么不同？</summary>${prose(h.nearest_feasible_counterfactual)}</details><details><summary>哪些变化归于本人，哪些属于共享作用？</summary>${prose(h.personal_causal_boundary)}</details><details><summary>后世如何使用其政治范式？</summary>${prose(h.paradigm_analysis)}</details><details><summary>判断有多稳定，边界在哪里？</summary>${prose(h.confidence_basis)}${Object.entries(dimNames).map(([k,n])=>h.dimensions[k]?.boundary_note?`<div class="label">${n}</div>${prose(h.dimensions[k].boundary_note)}`:'').join('')}</details>`}

const format=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function prose(t){if(Array.isArray(t))return t.length?t.map(prose).join(''):'';if(t&&typeof t==='object')return Object.entries(t).map(([k,v])=>`<div class="label">${esc(k)}</div>${prose(v)}`).join('');if(!t)return '';return String(t).split(/\n\s*\n/).map(block=>`<p class="prose">${format(block)}</p>`).join('')}
function contexts(a){const labels={positive_parent_refs:'正向表现',counter_parent_refs:'反例与下沿',negative_parent_refs:'负向表现',mixed_parent_refs:'正负混合表现'};return Object.entries(a.counterpattern).map(([key,refs])=>`<div class="label">${esc(labels[key]||key)}</div>${Array.isArray(refs)&&refs.length?refs.map(id=>{const c=a.context_lookup?.[id];return c?`<div class="context-story">${axisProse(c.cycle_basis||c.basis)}<details class="metadata"><summary>该情境的来源</summary><p class="subline">${esc(id)}</p>${(c.source_refs||[]).map(ref=>/^(docs\/|config\/|archive\/|https?:\/\/)/.test(ref)?link(ref,'来源原文 ↗'):prose(ref)).join('')}</details></div>`:prose('情境引用：'+id)}).join(''):'<p class="subline">当前未列独立情境。</p>'}`).join('')}

function nav(name){for(const n of ['home','compare','guide'])document.getElementById(n+'-nav').classList.toggle('active',n===name)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function radar(r){
 const codes=DATA.capability_axes, point=(i,v)=>{const a=i*Math.PI*2/codes.length-Math.PI/2;return[150+Math.cos(a)*v*.83,118+Math.sin(a)*v*.83]};
 const points=v=>codes.map((_,i)=>point(i,v).join(',')).join(' ');
 const complete=codes.every(c=>Number.isFinite(radarValue(r.axes[c])));
 return `<svg class="radar" viewBox="0 0 300 240" role="img" aria-label="八轴能力形状，具体档位见下方列表；不比较面积">${[25,50,75,100].map(v=>`<polygon points="${points(v)}" fill="none" stroke="#deded3"/>`).join('')}${codes.map((c,i)=>{const p=point(i,100),t=point(i,123);return `<line x1="150" y1="118" x2="${p[0]}" y2="${p[1]}" stroke="#deded3"/><text x="${t[0]}" y="${t[1]+4}" text-anchor="middle">${esc(shortNames[c]||c)}</text>`}).join('')}${complete?`<polygon points="${codes.map((c,i)=>point(i,radarValue(r.axes[c])).join(',')).join(' ')}" fill="#28655926" stroke="#286559" stroke-width="2"/>`:''}${codes.map((c,i)=>{const v=radarValue(r.axes[c]);if(!Number.isFinite(v))return '';const p=point(i,v);return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#286559"/>`}).join('')}</svg>`;
}
function axisRows(r,codes){return codes.map(c=>`<div class="axis-row compact-axis"><a href="#reason-${c}" data-reason="${c}">${esc(shortNames[c]||DATA.axis_specs[c].name)}</a><b class="axis-letter ${pending(r.axes[c])||ungraded(r.axes[c])?'pending':''}">${grade(r.axes[c])}</b></div>`).join('')}

function gradeHelp(kind){
 if(kind==='impact')return `<details class="grade-help"><summary>影响等级怎样读？</summary><p>这是历史改变的量级，不是能力或功绩等级。总档与四维分别裁定，不求平均。</p>${DATA.impact_grades.map(g=>`<p><b>${esc(g)}</b> · ${esc(impactMeaning[g])}</p>`).join('')}</details>`;
 return `<details class="grade-help"><summary>画像等级怎样读？</summary><p>各轴从E−到S+分18级，−／无符号／+分别表示档内下沿、中位、上沿。字母是本轴正式档位的展示，不与历史影响字母换算。</p><p>八个能力轴各看自己的行为证据；C5只评价权力运用风格与克制，不解释为能力高低。不适用、待补证、待重裁分别标明，不补零。</p></details>`;
}

function comparePicker(){
 screen.innerHTML=`<h1>选择两位人物</h1><p>按姓名、帝号或朝代搜索。当前已选 ${state.compare.length} 人。</p><p>${state.compare.map(id=>`<button data-remove-compare="${esc(id)}">${esc(byId.get(id).ruler_name)} ×</button>`).join(' ')}</p><input id="compare-search" aria-label="搜索对照人物" placeholder="搜索姓名、帝号或朝代"><div id="compare-candidates" class="candidate-grid"></div>`;
 const update=()=>{const q=document.getElementById('compare-search').value?.trim()||'';document.getElementById('compare-candidates').innerHTML=DATA.records.filter(r=>!state.compare.includes(r.ruler_id)&&(r.ruler_name+r.polity+(r.impact.identity_label||'')).includes(q)).map(r=>`<button data-pick-compare="${esc(r.ruler_id)}">${esc(r.impact.identity_label||r.ruler_name)}<small>${esc(r.polity)}${r.supplementary?' · 补充样本':''}</small></button>`).join('')||'<p>没有匹配人物。</p>'};
 document.getElementById('compare-search').addEventListener('input',update);update();
}

function home(){nav('home');screen.innerHTML=`<section class="hero"><div><div class="eyebrow">三重视角</div><h1>成效、才具、历史回声。</h1><p class="muted">同一个人，从统治成效、做事能力与历史后效三个角度一起读。</p></div><div class="legend"><div><b>净收益</b><p>统治实际留下了多少收益与损害</p></div><div><b>人物画像</b><p>面对不同问题时，表现出的能力与权力风格</p></div><div><b>历史影响</b><p>改变了多大范围的历史路径，又持续了多久</p></div></div></section>
 <div class="toolbar"><input id="search" aria-label="搜索人物" placeholder="搜索姓名、帝号、朝代" value="${esc(state.q)}"><select id="polity" aria-label="朝代"><option value="">全部朝代</option>${[...new Set(DATA.records.map(r=>r.polity))].map(p=>`<option ${p===state.polity?'selected':''}>${esc(p)}</option>`).join('')}</select><select id="scope" aria-label="样本范围"><option value="main">正式评价对象</option><option value="supplementary">补充历史样本</option></select><select id="sort" aria-label="排序"><option value="time">历史顺序</option><option value="net">净收益分数</option><option value="impact">历史影响等级</option></select><select id="impact-filter" aria-label="历史影响等级筛选"><option value="">全部影响档位</option>${DATA.impact_grades.map(g=>`<option>${esc(g)}</option>`).join('')}</select><button id="clear-filters" class="back">清除筛选</button><span class="count" id="count" role="status"></span></div><div id="rows"></div><p class="footer-note">正式评价对象 ${DATA.main_count} 人 · 净收益入榜 ${DATA.ranked_count} 人 · 补充历史样本 ${DATA.supplementary_count} 人。${DATA.records.some(r=>Object.values(r.axes).some(pending))?`画像另有 ${DATA.records.reduce((n,r)=>n+Object.values(r.axes).filter(pending).length,0)} 个轴记录待补证或重裁。`:''}${DATA.records.some(r=>Object.values(r.axes).some(ungraded))?`另有 ${DATA.records.reduce((n,r)=>n+Object.values(r.axes).filter(ungraded).length,0)} 个轴记录无档结案。`:''}</p><p class="toast" id="selection" aria-live="polite"></p>`;
 for(const [id,key] of [['scope','scope'],['sort','sort'],['impact-filter','grade']])document.getElementById(id).value=state[key];
 for(const [id,key] of [['search','q'],['polity','polity'],['scope','scope'],['sort','sort'],['impact-filter','grade']])document.getElementById(id).addEventListener(id==='search'?'input':'change',e=>{state[key]=e.target.value;renderRows()});document.getElementById('clear-filters').onclick=()=>{Object.assign(state,{q:'',polity:'',scope:'main',grade:'',sort:'time'});home()};renderRows();}
function renderRows(){let rows=DATA.records.filter(r=>r.supplementary===(state.scope==='supplementary')&&(!state.polity||r.polity===state.polity)&&(!state.grade||r.impact.public_grade===state.grade)&&(!state.q||(r.ruler_name+r.polity+r.impact.identity_label).includes(state.q.trim())));
 rows.sort((a,b)=>{if(state.sort==='net')return (b.net?.total_score??-Infinity)-(a.net?.total_score??-Infinity)||a.ruler_id.localeCompare(b.ruler_id);if(state.sort==='impact')return DATA.impact_grades.indexOf(a.impact.public_grade)-DATA.impact_grades.indexOf(b.impact.public_grade)||a.ruler_id.localeCompare(b.ruler_id);return (a.impact.reading_start_year??Infinity)-(b.impact.reading_start_year??Infinity)||a.ruler_id.localeCompare(b.ruler_id)});
 document.getElementById('count').textContent=`显示 ${rows.length} 人`;
 document.getElementById('rows').innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>人物 / 权力窗口</th><th>净收益 · 正式总分</th><th>人物画像 · 八轴能力＋权力风格</th><th>历史影响 · 等级</th><th>对照</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="name"><button data-person="${r.ruler_id}">${esc(r.ruler_name)}</button><small>${esc(r.polity)} · ${esc(r.actual_power_window)}</small></td><td>${r.net?`<span class="number">${number(r.net.total_score)}</span><small>第 ${r.net.rank} 名 / ${DATA.ranked_count}</small>`:`<span class="muted">${r.supplementary?'不在本评价范围':'未入榜'}</span>`}</td><td>${r.supplementary?'—':`<div class="overview-axes">${DATA.capability_axes.map(c=>`<span title="${esc(DATA.axis_specs[c].name)}">${esc(shortNames[c])} <b>${grade(r.axes[c])}</b></span>`).join('')}</div><div class="overview-style">${DATA.independent_axes.map(c=>`<span>${esc(DATA.axis_specs[c].name)} <b>${grade(r.axes[c])}</b></span>`).join('')}</div>`}</td><td><span class="impact-grade">${esc(r.impact.public_grade)}</span> <span class="badge">${esc(r.impact.impact_nature)}</span><small>判断把握：${conf(r.impact.confidence)}</small></td><td><button data-select="${r.ruler_id}" aria-pressed="${state.compare.includes(r.ruler_id)}">${state.compare.includes(r.ruler_id)?'已选':'加入对照'}</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">没有匹配人物。试试其他姓名、朝代或档位。</div>';
 document.getElementById('selection').textContent=state.compare.length?`已选：${state.compare.map(id=>byId.get(id).ruler_name).join('、')}。点击“并列对照”查看；再次点击可取消。`:'';
}
function netPanel(r){
 const n=r.net;
 return `<section id="person-outcome" class="panel net"><div class="eyebrow">01 / 统治结果</div><h2>净收益</h2><p class="subline">看统治实际留下的收益与损害</p>${n?`<div class="big">${number(n.total_score)}</div><span class="badge">净收益第 ${n.rank} 名 / ${DATA.ranked_count}</span>${[['治国净收益',n.second_item_score],['军事与边疆',n.third_item_score],['奠基与统一附加',n.first_item_add_on],['文明与国家整合',n.fourth_item_adjustment]].map(([k,v])=>`<div class="component"><span>${k}</span><b>${number(v)}</b></div>`).join('')}<p class="subline">分差不表示历史贡献的倍数，也不是百分制。</p><details><summary>这个分数怎么来的？</summary><p>总分由上列四项构成。它包含合同规定的结果与过程分量，不是货币收益减成本；零分也不代表每个方面都没有收益或损害。</p><p>第一项${n.first_item_status==='APPLICABLE'?`原分为 ${number(n.first_item_raw_score)}，按公式折算为附加分 ${number(n.first_item_add_on)}；原分不再重复相加`:'不适用，附加分为0；不代表能力失败'}。</p><p class="subline">${esc(DATA.formula)}</p>${n.weight_sensitivity?.all_scenarios?`<p><strong>换一套合理权重，名次会变化多少？</strong> 在已声明的 ${DATA.weight_sensitivity.scenario_count} 种权重情景中，名次范围为第 ${n.weight_sensitivity.all_scenarios.best}—${n.weight_sensitivity.all_scenarios.worst} 名。</p><p class="subline">这是有限权重情景的结果，不是置信区间，也不包含史料或裁决不确定性。正式名次仍使用基准权重。</p>`:''}${link('docs/项目总纲/皇帝统治净收益评价合同.md','计分合同与情景设定 ↗')}</details>`:`<div class="big">—</div><p>${r.supplementary?'补充历史样本，不纳入净收益正式评价范围。':'未进入净收益总榜，不能按零分理解。'}</p><p class="subline">${esc(({PENDING_SECOND_ITEM_FORMAL_SETTLEMENT:'第二项正式结算待补',PENDING_THIRD_ITEM_FORMAL_SETTLEMENT:'第三项正式结算待补',PENDING_FIRST_ITEM_FORMAL_SETTLEMENT:'第一项正式结算待补',SUPPLEMENTARY:'历史影响池外补充样本'}[r.settlement_readiness]||r.settlement_readiness))}</p>`}<p class="sources">${link(DATA.sources.net_reader,'净收益完整依据 ↗')}</p></section>`;
}

function impactPanel(r){const h=r.impact;return `<section id="person-impact" class="panel impact"><div class="eyebrow">03 / 历史后效</div><h2>历史影响</h2><p class="subline">路径改变的规模、深度与归责</p><div class="big" style="color:var(--red)">${esc(h.public_grade)}</div><p>${esc(impactMeaning[h.public_grade]||'')}</p><span class="badge">${esc(h.impact_nature)}</span> <span class="subline">判断把握：${conf(h.confidence)}</span><p class="subline confidence-note">表示证据与归责判断的稳定程度，不表示影响大小。</p><div class="dimensions">${Object.entries(dimNames).map(([k,n])=>`<div>${n}<b>${esc(h.dimensions[k]?.grade||'—')}</b></div>`).join('')}</div>${gradeHelp('impact')}<p class="sources"><a href="#history-evidence" data-section="history-evidence">查看历史主链与归责 ↓</a></p></section>`}

function axisEvidence(r,c,suffix=''){
 const a=r.axes[c],spec=DATA.axis_specs[c];if(!a)return '';
 return `<details id="reason-${c}${suffix}" class="axis-evidence"><summary>${esc(spec.name)} <span class="badge">${grade(a)}</span></summary>${ungraded(a)?'<p class="notice">证据审查已结案，本轴不发布等级或分数；不表示能力低下。</p>':''}${pending(a)?'<p class="notice">本轴当前尚未完成裁决；历史保留值不作为现行等级或雷达值。</p>':''}<div class="label">这个判断主要依据什么表现？</div>${axisProse(a.typical_pattern||a.not_applicable_reason||'本轴未另列人物表现，请展开裁决详情。')}${a.assessment_basis==='NO_DEMONSTRATED_CAPABILITY'?'<p class="notice">本轴E为终局证据认定：现有材料未显示外交能力。它与已证实外交失能的裁决分开，不表示史料已证明潜在能力为零。</p>':''}${a.applicability_basis?'<div class="label">适用范围</div>'+axisProse(a.applicability_basis):''}${a.counterpattern&&typeof a.counterpattern==='object'&&!Array.isArray(a.counterpattern)?contexts(a):a.counterpattern?'<div class="label">反例与限制</div>'+axisProse(a.counterpattern):''}<details class="metadata adjudication"><summary>裁决详情：定档、档内定位与限制</summary><div class="label">定档依据（原文）</div>${prose(a.grade_basis)}<div class="label">档内定位（原文）</div>${prose(a.position_basis)}<div class="label">限制与证据边界（原文）</div>${prose(a.limitations)}${prose(a.evidence_assessment_basis)}${a.no_grade_closure?`<div class="label">复查范围</div>${prose(a.no_grade_closure.review_scope)}<div class="label">证据缺口</div>${prose(a.no_grade_closure.evidence_gap)}<div class="label">重开条件</div>${prose(a.no_grade_closure.reopen_condition)}`:''}</details><details class="metadata"><summary>专业信息与正式记录</summary><p class="subline">展示模式：${esc(mode(a.output_mode))} · 判断把握：${esc(conf(a.confidence))} · ${ungraded(a)?'当前状态：无档结案':pending(a)?'当前状态：'+grade(a):a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?'当前状态：不适用':'公开等级：'+grade(a)}</p>${(a.source_refs||[]).map(ref=>/^(docs\/|config\/|archive\/|https?:\/\/)/.test(ref)?'<p class="sources">'+link(ref,ref)+'</p>':prose(ref)).join('')}<p class="sources">${link(spec.markdown,'本轴完整阅读页 ↗',r)}${link(spec.json+'#ruler_id='+r.ruler_id,'正式记录入口 ↗')}</p></details></details>`;
}

function person(r){
 nav('');if(!r){screen.innerHTML='<p>未找到该人物。</p><button data-home>返回人物总览</button>';return}
 screen.innerHTML=`<button class="back" data-home>← 人物总览</button><div class="person-head"><div><div class="eyebrow">${esc(r.polity)} / 三套评价</div><h1>${esc(r.impact.identity_label||r.ruler_name)}</h1><p class="muted">实际掌权时期：${esc(r.actual_power_window)} ${r.supplementary?'<span class="scope-label">· 补充历史样本</span>':''}</p></div><button data-person-compare="${r.ruler_id}">选择另一人对照 →</button></div><nav class="person-nav" aria-label="人物页章节"><a href="#person-outcome" data-section="person-outcome">净收益概览</a><a href="#person-capability" data-section="person-capability">九轴画像</a><a href="#person-impact" data-section="person-impact">历史影响概览</a><a href="#person-evidence" data-section="person-evidence">展开依据</a></nav><div class="three overview-panels">${netPanel(r)}<section id="person-capability" class="panel profile"><div class="eyebrow">02 / 人物画像</div><h2>人物画像</h2><p class="subline">八轴能力与权力风格分别评价</p>${r.supplementary?'<p>不在人物画像正式评价范围内。</p>':`<h3>八轴能力</h3><div class="compact-axes">${axisRows(r,DATA.capability_axes)}</div><div class="style-axis"><h3>权力运用风格</h3>${axisRows(r,DATA.independent_axes)}</div>`}${gradeHelp('profile')}<p class="sources"><a href="#profile-evidence" data-section="profile-evidence">查看表现、反例与限制 ↓</a></p></section>${impactPanel(r)}</div><section id="person-evidence" class="evidence reading-wide"><h2>结论背后的依据</h2><p class="muted">三套体系回答不同问题。按想了解的问题展开；相同字母在不同体系中也不代表同一尺度。</p>${r.net?`<section class="panel"><h3>净收益构成</h3>${netGroups(r)}</section>`:''}<section id="profile-evidence" class="panel evidence"><h2>人物画像依据</h2>${!r.supplementary?`<details><summary>查看八轴能力雷达</summary>${radar(r)}<p class="subline">只展示能力结构；C5不并入能力图，不按面积、均值或比例比较整体能力。</p></details>${DATA.axis_order.map(c=>axisEvidence(r,c)).join('')}`:'<p>该补充历史样本不在人物画像正式评价范围内。</p>'}</section><section id="history-evidence" class="panel evidence">${historySections(r)}<details><summary>历史影响 · 来源与核对范围</summary>${prose(r.impact.historical_source_notes)}${prose(r.impact.source_review_scope)}${prose(r.impact.source_trace?.limit)}${(r.impact.source_refs||[]).map((s,i)=>`<div class="label">来源 ${i+1} · ${esc(s.document||s.path||s.kind)}</div>${prose([s.section,s.subsection,s.adopted_excerpt,s.adoption_limit].filter(Boolean).join('\n'))}${s.path?link(s.path,'来源文件 ↗'):''}`).join('')}<p class="sources">${link(DATA.sources.impact_reader,'历史影响完整阅读页 ↗')}${link(DATA.sources.impact,'正式记录入口 ↗')}</p></details></section></section>`;
}

function compare(){
 nav('compare');if(state.compare.length<2){comparePicker();return}
 const [a,b]=state.compare.map(id=>byId.get(id));history.replaceState(null,'','#compare/'+state.compare.map(encodeURIComponent).join('/'));
 const row=(label,fn)=>{const left=fn(a),right=fn(b);if(state.differences&&left===right)return '';return `<tr><td>${label}</td><td>${left}</td><td>${right}</td></tr>`};
 const axisRow=c=>{if(state.differences&&grade(a.axes[c])===grade(b.axes[c]))return '';return `<tr><td>${esc(DATA.axis_specs[c].name)}</td>${[a,b].map((r,i)=>`<td>${r.axes[c]?axisEvidence(r,c,'-compare-'+i):'未覆盖'}</td>`).join('')}</tr>`};
 const section=label=>`<tr class="comparison-section"><th colspan="3">${label}</th></tr>`;
 screen.innerHTML=`<h1>同题对照，各读其因。</h1><p class="muted">按相同维度并排阅读双方结论和依据，同时保留各自的历史起点、实际掌权时期与材料限制。</p><div class="compare-select">${[a,b].map((r,i)=>`<button data-replace-compare="${i}">${esc(r.impact.identity_label||r.ruler_name)} · 更换</button>`).join('<span>与</span>')}<button data-swap-compare>交换左右</button></div><label class="difference-toggle"><input type="checkbox" id="differences" ${state.differences?'checked':''}>只看不同项</label><p class="subline">开启后只保留不同的分数、等级和对应依据。同档也可能有不同事实、判断把握和限制；关闭即可查看全部。</p><div class="table-wrap comparison-scroll"><table class="comparison"><thead><tr><th>阅读问题</th><th>${esc(a.ruler_name)}</th><th>${esc(b.ruler_name)}</th></tr></thead><tbody>${row('实际掌权时期',r=>esc(r.actual_power_window))}${section('净收益')}${row('净收益',r=>r.net?`<b>${number(r.net.total_score)}</b> · 第 ${r.net.rank} 名`:'未入榜')}${[['治国净收益','second_item_score'],['军事与边疆','third_item_score'],['奠基与统一附加','first_item_add_on'],['文明与国家整合','fourth_item_adjustment']].map(([n,k])=>row(n,r=>number(r.net?.[k]))).join('')}${row('构成与依据',r=>r.net?`<details><summary>展开构成</summary>${netGroups(r)}</details>`:'本展示未覆盖')}${section('人物画像 · 八轴能力')}${DATA.capability_axes.map(axisRow).join('')}${section('人物画像 · 权力运用风格')}${DATA.independent_axes.map(axisRow).join('')}${section('历史影响')}${row('历史影响等级',r=>`<b class="impact-grade">${esc(r.impact.public_grade)}</b> · ${esc(r.impact.impact_nature)}`)}${Object.entries(dimNames).map(([k,n])=>row(n,r=>esc(r.impact.dimensions[k]?.grade))).join('')}${row('判断把握',r=>conf(r.impact.confidence))}${row('主链与归责依据',r=>`<details><summary>展开历史影响依据</summary>${historySections(r)}</details>`)}${row('继续阅读',r=>`<button data-person="${r.ruler_id}">查看${esc(r.ruler_name)} →</button>`)}</tbody></table></div>${gradeHelp('profile')}${gradeHelp('impact')}`;

(() => {
  const basePerson = person;

  const baseGuide = guide;
  const pendingLoads = new Map();
  let renderGeneration = 0;

  function loading(message) {
    screen.innerHTML = `<div class="empty" role="status">${esc(message)}</div>`;
  }

  function loadFailure(error) {
    console.error(error);
    screen.innerHTML = `<div class="empty"><p>完整资料加载失败。</p><p class="subline">请检查网络后重试；人物总览仍可正常使用。</p><button data-home>返回人物总览</button></div>`;
  }

  async function loadRecord(record) {
    if (!record || record.detail_loaded) return record;
    const id = record.ruler_id;
    if (pendingLoads.has(id)) return pendingLoads.get(id);
    if (!record.detail_ref) throw new Error(`Missing detail_ref for ${id}`);

    const request = (async () => {
      const response = await fetch(record.detail_ref, {cache: "no-cache"});
      if (!response.ok) throw new Error(`Failed to load ${record.detail_ref}: HTTP ${response.status}`);
      const payload = await response.json();
      if (!payload || !payload.record || payload.record.ruler_id !== id) {
        throw new Error(`Detail payload ruler_id mismatch for ${id}`);
      }
      const full = {
        ...payload.record,
        detail_ref: record.detail_ref,
        detail_loaded: true,
      };
      byId.set(id, full);
      Object.assign(DATA.source_availability, payload.source_availability || {});
      return full;
    })().finally(() => pendingLoads.delete(id));

    pendingLoads.set(id, request);
    return request;
  }

  person = function(record) {
    if (!record || record.detail_loaded) {
      renderGeneration += 1;
      return basePerson(record);
    }

    const generation = ++renderGeneration;
    nav("");
    loading(`正在加载${record.ruler_name}的完整资料…`);
    loadRecord(record).then(full => {
      if (generation !== renderGeneration || personId() !== full.ruler_id) return;
      basePerson(full);
    }).catch(error => {
      if (generation === renderGeneration) loadFailure(error);
    });
  };

  compare = function() {
    if (state.compare.length < 2) {
      renderGeneration += 1;
      return baseCompare();
    }

    const selected = state.compare.map(id => byId.get(id));
    if (selected.some(record => !record)) {
      renderGeneration += 1;
      return baseCompare();
    }
    if (selected.every(record => record.detail_loaded)) {
      renderGeneration += 1;
      return baseCompare();
    }

    const generation = ++renderGeneration;
    nav("compare");
    loading("正在加载两位人物的完整对照资料…");
    Promise.all(selected.map(loadRecord)).then(() => {
      if (generation !== renderGeneration || !location.hash.startsWith("#compare")) return;
      baseCompare();
    }).catch(error => {
      if (generation === renderGeneration) loadFailure(error);
    });
  };

  home = function() {
    renderGeneration += 1;
    return baseHome();
  };

  guide = function() {
    renderGeneration += 1;
    return baseGuide();
  };

  // The template performs one synchronous first render before this enhancement is
  // injected. Re-route once so direct person/compare URLs immediately switch to
  // the lazy detail path while the overview remains unchanged.
  route();
})();
</script>

    for (const row of panel.querySelectorAll(":scope > .component")) {
      const label = row.querySelector("span")?.textContent.trim();
      const major = overviewMajorByLabel[label];
      if (!major) continue;
      const anchor = document.createElement("a");
      anchor.className = "net-overview-jump";
      anchor.href = netHref(record, major);
      anchor.setAttribute("aria-label", `查看${record.ruler_name}的${label}计分逻辑`);
      while (row.firstChild) anchor.append(row.firstChild);
      const text = anchor.querySelector("span");
      if (text && !text.querySelector("small")) {
        const hint = document.createElement("small");
        hint.textContent = "查看计分逻辑 →";
        text.append(hint);
      }
      row.append(anchor);
    }

    const sourceLink = panel.querySelector(":scope > p.sources a");
    if (sourceLink) {
      sourceLink.href = netHref(record, "all");
      sourceLink.textContent = "查看完整净收益计分页 →";
    }
    panel.dataset.netLinks = "done";
  }

  function compactNetReading(record) {
    const section = netEvidenceSection();
    const reading = section?.querySelector(".net-reading");
    if (!reading || reading.dataset.netCompact === "done") return;
    const groups = Object.entries(record.net?.component_details || {});
    if (!groups.length) return;

    reading.innerHTML = `<p class="reading-intro">这里保留各大项的快速摘要。完整的逐人判断、变量、公式和计分来源放到独立净收益计分页，避免单人主页无限变长。</p><p class="sources"><a href="${netHref(record, "all")}">打开完整净收益计分页 →</a></p>`;

    for (const [key, items] of groups) {
      if (!Array.isArray(items)) continue;
      const details = document.createElement("details");
      details.className = "net-summary-group";
      const major = netGroupMajor[key] || "all";
      const judgments = items.filter(item => item.reader_kind === "judgment" && item.value != null);
      const firstNotApplicable = key === "first" && items.every(item =>
        item.value == null || (item.label === "附加F" && Number(item.value) === 0)
      );
      const preview = firstNotApplicable
        ? `<p class="notice">该人物不适用第一项，本项不参与净收益计分。</p>`
        : judgments.map(item => `<div class="component"><span>${esc(item.label)}</span><b>${esc(netValue(item))}</b></div>`).join("");
      details.innerHTML = `<summary>${esc(netGroupNames[key] || key)}</summary>${preview}<p class="sources"><a href="${netHref(record, major, key)}">查看这组完整计分逻辑 →</a></p>`;
      reading.append(details);
    }
    reading.dataset.netCompact = "done";
  }

  function enhancePersonNet() {
    const record = currentPersonRecord();
    if (!record?.detail_loaded) return;
    enhanceNetOverview(record);
    compactNetReading(record);
  }

  function cleanNetText(value) {
    return String(value ?? "")
      .replace(/\bC-([0-9]+)-(LOW|MID|HIGH)\b/g, (_, n, p) => `第${n}档·${({LOW:"低位",MID:"中位",HIGH:"高位"})[p]}`)
      .replace(/\bC-0\b/g, "第0档")
      .replace(/\bML([0-4])\b/g, "军事净毁损第$1级")
      .replace(/\bCIV([0-4])\b/g, "文明影响量级$1")
      .replace(/\bDA([0-9]+)\b/g, "破坏放大第$1级")
      .replace(/\bHYBRID\b/g, "战略统筹与本人主帅／临阵并存")
      .replace(/\bSTRATEGIC_COMMAND\b/g, "战略统筹路线")
      .replace(/\bNONE\b/g, "未形成可计的本人统帅责任")
      .replace(/\bHIGH\b/g, "高位")
      .replace(/\bMID\b/g, "中位")
      .replace(/\bLOW\b/g, "低位")
      .replace(/\bmiddle-upper\b/g, "中上位")
      .replace(/\bmiddle-lower\b/g, "中下位")
      .replace(/\bupper\b/g, "上位")
      .replace(/\bmiddle\b/g, "中位")
      .replace(/\blower\b/g, "下位")
      .replace(/\bPOSITIVE\b/g, "正向")
      .replace(/\bNEGATIVE\b/g, "负向")
      .replace(/\bBALANCED\b/g, "正负相抵")
      .replace(/\s+/g, " ")
      .trim();
  }

  function uniqueSourceRefs(item) {
    const refs = Array.isArray(item.reader_source_refs) ? item.reader_source_refs : [];
    return [...new Set([item.source, item.applied_source, ...refs].filter(Boolean))];
  }

  function auditSourceBlock(item, record) {
    const refs = uniqueSourceRefs(item);
    if (!refs.length) return "";
    const links = refs.map((ref, index) => {
      const label = ref === item.applied_source && ref !== item.source
        ? "采用值原始记录 ↗"
        : index === 0 ? "原始正式文档 ↗" : `补充史料／记录 ${index} ↗`;
      return link(ref, label, record);
    }).join(" ");
    return `<details class="net-audit-sources"><summary>原始正式文档与史料（审计）</summary><p class="subline">这些链接指向整份正式文件，供核对使用；上面的“当前人物结算逻辑”才是面向读者的单人解释。</p><p class="sources">${links}</p></details>`;
  }

  function metricDetail(item, record) {
    const intro = netPublicIntro[item.label] || "";
    const summary = cleanNetText(item.reader_summary || "");
    const fullBasis = cleanNetText(item.reader_full_basis || "");
    const highlights = (Array.isArray(item.reader_highlights) ? item.reader_highlights : [])
      .map(cleanNetText).filter(Boolean);
    const boundary = cleanNetText(item.reader_boundary || "");
    const how = cleanNetText(item.reader_how || "");
    const logic = [intro, summary].filter(Boolean).join("\n");
    const full = fullBasis && fullBasis !== summary
      ? `<details><summary>当前人物的完整裁决原文</summary>${prose(fullBasis)}</details>`
      : "";
    const facts = highlights.length
      ? `<div class="label">关键事实</div><ul>${highlights.map(text => `<li>${esc(text)}</li>`).join("")}</ul>`
      : "";
    const limit = boundary ? `<div class="label">限制与边界</div>${prose(boundary)}` : "";
    const formula = how ? `<details><summary>这个分怎么算？</summary>${prose(how)}</details>` : "";
    return `<details class="net-metric-detail"><summary><span><strong>${esc(item.label)}</strong>${intro ? `<small>${esc(intro)}</small>` : ""}</span><b>${esc(netValue(item))}</b></summary><div class="net-metric-body">${logic ? `<div class="label">当前人物结算逻辑</div>${prose(logic)}` : ""}${facts}${limit}${formula}${full}${auditSourceBlock(item, record)}</div></details>`;
  }

  function calculationBlock(items) {
    const calculations = items.filter(item => item.reader_kind === "calculation" && item.value != null);
    if (!calculations.length) return "";
    return `<details class="net-calculations"><summary>计算过程与小计</summary>${calculations.map(item => `<div class="component"><span><strong>${esc(item.label)}</strong><small>${esc(cleanNetText(item.reader_how || "按正式公式换算。"))}</small></span><b>${esc(netValue(item))}</b></div>`).join("")}</details>`;
  }

    return `<section id="net-group-${esc(key)}" class="panel net-detail-group"><h2>${esc(netGroupNames[key] || key)}</h2>${judgments.map(item => metricDetail(item, record)).join("")}${calculationBlock(items)}</section>`;

  function firstItemRawUrl(ref) {
    const path = String(ref || "").split("#", 1)[0];
    return `../${path}?raw=1`;
  }

  async function loadFirstItemDoc(ref) {
    if (!ref) return "";
    if (firstItemDocCache.has(ref)) return firstItemDocCache.get(ref);
    const pending = fetch(firstItemRawUrl(ref), {cache: "no-cache"})
      .then(response => response.ok ? response.text() : "")
      .catch(() => "");
    firstItemDocCache.set(ref, pending);
    return pending;
  }

  function firstItemBullets(markdown, rulerName) {
    if (!markdown || !rulerName) return {};
    const escaped = rulerName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const heading = new RegExp(`^###\\s+\\d+\\.\\s+${escaped}\\s*$`, "m");
    const match = heading.exec(markdown);
    if (!match) return {};
    const tail = markdown.slice(match.index + match[0].length);
    const next = tail.search(/^###\s+\d+\./m);
    const section = next >= 0 ? tail.slice(0, next) : tail;
    const result = {};
    for (const line of section.split(/\r?\n/)) {
      const bullet = line.match(/^-\s+\*\*(.+?)\*\*：\s*(.*)$/);
      if (!bullet) continue;
      result[bullet[1].trim()] = bullet[2].replace(/\*\*/g, "").replace(/`/g, "").trim();
    }
    return result;
  }

  function firstItemPublicText(value) {
    return String(value ?? "")
      .replace(/\bR([0-6])\b/g, "起点R$1级")
      .replace(/\bO([1-6])\b/g, "对手O$1级")
      .replace(/\bL([0-5])\b/g, "L$1级")
      .replace(/\bHYBRID\b/g, "战略统筹与本人主帅／临阵并存")
      .replace(/\bSTRATEGIC_COMMAND\b/g, "战略统筹路线")
      .replace(/\bNONE\b/g, "未形成可计的本人统帅责任")
      .replace(/\bC-([0-5])-(LOW|MID|HIGH)\b/g, (_, n, p) => `第${n}档·${({LOW:"低位",MID:"中位",HIGH:"高位"})[p]}`)
      .replace(/\bC-0\b/g, "第0档")
      .replace(/\s+/g, " ")
      .trim();
  }

  function firstMetricDetail(id, title, subtitle, score, body, item, record) {
    return `<details id="${id}" data-ruler="${esc(record.ruler_name)}" class="net-metric-detail"><summary><span><strong>${title}</strong><small>${subtitle}</small></span><b>${esc(netValue(item))}</b></summary><div class="net-metric-body">${body}${auditSourceBlock(item, record)}</div></details>`;
  }

  function firstEvidenceMarkup(value, component) {
    const text = String(value || "");
    const base = new URL(`../${firstItemDocs[component]}`, location.href);
    let output = "", cursor = 0;
    for (const match of text.matchAll(/\[([^\]]+)\]\(([^)]+)\)/g)) {
      output += esc(text.slice(cursor, match.index));
      const href = new URL(match[2], base);
      output += ["http:", "https:"].includes(href.protocol)
        ? `<a href="${esc(href.href)}" target="_blank" rel="noopener">${esc(match[1])} ↗</a>` : esc(match[1]);
      cursor = match.index + match[0].length;
    }
    return output + esc(text.slice(cursor));
  }

  function renderFirstA(item, bullets, record) {
    const result = bullets["结算结果"] || bullets["A结算"] || "";

    const project = bullets["项目总成果"] || "";

    const body = `<div class="label">A是什么意思</div>${prose("A只评价建国、复国或统一主链中，本人最终真正留下了多少稳定控制成果。继承来的既有版图不算本人新增；起点强弱、对手、速度、组织和本人军事能力分别放到B1、B2、C。")}<div class="label">U是什么意思</div>${prose("U = 有效控制信用。新增的稳定控制按100%计，恢复旧有稳定控制按50%计；1000代表一个“全国核心统一尺度”。U不是人口、面积或军队人数，而是统一成果规模的标准化信用。公式：U = 新增稳定空间控制 + 50% × 恢复稳定空间控制。")}${scale || content ? `<div class="label">当前人物的U怎么来</div>${prose([project, scale, content, bullets["分账说明"]].filter(Boolean).join("\n"))}` : ""}${allocation}<details><summary>这个分怎么算？</summary>${prose(`单人项目：A = 120 × (min(1000, U) / 1000)^0.65；共同项目先算项目A池，再按本人控制信用占项目总信用的比例分配，不把个人信用再次代入曲线。最后保留1位小数。${calculation ? `\n当前人物正式代入：${calculation}` : ""}${result ? `\n正式结算：${result}` : ""}`)}</details>`;
    return firstMetricDetail("net-first-a", "A · 统一主链客观贡献", "满分120；只看本人最终留下的稳定控制成果", item.value, body, item, record);
  }

  function renderFirstB1(item, bullets, record) {
    const result = bullets["B1结算"] || "";
    const start = bullets["起点"] || "";
    const opponent = bullets["对手"] || "";
    const efficiency = bullets["效率"] || "";
    const body = `<div class="label">B1是什么意思</div>${prose("B1不重复奖励统一规模，而是问：本人从多强的家底起步、面对多强的实际竞争对手、用了多高效率完成核心成果。起点越弱、对手越强、完成越快，B1越高。")}<div class="label">三个变量怎么读</div><ul><li>起点R档：看本人进入主链时能直接调用的军政资源。R0最弱，得15分；R6接近统一的成熟国家机器，得0分。</li><li>对手O档：看实际竞争阶段的战争机器强度。最强对手全值，第二强只按50%计。</li><li>效率：先算期望完成年 = 4 + 8 × √(效率阶段有效控制信用 / 1000)，再用“实际年数 ÷ 期望年数”得到速度比；速度比越小，效率分越高。</li></ul>${start ? `<div class="label">起点怎么判</div>${prose(firstItemPublicText(start))}` : ""}${opponent ? `<div class="label">对手怎么判</div>${prose(firstItemPublicText(opponent))}` : ""}${efficiency ? `<div class="label">效率怎么判</div>${prose(firstItemPublicText(efficiency))}` : ""}<details><summary>这个分怎么算？</summary>${prose(`B1 = 起点难度分 + 对手难度分 + 完成效率分。${result ? `\n当前人物正式结算：${firstItemPublicText(result)}` : ""}`)}</details>`;

  }

  function renderFirstB2(item, bullets, record, contract) {
    const result = bullets["B2结算"] || "";
    const explainLevel = (value, section) => {
      const level = String(value || "").match(/L[0-5]/)?.[0];
      const part = contract.split(`### ${section}`)[1]?.split(/\n###? /)[0] || "";
      const row = part.split("\n").find(line => level && line.startsWith(`| ${level} |`));
      const meaning = row?.split("|")[3]?.trim();
      return [firstItemPublicText(value), meaning ? `本档要求：${meaning}。` : ""].filter(Boolean).join(" ");
    };
    const parallel = explainLevel(bullets["并行执行"], "4.1");
    const coverage = explainLevel(bullets["团队能力覆盖与组织杠杆"] || bullets["能力覆盖/组织杠杆"], "4.2");

    const body = `<div class="label">B2是什么意思</div>${prose("B2看创业或统一机器能不能脱离本人逐项盯办而运行：能否多线并行、能否把高难任务交给专业责任中心、能否把不同地域和旧集团稳定整合进同一执行体系。")}<div class="label">L档怎么换分</div>${prose("每个维度都用L0—L5六档：L0=0分、L1=2分、L2=4分、L3=6分、L4=8分、L5=10分。三项相加就是B2。")}${parallel ? `<div class="label">并行执行</div>${prose(parallel)}` : ""}${coverage ? `<div class="label">专业覆盖与组织杠杆</div>${prose(coverage)}` : ""}${integration ? `<div class="label">异质整合</div>${prose(integration)}` : ""}${basis ? `<div class="label">本人组织表现与限制</div>${prose(firstItemPublicText(basis))}` : ""}${bullets["材料来源"] ? `<div class="label">史料与归责来源</div><p class="sources">${firstEvidenceMarkup(bullets["材料来源"], "B2组织与整合")}</p>` : ""}<details><summary>这个分怎么算？</summary>${prose(`B2 = 并行执行分 + 专业覆盖／组织杠杆分 + 异质整合分。${result ? `\n当前人物正式结算：${firstItemPublicText(result)}` : ""}`)}</details>`;
    return firstMetricDetail("net-first-b2", "B2 · 创业组织与政治整合", "满分30；三项各10分", item.value, body, item, record);

  function firstTotals(items) {
    const byLabel = Object.fromEntries(items.map(item => [item.label, item]));
    const a = byLabel["A统一贡献"]?.value;
    const b1 = byLabel["B1创业难度与效率"]?.value;
    const b2 = byLabel["B2组织与整合"]?.value;
    const c = byLabel["C军事统帅与战争解题"]?.value;

  async function renderFirstMajor(record, focus = "") {
    const items = record.net?.component_details?.first || [];
    const container = document.getElementById("net-major-body");
    if (!container) return;
    const firstNotApplicable = items.every(item =>
      item.value == null || (item.label === "附加F" && Number(item.value) === 0)
    );
    if (firstNotApplicable) {
      container.innerHTML = `<section class="panel"><h2>${esc(netMajorSpecs.first.title)}</h2><p class="notice">本项只评价建国、复国或统一创业主链；该人物不适用，因此这一项不参与净收益计分。</p></section>`;
      return;
    }

    const labels = ["A统一贡献", "B1创业难度与效率", "B2组织与整合", "C军事统帅与战争解题"];
    const bulletsByLabel = {};
    await Promise.all(labels.map(async label => {
      bulletsByLabel[label] = firstItemBullets(await loadFirstItemDoc(firstItemDocs[label]), record.ruler_name);
    }));
    if (!location.hash.startsWith(`#net/${encodeURIComponent(record.ruler_id)}/first`)) return;

    const contract = await loadFirstItemDoc("docs/分项规则/第一项政权奠基与统一贡献及能力/00-规则与计分合同.md");
    const mainWindow = contract.split("## 7. ")[1]?.split("## 8.")[0]?.split("\n").find(line => line.startsWith("| ") && line.split("|")[1]?.trim() === record.ruler_name)?.split("|")[2]?.trim();
    const byLabel = Object.fromEntries(items.map(item => [item.label, item]));
    const windowText = bulletsByLabel["B1创业难度与效率"]["效率"] || "";
    const ownA = bulletsByLabel["A统一贡献"];
    if (ownA["项目总成果"]) {
      const aDoc = await loadFirstItemDoc(firstItemDocs["A统一贡献"]);
      const people = [...aDoc.matchAll(/^###\s+\d+\.\s+(.+)$/gm)].map(match => match[1].trim());
      const partners = people.map(name => ({name, fields:firstItemBullets(aDoc,name)})).filter(person => person.fields["项目总成果"] === ownA["项目总成果"]);
      ownA["分账说明"] = `分账对象与分数：${partners.map(person => {
        const credit = (person.fields["本人取得/归属成果"] || "").split("；")[0].replace(/[。；]+$/, "");
        const score = (person.fields["结算结果"] || "").replace(/[。；]+$/, "");
        return `${person.name}：${credit}，${score}`;
      }).join("；")}。`;
    }

    const cards = [];
    if (byLabel["A统一贡献"]) cards.push(renderFirstA(byLabel["A统一贡献"], bulletsByLabel["A统一贡献"], record));
    if (byLabel["B1创业难度与效率"]) cards.push(renderFirstB1(byLabel["B1创业难度与效率"], bulletsByLabel["B1创业难度与效率"], record));
    if (byLabel["B2组织与整合"]) cards.push(renderFirstB2(byLabel["B2组织与整合"], bulletsByLabel["B2组织与整合"], record, contract));
    if (byLabel["C军事统帅与战争解题"]) cards.push(renderFirstC(byLabel["C军事统帅与战争解题"], bulletsByLabel["C军事统帅与战争解题"], record));

    container.innerHTML = `<section class="panel net-detail-group"><div class="notice"><strong>这页采用哪些时间与责任范围？</strong><p>本项评价建国、复国或统一主链，可以包含即位前的本人责任。B1完成效率的计时点，不自动截断A、B2、C及军事成本范围。</p><dl><dt>创业／统一主链</dt><dd>${esc(mainWindow || ownA["成果内容"] || "按逐人正式条目确定主链，未单列统一起止年份。")}</dd>${windowText ? `<dt>B1完成效率计时</dt><dd>${esc(firstItemPublicText(windowText))}</dd>` : ""}${byLabel["军事成本扣分"]?.reader_boundary ? `<dt>军事成本责任范围</dt><dd>${esc(byLabel["军事成本扣分"].reader_boundary)}</dd>` : ""}</dl><p class="sources"><a href="../docs/分项规则/第一项政权奠基与统一贡献及能力/00-规则与计分合同.md" target="_blank" rel="noopener">主链与分项边界 ↗</a></p></div>${cards.join("")}${firstTotals(items)}</section>`;
    if (focus) requestAnimationFrame(() => document.getElementById(`net-first-${focus}`)?.scrollIntoView({behavior: "smooth", block: "start"}));

  function renderGenericMajor(record, major, focus = "") {
    const spec = netMajorSpecs[major];
    const details = record.net?.component_details || {};
    const content = spec.groups.map(key => genericNetGroup(record, key, details[key] || [])).join("");

    if (container) container.innerHTML = content || `<section class="panel"><p class="notice">这一项暂未形成可展示的完整分项记录。</p></section>`;
    if (focus) requestAnimationFrame(() => document.getElementById(`net-group-${focus}`)?.scrollIntoView({behavior: "smooth", block: "start"}));
  }

  function majorNav(record, active) {
    const links = ["all", "first", "second", "third", "fourth"].map(key => {
      const label = key === "all" ? "总览" : netMajorSpecs[key].title.replace(/^第[一二三四]项 · /, "");
      return `<a class="${active === key ? "active" : ""}" href="${netHref(record, key)}">${esc(label)}</a>`;
    }).join("");
    return `<nav class="net-major-nav" aria-label="净收益计分页">${links}</nav>`;
  }

  function majorCard(record, major) {
    const value = majorValue(record, major);
    const spec = netMajorSpecs[major];
    const extra = major === "first" && record.net?.first_item_status === "APPLICABLE"
      ? `<p class="subline">第一项原始净分 S1：${number(record.net.first_item_raw_score)}；此处显示进入总榜的附加分。</p>`
      : major === "first" ? `<p class="subline">该人物第一项不适用。</p>` : "";
    return `<a class="panel net-major-card" href="${netHref(record, major)}"><h2>${esc(spec.title)}</h2><div class="big">${value == null ? "—" : number(value)}</div>${extra}<p>${esc(spec.description)}</p><p class="sources">查看完整计分逻辑 →</p></a>`;
  }

  function renderNetShell(record, active, body) {
    nav("");
    screen.innerHTML = `<a class="back" href="#person/${encodeURIComponent(record.ruler_id)}">← 返回${esc(record.ruler_name)}人物页</a><div class="person-head net-detail-head"><div><div class="eyebrow">${esc(record.polity)} / 净收益计分</div><h1>${esc(record.ruler_name)} · ${esc(netMajorSpecs[active]?.title || "净收益")}</h1><p class="muted">${active === "first" ? "人物在位／掌权时期（不是本项采用窗口）" : "实际权力窗口"}：${esc(record.actual_power_window)} · 总榜净收益 ${number(record.net?.total_score)}</p></div></div>${majorNav(record, active)}<section class="net-detail-page">${body}</section>`;
  }

  function renderNetLanding(record) {
    renderNetShell(record, "all", `<section class="panel"><h2>怎么读这页</h2><p>先选一个大项。每个指标优先展示当前人物自己的结算逻辑和公式；整份正式结算文件只保留为最深层审计入口。</p></section><div class="net-major-grid">${["first", "second", "third", "fourth"].map(major => majorCard(record, major)).join("")}</div>`);
  }

  function renderNetMajor(record, major, focus) {
    const spec = netMajorSpecs[major];
    if (!spec || major === "all") {
      renderNetLanding(record);
      return;
    }
    const value = majorValue(record, major);
    const scoreNote = major === "first" && record.net?.first_item_status === "APPLICABLE"
      ? `进入总榜的附加分：${number(value)}；第一项扣军事成本后的原始净分 S1：${number(record.net.first_item_raw_score)}。`
      : major === "first" ? "该人物第一项不适用。" : `本项进入总榜的分值：${value == null ? "—" : number(value)}。`;

    if (major === "first") void renderFirstMajor(record, focus);
    else renderGenericMajor(record, major, focus);
  }

  function parseNetRoute(hash = location.hash) {
    const match = hash.match(/^#net\/([^/?#]+)(?:\/(all|first|second|third|fourth))?(?:\/([^/?#]+))?$/);
    if (!match) return null;
    try {
      return {
        rulerId: decodeURIComponent(match[1]),
        major: match[2] || "all",
        focus: match[3] ? decodeURIComponent(match[3]) : "",
      };
    } catch {
      return null;
    }
  }

  async function loadNetRecord(record) {
    if (!record || record.detail_loaded) return record;
    const id = record.ruler_id;
    if (pendingNetRecords.has(id)) return pendingNetRecords.get(id);
    if (!record.detail_ref) throw new Error(`Missing detail_ref for ${id}`);
    const pending = (async () => {
      const response = await fetch(record.detail_ref, {cache: "no-cache"});
      if (!response.ok) throw new Error(`Failed to load ${record.detail_ref}: HTTP ${response.status}`);
      const payload = await response.json();
      if (!payload?.record || payload.record.ruler_id !== id) throw new Error(`Detail payload ruler_id mismatch for ${id}`);
      const full = {...payload.record, detail_ref: record.detail_ref, detail_loaded: true};
      byId.set(id, full);
      Object.assign(DATA.source_availability, payload.source_availability || {});
      return full;
    })().finally(() => pendingNetRecords.delete(id));
    pendingNetRecords.set(id, pending);
    return pending;
  }

  async function renderNetRoute() {
    const parsed = parseNetRoute();
    if (!parsed) return false;
    const summary = byId.get(parsed.rulerId);
    nav("");
    if (!summary) {
      screen.innerHTML = `<div class="empty"><p>净收益详情地址无效。</p><a href="#overview">返回人物总览</a></div>`;
      return true;
    }
    const generation = ++netRenderGeneration;
    screen.innerHTML = `<div class="empty" role="status">正在加载${esc(summary.ruler_name)}的净收益计分逻辑…</div>`;
    try {
      const record = await loadNetRecord(summary);
      if (generation !== netRenderGeneration || !location.hash.startsWith("#net/")) return true;
      if (!record.net) {
        screen.innerHTML = `<div class="empty"><p>${esc(record.ruler_name)}没有可展示的净收益正式结算。</p><a href="#person/${encodeURIComponent(record.ruler_id)}">返回人物页</a></div>`;
        return true;
      }
      renderNetMajor(record, parsed.major, parsed.focus);
      window.scrollTo(0, 0);
    } catch (error) {
      console.error(error);
      if (generation === netRenderGeneration) {
        screen.innerHTML = `<div class="empty"><p>净收益计分详情加载失败。</p><p class="subline">人物总览与人物主页仍可正常使用。</p><a href="#person/${encodeURIComponent(summary.ruler_id)}">返回人物页</a></div>`;
      }
    }
    return true;
  }

  // #screen survives route changes, while child views are rebuilt. Enhance both
  // the overview table and the person page whenever their DOM appears.
  new MutationObserver(() => {
    enhanceHomeRows();
    enhancePersonNet();
  }).observe(screen, {childList: true, subtree: true});
  enhanceHomeRows();
  ensureNetStyles();
  enhancePersonNet();

  screen.addEventListener("click", event => {
    const polity = event.target.closest("[data-home-polity]");
    if (polity) {
      event.preventDefault();
      applyPolityFilter(polity.dataset.homePolity);
      return;
    }

    const grade = event.target.closest("[data-home-grade]");
    if (grade) {
      event.preventDefault();
      applyImpactFilter(grade.dataset.homeGrade);
      return;
    }

    if (event.target.closest(interactiveSelector)) return;
    const row = event.target.closest("tr[data-home-person]");
    if (!row) return;
    const cell = event.target.closest("td");
    openPersonSection(row.dataset.homePerson, cell?.dataset.homeSection || "");
  });

  screen.addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;

    const grade = event.target.closest("[data-home-grade]");
    if (grade) {
      event.preventDefault();
      applyImpactFilter(grade.dataset.homeGrade);
      return;
    }

    const cell = event.target.closest("td[data-home-section]");
    const row = cell?.closest("tr[data-home-person]");
    if (!cell || !row) return;
    event.preventDefault();
    openPersonSection(row.dataset.homePerson, cell.dataset.homeSection);
  });

  // Replace the original hash router with a thin extension that owns #net routes
  // and delegates every existing route unchanged. This keeps lazy person loading,
  // comparison, overview, and guide behavior intact.
  const baseRoute = route;
  window.removeEventListener("hashchange", baseRoute);
  route = function() {
    if (location.hash.startsWith("#net/")) {
      void renderNetRoute();
      return;
    }
    netRenderGeneration += 1;
    baseRoute();
  };
  window.addEventListener("hashchange", route);

  if (location.hash.startsWith("#net/")) void renderNetRoute();
})();
</script>

  async function loadFirstItemASettlement() {
    if (firstItemASettlementPromise) return firstItemASettlementPromise;
    firstItemASettlementPromise = fetch(`../${firstItemASettlementPath}?raw=1`, {cache: "force-cache"})
      .then(response => response.ok ? response.text() : "")
      .catch(() => "");
    return firstItemASettlementPromise;
  }

  function sanitizeFirstItemAReaderHow() {
    const record = currentFirstNetRecord();
    const item = firstNetItem(record, "A统一贡献");
    if (!record?.detail_loaded || !item?.reader_how || !/按统一贡献曲线换算/.test(item.reader_how)) return;
    item.reader_how = `${item.note || "按正式A项成果信用"}；按第一项A正式项目结算规则得到 ${item.value} 分。共同创业或跨代项目先形成项目A池，再按个人信用分账，个人信用不重复跑0.65次方。`;
  }

  async function enhanceFirstItemAExplanation() {
    const record = currentFirstNetRecord();
    const card = firstItemPublicCard("A · 统一主链客观贡献");
    if (!record?.detail_loaded || !card || card.dataset.aProjectExplained === "done" || card.dataset.aProjectExplained === "pending") return;
    card.dataset.aProjectExplained = "pending";
    const markdown = await loadFirstItemASettlement();
    if (!card.isConnected || currentFirstNetRecord()?.ruler_id !== record.ruler_id) return;
    const bullets = firstItemSettlementBullets(markdown, record.ruler_name);
    const project = bullets["项目总成果"] || "";
    const personal = bullets["本人取得/归属成果"] || "";
    const scale = bullets["取得/恢复成果"] || "";
    const content = bullets["成果内容"] || "";
    const calculation = bullets["计算"] || "";
    const result = bullets["结算结果"] || bullets["A结算"] || "";
    const shared = Boolean(project || personal);

    const uLabel = firstItemLabel(card, "U是什么意思");
    const uProse = uLabel?.nextElementSibling;
    if (uProse?.classList.contains("prose")) {
      uProse.textContent = shared
        ? "U = 有效控制信用。新增稳定控制按100%计，恢复旧有稳定控制按50%计。共同创业或跨代项目不能把每个人的U分别重跑非线性曲线：必须先用项目总U生成一次A池，再按个人信用零和分账。"
        : "U = 有效控制信用。新增稳定控制按100%计，恢复旧有稳定控制按50%计；1000代表一个全国核心统一尺度。单人/独立项目才直接把该项目U代入A曲线。";
    }

    const personLabel = firstItemLabel(card, "这个人的U怎么来");
    const personProse = personLabel?.nextElementSibling;
    const personText = shared
      ? [project, personal, content].filter(Boolean).join("\n")
      : [scale, content].filter(Boolean).join("\n");
    if (personText && personProse?.classList.contains("prose")) personProse.textContent = personText;

    const formula = Array.from(card.querySelectorAll(":scope > details")).find(details => details.querySelector(":scope > summary")?.textContent.trim() === "这个分怎么算？");
    const formulaProse = formula?.querySelector(":scope > .prose");
    if (formulaProse) {
      formulaProse.textContent = shared
        ? [
            "共同创业/跨代项目：先按项目总U计算一次项目A池，再按个人有效控制信用零和分账；个人U不能再次单独跑0.65次方。",
            project,
            personal,
            result ? `正式结算：${result}` : "",
          ].filter(Boolean).join("\n")
        : [
            "单人/独立项目：A = 120 × (min(1000, U) / 1000)^0.65，最后保留1位小数。",
            scale,
            calculation ? `本人的正式代入：${calculation}` : "",
            result ? `正式结算：${result}` : "",
          ].filter(Boolean).join("\n");
    }
    card.dataset.aProjectExplained = "done";
  }

  function enforceFirstItemStatus() {
    const record = currentFirstNetRecord();
    const group = firstItemGroup();
    if (!record?.detail_loaded || !group) return;
    const status = record.net?.first_item_status;
    const notice = group.querySelector(":scope > .notice");
    const saysNotApplicable = notice?.textContent.includes("本项不适用") || false;
    if (status === "APPLICABLE" && saysNotApplicable) {
      group.innerHTML = `<h3>第一项 · 奠基与统一</h3><p class="notice"><strong>正式状态为适用，但第一项明细没有完整加载。</strong>这里不能把“适用但净分为0”改写成“不适用”；请以正式第一项结算状态为准。</p>`;
      return;
    }
    if (status === "NOT_APPLICABLE" && !saysNotApplicable) {
      group.innerHTML = `<h3>第一项 · 奠基与统一</h3><p class="notice"><strong>本项不适用。</strong>这不代表军事能力差，只表示该人物没有进入“建国、复国或统一创业主链”的本项加分口径，因此第一项不参与净收益计分。</p>`;
    }
  }

  function enhanceFirstItemSummary() {
    const record = currentFirstNetRecord();
    const group = firstItemGroup();
    if (!record?.detail_loaded || !group || record.net?.first_item_status !== "APPLICABLE") return;
    const intro = group.querySelector(":scope > .reading-intro");
    if (intro && intro.dataset.firstSummary !== "done") {
      intro.innerHTML = "<strong>本项先按A统一主链客观贡献、B1创业难度与战略效率、B2创业组织与政治整合、C本人军事统帅与战争解题形成四轴毛分，再扣本人窗口内军事成本，得到第一项净分S1。</strong>S1再按统一曲线折算为进入总榜的附加分F；不适用与S1=0是两种不同状态。";
      intro.dataset.firstSummary = "done";
    }
    const total = group.querySelector(".first-item-total");
    if (!total) return;
    const components = total.querySelectorAll(":scope > .component");
    const firstStrong = components[0]?.querySelector("strong");
    const firstSmall = components[0]?.querySelector("small");
    const secondStrong = components[1]?.querySelector("strong");
    if (firstStrong) firstStrong.textContent = "第一项净分 S1（240分制）";
    if (firstSmall) firstSmall.textContent = "A、B1、B2、C合计后扣除本人窗口内军事成本，最低按0分计";
    if (secondStrong) secondStrong.textContent = "进入总榜的附加分 F";
    const standalone = Array.from(total.children).find(node => node.classList?.contains("prose"));
    if (standalone) standalone.textContent = "S1是第一项自身的240分制净分；F是S1经过统一曲线后的总榜附加分。两者量纲不同，不应直接比较大小。";
    const cost = firstNetItem(record, "军事成本扣分");
    const formula = Array.from(total.querySelectorAll(":scope > details")).find(details => details.querySelector(":scope > summary")?.textContent.trim() === "查看完整公式");
    if (cost?.value == null && formula) {
      formula.innerHTML = "<summary>查看完整公式</summary><p class=\"notice\"><strong>军事成本明细缺失，暂不展示汇总公式。</strong>缺失值不能按0分代入。</p>";
    }
  }

  function enhanceFirstItemB1Guide() {
    const card = firstItemPublicCard("B1 · 创业难度与战略效率");
    if (!card || card.dataset.b1Exceptions === "done") return;
    const label = firstItemLabel(card, "三个变量怎么读");
    const list = label?.nextElementSibling;
    if (!list || list.tagName !== "UL") return;
    const item = document.createElement("li");
    item.innerHTML = "<strong>多阶段／共同创业：</strong>独立目标分阶段完成时，各阶段单算效率，再按阶段A有效控制信用加权；同代共同创业若成果节点未拆清，则共用项目规模和核心闭合点，不能拿个人分账后的较小U重新缩短期望工期。";
    list.append(item);
    card.dataset.b1Exceptions = "done";
  }

  function firstCostCard() {
    return Array.from(document.querySelectorAll("#net-major-body .net-metric-detail")).find(card => card.querySelector(":scope > summary strong")?.textContent.trim() === "军事成本扣分") || null;
  }

  function enhanceFirstItemCost() {
    const record = currentFirstNetRecord();
    const item = firstNetItem(record, "军事成本扣分");
    const card = firstCostCard();
    if (!record?.detail_loaded || !item || !card || card.dataset.costExplained === "done") return;
    const match = String(item.grade || "").match(/^(C[0-7])\s*\/\s*(LOW|MID|HIGH|HIGHEST)$/);
    if (!match) return;
    const [, band, position] = match;
    const body = card.querySelector(":scope > .net-metric-body");
    if (!body) return;
    const oldLogicLabel = Array.from(body.querySelectorAll(":scope > .label")).find(label => label.textContent.trim() === "当前人物结算逻辑");
    if (oldLogicLabel) oldLogicLabel.textContent = "计分理由";
    const current = document.createElement("div");
    current.className = "first-cost-explainer";
    const mappedDebit = firstCostDebits[band]?.[position];
    current.innerHTML = `<div class="label">当前军事成本档</div><p class="prose"><strong>${band} · ${firstCostPositionName[position] || position}</strong>：${firstCostBandMeaning[band]}；${firstCostPositionMeaning[position] || ""}。</p><p class="notice">这里的“成本${band}”衡量的是本方军事投入与毁损，不是第一项C“本人军事统帅能力”的C-${band.slice(1)}档；两套C完全独立。</p><details><summary>C0—C7大致怎么读？</summary><ul>${Object.entries(firstCostBandMeaning).map(([key, text]) => `<li><strong>${key}</strong>：${esc(text)}</li>`).join("")}</ul></details><details><summary>档位怎样换成扣分？</summary><p class="prose">先定成本档，再比较同档中的规模、核心角色、动员后勤、时长、战区与重建情况确定低／中／高位置；最后查第一项固定扣分表。当前为 <strong>${band} · ${firstCostPositionName[position] || position}</strong>${mappedDebit == null ? "" : `，对应扣 ${mappedDebit} 分`}。页面正式扣分为 ${esc(String(item.value))} 分。</p></details>`;
    body.prepend(current);
    card.dataset.costExplained = "done";
  }

  function enhanceFirstItemCommandGuide() {
    if (!currentFirstNetRecord()?.detail_loaded) return;
    const card = document.getElementById("net-first-c");
    if (!card || card.dataset.commandGuide === "done") return;
    const body = card.querySelector(":scope > .net-metric-body");
    if (!body) return;
    const audit = body.querySelector(":scope > .net-audit-sources");
    const guide = document.createElement("div");
    guide.className = "first-command-guide";
    guide.innerHTML = `<details><summary>战役标记怎样读？</summary><p class="prose"><strong>S−/D3</strong>不是一个总等级，而是第一项C采用的一条战役证据锚中的两个独立标签。必须先看它落在哪个责任层级：人物级登记存在更精确的<strong>个人战果／个人任务难度</strong>时，按人物级标签读；只有责任路线本来就在消费整场战役或高层战略结果时，才按相应的整场／统筹层级读，不能默认把父战役总档转给本人。</p><ul><li><strong>结果档</strong>：C=局部战术结果；B=重要单项目标；A=主要区域、门户、主力集团或重大阶段结果；S−=强区域终局、核心根据地或长期独立战略方向；S=决定性击败第一梯队竞争极或国家级终局；S+=多个第一梯队竞争极／统一终局等最高结果。</li><li><strong>难度档</strong>：D0=几乎未形成有效军事对抗；D1=本方明显优势；D2=有一项重大难点但总体风险可控；D3=两项以上重大约束相互强化，需要高质量一线统帅；D4=极端劣势、被围断粮、濒临崩溃或连续败退后的临阵逆转。</li></ul><p class="notice"><strong>不要把战役档案主卡和人物责任块混成一把尺。</strong>战役档案主卡显示“整场战役战果／整场战役难度”，责任人物块显示“个人战果／个人任务难度”。同一战役出现“整场难度D3、个人任务难度D4”可以同时成立；前者描述整场问题，后者只描述该人物实际承担并闭合的部分。</p><p class="prose">因此看到第一项C里的S−/D3后，应先确认它消费的是哪一级责任记录，再解释“结果有多大、本人面对的问题有多难”。结果档高不等于难度一定高，难度高也不保证结果优秀。</p><p class="sources">${link("docs/证据规则/公共成果登记与人物画像规则.md", "战役结果与难度正式规则 ↗")} <a href="military.html">打开战役与武将档案 →</a></p></details><details><summary>这些战役怎样形成第一项C档？</summary><p class="prose">第一项C<strong>不是把S、A、D3、D4换成分数后求和或平均</strong>。战役登记只是证据锚，最终按下面的顺序整体裁决：</p><ol><li><strong>先过责任门</strong>：只采用本人真正承担的战略统筹、实际主帅或临阵指挥；逐人结算里的战役标记也必须按这条责任链解释。普通任将、批准出兵、国家总成果和下属独立判断不能转给本人。</li><li><strong>再过窗口门</strong>：只看第一项建国、复国、统一或政权取得主链；主链闭合后的成熟扩张、防务不能拿来抬本项C。</li><li><strong>看正向证据结构</strong>：最高峰值、是否有独立复核、D3/D4高难成果、不同战区与战争形态的跨度，以及高层统筹和前线能力是否能反复成立。</li><li><strong>加入负向证据</strong>：本人可归责的重大失败、同类错误复发和未纠偏会压低档位或档内位置；敌强、天气、史源冲突或下属失败本身不算本人败责。</li><li><strong>最后定C档与档内位置</strong>：C-0=无可用本人军事责任证据；C-1=基础统帅；C-2=重要统帅；C-3=优秀统帅；C-4=顶级统帅；C-5=历史级统帅。低／中／高位再映射到0—40分。</li></ol><p class="prose">一个高质量闭环但没有独立复核，最高只能到C-3；C-4、C-5必须跨情境稳定成立。因此“一场S/D4”不会自动等于C-5，多场A/D3也不是简单相加。</p><p class="prose">公共军事人才登记中的“elite / top / historic”等全生涯聚合标签可以帮助复核证据厚度，但它有自己的窗口和聚合门槛，<strong>不能机械换算成第一项C</strong>。</p><p class="sources">${link("docs/分项规则/第一项政权奠基与统一贡献及能力/00-规则与计分合同.md#5-c本人军事统帅与战争解题能力40", "第一项C正式档位规则 ↗")} ${link("docs/评分结算/净收益/第一项政权奠基与统一贡献及能力/05-第一项C战役标记与统帅档聚合说明.md", "C战役标记与聚合说明 ↗")}</p></details>`;
    if (audit) body.insertBefore(guide, audit);
    else body.append(guide);
    card.dataset.commandGuide = "done";
  }

  function battleTerms(text) {
    const found = [];
    const re = /([\u3400-\u9fff]{2,8}(?:[—－-][\u3400-\u9fff]{2,8})?)(S\+|S-|S−|S|A|B|C)\/(D[0-4])/g;
    for (const match of String(text || "").matchAll(re)) {
      const term = match[1];
      if (!found.includes(term)) found.push(term);
      if (found.length >= 10) break;
    }
    return found;
  }

  let firstBattleIndexPromise;
  async function enhanceFirstItemBattleLinks() {
    const card = document.getElementById("net-first-c");
    if (!card || card.dataset.battleLinks) return;
    const labels = Array.from(card.querySelectorAll(".net-metric-body > .label"));
    const label = labels.find(node => node.textContent.trim() === "当前人物为什么是这个档");
    const prose = label?.nextElementSibling;
    if (!prose?.classList.contains("prose")) return;
    card.dataset.battleLinks = "loading";
    let index;
    try {
      firstBattleIndexPromise ||= fetch("data/military/battles-index.json").then(response => {
        if (!response.ok) throw new Error("战役索引暂不可用");
        return response.json();
      });
      index = await firstBattleIndexPromise;
    } catch {
      firstBattleIndexPromise = null;
      card.dataset.battleLinks = "unavailable";
      const notice = document.createElement("p");
      notice.textContent = "战役索引暂未加载，可进入军事档案按事件名查找。";
      prose.insertAdjacentElement("afterend", notice);
      return;
    }
    if (!card.isConnected) return;
    const ruler = card.dataset.ruler;
    const rows = (index.first_item_c_anchors || []).filter(row => row.ruler === ruler);
    const seen = new Set();
    const links = rows.flatMap(row => {
      const resolved = row.status === "resolved_unique" && row.battle_id;
      const key = resolved || "related-person-records";
      if (!key || seen.has(key)) return [];
      seen.add(key);
      const title = resolved ? index.records.find(record => record.id === resolved)?.name || row.anchor : `${ruler}的相关军事记录（含概括性引文）`;
      return [`<a href="military.html#${resolved ? "battle=" + encodeURIComponent(resolved) : "evidence=" + encodeURIComponent(ruler)}">${esc(title)} →</a>`];
    });
    if (!links.length) { card.dataset.battleLinks = "done"; return; }
    const block = document.createElement("div");
    block.className = "first-battle-links";
    block.innerHTML = `<div class="label">相关战役档案</div><p class="sources">${links.join(" ")}</p>`;
    prose.insertAdjacentElement("afterend", block);
    card.dataset.battleLinks = "done";
  }

  function enhance() {
    foldHomeStatus();
    compactComparisonEvidence();
    simplifyDifferenceToggle();
    publicGradeHelp();
    publicAxisMetadata();
    translateResidualAxisCodes();
    sanitizeFirstItemAReaderHow();
    enforceFirstItemStatus();
    enhanceFirstItemSummary();
    enhanceFirstItemB1Guide();
    enhanceFirstItemAExplanation();
    enhanceFirstItemCost();
    enhanceFirstItemCommandGuide();
    enhanceFirstItemBattleLinks();
  }

  new MutationObserver(enhance).observe(screen, {childList: true, subtree: true});
  enhance();
})();
</script>
<script>
"use strict";

(() => {
  const normalized = value => {
    if (Array.isArray(value)) return value.map(normalized).filter(Boolean).join("\n");
    if (value && typeof value === "object") return JSON.stringify(value);
    return String(value ?? "").replace(/\s+/g, " ").trim();
  };

  const fragment = html => {
    const template = document.createElement("template");
    template.innerHTML = html;
    return template.content;
  };

  const directLabels = details => Array.from(details.children).filter(
    node => node.classList && node.classList.contains("label")
  );

  const c5PublicText = value => {
    if (Array.isArray(value)) return value.map(c5PublicText);
    if (typeof value !== "string") return value;
    return value
      .replace(/\bC5\b/g, "本轴")
      .replace(/COUNTEREVIDENCE_FOUND/g, "已找到明确反例")
      .replace(/高档反例审查/g, "反例检查")
      .replace(/父链/g, "证据链");
  };

  const impactPublicText = value => String(value ?? "")
    .replace(/取基础([SABCDE](?:[+−-])?)/g, "，基础影响量级为$1")
    .replace(/([SABCDE](?:[+−-])?)个人因果/g, "个人因果$1")
    .replace(/上调至内部([SABCDE](?:[+−-])?)/g, "使最终判断上调为$1")
    .replace(/内部([SABCDE](?:[+−-])?)/g, "综合判断$1")
    .replace(/公众([SABCDE](?:[+−-])?)/g, "最终等级$1")
    .replace(/不增加第二份深度/g, "不重复计入深度")
    .replace(/抬升基础/g, "提高基础影响量级");

  const historyPublicText = value => readerText(String(value ?? ""))
    .replace(/\bNEGATIVE\b/g, "负向")
    .replace(/\bPOSITIVE\b/g, "正向")
    .replace(/\bMIXED\b/g, "正负混合")
    .replace(/负向\s*\/\s*持续系统性情境/g, "持续系统性负向情境")
    .replace(/正向\s*\/\s*持续系统性情境/g, "持续系统性正向情境")
    .replace(/正负混合\s*\/\s*持续系统性情境/g, "持续系统性正负混合情境")
    .replace(/项目正式战役群/g, "正式战役材料")
    .replace(/项目重审明确把/g, "现有裁决将")
    .replace(/项目(?:M1|M2|M4|M5|C1|C2|C3|C4|C5)明确指出/g, "相关人物画像材料指出")
    .replace(/项目(?:M1|M2|M4|M5|C1|C2|C3|C4|C5)因此把这一链裁为/g, "相关人物画像材料将这一链认定为")
    .replace(/项目(?:M1|M2|M4|M5|C1|C2|C3|C4|C5)/g, "相关人物画像材料");

  function firstItemBullets(markdown, rulerName) {
    if (!markdown || !rulerName) return {};
    const escaped = rulerName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const heading = new RegExp(`^###\\s+\\d+\\.\\s+${escaped}\\s*$`, "m");
    const match = heading.exec(markdown);
    if (!match) return {};
    const tail = markdown.slice(match.index + match[0].length);
    const next = tail.search(/^###\s+\d+\./m);
    const section = next >= 0 ? tail.slice(0, next) : tail;
    const result = {};
    for (const line of section.split(/\r?\n/)) {
      const bullet = line.match(/^-\s+\*\*(.+?)\*\*：\s*(.*)$/);
      if (!bullet) continue;
      result[bullet[1].trim()] = bullet[2].replace(/\*\*/g, "").replace(/`/g, "").trim();
    }
    return result;
  }
