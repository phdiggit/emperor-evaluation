/* Link affordance for pointer users: visible but deliberately quieter than buttons. */
#screen a {
  border-radius: 3px;
  text-decoration-thickness: 1px;
  text-underline-offset: .2em;
  text-decoration-color: color-mix(in srgb, currentColor 42%, transparent);
}

/* Buttons and disclosure headings share one restrained interaction language. */
header nav button,
#screen button,
#screen summary {
  transition: color .16s ease, background-color .16s ease, border-color .16s ease,
              box-shadow .16s ease, transform .16s ease;
}

#screen summary {
  border-radius: 4px;
  list-style: none;
  padding: 3px 28px 3px 5px;
  margin-left: -5px;
  position: relative;
}

#screen summary::-webkit-details-marker {
  display: none;
}

#screen summary::after {
  content: "›";
  position: absolute;
  right: 7px;
  top: 50%;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
  transform: translateY(-50%);
  transform-origin: 50% 50%;
  transition: color .16s ease, transform .18s ease;
}

#screen details[open] > summary::after {
  color: var(--red);
  transform: translateY(-50%) rotate(90deg);
}

/* Ruler names behave like textual entry points rather than generic controls. */
#screen td.name button {
  position: relative;
  border-radius: 2px;
  transition: color .16s ease, transform .16s ease;
}

#screen td.name button::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: -3px;
  height: 1px;
  background: currentColor;
  transition: right .18s ease;
}

/* Home-table cells are direct entry points into the matching person-page section. */
#screen .home-click-row,
#screen .home-jump-cell {
  transition: background-color .16s ease, box-shadow .16s ease;
}

#screen .home-jump-cell {
  cursor: pointer;
  position: relative;
}

#screen .home-jump-cell::after {
  content: "↗";
  position: absolute;
  right: 8px;
  top: 6px;
  color: var(--muted);
  font-size: 11px;
  opacity: 0;
  transform: translate(-2px, 2px);
  transition: opacity .16s ease, transform .16s ease, color .16s ease;
}

#screen .home-jump-cell:focus-visible,
#screen .impact-grade[data-home-grade]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: -3px;
}

#screen .inline-table-filter {
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--green);
  font-size: inherit;
  line-height: inherit;
}

#screen .impact-grade[data-home-grade] {
  cursor: pointer;
  border-radius: 3px;
  padding: 0 2px;
  margin-left: -2px;
  transition: color .16s ease, background-color .16s ease, box-shadow .16s ease;
}

@media (hover: hover) and (pointer: fine) {
  #screen a {
    background-image: linear-gradient(currentColor, currentColor);
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 0 1px;
    transition: color .16s ease, background-size .2s ease, background-color .16s ease, box-shadow .16s ease;
  }

  #screen a:hover {
    color: var(--red);
    background-size: 100% 1px;
    background-color: color-mix(in srgb, var(--gold) 9%, transparent);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--gold) 22%, transparent);
    text-decoration-color: transparent;
  }

  #screen .axis-row a:hover,
  #screen .compact-axis a:hover,
  #screen .person-nav a:hover {
    text-decoration: none;
  }

  #screen .person-nav a:hover {
    color: var(--ink);
    background-color: color-mix(in srgb, var(--gold) 13%, transparent);
    box-shadow: none;
  }

  header nav button:hover,
  #screen button:hover {
    transform: translateY(-1px);
    border-color: color-mix(in srgb, var(--gold) 58%, var(--line));
    background-color: color-mix(in srgb, var(--gold) 8%, transparent);
    box-shadow: 0 4px 10px color-mix(in srgb, var(--ink) 9%, transparent);
  }

  header nav button.active:hover,
  #screen button.primary:hover {
    background-color: color-mix(in srgb, var(--ink) 92%, var(--gold));
    border-color: var(--ink);
    color: white;
  }

  #screen .candidate-grid button:hover {
    background-color: color-mix(in srgb, var(--gold) 11%, #fcfbf7);
  }

  #screen td.name button:hover {
    color: var(--red);
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    transform: translateX(2px);
  }

  #screen td.name button:hover::after {
    right: 0;
  }

  #screen summary:hover {
    color: var(--red);
    background-color: color-mix(in srgb, var(--gold) 8%, transparent);
  }

  #screen summary:hover::after {
    color: var(--red);
  }

  #screen .home-click-row:hover {
    background-color: color-mix(in srgb, var(--gold) 3%, transparent);
  }

  #screen .home-jump-cell:hover {
    background-color: color-mix(in srgb, var(--gold) 9%, transparent);
    box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--gold) 34%, transparent);
  }

  #screen .home-jump-cell:hover::after {
    color: var(--red);
    opacity: .72;
    transform: translate(0, 0);
  }

  #screen .inline-table-filter:hover {
    color: var(--red);
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    transform: none;
    text-decoration: underline;
    text-underline-offset: .18em;
  }

  #screen .impact-grade[data-home-grade]:hover {
    color: color-mix(in srgb, var(--red) 88%, var(--ink));
    background-color: color-mix(in srgb, var(--red) 7%, transparent);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--red) 18%, transparent);
  }

  header nav button:active,
  #screen button:active {
    transform: translateY(0);
    box-shadow: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  #screen a,
  header nav button,
  #screen button,
  #screen summary,
  #screen summary::after,
  #screen td.name button,
  #screen td.name button::after,
  #screen .home-click-row,
  #screen .home-jump-cell,
  #screen .home-jump-cell::after,
  #screen .impact-grade[data-home-grade] {
    transition: none;
  }

  header nav button:hover,
  #screen button:hover,
  #screen td.name button:hover,
  #screen .home-jump-cell:hover::after {
    transform: none;
  }
}

const format=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function prose(t){if(Array.isArray(t))return t.length?t.map(prose).join(''):'';if(t&&typeof t==='object')return Object.entries(t).map(([k,v])=>`<div class="label">${esc(k)}</div>${prose(v)}`).join('');if(!t)return '';return String(t).split(/\n\s*\n/).map(block=>`<p class="prose">${format(block)}</p>`).join('')}
// Display names follow the profile contract, section 2.3. No prose-based classification.
const materialIntensityNames={MI1_CASE:'单一情境',MI2_LIFECYCLE:'完整生命周期情境',MI3_SUSTAINED_SYSTEMIC:'持续系统性情境',MI4_CROSS_PHASE_SYSTEMIC:'跨阶段系统性情境'};
const formalDirectionNames={POSITIVE:'正向',NEGATIVE:'负向',MIXED_POSITIVE:'混合偏正',MIXED_NEGATIVE:'混合偏负',MIXED:'正负混合',LIMITATION:'限制／边界'};
function nonEmptyFormal(value){
 if(Array.isArray(value))return value.length>0;
 if(value&&typeof value==='object')return Object.keys(value).length>0;
 return value!==null&&value!==undefined&&String(value).trim()!=='';
}
function contextDirection(c){
 if(!nonEmptyFormal(c?.direction))return '';
 const raw=String(c.direction);
 return Object.prototype.hasOwnProperty.call(formalDirectionNames,raw)?formalDirectionNames[raw]:raw;
}
function contextIntensityEntries(c){
 return ['intensity','material_intensity']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>[k,c[k]]);
}
function contextIntensity(c){
 const entries=contextIntensityEntries(c);
 if(!entries.length)return '未列';
 const rawValues=entries.map(([,v])=>String(v));
 if(rawValues.length>1&&rawValues.some(v=>v!==rawValues[0]))return '上游字段不一致，请查原始记录';
 const raw=rawValues[0];
 return Object.prototype.hasOwnProperty.call(materialIntensityNames,raw)
  ? materialIntensityNames[raw]
  : '未设中文展示，请查原始记录';
}
function formalMetaChip(label,value,extraClass=''){
 if(!nonEmptyFormal(value))return '';
 return `<span class="formal-context-chip ${extraClass}"><strong>${esc(label)}</strong><span>${esc(String(value))}</span></span>`;
}
function formalMetaField(label,value,extraClass=''){
 if(!nonEmptyFormal(value))return '';
 return `<div class="formal-context-meta-row ${extraClass}"><strong>${esc(label)}</strong>${axisProse(value)}</div>`;
}
function formalContextRawIntensity(c){
 const entries=contextIntensityEntries(c);
 if(!entries.length)return '';
 return entries.map(([k,v])=>`${k}=${typeof v==='string'?v:JSON.stringify(v)}`).join('；');
}
function formalContextMetadata(c,{showIntensity=true}={}){
 const direction=contextDirection(c);
 const intensityEntries=contextIntensityEntries(c);
 const attrs=['attribution','attribution_basis','role_attribution']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>c[k]);
 const limits=['limitations','limitation']
  .filter(k=>Object.prototype.hasOwnProperty.call(c||{},k)&&nonEmptyFormal(c[k]))
  .map(k=>c[k]);
 const chips=[];
 const details=[];
 if(direction)chips.push(formalMetaChip('方向',direction,'context-direction'));
 if(showIntensity&&intensityEntries.length)chips.push(formalMetaChip('材料强度',contextIntensity(c),'context-intensity'));
 for(const value of attrs)details.push(formalMetaField('归责',value));
 for(const value of limits)details.push(formalMetaField('限制',value));
 if(!chips.length&&!details.length)return '';
 return `<div class="formal-context-meta">${chips.length?`<div class="formal-context-chips">${chips.join('')}</div>`:''}${details.length?`<div class="formal-context-meta-details">${details.join('')}</div>`:''}</div>`;
}
function formalContextSources(c){
 const refs=[...(c?.source_refs||[]),...(c?.cycle_anchor_refs||[]),...(c?.direct_process_refs||[])].filter(ref=>typeof ref==='string'&&ref);
 return [...new Set(refs)];
}
function formalContextStory(c,id='',options={}){
 if(!c)return prose(id?'情境引用：'+id:'正式记录未列情境正文');
 const rawTitle=String(c.title||'').trim();

 const sources=(id||refs.length||rawIntensity)?`<details class="metadata"><summary>该情境的来源与原始标注</summary>${id?`<p class="subline">${esc(id)}</p>`:''}${rawIntensity?`<p class="subline">材料强度原始字段：${esc(rawIntensity)}</p>`:''}${refs.map(ref=>/^(docs\/|config\/|archive\/|https?:\/\/)/.test(ref)?link(ref,'来源原文 ↗'):prose(ref)).join('')}</details>`:'';
 return `<div class="context-story formal-context-story">${title}${formalContextMetadata(c,options)}${body?axisProse(body):''}${sources}</div>`;
}

 const simple=()=>`<div class="home-simple-list">${rows.map(r=>`<article class="home-simple-card"><div class="home-simple-identity"><button data-person="${r.ruler_id}">${esc(personLabel(r))}</button><small><button type="button" class="inline-table-filter" data-home-polity="${esc(r.polity)}">${esc(r.polity)}</button> · 掌权背景：${esc(r.actual_power_window||'未列')}</small></div><div class="home-simple-cell"><span class="home-simple-label">统治绩效</span>${r.net?`<b class="home-simple-score">${number(r.net.total_score)}</b><small>第 ${r.net.rank} 名 / ${DATA.ranked_count}</small>`:`<span class="muted">${esc(missingNetLabel(r))}</span>`}<button class="home-simple-action" data-home-open="${r.ruler_id}" data-home-section="person-outcome">查看结果 →</button></div><div class="home-simple-cell"><span class="home-simple-label">人物画像</span>${r.supplementary?'<span class="muted">不在人物画像主池</span>':`<button class="home-simple-profile" data-home-open="${r.ruler_id}" data-home-section="person-capability">查看人物画像 →</button>`}</div><div class="home-simple-cell"><span class="home-simple-label">历史影响</span><button class="home-simple-impact" data-home-grade="${esc(r.impact.public_grade)}"><b class="impact-grade">${esc(r.impact.public_grade)}</b> <span class="badge">${esc(r.impact.impact_nature)}</span></button><small>判断把握：${conf(r.impact.confidence)}</small><button class="home-simple-action" data-home-open="${r.ruler_id}" data-home-section="person-impact">查看影响 →</button></div><div class="home-simple-compare"><button data-select="${r.ruler_id}" aria-pressed="${state.compare.includes(r.ruler_id)}">${state.compare.includes(r.ruler_id)?'已选':'加入对照'}</button></div></article>`).join('')}</div>`;
 const full=()=>`<div class="table-wrap"><table><thead><tr><th>人物 / 掌权背景</th><th>统治绩效 · 正式总分</th><th>人物画像 · 八轴能力＋权力风格</th><th>历史影响 · 等级</th><th>对照</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="name"><button data-person="${r.ruler_id}">${esc(personLabel(r))}</button><small>${esc(r.polity)} · 掌权背景：${esc(r.actual_power_window||'未列')}</small></td><td>${r.net?`<span class="number">${number(r.net.total_score)}</span><small>第 ${r.net.rank} 名 / ${DATA.ranked_count}</small>`:`<span class="muted">${esc(missingNetLabel(r))}</span>`}</td><td>${r.supplementary?'—':`<div class="overview-axes">${DATA.capability_axes.map(c=>`<span title="${esc(DATA.axis_specs[c].name)}">${esc(shortNames[c])} <b>${grade(r.axes[c])}</b></span>`).join('')}</div><div class="overview-style">${DATA.independent_axes.map(c=>`<span>${esc(DATA.axis_specs[c].name)} <b>${grade(r.axes[c])}</b>${c==='C5'?'<small class="c5-inline-hint">S端＝更克制</small>':''}</span>`).join('')}</div>`}</td><td><span class="impact-grade">${esc(r.impact.public_grade)}</span> <span class="badge">${esc(r.impact.impact_nature)}</span><small>判断把握：${conf(r.impact.confidence)}</small></td><td><button data-select="${r.ruler_id}" aria-pressed="${state.compare.includes(r.ruler_id)}">${state.compare.includes(r.ruler_id)?'已选':'加入对照'}</button></td></tr>`).join('')}</tbody></table></div>`;
 document.getElementById('rows').innerHTML=rows.length?(view==='full'?full():simple()):'<div class="empty">没有匹配人物。试试其他姓名、朝代或档位。</div>';
 document.getElementById('selection').textContent=state.compare.length?`已选：${state.compare.map(id=>personLabel(byId.get(id))).join('、')}。点击“并列对照”查看；再次点击可取消。`:'';
}
function netPanel(r){
 const n=r.net;
 return `<section id="person-outcome" class="panel net"><div class="eyebrow">01 / 统治结果</div><h2>统治绩效</h2><p class="subline">看治国、军事、统一与文明整合如何共同构成统治绩效</p>${n?`<div class="big">${number(n.total_score)}</div><span class="badge">统治绩效第 ${n.rank} 名 / ${DATA.ranked_count}</span>${`<div class="component"><span>治国成效</span><b>${number(n.second_item_score)}</b></div><div class="component"><span>军事与边疆</span><b>${number(n.third_item_score)}</b></div>`}${firstAddOnComponent(n)}${`<div class="component"><span>文明与国家整合</span><b>${signedAdjustment(n.fourth_item_adjustment)}</b></div>`}<p class="subline">分差不表示历史贡献的倍数，也不是百分制。</p><details><summary>这个分数怎么来的？</summary><p>总分由上列四项构成。它包含合同规定的结果与过程分量，不是货币收益减成本；零分也不代表每个方面都没有收益或损害。</p><p>第一项${n.first_item_status==='APPLICABLE'?(Number(n.first_item_raw_score)===0?'适用，但原始净收益为0，附加分为0；这与“不适用”不同':`原始净收益为 ${number(n.first_item_raw_score)}，按公式折算为附加分 ${number(n.first_item_add_on)}；原始净收益不再重复相加`):'不适用，附加分按0计入总分；不代表能力失败'}。</p><p class="subline">${esc(DATA.formula)}</p>${n.weight_sensitivity?.all_scenarios?`<p><strong>换一套合理权重，名次会变化多少？</strong> 在已声明的 ${DATA.weight_sensitivity.scenario_count} 种权重情景中，名次范围为第 ${n.weight_sensitivity.all_scenarios.best}—${n.weight_sensitivity.all_scenarios.worst} 名。</p><p class="subline">这是有限权重情景的结果，不是置信区间，也不包含史料或裁决不确定性。正式名次仍使用基准权重。</p>`:''}${link('docs/项目总纲/皇帝统治绩效评价合同.md','计分合同与情景设定 ↗')}</details>`:`<div class="big">—</div><p>${r.supplementary?'补充历史样本，不纳入统治绩效正式评价范围。':'未进入统治绩效总榜，不能按零分理解。'}</p><p class="subline">${esc(({PENDING_SECOND_ITEM_FORMAL_SETTLEMENT:'第二项正式结算待补',PENDING_THIRD_ITEM_FORMAL_SETTLEMENT:'第三项正式结算待补',PENDING_FIRST_ITEM_FORMAL_SETTLEMENT:'第一项正式结算待补',SUPPLEMENTARY:'历史影响池外补充样本'}[r.settlement_readiness]||r.settlement_readiness))}</p>`}<p class="sources">${link(DATA.sources.net_reader,'统治绩效详情 ↗')}</p></section>`;
}

function impactPanel(r){const h=r.impact;return `<section id="person-impact" class="panel impact"><div class="eyebrow">03 / 历史后效</div><h2>历史影响</h2><p class="subline">路径改变的规模、深度与归责</p><p class="subline">先看范围与深度定基础，再看本人归责；政治范式只作有限补充。</p><div class="big" style="color:var(--red)">${esc(h.public_grade)}</div><p>${esc(impactMeaning[h.public_grade]||'')}</p><span class="badge">${esc(h.impact_nature)}</span> <span class="subline">判断把握：${conf(h.confidence)}</span><p class="subline confidence-note">表示证据与归责判断的稳定程度，不表示影响大小。</p>${impactScaleNote()}<div class="dimensions">${Object.entries(dimNames).map(([k,n])=>`<div class="impact-dimension-card"><a href="#history-dimension-${k}" data-section="history-dimension-${k}" aria-label="查看${esc(n)}依据"><span>${esc(n)}</span><b>${esc(h.dimensions[k]?.grade||'—')}</b><small class="impact-dimension-question">${esc(impactDimensionQuestions[k]||'查看本维度依据')}</small><small>查看依据 ↓</small></a></div>`).join('')}</div>${gradeHelp('impact')}<p class="sources"><a href="#history-evidence" data-section="history-evidence">查看历史影响详情 ↓</a></p></section>`}

function axisEvidence(r,c,suffix=''){
 const a=r.axes[c],spec=DATA.axis_specs[c];if(!a)return '';
 const structuredCounter=a.counterpattern&&typeof a.counterpattern==='object'&&!Array.isArray(a.counterpattern);
 const formalMaterials=structuredCounter?contexts(a):representativeContexts(a);
 const counterText=!structuredCounter&&a.counterpattern?'<div class="label">反例与限制</div>'+axisProse(a.counterpattern):'';
 const further=`${formalMaterials}${publicEvidencePoints(a)}${counterText}<details class="metadata adjudication"><summary>裁决详情：定档、档内定位与限制</summary><div class="label">定档依据（原文）</div>${axisProse(a.grade_basis)}<div class="label">档内定位（原文）</div>${axisProse(a.position_basis)}<div class="label">限制与证据边界（原文）</div>${axisProse(a.limitations)}${axisProse(a.evidence_assessment_basis)}${a.no_grade_closure?`<div class="label">复查范围</div>${axisProse(a.no_grade_closure.review_scope)}<div class="label">证据缺口</div>${axisProse(a.no_grade_closure.evidence_gap)}<div class="label">重开条件</div>${axisProse(a.no_grade_closure.reopen_condition)}`:''}</details>`;
 return `<details id="reason-${c}${suffix}" class="axis-evidence"><summary>${esc(spec.name)} <span class="badge">${grade(a)}</span></summary>${ungraded(a)?'<p class="notice">证据审查已结案，本轴不发布等级或分数；不表示能力低下。</p>':''}${pending(a)?'<p class="notice">本轴当前尚未完成裁决；历史保留值不作为现行等级或雷达值。</p>':''}<div class="label">这个判断主要依据什么表现？</div>${axisProse(a.typical_pattern||a.not_applicable_reason||'本轴未另列人物表现，请展开裁决详情。')}${a.assessment_basis==='NO_DEMONSTRATED_CAPABILITY'?'<p class="notice">本轴E为终局证据认定：现有材料未显示外交能力。它与已证实外交失能的裁决分开，不表示史料已证明潜在能力为零。</p>':''}${a.applicability_basis?'<div class="label">适用范围</div>'+axisProse(a.applicability_basis):''}<details class="axis-further-check"><summary>进一步核对：代表情境、反例与限制</summary>${further}</details><details class="metadata"><summary>原始记录与专业信息</summary><p class="subline">展示模式：${esc(mode(a.output_mode))} · 判断把握：${esc(conf(a.confidence))} · ${ungraded(a)?'当前状态：无档结案':pending(a)?'当前状态：'+grade(a):a.applicability_status==='NOT_APPLICABLE'||a.output_mode==='NOT_APPLICABLE'?'当前状态：不适用':'公开等级：'+grade(a)}</p>${(a.source_refs||[]).map(ref=>/^(docs\/|config\/|archive\/|https?:\/\/)/.test(ref)?'<p class="sources">'+link(ref,ref)+'</p>':prose(ref)).join('')}<p class="sources">${link(spec.markdown,'本轴完整阅读页 ↗',r)}${link(spec.json+'#ruler_id='+r.ruler_id,'正式记录入口 ↗')}</p></details></details>`;
}
function person(r){
 nav('');if(!r){screen.innerHTML='<p>未找到该人物。</p><button data-home>返回人物总览</button>';return}
 screen.innerHTML=`<button class="back" data-home>← 人物总览</button><div class="person-head"><div><div class="eyebrow">${esc(r.polity)} / 三套评价</div><h1>${esc(personLabel(r))}</h1><p class="muted">掌权背景：${esc(r.actual_power_window||'未列')} ${r.supplementary?'<span class="scope-label">· 补充历史样本</span>':''}</p></div><button data-person-compare="${r.ruler_id}">选择另一人对照 →</button></div><p class="subline power-context-note">${esc(powerContextNote)}</p><nav class="person-nav" aria-label="人物页章节"><a href="#person-outcome" data-section="person-outcome">统治绩效</a><a href="#person-capability" data-section="person-capability">人物画像</a><a href="#person-impact" data-section="person-impact">历史影响</a></nav><div class="three overview-panels">${netPanel(r)}<section id="person-capability" class="panel profile"><div class="eyebrow">02 / 人物画像</div><h2>人物画像</h2><p class="subline">八轴能力与权力风格分别评价</p>${r.supplementary?'<p>该对象只作为补充历史样本，不进入本展示的人物画像主池。</p>':`<h3>八轴能力</h3><div class="compact-axes">${axisRows(r,DATA.capability_axes)}</div><div class="style-axis"><h3>权力运用风格</h3>${axisRows(r,DATA.independent_axes)}</div>${gradeHelp('profile')}<p class="sources"><a href="#profile-evidence" data-section="profile-evidence">人物画像详情 ↓</a></p>`}</section>${impactPanel(r)}</div><section id="person-evidence" class="evidence reading-wide">${r.net?`<section class="panel"><h3>统治绩效构成</h3>${netGroups(r)}</section>`:''}<section id="profile-evidence" class="panel evidence"><h2>人物画像详情</h2><p class="subline evidence-layer-guide">默认先读主要表现；需要时再展开“进一步核对”和“原始记录”。</p>${!r.supplementary?`<details><summary>查看八轴能力雷达</summary>${radar(r)}<p class="subline">E−在中心，S+在外缘，相邻等级等距。只展示能力结构；权力运用与克制不并入能力图，不按面积、均值或比例比较整体能力。</p></details>${DATA.axis_order.map(c=>axisEvidence(r,c)).join('')}`:'<p>该补充历史样本不在人物画像正式评价范围内。</p>'}</section><section id="history-evidence" class="panel evidence">${historySections(r)}</section></section>`;
}

function compare(){
 nav('compare');if(state.compare.length<2){comparePicker();return}
 const [a,b]=state.compare.map(id=>byId.get(id));history.replaceState(null,'','#compare/'+state.compare.map(encodeURIComponent).join('/'));
 const missingNetLabel=r=>r?.supplementary?'不在本评价范围':({
   PENDING_SECOND_ITEM_FORMAL_SETTLEMENT:'治国成效待正式结算',
   PENDING_THIRD_ITEM_FORMAL_SETTLEMENT:'军事与边疆待正式结算',
   PENDING_FIRST_ITEM_FORMAL_SETTLEMENT:'奠基与统一待正式结算',
   SUPPLEMENTARY:'不在本评价范围'
 }[r?.settlement_readiness]||'未入榜');
 const compareFirstAddOn=r=>!r?.net?'—':r.net.first_item_status!=='APPLICABLE'?'不适用':Number(r.net.first_item_raw_score)===0?'0.00 · 本项适用':number(r.net.first_item_add_on);
 const signedAdjustment=value=>{const n=Number(value);return Number.isFinite(n)&&n>0?'+'+number(n):number(value);};
 // Same grade does not mean same evidence. Keep every row, and only mark
 // comparable values for visual emphasis; narrative rows are never classified.
 const row=(label,fn,comparable=true)=>{const left=fn(a,0),right=fn(b,1);return `<tr${comparable?` data-compare-equal="${left===right}"`:''}><td>${label}</td><td>${left}</td><td>${right}</td></tr>`};
 const axisRow=c=>{const same=grade(a.axes[c])===grade(b.axes[c]);return `<tr data-compare-equal="${same}"><td>${esc(DATA.axis_specs[c].name)}${c==='C5'?'<small class="c5-inline-hint">S端＝更克制</small>':''}${same?'<small class="compare-same-note">同档或同状态，依据分别保留</small>':''}</td>${[a,b].map((r,i)=>`<td>${r.axes[c]?axisEvidence(r,c,'-compare-'+i):'未覆盖'}</td>`).join('')}</tr>`};
 const section=label=>`<tr class="comparison-section"><th colspan="3">${label}</th></tr>`;
 screen.innerHTML=`<h1>同题对照，各读其因。</h1><p class="muted">按相同维度并排阅读双方结论和依据，同时保留各自的历史起点、实际掌权时期与材料限制。</p><p class="subline power-context-note">${esc(powerContextNote)}</p><div class="compare-select">${[a,b].map((r,i)=>`<button data-replace-compare="${i}">${esc(personLabel(r))} · 更换</button>`).join('<span>与</span>')}<button data-swap-compare>交换左右</button></div><label class="difference-toggle"><input type="checkbox" id="differences" ${state.differences?'checked':''}>突出分数／等级差异</label><p class="subline">只突出数值、等级或状态不同的项目，不隐藏任何依据；同档不等于表现相同。</p><div class="table-wrap comparison-scroll"><table class="comparison"><thead><tr><th>阅读问题</th><th>${esc(personLabel(a))}</th><th>${esc(personLabel(b))}</th></tr></thead><tbody>${row('掌权背景（非统一取证期）',r=>esc(r.actual_power_window||'未列'))}${section('统治绩效')}${row('统治绩效',r=>r.net?`<b>${number(r.net.total_score)}</b> · 第 ${r.net.rank} 名`:esc(missingNetLabel(r)))}${row('治国成效',r=>number(r.net?.second_item_score))}${row('军事与边疆',r=>number(r.net?.third_item_score))}${row('奠基与统一附加',r=>compareFirstAddOn(r))}${row('文明与国家整合',r=>r.net?signedAdjustment(r.net.fourth_item_adjustment):'—')}${row('构成与依据',r=>r.net?`<details><summary>展开构成</summary>${netGroups(r)}</details>`:esc(missingNetLabel(r)),false)}${section('人物画像 · 八轴能力')}${DATA.capability_axes.map(axisRow).join('')}${section('人物画像 · 权力运用风格')}${DATA.independent_axes.map(axisRow).join('')}${section('历史影响')}${row('历史影响等级',r=>`<b class="impact-grade">${esc(r.impact.public_grade)}</b> · ${esc(r.impact.impact_nature)}`)}${section('历史影响 · 四维分项（与总等级不同尺，不取平均）')}${Object.entries(dimNames).map(([k,n])=>row(n,r=>esc(r.impact.dimensions[k]?.grade))).join('')}${row('判断把握',r=>conf(r.impact.confidence))}${row('主链与归责依据',(r,i)=>`<details><summary>展开历史影响详情</summary>${historySections(r,`-compare-${i}`,true)}</details>`,false)}${row('继续阅读',r=>`<button data-person="${r.ruler_id}">查看${esc(personLabel(r))} →</button>`,false)}</tbody></table></div>${gradeHelp('profile')}${gradeHelp('impact')}`;
 const emphasize=()=>document.querySelector('.comparison')?.classList.toggle('emphasize-differences',state.differences);
 document.getElementById('differences').onchange=e=>{state.differences=e.target.checked;emphasize()};
 emphasize();
}

  const screenEl = document.getElementById("screen");
  if (!screenEl) return;

  const PUBLIC_GRADE = {G0:"E",G1:"D",G2:"C",G3:"B",G4:"A",G5:"S"};

  const FINANCE_ORDINAL_GRADE = {"一":"E","二":"D","三":"C","四":"B","五":"A","六":"S","1":"E","2":"D","3":"C","4":"B","5":"A","6":"S"};
  const LOSS_TEXT = {
    0:"未见独立有效低谷",

  let scheduled = false;

  function finite(value) {
    if (value == null || value === "") return null;
    const n = Number(value);
    return Number.isFinite(n) ? n : null;
  }

  function fmt(value, digits = 1) {
    const n = finite(value);
    return n == null ? "—" : n.toFixed(digits);
  }

  function personRecord() {
    if (typeof byId === "undefined") return null;
    const match = location.hash.match(/^#person\/([^/?#]+)/);
    if (!match) return null;
    try { return byId.get(decodeURIComponent(match[1])) || null; } catch { return null; }
  }

  function netRecord() {
    if (typeof byId === "undefined") return null;
    const match = location.hash.match(/^#net\/([^/?#]+)/);
    if (!match) return null;
    try { return byId.get(decodeURIComponent(match[1])) || null; } catch { return null; }
  }

  function compareRecords() {
    if (typeof byId === "undefined" || !location.hash.startsWith("#compare/")) return [];
    return location.hash.slice(9).split("/").filter(Boolean).slice(0, 2).map(id => {
      try { return byId.get(decodeURIComponent(id)) || null; } catch { return null; }
    }).filter(Boolean);
  }

  function itemMap(record, key) {
    return new Map((record?.net?.component_details?.[key] || []).map(item => [item.label, item]));
  }

  function secondItems(record) {
    const result = new Map();
    for (const key of SECOND_GROUPS) {
      for (const item of record?.net?.component_details?.[key] || []) result.set(item.label, item);
    }
    return result;
  }

  function secondTotals(record) {
    const method = itemMap(record, "method");
    const finance = itemMap(record, "finance");
    const handoff = itemMap(record, "handoff");
    return {
      method: finite(method.get("治理手段")?.value),
      finance: finite(finance.get("治理结果")?.value),
      handoff: finite(handoff.get("交接得分")?.value),
      total: finite(record?.net?.second_item_score ?? handoff.get("第二项合计")?.value),
    };
  }

  function currentSecondPool() {
    if (typeof byId === "undefined") return [];
    return Array.from(byId.values()).filter(record =>
      !record?.supplementary && finite(record?.net?.second_item_score) != null
    );
  }

  function secondRankText(record) {
    const score = finite(record?.net?.second_item_score);
    if (score == null) return "";
    const pool = currentSecondPool();
    if (!pool.length) return "";
    const rank = 1 + pool.filter(item => finite(item?.net?.second_item_score) > score).length;
    const pct = Math.max(1, Math.min(100, Math.ceil(rank / pool.length * 100)));
    return `当前已结算人物：第 ${rank} / ${pool.length}（约前 ${pct}%）`;
  }

  function positionSuffix(text) {
    const lower = String(text || "").toLowerCase();
    if (/lower|low/.test(lower)) return "-";
    if (/upper|high/.test(lower)) return "+";
    return "";
  }

  function publicMethodGrade(item) {
    const text = String(item?.grade || "");
    const band = text.match(/\bG([0-5])\b/i);
    if (!band) return "";
    return `${PUBLIC_GRADE[`G${band[1]}`] || ""}${positionSuffix(text)}`;
  }

  function stateGradeMeta(item) {
    const match = String(item?.grade || "").match(/\bC[123]-(\d)\s*\/\s*L([0-3])\b/i);
    if (!match) return null;
    const band = Number(match[1]);
    const loss = Number(match[2]);
    return {grade:STATE_GRADE[band] || "",lossText:LOSS_TEXT[loss] || ""};
  }

  function publicHandoffGrade(item) {
    const level = Number(item?.value);
    return Number.isInteger(level) ? HANDOFF_GRADE[level] || "" : "";
  }

  function boundaryExcerpt(item) {
    const text = String(item?.reader_boundary || "").trim();
    if (!text) return "";
    return "适用范围与限制见展开说明";
  }

  function ensureStyles() {

      .adjudication-material-group{margin:14px 0 18px}

      .adjudication-material-empty{margin:4px 0;color:var(--muted);font-size:12px}

      @media(max-width:700px){

  // The public layer owns these text nodes. The structural renderer respects
  // the data-public-* markers instead of restoring its intermediate copy.
  // Write real text: CSS generated content is not a replacement for readable DOM.
  function setPublicText(node, text, key, className) {
    if (!node || !text) return;
    node.classList.add(className);
    if (node.dataset[key] !== text) node.dataset[key] = text;
    if (node.textContent !== text) node.textContent = text;
  }

  function writePublicCopy(node, text) {
    setPublicText(node, text, "publicCopy", "second-item-public-copy");
  }

  function writePublicScore(node, text) {
    setPublicText(node, text, "publicScore", "second-item-public-score");
  }

  function setPublicGrade(span, valueNode, grade, noteParts) {
    if (!span || !grade) return;
    const note = noteParts.filter(Boolean).join("｜");
    span.classList.add("second-item-public-grade-ready");
    if (span.dataset.publicGradeNote !== note) span.dataset.publicGradeNote = note;
    let noteNode = span.querySelector(":scope > .second-item-scale-note");
    if (!noteNode) {
      noteNode = document.createElement("small");
      noteNode.className = "second-item-scale-note";
      span.append(noteNode);
    }
    if (noteNode.textContent !== note) noteNode.textContent = note;
    setPublicText(valueNode, grade, "publicValue", "second-item-public-value");
  }

  function patchMethodGrades(root, record) {
    if (!root || !record?.net) return;
    const items = itemMap(record, "method");
    if (!items.size) return;
    for (const detail of root.querySelectorAll(".net-metric-detail[data-second-source-label]")) {
      const sourceLabel = detail.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const grade = publicMethodGrade(item);
      if (!item || !grade || !METHOD_MAX[sourceLabel]) continue;
      const summary = detail.querySelector(":scope > summary");
      setPublicGrade(summary?.querySelector(":scope > span"), summary?.querySelector(":scope > b"), grade,
        [`原始方向指数 ${Number(item.value).toFixed(1)} / ${METHOD_MAX[sourceLabel]}`, boundaryExcerpt(item)]);
    }
    for (const span of root.querySelectorAll(".component > span[data-second-source-label]")) {
      const sourceLabel = span.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const grade = publicMethodGrade(item);
      if (!item || !grade || !METHOD_MAX[sourceLabel]) continue;
      setPublicGrade(span, span.parentElement?.querySelector(":scope > b"), grade,
        [`原始方向指数 ${Number(item.value).toFixed(1)} / ${METHOD_MAX[sourceLabel]}`, boundaryExcerpt(item)]);
    }
  }

  function patchFinanceGrades(root, record) {
    if (!root || !record?.net) return;
    const items = itemMap(record, "finance");

      const meta = stateGradeMeta(item);
      if (!item || !meta?.grade || !FINANCE_MAX[sourceLabel]) continue;
      const summary = detail.querySelector(":scope > summary");
      setPublicGrade(summary?.querySelector(":scope > span"), summary?.querySelector(":scope > b"), meta.grade,
        [`结算分 ${Number(item.value).toFixed(1)}`, meta.lossText, boundaryExcerpt(item)]);
    }
    for (const span of root.querySelectorAll(".component > span[data-second-source-label]")) {
      const sourceLabel = span.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);

      if (!item || !meta?.grade || !FINANCE_MAX[sourceLabel]) continue;
      setPublicGrade(span, span.parentElement?.querySelector(":scope > b"), meta.grade,
        [`结算分 ${Number(item.value).toFixed(1)}`, meta.lossText, boundaryExcerpt(item)]);
    }
  }

  function patchHandoffGrades(root, record) {
    if (!root || !record?.net) return;
    const items = itemMap(record, "handoff");
    if (!items.size) return;
    for (const detail of root.querySelectorAll(".net-metric-detail[data-second-source-label]")) {
      const sourceLabel = detail.dataset.secondSourceLabel || "";

      if (!item || !grade || !HANDOFF_LABELS[sourceLabel]) continue;
      const summary = detail.querySelector(":scope > summary");
      setPublicGrade(summary?.querySelector(":scope > span"), summary?.querySelector(":scope > b"), grade,

    }
    for (const span of root.querySelectorAll(".component > span[data-second-source-label]")) {
      const sourceLabel = span.dataset.secondSourceLabel || "";
      const item = items.get(sourceLabel);
      const grade = publicHandoffGrade(item);
      if (!item || !grade || !HANDOFF_LABELS[sourceLabel]) continue;
      setPublicGrade(span, span.parentElement?.querySelector(":scope > b"), grade,
        [HANDOFF_LABELS[sourceLabel], boundaryExcerpt(item)]);
    }
  }

  function patchGradeGroups(root, record) {
    patchMethodGrades(root, record);
    patchFinanceGrades(root, record);
    patchHandoffGrades(root, record);

  function publicEnumText(value) {
    let text = String(value ?? "").trim();
    for (const [from, to] of Object.entries(PUBLIC_ITEM_LABELS)) text = text.replaceAll(from, to);
    for (const [from, to] of Object.entries(PUBLIC_ROLE_LABELS)) text = text.replace(new RegExp("\\b" + from + "\\b", "g"), to);
    text = text
      .replace(/(?:现有材料|现材料|现有证据)?\s*未(?:独立)?闭合\s*R4/gi, "现有证据尚未证明跨朝代长期接收")
      .replace(/(?:现有材料|现材料|现有证据)?\s*未(?:独立)?闭合\s*R3/gi, "现有证据尚未证明被多个后继统治阶段持续采用")
      .replace(/闭合\s*R4/gi, "已证明跨朝代长期接收")
      .replace(/闭合\s*R3/gi, "已证明被多个后继统治阶段持续采用")
      .replace(/R3\s*\/\s*R4/gi, "长期接收")
      .replace(/R3\s*门(?:槛)?/gi, "长期接收门槛")
      .replace(/\bR4\b/gi, "跨朝代长期接收")
      .replace(/\bR3\b/gi, "被多个后继统治阶段持续采用")
      .replace(/\bR[12]\b/gi, "后世接收范围有限")
      .replace(/\bR0\b/gi, "本人任内运行证据")
      .replace(/\bG([0-5])\s*[-/]\s*([A-Za-z-]+)\b/gi, (_, band, position) => `${PUBLIC_GRADE[`G${band}`] || ""}${positionSuffix(position)}`)
      .replace(/\bG([0-5])\b/g, (_, band) => PUBLIC_GRADE[`G${band}`] || band)
      .replace(/\bC[123]-([1-6])\s*\/\s*L([0-3])\b/g, (_, band, loss) => `${STATE_GRADE[Number(band)] || band}档；${LOSS_TEXT[Number(loss)] || ""}`)
      .replace(/\bC[123]-([1-6])\b/g, (_, band) => `${STATE_GRADE[Number(band)] || band}档`)
      .replace(/\bD3-([0-5])\b/g, (_, level) => `${HANDOFF_GRADE[Number(level)] || level}档`)
      .replace(/\bH([0-5])\b/g, (_, level) => `${HANDOFF_GRADE[Number(level)] || level}档`)
      .replace(/\bL([0-3])\b/g, (_, level) => LOSS_TEXT[Number(level)] || "");
    return text.trim();
  }

  function publicTechnicalText(value) {
    return publicEnumText(value);
  }

  function publicFinanceText(value) {
    return publicEnumText(value)
      .replace(/第?([一二三四五六1-6])档/g, (_, level) => `${FINANCE_ORDINAL_GRADE[level] || level}档`);
  }

  // Only contract-defined enum labels are translated. Sentences, negation,
  // responsibility and boundaries are otherwise preserved verbatim.
  function publicText(value) {
    return publicEnumText(value);
  }

  function materialStrengthFromTags(tags) {
    const values = Array.isArray(tags) ? tags : [];
    for (const [tag, label] of MATERIAL_STRENGTH_TAGS) if (values.includes(tag)) return label;
    return "";
  }

  function materialChip(text, className = "") {
    const value = publicText(text);
    if (!value) return null;
    const chip = document.createElement("span");
    chip.className = `adjudication-material-chip ${className}`.trim();
    chip.textContent = value;
    return chip;
  }

  function materialCard(data = {}) {
    const card = document.createElement("li");
    card.className = "adjudication-material-card" + (data.supplement ? " is-supplement" : "");
    for (const [key, value] of Object.entries(data.dataset || {})) if (value != null && value !== "") card.dataset[key] = String(value);

    const head = document.createElement("div");
    head.className = "adjudication-material-head";
    const title = document.createElement("strong");
    title.textContent = publicText(data.title || "裁决材料");
    head.append(title);

    const meta = document.createElement("div");
    meta.className = "adjudication-material-meta";
    const strength = data.strength || materialStrengthFromTags(data.tags);
    for (const [value, className] of [
      [data.direction, "direction"],
      [strength, "strength"],
      ...(Array.isArray(data.tags) ? data.tags.filter(tag => !MATERIAL_STRENGTH_TAGS.has(tag)).map(tag => [tag, "tag"]) : []),
      [data.contribution, "contribution"],
    ]) {
      const chip = materialChip(value, className);
      if (chip) meta.append(chip);
    }
    if (meta.childNodes.length) head.append(meta);
    card.append(head);

    const body = publicText(data.body);
    if (body) card.append(makeTextBlock("p", "adjudication-material-basis", body));

    const scope = publicText(data.scope);
    const boundary = publicText(data.boundary);
    if (scope || boundary) {
      const details = document.createElement("details");
      details.className = "adjudication-material-boundary";
      details.append(makeTextBlock("summary", "", "范围与边界"));
      if (scope) {
        const box = makeTextBlock("div", "adjudication-material-scope", "");
        box.append(makeTextBlock("strong", "", "具体范围"), makeTextBlock("p", "", scope));
        details.append(box);
      }
      if (boundary) {
        const box = makeTextBlock("div", "adjudication-material-scope", "");
        box.append(makeTextBlock("strong", "", "判断边界"), makeTextBlock("p", "", boundary));
        details.append(box);
      }
      card.append(details);
    }

    const footer = publicText(data.footer);
    if (footer) card.append(makeTextBlock("small", "adjudication-material-footer", footer));
    return card;
  }

  function materialGroup(title, cards, emptyText = "当前没有该类材料。") {
    const section = document.createElement("section");
    section.className = "adjudication-material-group";
    section.append(makeTextBlock("h4", "", publicText(title)));
    if (!cards.length) {
      section.append(makeTextBlock("p", "adjudication-material-empty", emptyText));
      return section;
    }
    const list = document.createElement("ul");
    list.className = "adjudication-material-list";
    list.replaceChildren(...cards);
    section.append(list);
    return section;
  }

  function renderB2MaterialGroups(evidence) {
    const groups = {positive:[], negative:[], mixed:[]};
    for (const entry of evidence || []) {
      const direction = String(entry?.public_direction || "");
      const key = direction.startsWith("正向") ? "positive" : direction.startsWith("负向") ? "negative" : "mixed";
      groups[key].push(materialCard({
        title: entry?.public_label || entry?.public_role,
        direction,
        tags: entry?.public_tags || [],
        body: entry?.public_basis,
        boundary: entry?.public_boundary,
        dataset: {publicEvidenceId: entry?.id || ""},
      }));
    }
    const wrapper = document.createElement("div");
    wrapper.className = "adjudication-material-groups b2-material-groups";
    wrapper.append(
      materialGroup("正向反馈与约束", groups.positive),
      materialGroup("负向反馈失灵", groups.negative),
      materialGroup("正负并存或阶段变化", groups.mixed)
    );
    return wrapper;
  }

  function financeRoleKey(role) {
    const value = String(role || "").trim();
    if (value === "主要状态") return "state";
    if (value === "低谷") return "loss";
    if (value === "边界") return "boundary";
    if (value === "恢复" || value === "责任范围") return "recovery";
    if (value === "状态恶化" || value === "额外代价") return "cost";
    return "other";
  }

  function renderFinanceMaterialGroups(label, evidence) {
    const groups = {state:[], loss:[], recovery:[], cost:[], boundary:[], other:[]};
    for (const entry of evidence || []) {
      const role = String(entry?.public_role || "").trim();
      const key = financeRoleKey(role);
      groups[key].push(materialCard({
        title: publicFinanceText(entry?.public_label || role || "正式裁决材料"),
        tags: role ? [role] : [],
        body: publicFinanceText(entry?.public_basis),
        boundary: publicFinanceText(entry?.public_boundary),
        dataset: {publicEvidenceId: entry?.id || ""},
      }));
    }
    const wrapper = document.createElement("div");
    wrapper.className = "adjudication-material-groups finance-material-groups";
    if (label === "C4恢复与成本") {
      wrapper.append(
        materialGroup("恢复与归责", groups.recovery),
        materialGroup("恶化与额外代价", groups.cost),
        materialGroup("重复计算与评价边界", groups.boundary),
      );
    } else {
      wrapper.append(
        materialGroup("主要状态", groups.state),
        materialGroup("低谷与损失", groups.loss),
        materialGroup("评价边界", groups.boundary),
      );
    }
    if (groups.other.length) wrapper.append(materialGroup("其他正式材料", groups.other));
    return wrapper;
  }


  function renderHandoffMaterialGroups(label, evidence) {
    const groups = {preparation:[], result:[], continuity:[], other:[]};
    for (const entry of evidence || []) {
      const role = String(entry?.public_role || "").trim();
      const key = role === "事前安排" ? "preparation"
        : (role === "交接结果" || role === "终局事实") ? "result"
        : role === "前任行政资产承接" ? "continuity"
        : "other";
      groups[key].push(materialCard({
        title: entry?.public_label || role || "交接裁决材料",
        tags: role ? [role] : [],
        body: entry?.public_basis,
        boundary: entry?.public_boundary,
        dataset: {publicEvidenceId: entry?.id || ""},
      }));
    }
    const wrapper = document.createElement("div");
    wrapper.className = "adjudication-material-groups handoff-material-groups";
    if (label === "D1继任行政连续性") {
      wrapper.append(materialGroup("行政承接与连续性", groups.continuity));
    } else {
      wrapper.append(
        materialGroup("事前安排", groups.preparation),
        materialGroup("实际交接与终局事实", groups.result),
      );
    }
    if (groups.other.length) wrapper.append(materialGroup("其他正式材料", groups.other));
    return wrapper;
  }


  globalThis.SecondItemMaterialCards = Object.freeze({
    card: materialCard,
    group: materialGroup,
    strengthFromTags: materialStrengthFromTags,
    publicEnumText,
  });

  function publicFacts(item) {
    const evidence = Array.isArray(item?.reader_public_evidence_items) ? item.reader_public_evidence_items : [];
    if (evidence.length) {
      return evidence.map(entry => {
        if (!entry || typeof entry !== "object") return "";
        const label = String(entry.public_label || "").trim();
        const direction = String(entry.public_direction || "").trim();
        const basis = publicText(entry.public_basis || "");
        const boundary = publicText(entry.public_boundary || "");
        return [
          [label, direction].filter(Boolean).join(" · "),
          basis,
          boundary ? `边界：${boundary}` : "",
        ].filter(Boolean).join("；");
      }).map(publicText).filter(Boolean);
    }
    const highlights = (Array.isArray(item?.reader_highlights) ? item.reader_highlights : [])
      .map(publicText).filter(Boolean);
    if (highlights.length) return highlights;
    const summary = publicText(item?.reader_summary || "");
    return summary ? [summary] : [];
  }

  function makeTextBlock(tagName, className, text) {
    const node = document.createElement(tagName);
    if (className) node.className = className;
    node.textContent = text;
    return node;
  }

  function makeDetails(title, text, className = "") {
    if (!text) return null;
    const details = document.createElement("details");
    if (className) details.className = className;
    const summary = document.createElement("summary");
    summary.textContent = title;
    details.append(summary, makeTextBlock("p", "prose", text));
    return details;
  }

  function publicEvidenceList(evidence) {
    const list = makeTextBlock("ul", "second-item-public-evidence", "");
    for (const entry of evidence) {
      const card = makeTextBlock("li", "second-item-public-evidence-card", "");
      const title = [publicText(entry.public_label || entry.public_role), publicText(entry.public_direction)].filter(Boolean).join(" · ");
      if (title) card.append(makeTextBlock("strong", "", title));
      card.append(makeTextBlock("p", "prose", publicText(entry.public_basis)));
      const boundary = makeDetails("适用范围与限制", publicText(entry.public_boundary));
      if (boundary) card.append(boundary);
      list.append(card);
    }
    return list;
  }

  function patchMetricBodies(record) {
    if (!record?.net || !location.hash.match(/^#net\/[^/?#]+\/second(?:\/|$)/)) return;
    const items = secondItems(record);
    const root = document.getElementById("net-major-body");
    if (!root) return;
    for (const detail of root.querySelectorAll(".net-metric-detail[data-second-source-label]")) {
      const label = detail.dataset.secondSourceLabel || "";
      // Dedicated A/B1 renderers own these bodies. Do not overwrite them when
      // their asynchronous formal data load triggers the shared observer.
      if (label === "A制度建设" || label === "B1官僚治理") continue;
      const item = items.get(label);
      if (!item || item.reader_kind !== "judgment") continue;
      const body = detail.querySelector(":scope > .net-metric-body");
      if (!body) continue;
      const key = [item.reader_summary || "", JSON.stringify(item.reader_public_evidence_items || []), ...(item.reader_highlights || []), item.reader_boundary || "", item.reader_how || "", item.reader_full_basis || ""].join("|");
      if (body.dataset.secondPublicBodyKey === key && body.querySelector(":scope > .second-item-public-reading")) continue;
      const audit = body.querySelector(":scope > .net-audit-sources");
      if (audit) audit.remove();
      let formal = body.querySelector(":scope > .net-formal-basis-raw");
      if (formal) formal.remove();
      const raw = String(item.reader_full_basis || "").trim();
      if (!formal && raw && raw !== String(item.reader_summary || "").trim()) {
        formal = makeDetails("正式裁决原文（未改写）", raw, "net-formal-basis-raw");
      }
      body.innerHTML = "";
      const reading = document.createElement("div");
      reading.className = "second-item-public-reading";
      reading.append(makeTextBlock("div", "label", "为什么这样判断"));
      const evidence = item.reader_public_evidence_items;
      const facts = publicFacts(item);
      if (label === "B2反馈与约束" && Array.isArray(evidence) && evidence.length) {
        reading.append(renderB2MaterialGroups(evidence));
      } else if (["C1民生","C2经济财政","C3社会安全","C4恢复与成本"].includes(label) && Array.isArray(evidence) && evidence.length) {
        reading.append(renderFinanceMaterialGroups(label, evidence));
      } else if (["D1继任行政连续性","D3政权交接稳定"].includes(label) && Array.isArray(evidence) && evidence.length) {
        reading.append(renderHandoffMaterialGroups(label, evidence));
      } else if (Array.isArray(evidence) && evidence.length) {
        reading.append(publicEvidenceList(evidence));
      } else if (facts.length > 1) {
        const list = document.createElement("ul");
        for (const fact of facts) list.append(makeTextBlock("li", "", fact));
        reading.append(list);
      } else if (facts.length === 1) {
        reading.append(makeTextBlock("p", "prose", facts[0]));
      } else {
        reading.append(makeTextBlock("p", "prose", "当前尚未提供公开说明，请查看正式记录。"));
      }
      body.append(reading);
      const financeItem = ["C1民生","C2经济财政","C3社会安全","C4恢复与成本"].includes(label);
      const boundaryDetails = makeDetails("范围与边界", financeItem ? publicFinanceText(item.reader_boundary || "") : publicText(item.reader_boundary || ""));
      if (boundaryDetails) body.append(boundaryDetails);
      const howDetails = makeDetails("这个分数怎么算？", financeItem ? publicFinanceText(item.reader_how || "") : publicTechnicalText(item.reader_how || ""));
      if (howDetails) body.append(howDetails);
      if (formal) body.append(formal);
      if (audit) body.append(audit);
      body.dataset.secondPublicBodyKey = key;
    }
  }

  function patchGroupIntros(record) {
    if (!record?.net || !location.hash.match(/^#net\/[^/?#]+\/second(?:\/|$)/)) return;
    const values = secondTotals(record);

      `这一组看国家机器如何建立规则、配置官僚并形成反馈约束。当前合计 ${fmt(values.method)} 分；公开层先看等级和历史依据，具体指数与折算放在展开内容里。`);
    writePublicCopy(document.querySelector('[data-second-intro="finance"]'),
      `这一组看统治时期普通家庭、经济财政和社会安全的主要状态，再结合任内低谷、恢复与额外代价形成结果判断。当前合计 ${fmt(values.finance)} 分。`);
    writePublicCopy(document.querySelector('[data-second-intro="handoff"]'),
      "统治如何收尾，会直接影响国家机器和继承秩序能否平稳延续。行政连续性看旧国家机器有多少被接住，交接稳定看继承过程是否顺利；两项均以 S—E 六档显示。");

  function patchScorePresentation(record) {
    if (!record?.net) return;
    const totals = secondTotals(record);
    const rank = secondRankText(record);
    if (location.hash.match(/^#net\/[^/?#]+\/(?:all)?$/)) {
      const card = Array.from(document.querySelectorAll(".net-major-card")).find(node => /\/second(?:\/|$)/.test(node.getAttribute("href") || ""));
      if (card) {
        if (totals.total != null) writePublicScore(card.querySelector(".big"), `${fmt(totals.total)} 分`);
        if ([totals.method, totals.finance, totals.handoff].every(value => value != null)) {
          writePublicCopy(card.querySelector(":scope > .second-item-card-breakdown"),
            `${rank ? `${rank} · ` : ""}制度与行政 ${fmt(totals.method)} · 民生与社会 ${fmt(totals.finance)} · 政权交接 ${fmt(totals.handoff)}`);
        }
      }

    if (location.hash.match(/^#net\/[^/?#]+\/second(?:\/|$)/)) {
      const summary = document.querySelector(".second-item-reader-summary");
      const cards = summary?.querySelectorAll(".second-item-total-grid > div");
      if (cards?.length >= 3) {
        const values = [totals.method, totals.finance, totals.handoff];

        const span = row.querySelector("span");

      }

  function patchCompareScores(records) {
    if (records.length < 2 || !location.hash.startsWith("#compare/")) return;
    const row = Array.from(screenEl.querySelectorAll(".comparison tbody tr")).find(item => item.cells?.[0]?.textContent.trim() === "治国成效");

    records.forEach((record, index) => {

  function replaceText(node, replacements) {
    if (!node) return;
    let next = node.textContent;
    for (const [from, to] of replacements) next = next.replaceAll(from, to);
    if (next !== node.textContent) node.textContent = next;
  }

// No battle inference, narrative filtering, sorting or truncation belongs here.
function secondMethodDetailsMarkup(item, record) {
  const block = (title, text, className = "") => text
    ? `<details class="${className}"><summary>${esc(title)}</summary>${prose(text)}</details>` : "";
  const refs = [...new Set([item.source, item.applied_source, ...(item.reader_source_refs || [])].filter(Boolean))];
  const sources = refs.map(ref => link(ref, "正式记录与史料 ↗", record)).join(" ");
  return block("范围与边界", item.reader_boundary)
    + block("这个分数怎么算？", item.reader_how)
    + block("正式裁决原文（未改写）", item.reader_full_basis, "net-formal-basis-raw")
    + (sources ? `<details class="net-audit-sources"><summary>正式记录与史料</summary><p class="sources">${sources}</p></details>` : "");
}

function firstB1Markup(item) {
  const data = item?.reader_public_b1 || {};
  return [["起点", data.public_start_basis], ["主要对手", data.public_opponent_basis], ["完成速度", data.public_efficiency_basis]]
    .filter(([, value]) => value)
    .map(([label, value]) => `<div class="label">${esc(label)}</div>${prose(value)}`).join("");
}

function firstCostMarkup(item) {
  const data = item?.reader_public_cost || {};
  const fields = [["成本程度", data.public_level_label], ["证据状态", data.public_status_label], ["责任时期", data.public_responsibility_window], ["完整成本说明", data.public_basis]];
  const facts = fields.filter(([, value]) => value).map(([label, value]) => `<div class="label">${esc(label)}</div>${prose(value)}`).join("");
  const gaps = (data.public_unresolved_gaps || []).map(value => `<li>${esc(value)}</li>`).join("");
  const sources = (data.public_source_links || []).filter(source => /^https?:\/\//.test(source.url))
    .map(source => `<a href="${esc(source.url)}" target="_blank" rel="noopener">${esc(source.label)} ↗</a>`).join(" ");
  return `${facts}${gaps ? `<div class="label">证据缺口</div><ul>${gaps}</ul>` : ""}${sources ? `<p class="sources">${sources}</p>` : ""}`;
}

function firstCommanderMarkup(item) {
  const source = item?.reader_public_commander;
  if (!source?.public_basis || !source?.public_boundary || !Array.isArray(source.public_battles)) {
    return '<p class="notice">本人统帅的公开说明尚未同步。</p>';
  }
  const battles = source.public_battles.length
    ? `<details class="first-item-battle-evidence"><summary>查看已明确记载的战役与统筹成果</summary><ul class="first-item-battles">${source.public_battles.map(battle => `<li><strong>${esc(battle.name)}</strong> · ${esc(battle.role)} · ${esc(battle.result)}成果 · ${esc(battle.difficulty ? `${battle.difficulty}难度` : '难度未单列')} <a href="military.html#search=${encodeURIComponent(battle.name)}">查看战役档案 ↗</a></li>`).join('')}</ul></details>`
    : '';
  return `<div class="first-item-commander-public"><div class="label">为什么这样评</div>${prose(source.public_basis)}<div class="label">责任与限制</div>${prose(source.public_boundary)}${battles}</div>`;
}

        return;

  function netValue(item, groupKey = "") {
    if (item?.value == null) return item?.unit === "不单独计分" ? "不单独计分" : "—";
    const signed = item.value > 0 && groupKey === "civilization" ? `+${item.value}` : String(item.value);
    return `${signed}${item.unit ? ` ${item.unit}` : ""}`;
  }

  function majorValue(record, major) {
    const net = record.net || {};
    if (major === "first") return net.first_item_status === "APPLICABLE" ? net.first_item_add_on : null;
    if (major === "second") return net.second_item_score;
    if (major === "third") return net.third_item_score;
    if (major === "fourth") return net.fourth_item_adjustment;
    return net.total_score;
  }

      const judgments = items.filter(item => item.reader_kind === "judgment" && item.value != null);
      const firstNotApplicable = key === "first" && items.every(item =>
        item.value == null || (item.label === "附加F" && Number(item.value) === 0)
      );
      const preview = firstNotApplicable
        ? `<p class="notice">该人物不适用第一项，本项不参与净收益计分。</p>`
        : judgments.map(item => `<div class="component"><span>${esc(item.public_component_label || item.label)}</span><b>${esc(netValue(item, key))}</b></div>`).join("");
      details.innerHTML = `<summary>${esc(netGroupNames[key] || key)}</summary>${preview}<p class="sources"><a href="${netHref(record, major, key)}">查看这组完整计分逻辑 →</a></p>`;
      reading.append(details);
    }
    reading.dataset.netCompact = "done";
  }

  function enhancePersonNet() {
    const record = currentPersonRecord();
    if (!record?.detail_loaded) return;
    enhanceNetOverview(record);
    compactNetReading(record);
  }

  function cleanNetText(value) {
    return String(value ?? "").replace(/\s+/g, " ").trim();
  }

  function uniqueSourceRefs(item) {
    const refs = Array.isArray(item.reader_source_refs) ? item.reader_source_refs : [];
    return [...new Set([item.source, item.applied_source, ...refs].filter(Boolean))];
  }

  function auditSourceBlock(item, record) {
    const refs = uniqueSourceRefs(item);
    if (!refs.length) return "";
    const links = refs.map((ref, index) => {
      const label = ref === item.applied_source && ref !== item.source
        ? "采用值原始记录 ↗"
        : index === 0 ? "原始正式文档 ↗" : `补充史料／记录 ${index} ↗`;
      return link(ref, label, record);
    }).join(" ");
    return `<details class="net-audit-sources"><summary>正式文档与史料</summary><p class="subline">这些链接指向整份正式文件，供读者核对；上面的当前人物事实才是正文。</p><p class="sources">${links}</p></details>`;
  }

  const MATERIAL_CARD_GROUPS = new Set(["strategic", "military", "civilization"]);
  const SECOND_PUBLIC_GROUPS = new Set(["method", "finance", "handoff"]);

  function metricMaterialCards(item, groupKey) {
    if (!MATERIAL_CARD_GROUPS.has(groupKey)) return "";
    const evidence = Array.isArray(item.reader_public_evidence_items) ? item.reader_public_evidence_items : [];
    if (!evidence.length) return "";
    const cards = evidence.map(entry => {
      const title = cleanNetText(entry?.public_label || entry?.public_role || "正式裁决材料");
      const role = cleanNetText(entry?.public_role || "");
      const direction = cleanNetText(entry?.public_direction || "");
      const tags = Array.isArray(entry?.public_tags) ? entry.public_tags.map(cleanNetText).filter(Boolean) : [];
      const chips = [...new Set([role, direction, ...tags].filter(Boolean))]
        .map(value => `<span class="net-material-chip">${esc(value)}</span>`).join("");
      const basis = cleanNetText(entry?.public_basis || "");
      const boundary = cleanNetText(entry?.public_boundary || "");
      return `<li class="net-material-card"><div class="net-material-head"><strong>${esc(title)}</strong>${chips ? `<span class="net-material-meta">${chips}</span>` : ""}</div>${basis ? `<p class="net-material-body">${esc(basis)}</p>` : ""}${boundary ? `<details class="net-material-boundary"><summary>该材料的范围与边界</summary><p>${esc(boundary)}</p></details>` : ""}</li>`;
    }).join("");
    return cards ? `<div class="label">正式裁决材料</div><ul class="net-material-list">${cards}</ul>` : "";
  }

  function metricDetail(item, record, groupKey = "") {
    const displayLabel = item.public_component_label || item.label;
    const intro = netPublicIntro[displayLabel] || netPublicIntro[item.label] || "";
    const summary = cleanNetText(item.reader_summary || "");
    const fullBasis = cleanNetText(item.reader_full_basis || "");
    const publicEvidence = Array.isArray(item.reader_public_evidence_items) ? item.reader_public_evidence_items : [];
    const highlights = publicEvidence.length
      ? publicEvidence.map(entry => {
        const label = entry?.public_label || entry?.public_role || "公开依据";
        const basis = cleanNetText(entry?.public_basis || "");
        return basis ? `${label}：${basis}` : "";
      }).filter(Boolean)
      : (Array.isArray(item.reader_highlights) ? item.reader_highlights : [])
        .map(cleanNetText).filter(Boolean);
    const boundary = cleanNetText(item.reader_boundary || "");
    const how = cleanNetText(item.reader_how || "");
    const structuredMaterials = MATERIAL_CARD_GROUPS.has(groupKey) && publicEvidence.length > 0;
    const logic = (structuredMaterials ? [intro] : [intro, summary]).filter(Boolean).join("\n");
    const formalLevel = MATERIAL_CARD_GROUPS.has(groupKey) ? cleanNetText(item.public_level_label || "") : "";
    const full = fullBasis && fullBasis !== summary
      ? `<details><summary>当前人物的完整裁决原文</summary>${prose(fullBasis)}</details>`
      : "";
    const materialCards = metricMaterialCards(item, groupKey);
    const summaryFold = structuredMaterials && summary
      ? `<details class="net-material-summary"><summary>总体裁决摘要</summary>${prose(summary)}</details>`
      : "";
    const facts = materialCards || (highlights.length
      ? `<div class="label">关键事实</div><ul>${highlights.map(text => `<li>${esc(text)}</li>`).join("")}</ul>`
      : "");
    const limit = boundary ? `<div class="label">${materialCards ? "总体范围与边界" : "限制与边界"}</div>${prose(boundary)}` : "";
    const formula = how ? `<details><summary>这个分怎么算？</summary>${prose(how)}</details>` : "";
    const secondSource = SECOND_PUBLIC_GROUPS.has(groupKey) ? ` data-second-source-label="${esc(item.label)}"` : "";
    return `<details class="net-metric-detail"${secondSource}><summary><span><strong>${esc(displayLabel)}</strong>${intro ? `<small>${esc(intro)}</small>` : ""}${formalLevel ? `<small class="net-formal-level">正式层级：${esc(formalLevel)}</small>` : ""}</span><b>${esc(netValue(item, groupKey))}</b></summary><div class="net-metric-body">${logic ? `<div class="label">当前人物结算逻辑</div>${prose(logic)}` : ""}${facts}${summaryFold}${limit}${formula}${full}${auditSourceBlock(item, record)}</div></details>`;
  }

  function calculationBlock(items, groupKey = "") {
    const calculations = items.filter(item => item.reader_kind === "calculation" && item.value != null);
    if (!calculations.length) return "";
      return `<details class="net-calculations"><summary>计算过程与小计</summary>${calculations.map(item => `<div class="component"><span><strong>${esc(item.public_component_label || item.label)}</strong><small>${esc(cleanNetText(item.reader_how || "按正式公式换算。"))}</small></span><b>${esc(netValue(item, groupKey))}</b></div>`).join("")}</details>`;
  }

  function genericNetGroup(record, key, items) {
    const judgments = items.filter(item => item.reader_kind === "judgment" && item.value != null);
    return `<section id="net-group-${esc(key)}" class="panel net-detail-group"><h2>${esc(netGroupNames[key] || key)}</h2>${judgments.map(item => metricDetail(item, record, key)).join("")}${calculationBlock(items, key)}</section>`;
  }

  function firstItemRawUrl(ref) {
    const path = String(ref || "").split("#", 1)[0];
    return typeof validatedRawUrl === "function" ? validatedRawUrl(path) : `../${path}?raw=1`;
  }

  async function loadFirstItemDoc(ref, record) {
    if (!ref) return "";
    const rulerId = record?.ruler_id || "";
    const cacheKey = `${rulerId}\u0000${ref}`;
    if (firstItemDocCache.has(cacheKey)) return firstItemDocCache.get(cacheKey);
    const pending = fetch(firstItemRawUrl(ref), {cache: "no-cache"})
      .then(response => response.ok ? response.text() : "")
      .catch(() => "");
    firstItemDocCache.set(cacheKey, pending);
    return pending;
  }

  function firstItemBulletsForName(markdown, rulerName) {
    if (!markdown || !rulerName) return {};
    const escaped = rulerName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const heading = new RegExp(`^###\\s+\\d+\\.\\s+${escaped}\\s*$`, "m");
    const match = heading.exec(markdown);
    if (!match) return {};
    const tail = markdown.slice(match.index + match[0].length);
    const next = tail.search(/^###\s+\d+\./m);
    const section = next >= 0 ? tail.slice(0, next) : tail;
    const result = {};
    for (const line of section.split(/\r?\n/)) {
      const bullet = line.match(/^-\s+\*\*(.+?)\*\*：\s*(.*)$/);
      if (!bullet) continue;
      result[bullet[1].trim()] = bullet[2].replace(/\*\*/g, "").replace(/`/g, "").trim();
    }
    return result;
  }

  function firstItemBullets(markdown, rulerNames) {
    const names = Array.isArray(rulerNames) ? rulerNames : [rulerNames];
    for (const rulerName of [...new Set(names.filter(Boolean))]) {
      const result = firstItemBulletsForName(markdown, rulerName);
      if (Object.keys(result).length) return result;
    }
    return {};
  }

  function firstItemPublicText(value) {
    return String(value ?? "")
      .replace(/\bR([0-6])\b/g, "起点R$1级")
      .replace(/\bO([1-6])\b/g, "对手O$1级")
      .replace(/\bL([0-5])\b/g, "L$1级")
      .replace(/\bHYBRID\b/g, "战略统筹与本人主帅／临阵并存")
      .replace(/\bSTRATEGIC_COMMAND\b/g, "战略统筹路线")
      .replace(/\bNONE\b/g, "未形成可计的本人统帅责任")
      .replace(/\bC-([0-5])-(LOW|MID|HIGH)\b/g, (_, n, p) => `第${n}档·${({LOW:"低位",MID:"中位",HIGH:"高位"})[p]}`)
      .replace(/\bC-0\b/g, "第0档")
      .replace(/\s+/g, " ")
      .trim();
  }

  function firstFactText(value) {
    return firstItemPublicText(value)
      .replace(/^L[0-5]级[。；：]?\s*/, "")
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .trim();
  }

  function firstPublicOutcomeText(value) {
    return String(value ?? "").replace(/\s+/g, " ").trim();
  }

  function firstPublicOutcomeParts(outcome) {
    if (!outcome || typeof outcome !== "object") return [];
    return [
      ["起点与继承背景", outcome.public_outcome_basis],
      ["本人实际成果范围", outcome.public_scope],
      ["公开边界", outcome.public_boundary],
    ].filter(([, value]) => firstPublicOutcomeText(value));
  }

  function firstPublicSharePercent(outcome) {
    const value = Number(outcome?.public_share_percent);
    if (!Number.isFinite(value)) return "";
    return Number.isInteger(value) ? String(value) : value.toFixed(1);
  }

  function firstMetricDetail(id, title, subtitle, item, body, record, valueText = "") {
    const shown = valueText || netValue(item);
    return `<details id="${id}" data-ruler="${esc(personLabel(record))}" class="net-metric-detail"><summary><span><strong>${title}</strong><small>${subtitle}</small></span><b>${esc(shown)}</b></summary><div class="net-metric-body">${body}${auditSourceBlock(item, record)}</div></details>`;
  }

  function firstEvidenceMarkup(value, component) {
    const text = String(value || "");
    const base = new URL(`../${firstItemDocs[component]}`, location.href);
    let output = "", cursor = 0;
    for (const match of text.matchAll(/\[([^\]]+)\]\(([^)]+)\)/g)) {
      output += esc(text.slice(cursor, match.index));
      const href = new URL(match[2], base);
      output += ["http:", "https:"].includes(href.protocol)
        ? `<a href="${esc(href.href)}" target="_blank" rel="noopener">${esc(match[1])} ↗</a>` : esc(match[1]);
      cursor = match.index + match[0].length;
    }
    return output + esc(text.slice(cursor));
  }

  function renderFirstA(item, bullets, record) {
    const publicOutcome = item.reader_public_outcome || {};
    const calculation = item.reader_how || "";
    const percent = firstPublicSharePercent(publicOutcome);
    const project = publicOutcome.public_project ? `<div class="label">共同项目</div>${prose(firstPublicOutcomeText(publicOutcome.public_project))}` : "";
    const facts = firstPublicOutcomeParts(publicOutcome)
      .map(([label, value]) => `<div class="label">${esc(label)}</div>${prose(firstPublicOutcomeText(value))}`)
      .join("");
    const share = percent ? `<div class="label">成果占比</div>${prose(`约${percent}%`)}` : "";
    const rules = `<details class="first-item-rule-box"><summary>规则口径与计算</summary><div class="label">A看什么</div>${prose("A只评价建国、复国或统一主链中，本人最终真正留下的稳定控制成果。继承来的既有版图不算本人新增；起点、对手、速度、组织和本人军事能力分别放到B1、B2、C。")}<div class="label">有效控制信用U</div>${prose("新增稳定控制按100%计，恢复旧有稳定控制按50%计；1000代表一个全国核心统一尺度。U不是人口、面积或军队人数。")}${prose(`单人项目按统一贡献曲线换分；共同项目先算项目A池，再按本人控制信用占项目总信用的比例分配。${calculation ? `\n当前人物正式代入：${calculation}` : ""}`)}</details>`;
    return firstMetricDetail("net-first-a", "统一成果", "先看本人真正留下了什么", item, `${project}${facts}${share}${rules}`, record);
  }

  function renderFirstB1(item, bullets, record) {
    const rules = `<details class="first-item-rule-box"><summary>规则口径与计算</summary>${prose(item.reader_public_b1?.public_calculation || "")}</details>`;
    return firstMetricDetail("net-first-b1", "起点、强敌与速度", "起点、主要对手和完成效率", item, `${firstB1Markup(item)}${rules}`, record);
  }


  function renderFirstB2(item, bullets, record) {
    const result = bullets["B2结算"] || "";
    const parallel = bullets["并行执行"] || "";
    const coverage = bullets["团队能力覆盖与组织杠杆"] || bullets["能力覆盖/组织杠杆"] || "";
    const integration = bullets["异质整合"] || "";
    const basis = bullets["裁决依据"] || "";
    const facts = `${parallel ? `<div class="label">多线任务怎样同时推进</div>${prose(firstFactText(parallel))}` : ""}${coverage ? `<div class="label">团队怎样分工</div>${prose(firstFactText(coverage))}` : ""}${integration ? `<div class="label">旧部、降附者与异质集团怎样整合</div>${prose(firstFactText(integration))}` : ""}${basis ? `<div class="label">本人组织表现与限制</div>${prose(firstFactText(basis))}` : ""}${bullets["材料来源"] ? `<details><summary>史料与归责来源</summary><p class="sources">${firstEvidenceMarkup(bullets["材料来源"], "B2组织与整合")}</p></details>` : ""}`;
    const rules = `<details class="first-item-rule-box"><summary>规则口径与计算</summary>${prose("B2看创业或统一机器能否多线并行、把高难任务交给专业责任中心，并把不同地域和旧集团稳定接入同一执行体系。三个维度各用L0—L5六档，分别映射0、2、4、6、8、10分，三项相加。")}${result ? prose(`当前人物正式结算：${firstFactText(result)}`) : ""}</details>`;
    return firstMetricDetail("net-first-b2", "创业组织与政治整合", "多线并行、专业分工与异质整合", item, `${facts}${rules}`, record);
  }

  function renderFirstC(item, bullets, record) {
    const facts = firstCommanderMarkup(item);
    const rules = `<details class="first-item-rule-box"><summary>规则口径与计算</summary>${prose("这里只看本人亲自承担的整体部署、战役指挥或临阵处理；将领独立完成的战果不直接归到本人名下。具体分数保留在正式记录中。")}</details>`;
    return firstMetricDetail("net-first-c", "本人统帅", "只看本人亲自承担并完成的军事指挥事实", item, `${facts}${rules}`, record);
  }

  function renderFirstCost(item, record) {
    const rule = `<details class="first-item-rule-box"><summary>扣分怎样换算</summary>${prose(item.reader_how || "")}</details>`;
    return firstMetricDetail("net-first-cost", "军事成本 · 战争代价", "从四轴毛分中扣除", item, `${firstCostMarkup(item)}${rule}`, record, `扣 ${item.value} 分`);
  }


  function firstTotals(items) {
    const byLabel = Object.fromEntries(items.map(item => [item.label, item]));
    const a = byLabel["A统一贡献"]?.value;
    const b1 = byLabel["B1创业难度与效率"]?.value;
    const b2 = byLabel["B2组织与整合"]?.value;
    const c = byLabel["C军事统帅与战争解题"]?.value;
    const gross = byLabel["四轴合计"]?.value;
    const cost = byLabel["军事成本扣分"]?.value;
    const net = byLabel["第一项净分"]?.value;
    const addOn = byLabel["附加F"]?.value;
    if ([a, b1, b2, c, gross, net, addOn].some(value => value == null)) return "";
    return `<div class="net-detail-total"><div class="label">第一项结算</div><p class="first-item-scoreline">统一成果 ${a} + 创业难度与效率 ${b1} + 创业组织 ${b2} + 本人统帅 ${c} − 战争代价 ${cost ?? 0} = <strong>原始净收益 ${net} / 240</strong> → 总榜附加 <strong>+${addOn}</strong></p><details><summary>查看完整折算公式</summary>${prose(`四轴毛分 = A + B1 + B2 + C = ${a} + ${b1} + ${b2} + ${c} = ${gross}。\nS1 = max(0, ${gross} − ${cost ?? 0}) = ${net}。\n总榜附加 F = 0.20 × 637 × (S1 / 240)^1.25 = ${addOn}。`)}</details></div>`;
  }

  function firstItemOverview(record, bulletsByLabel, byLabel) {
    const a = byLabel["A统一贡献"]?.reader_public_outcome || {};
    const b1 = byLabel["B1创业难度与效率"]?.reader_public_b1 || {};
    const b2 = bulletsByLabel["B2组织与整合"] || {};
    const cost = byLabel["军事成本扣分"];
    const aPercent = firstPublicSharePercent(a);
    const aText = [
      a.public_project ? `共同项目：${a.public_project}` : "",
      ...firstPublicOutcomeParts(a).map(([, value]) => firstPublicOutcomeText(value)),
      aPercent ? `成果占比：约${aPercent}%` : "",
    ].filter(Boolean).join(" ");
    const b1Parts = [
      ["起点", b1.public_start_basis],
      ["对手", b1.public_opponent_basis],
      ["速度", b1.public_efficiency_basis],
    ].filter(([, value]) => value);
    const b2Parts = [
      ["并行", b2["并行执行"]],
      ["分工", b2["团队能力覆盖与组织杠杆"] || b2["能力覆盖/组织杠杆"]],
      ["整合", b2["异质整合"]],
    ].filter(([, value]) => value);
    const cText = byLabel["C军事统帅与战争解题"]?.reader_public_commander?.public_basis || "";
    const costText = cost?.reader_public_cost?.public_basis || "";
    const items = record.net?.component_details?.first || [];
