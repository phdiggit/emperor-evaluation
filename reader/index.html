    const score = [parts["A统一贡献"], parts["B1创业难度与效率"], parts["B2组织与整合"], parts["C军事统帅与战争解题"], parts["第一项净分"], parts["附加F"]];
    return `<section class="first-item-overview"><h2>先看${esc(personLabel(record))}在这条主链里实际做了什么</h2><p class="subline">下面默认只放当前人物的成果、难题、组织、统帅和代价；指标定义与公式都收进折叠项。</p><div class="first-item-story-grid">${aText ? `<div class="first-item-story-card"><b>统一成果</b><p>${esc(aText)}</p></div>` : ""}${b1Parts.length ? `<div class="first-item-story-card"><b>起点、强敌与速度</b><ul>${b1Parts.map(([label, value]) => `<li><strong>${label}：</strong>${esc(value)}</li>`).join("")}</ul></div>` : ""}${b2Parts.length ? `<div class="first-item-story-card"><b>组织与整合</b><ul>${b2Parts.map(([label, value]) => `<li><strong>${label}：</strong>${esc(firstFactText(value))}</li>`).join("")}</ul></div>` : ""}${cText ? `<div class="first-item-story-card"><b>本人统帅</b><p>${esc(cText)}</p></div>` : ""}${costText ? `<div class="first-item-story-card wide"><b>战争代价</b><p>${esc(costText)}</p></div>` : ""}</div>${score.every(value => value != null) ? `<div class="first-item-scoreline">统一成果 ${score[0]} + 创业难度与效率 ${score[1]} + 创业组织 ${score[2]} + 本人统帅 ${score[3]} − 战争代价 ${parts["军事成本扣分"] ?? 0} = <strong>原始净收益 ${score[4]}</strong> → 总榜附加 <strong>+${score[5]}</strong></div>` : ""}</section>`;
  }

  async function renderFirstMajor(record, focus = "") {
    const items = record.net?.component_details?.first || [];
    const container = document.getElementById("net-major-body");
    if (!container) return;
    const firstNotApplicable = items.every(item =>
      item.value == null || (item.label === "附加F" && Number(item.value) === 0)
    );
    if (firstNotApplicable) {
      container.innerHTML = `<section class="panel"><h2>${esc(netMajorSpecs.first.title)}</h2><p class="notice">本项只评价建国、复国或统一创业主链；该人物不适用，因此这一项不参与净收益计分。</p></section>`;
      return;
    }

    const labels = ["B1创业难度与效率", "B2组织与整合"];
    const bulletsByLabel = {};
    const names = [record.ruler_name, firstItemFormalNames[record.ruler_name]];
    await Promise.all(labels.map(async label => {
      bulletsByLabel[label] = firstItemBullets(await loadFirstItemDoc(firstItemDocs[label], record), names);
    }));
    if (!location.hash.startsWith(`#net/${encodeURIComponent(record.ruler_id)}/first`)) return;

    const byLabel = Object.fromEntries(items.map(item => [item.label, item]));
    const ownA = byLabel["A统一贡献"]?.reader_public_outcome || {};
    if (!container.isConnected) return;

    const cards = [];
    if (byLabel["A统一贡献"]) cards.push(renderFirstA(byLabel["A统一贡献"], bulletsByLabel["A统一贡献"], record));
    if (byLabel["B1创业难度与效率"]) cards.push(renderFirstB1(byLabel["B1创业难度与效率"], bulletsByLabel["B1创业难度与效率"], record));
    if (byLabel["B2组织与整合"]) cards.push(renderFirstB2(byLabel["B2组织与整合"], bulletsByLabel["B2组织与整合"], record));
    if (byLabel["C军事统帅与战争解题"]) cards.push(renderFirstC(byLabel["C军事统帅与战争解题"], bulletsByLabel["C军事统帅与战争解题"], record));
    if (byLabel["军事成本扣分"]?.value != null) cards.push(renderFirstCost(byLabel["军事成本扣分"], record));

    const windowText = bulletsByLabel["B1创业难度与效率"]["效率"] || "";
    const zeroNote = record.net?.first_item_status === "APPLICABLE" && Number(record.net?.first_item_raw_score) === 0
      ? '<p class="notice"><strong>本项适用，但没有形成正向净收益。</strong>这与“不适用”不同：本项已经进入结算，只是成果在扣除本人窗口内军事代价后归零，因此总榜附加为0。</p>'
      : "";
    const scope = `<details class="first-item-scope"><summary>本项采用的时间与责任范围</summary><dl>${ownA.public_project ? `<dt>共同项目</dt><dd>${esc(firstPublicOutcomeText(ownA.public_project))}</dd>` : ""}${firstPublicOutcomeParts(ownA).map(([label, value]) => `<dt>${esc(label)}</dt><dd>${esc(firstPublicOutcomeText(value))}</dd>`).join("")}${windowText ? `<dt>完成效率计时</dt><dd>${esc(firstFactText(windowText))}</dd>` : ""}${byLabel["军事成本扣分"]?.reader_boundary ? `<dt>军事成本责任范围</dt><dd>${esc(byLabel["军事成本扣分"].reader_boundary)}</dd>` : ""}</dl><p class="sources">${link('docs/分项规则/第一项政权奠基与统一贡献及能力/00-规则与计分合同.md','查看完整规则合同 ↗',record)}</p></details>`;

    container.innerHTML = `<section class="panel net-detail-group">${firstItemOverview(record, bulletsByLabel, byLabel)}${zeroNote}${scope}${cards.join("")}${firstTotals(items)}</section>`;
    if (focus) requestAnimationFrame(() => document.getElementById(`net-first-${focus}`)?.scrollIntoView({behavior: "smooth", block: "start"}));
  }

  function renderGenericMajor(record, major, focus = "") {
    const spec = netMajorSpecs[major];
    const details = record.net?.component_details || {};
    const content = spec.groups.map(key => genericNetGroup(record, key, details[key] || [])).join("");
    const container = document.getElementById("net-major-body");
    if (container) container.innerHTML = content || `<section class="panel"><p class="notice">这一项暂未形成可展示的完整分项记录。</p></section>`;
    if (focus) requestAnimationFrame(() => document.getElementById(`net-group-${focus}`)?.scrollIntoView({behavior: "smooth", block: "start"}));
  }

  function majorNav(record, active) {
    const links = ["all", "first", "second", "third", "fourth"].map(key => {
      const label = key === "all" ? "总览" : netMajorSpecs[key].title.replace(/^第[一二三四]项 · /, "");
      return `<a class="${active === key ? "active" : ""}" href="${netHref(record, key)}">${esc(label)}</a>`;
    }).join("");
    return `<nav class="net-major-nav" aria-label="净收益计分页">${links}</nav>`;
  }

  function majorCard(record, major) {
    const value = majorValue(record, major);
    const spec = netMajorSpecs[major];
    const extra = major === "first" && record.net?.first_item_status === "APPLICABLE"
      ? Number(record.net.first_item_raw_score) === 0
        ? '<p class="subline">本项适用，但原始净收益为0；总榜附加为0。</p>'
        : `<p class="subline">第一项原始净收益：${number(record.net.first_item_raw_score)}；此处显示进入总榜的附加分。</p>`
      : major === "first" ? `<p class="subline">该人物第一项不适用。</p>` : "";
    const shownValue = value == null ? "—" : major === "fourth" && Number(value) > 0 ? `+${number(value)}` : number(value);
    return `<a class="panel net-major-card" href="${netHref(record, major)}"><h2>${esc(spec.title)}</h2><div class="big">${shownValue}</div>${extra}<p>${esc(spec.description)}</p><p class="sources">查看完整计分逻辑 →</p></a>`;
  }

  function renderNetShell(record, active, body) {
    nav("");
    screen.innerHTML = `<a class="back" href="#person/${encodeURIComponent(record.ruler_id)}">← 返回${esc(personLabel(record))}人物页</a><div class="person-head net-detail-head"><div><div class="eyebrow">${esc(record.polity)} / 净收益计分</div><h1>${esc(personLabel(record))} · ${esc(netMajorSpecs[active]?.title || "净收益")}</h1><p class="muted">掌权背景：${esc(record.actual_power_window || "未列")} · 总榜净收益 ${number(record.net?.total_score)}</p></div></div><p class="subline net-power-context-note">本项采用的时间与责任范围见各条依据；不能仅凭上述背景时期判断事件是否计入。</p>${majorNav(record, active)}<section class="net-detail-page">${body}</section>`;
  }

  function renderNetLanding(record) {
    renderNetShell(record, "all", `<section class="panel"><h2>怎么读这页</h2><p>先选一个大项。每个指标优先展示当前人物自己的结算逻辑和公式；整份正式结算文件只保留为最深层审计入口。</p></section><div class="net-major-grid">${["first", "second", "third", "fourth"].map(major => majorCard(record, major)).join("")}</div>`);
  }

  function renderNetMajor(record, major, focus) {
    const spec = netMajorSpecs[major];
    if (!spec || major === "all") {
      renderNetLanding(record);
      return;
    }
    const value = majorValue(record, major);
    if (major === "first") {
      renderNetShell(record, major, `<div id="net-major-body"><div class="empty">正在整理当前人物的主链事实…</div></div>`);
      void renderFirstMajor(record, focus);
      return;
    }
    const shownValue = value == null ? "—" : major === "fourth" && Number(value) > 0 ? `+${number(value)}` : number(value);
    const scoreNote = `本项进入总榜的分值：${shownValue}。`;
    renderNetShell(record, major, `<section class="panel"><h2>${esc(spec.title)}</h2><p>${esc(spec.description)}</p><p class="subline">${esc(scoreNote)}</p></section><div id="net-major-body"><div class="empty">正在整理当前人物的逐项结算逻辑…</div></div>`);
    renderGenericMajor(record, major, focus);
  }

  function parseNetRoute(hash = location.hash) {
    const match = hash.match(/^#net\/([^/?#]+)(?:\/(all|first|second|third|fourth))?(?:\/([^/?#]+))?$/);
    if (!match) return null;
    try {
      return {
        rulerId: decodeURIComponent(match[1]),
        major: match[2] || "all",
        focus: match[3] ? decodeURIComponent(match[3]) : "",
      };
    } catch {
      return null;
    }
  }

  async function loadNetRecord(record) {
    if (!record || record.detail_loaded) return record;
    const id = record.ruler_id;
    if (pendingNetRecords.has(id)) return pendingNetRecords.get(id);
    if (!record.detail_ref) throw new Error(`Missing detail_ref for ${id}`);
    const pending = (async () => {
      const response = await fetch(record.detail_ref, {cache: "no-cache"});
      if (!response.ok) throw new Error(`Failed to load ${record.detail_ref}: HTTP ${response.status}`);
      const payload = await response.json();
      if (!payload?.record || payload.record.ruler_id !== id) throw new Error(`Detail payload ruler_id mismatch for ${id}`);
      const full = {...payload.record, detail_ref: record.detail_ref, detail_loaded: true};
      byId.set(id, full);
      Object.assign(DATA.source_availability, payload.source_availability || {});
      return full;
    })().finally(() => pendingNetRecords.delete(id));
    pendingNetRecords.set(id, pending);
    return pending;
  }

  async function renderNetRoute() {
    const parsed = parseNetRoute();
    if (!parsed) return false;
    const summary = byId.get(parsed.rulerId);
    nav("");
    if (!summary) {
      screen.innerHTML = `<div class="empty"><p>净收益详情地址无效。</p><a href="#overview">返回人物总览</a></div>`;
      return true;
    }
    const generation = ++netRenderGeneration;
    screen.innerHTML = `<div class="empty" role="status">正在加载${esc(summary.ruler_name)}的净收益计分逻辑…</div>`;
    try {
      const record = await loadNetRecord(summary);
      if (generation !== netRenderGeneration || !location.hash.startsWith("#net/")) return true;
      if (!record.net) {
        screen.innerHTML = `<div class="empty"><p>${esc(personLabel(record))}没有可展示的净收益正式结算。</p><a href="#person/${encodeURIComponent(record.ruler_id)}">返回人物页</a></div>`;
        return true;
      }
      renderNetMajor(record, parsed.major, parsed.focus);
      window.scrollTo(0, 0);
    } catch (error) {
      console.error(error);
      if (generation === netRenderGeneration) {
        screen.innerHTML = `<div class="empty"><p>净收益计分详情加载失败。</p><p class="subline">人物总览与人物主页仍可正常使用。</p><a href="#person/${encodeURIComponent(summary.ruler_id)}">返回人物页</a></div>`;
      }
    }
    return true;
  }

  new MutationObserver(() => {
    enhanceHomeRows();
    enhancePersonNet();
  }).observe(screen, {childList: true, subtree: true});
  enhanceHomeRows();
  ensureNetStyles();
  enhancePersonNet();

  screen.addEventListener("click", event => {
    const quickOpen = event.target.closest("[data-home-open]");
    if (quickOpen) {
      event.preventDefault();
      openPersonSection(quickOpen.dataset.homeOpen, quickOpen.dataset.homeSection || "");
      return;
    }

    const polity = event.target.closest("[data-home-polity]");
    if (polity) {
      event.preventDefault();
      applyPolityFilter(polity.dataset.homePolity);
      return;
    }

    const grade = event.target.closest("[data-home-grade]");
    if (grade) {
      event.preventDefault();
      applyImpactFilter(grade.dataset.homeGrade);
      return;
    }

    if (event.target.closest(interactiveSelector)) return;
    const row = event.target.closest("tr[data-home-person]");
    if (!row) return;
    const cell = event.target.closest("td");
    openPersonSection(row.dataset.homePerson, cell?.dataset.homeSection || "");
  });

  screen.addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;

    const grade = event.target.closest("[data-home-grade]");
    if (grade) {
      event.preventDefault();
      applyImpactFilter(grade.dataset.homeGrade);
      return;
    }

    const cell = event.target.closest("td[data-home-section]");
    const row = cell?.closest("tr[data-home-person]");
    if (!cell || !row) return;
    event.preventDefault();
    openPersonSection(row.dataset.homePerson, cell.dataset.homeSection);
  });

  const baseRoute = route;
  window.removeEventListener("hashchange", baseRoute);
  route = function() {
    if (location.hash.startsWith("#net/")) {
      void renderNetRoute();
      return;
    }
    netRenderGeneration += 1;
    baseRoute();
  };
  window.addEventListener("hashchange", route);

  if (location.hash.startsWith("#net/")) void renderNetRoute();
})();
</script>
<script>
"use strict";

(() => {
  const baseReaderText = readerText;
  // These names apply only to profile prose. Fiscal C1/C2 etc. use another contract.
  const profileAxisNames = {M1: "军事统帅", M2: "外交博弈", M4: "内部联盟", M5: "组织执行",
    C1: "战略判断", C2: "学习纠错", C3: "用人授权", C4: "制度设计", C5: "权力运用与克制"};
  const militaryFacets = {"M1.1": "战争目标与军事战略", "M1.2": "战区与战役统筹",
    "M1.3": "临阵判断与战术解题", "M1.4": "失败识别、止损与重组", "M1.5": "个人武勇与前线承担"};
  function profileCodeNames(value) {
    return String(value ?? "")
      // An identifier is not a public title; the full identifier stays in the original record.
      .replace(/(?<![A-Za-z0-9_.-])(M[1245]|C[1-5])-(?:[A-Z0-9]+-)+[A-Z0-9]+\b/g, (_, code) => profileAxisNames[code] + "情境记录")
      .replace(/(?<![A-Za-z0-9_.-])M1\.[1-5]\b/g, code => militaryFacets[code])
      .replace(/(?<![A-Za-z0-9_.-])(M[1245]|C[1-5])(?![A-Za-z0-9_.-])(?:军事统帅|外交博弈|内部联盟|组织执行|战略判断|学习纠错|用人授权|制度设计|权力运用风格与克制|权力运用与克制|权力克制)?/g,
        (_, code) => profileAxisNames[code]);
  }
  function conflictScopeText(value) {
    // C5's radius is the affected population, not event severity or a military difficulty code.
    const names = {R0: "未向无独立威胁归责对象扩大", R1: "扩大到极少数邻接对象",
      R2: "扩大到单一家庭或窄亲属群", R3: "扩大到宗族或特定政治群体",
      R4: "扩大到一般民众或形成跨案件的制度化清洗"};
    return value.replace(/\b(R[0-4])(?:_(?:NO_EXPANSION|LIMITED|BOUNDED|BROAD|SYSTEMIC_EXTREME))?\b/g,
      (_, code) => names[code]);
  }
  const publicReaderText = value => profileCodeNames(baseReaderText(value))
    .replace(/\bMIXED_NEGATIVE\b/g, "正负混合、以负向为主")
    .replace(/\bMIXED_POSITIVE\b/g, "正负混合、以正向为主")
    .replace(/\bNEGATIVE\b/g, "负向")
    .replace(/\bPOSITIVE\b/g, "正向")
    .replace(/\bMIXED\b/g, "正负混合")
    .replace(/\bCOUNTEREVIDENCE_FOUND\b/g, "已找到明确反例")
    .replace(/\bBACKGROUND_VALIDATION\b/g, "背景核验")
    .replace(/\bAXIS_OUT_WITH_REASON\b/g, "不计入本轴（有明确理由）")
    .replace(/\bFORMAL_CURRENT\b/g, "当前正式记录")
    .replace(/\bSCORING_PARENT\b/g, "主要计分证据")
    .replace(/\bREFUSAL_OR_RECURRENCE\b/g, "拒绝更新或同类复发情境")
    .replace(/\bTRUTH_ACQUISITION\b/g, "求真取证情境")
    .replace(/\bUNRESOLVED\b/g, "尚未确认");

  readerText = publicReaderText;

  function foldHomeStatus() {
    const note = document.querySelector("#screen .footer-note:not([data-readability-status])");
    if (!note) return;
    const text = note.textContent.trim();
    const firstStop = text.indexOf("。");
    note.dataset.readabilityStatus = "done";
    if (firstStop < 0 || firstStop === text.length - 1) return;
    const headline = text.slice(0, firstStop + 1).trim();
    const detailText = text.slice(firstStop + 1).trim();
    if (!detailText) return;
    note.textContent = "";
    const summary = document.createElement("span");
    summary.className = "home-count-summary";
    summary.textContent = headline;
    const details = document.createElement("details");
    details.className = "data-status";
    const toggle = document.createElement("summary");
    toggle.textContent = "数据状态";
    const body = document.createElement("p");
    body.textContent = detailText;
    details.append(toggle, body);
    note.append(summary, details);
  }

  function compactComparisonEvidence() {
    for (const summary of document.querySelectorAll("#screen .comparison .axis-evidence > summary:not([data-compact-compare])")) {
      const badge = summary.querySelector(".badge");
      if (!badge) continue;
      const grade = badge.textContent.trim();
      summary.textContent = "";
      const compactBadge = document.createElement("span");
      compactBadge.className = "badge";
      compactBadge.textContent = grade;
      const label = document.createElement("span");
      label.className = "compare-evidence-label";
      label.textContent = "展开依据";
      summary.append(compactBadge, label);
      summary.dataset.compactCompare = "done";
    }
  }

  function publicGradeHelp() {
    const profile = document.querySelector("#person-capability .grade-help:not([data-public-help])");
    if (profile) {
      const paragraphs = profile.querySelectorAll(":scope > p");
      if (paragraphs[0]) paragraphs[0].textContent = "各轴从E−到S+分18级；−、无符号、+分别表示同一字母等级中的较低、中间和较高位置。人物画像与历史影响使用不同尺度，字母相同也不能直接比较。";
      if (paragraphs[1]) paragraphs[1].textContent = "八个能力轴分别依据相应行为证据；权力运用与克制这一项描述权力使用方式，不当作能力高低，也不计入能力雷达。不适用、待补证、待重裁会单独标明，不按低分处理。";
      profile.dataset.publicHelp = "done";
    }
    const impact = document.querySelector("#person-impact .grade-help:not([data-public-help])");
    if (impact) {
      const paragraph = impact.querySelector(":scope > p");
      if (paragraph) paragraph.textContent = "这是历史改变的量级，不是能力或功绩等级。总等级与四维使用不同刻度；相同字母不能直接对照，四维也不做平均。";
      impact.dataset.publicHelp = "done";
    }
  }

  function axisRecordForEvidence(details) {
    const id = details.id || "";
    let match = id.match(/^reason-([A-Z]\d)$/);
    if (match) {
      const person = location.hash.match(/^#person\/([^/?#]+)/);
      if (!person) return null;
      try { return byId.get(decodeURIComponent(person[1]))?.axes?.[match[1]] || null; } catch { return null; }
    }
    match = id.match(/^reason-([A-Z]\d)-compare-(\d+)$/);
    if (match) {
      const rulerId = state.compare[Number(match[2])];
      return rulerId ? byId.get(rulerId)?.axes?.[match[1]] || null : null;
    }
    return null;
  }

  function publicAxisMetadata() {
    for (const details of document.querySelectorAll("#screen .axis-evidence:not([data-public-metadata])")) {
      const axis = axisRecordForEvidence(details);
      if (!axis) continue;
      const box = Array.from(details.children).find(node => node.tagName === "DETAILS" && node.classList.contains("metadata") && !node.classList.contains("adjudication"));
      if (!box) continue;
      const summary = box.querySelector(":scope > summary");
      if (summary) summary.textContent = "专业信息与正式记录";
      const line = box.querySelector(":scope > .subline");
      if (line) {
        let status;
        if (ungraded(axis)) status = "当前状态：无档结案";
        else if (pending(axis)) status = `当前状态：${grade(axis)}`;
        else if (axis.applicability_status === "NOT_APPLICABLE" || axis.output_mode === "NOT_APPLICABLE") status = "当前状态：不适用";
        else status = `公开等级：${grade(axis)}`;
        line.textContent = `展示模式：${mode(axis.output_mode)} · 判断把握：${conf(axis.confidence)} · ${status}`;
      }
      details.dataset.publicMetadata = "done";
    }
  }

  function translateResidualAxisCodes() {
    for (const details of document.querySelectorAll("#screen .axis-evidence")) {
      const walker = document.createTreeWalker(details, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        const parent = node.parentElement;
        if (!parent || parent.closest("a, code, .sources, .unavailable-source, .metadata, .reading-original-record, .note-evidence")) continue;
        let translated = publicReaderText(node.nodeValue);
        if (/^reason-C5(?:-|$)/.test(details.id)) translated = conflictScopeText(translated);
        if (translated !== node.nodeValue) node.nodeValue = translated;
      }
      details.dataset.publicTerms = "done";
    }
  }

  function translateNamedProfileReferences() {
    // Historical-impact prose may explicitly cite a profile axis; do not reuse its grade mapper.
    for (const section of document.querySelectorAll('#history-evidence, .comparison [id^="history-"]')) {
      const walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (node.parentElement?.closest("a, code, .sources, .metadata, .note-evidence")) continue;
        const translated = node.nodeValue.replace(/(项目|人物画像|画像)(M[1245]|C[1-5])(?![A-Za-z0-9_.-])/g,
          (_, prefix, code) => prefix + "的" + profileAxisNames[code]);
        if (translated !== node.nodeValue) node.nodeValue = translated;
      }
    }
  }

  function enhance() {
    foldHomeStatus();
    compactComparisonEvidence();
    publicGradeHelp();
    publicAxisMetadata();
    translateResidualAxisCodes();
    translateNamedProfileReferences();
  }

  new MutationObserver(enhance).observe(screen, {childList: true, subtree: true});
  enhance();
})();
</script>

  function evidenceSection(title) {

  function firstItemRawUrl(ref) {

  async function loadFirstItemDoc(ref, record) {
    if (!ref) return "";
    const rulerId = record?.ruler_id || "";
    const cacheKey = `${rulerId}\u0000${ref}`;
    if (firstItemDocCache.has(cacheKey)) return firstItemDocCache.get(cacheKey);
    const pending = fetch(firstItemRawUrl(ref), {cache: "force-cache"})
      .then(response => response.ok ? response.text() : "")
      .catch(() => "");
    firstItemDocCache.set(cacheKey, pending);
    return pending;
  }

  function firstItemBulletsForName(markdown, rulerName) {
    if (!markdown || !rulerName) return {};
    const escaped = rulerName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const heading = new RegExp(`^###\\s+\\d+\\.\\s+${escaped}\\s*$`, "m");
    const match = heading.exec(markdown);
    if (!match) return {};
    const tail = markdown.slice(match.index + match[0].length);
    const next = tail.search(/^###\s+\d+\./m);
    const section = next >= 0 ? tail.slice(0, next) : tail;
    const result = {};
    for (const line of section.split(/\r?\n/)) {
      const bullet = line.match(/^-\s+\*\*(.+?)\*\*：\s*(.*)$/);
      if (!bullet) continue;
      result[bullet[1].trim()] = bullet[2].replace(/\*\*/g, "").replace(/`/g, "").trim();
    }
    return result;
  }

  function firstItemBullets(markdown, rulerNames) {
    const names = Array.isArray(rulerNames) ? rulerNames : [rulerNames];
    for (const rulerName of [...new Set(names.filter(Boolean))]) {
      const result = firstItemBulletsForName(markdown, rulerName);
      if (Object.keys(result).length) return result;
    }
    return {};
  }

  function firstItemPublicText(value) {
    return String(value ?? "")
      .replace(/\bR([0-6])\b/g, "起点R$1级")
      .replace(/\bO([1-6])\b/g, "对手O$1级")
      .replace(/\bL([0-5])\b/g, "L$1级")
      .replace(/\bHYBRID\b/g, "战略统筹与本人主帅／临阵并存")
      .replace(/\bSTRATEGIC_COMMAND\b/g, "战略统筹路线")
      .replace(/\bNONE\b/g, "未形成可计的本人统帅责任")
      .replace(/\bC-([0-5])-(LOW|MID|HIGH)\b/g, (_, n, p) => `第${n}档·${({LOW:"低位",MID:"中位",HIGH:"高位"})[p]}`)
      .replace(/\bC-0\b/g, "第0档")
      .replace(/\s+/g, " ")
      .trim();
  }

  function firstFactText(value) {
    return firstItemPublicText(value)
      .replace(/^L[0-5]级[。；：]?\s*/, "")
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .trim();

  function firstPublicOutcomeText(value) {

  function firstPublicOutcomeParts(outcome) {

  function firstItemTotals(items) {

    const addOnText = Number(addOn) > 0 ? `+${addOn}` : String(addOn);
    return `<article class="context-story net-public-item first-item-total"><div class="label">第一项最后怎么进入总榜</div><div class="component"><span><strong>第一项原始净收益</strong><small>统一成果、创业难度与效率、创业组织、本人统帅合计后，再扣除本人窗口内的军事代价</small></span><b>${esc(net)}</b></div><div class="component"><span><strong>进入总榜的加成</strong><small>所有人物都使用同一条折算曲线，避免第一项量纲直接压过其他项目</small></span><b>${esc(addOnText)}</b></div>${prose("先算第一项原始净收益，再按全员统一曲线折算为总榜加成；因此两个数字不是同一量纲，也不应直接比较大小。") }<details><summary>查看完整公式</summary>${prose(`四轴毛分 = A + B1 + B2 + C = ${a} + ${b1} + ${b2} + ${c} = ${gross}。\n第一项净分 S1 = max(0, 四轴毛分 − 军事代价扣减) = max(0, ${gross} − ${cost ?? 0}) = ${net}。\n总榜附加分 F = 0.20 × 637 × (S1 / 240)^1.25 = ${addOn}。`)}</details></article>`;

  async function hydrateFirstItemGroup(group, record, items) {
    const firstNotApplicable = items.every(item =>
      item.value == null || (item.label === "附加F" && Number(item.value) === 0)

    if (firstNotApplicable) {
      group.innerHTML = `<h3>${esc(netGroupNames.first)}</h3><p class="notice"><strong>本项不适用。</strong>这不代表军事能力差，只表示该人物没有进入“建国、复国或统一创业主链”的本项加分口径，因此第一项不参与净收益计分。</p>`;
      return;
    }

    const labels = ["B1创业难度与效率", "B2组织与整合"];
    const bulletsByLabel = {};
    const names = [record.ruler_name, firstItemFormalNames[record.ruler_name]];
    await Promise.all(labels.map(async label => {
      const markdown = await loadFirstItemDoc(firstItemDocs[label], record);
      bulletsByLabel[label] = firstItemBullets(markdown, names);
    }));
    if (!group.isConnected || currentRecord()?.ruler_id !== record.ruler_id) return;

    const byLabel = Object.fromEntries(items.map(item => [item.label, item]));
    const cards = [];
    if (byLabel["A统一贡献"]) cards.push(renderFirstA(byLabel["A统一贡献"], {}, record));
    if (byLabel["B1创业难度与效率"]) cards.push(renderFirstB1(byLabel["B1创业难度与效率"], bulletsByLabel["B1创业难度与效率"], record));
    if (byLabel["B2组织与整合"]) cards.push(renderFirstB2(byLabel["B2组织与整合"], bulletsByLabel["B2组织与整合"], record));
    if (byLabel["C军事统帅与战争解题"]) cards.push(renderFirstC(byLabel["C军事统帅与战争解题"], bulletsByLabel["C军事统帅与战争解题"], record));
    if (byLabel["军事成本扣分"]?.value != null) cards.push(`<article class="context-story net-public-item first-item-card"><div class="component"><strong>战争代价</strong><b>${esc(netValue(byLabel["军事成本扣分"]))}</b></div>${firstCostMarkup(byLabel["军事成本扣分"])}<details><summary>扣分怎样换算</summary>${prose(byLabel["军事成本扣分"].reader_how || "")}</details>${firstItemSourceBlock(byLabel["军事成本扣分"], record)}</article>`);
    const totals = firstItemTotals(items);
    const netScore = Number(byLabel["第一项净分"]?.value);
    const zeroNote = Number.isFinite(netScore) && netScore === 0
      ? `<p class="notice"><strong>本项适用，但没有形成正向净收益。</strong>这与“不适用”不同：这里已经进入第一项结算，只是正向成果在扣除相关军事代价后没有留下正的净值。</p>`
      : "";

  }

  function netValue(item) {
    if (item.value == null) return item.unit === "不单独计分" ? "不单独计分" : "—";
    const signed = item.value > 0 && item.label?.includes("文明") ? `+${item.value}` : String(item.value);
    return `${signed}${item.unit ? ` ${item.unit}` : ""}`;
  }

  function netSourceLinks(item, record) {
    const refs = Array.isArray(item.reader_source_refs) ? item.reader_source_refs : [];
    if (!refs.length && !item.source && !item.applied_source) return "";
    const ordered = [...new Set([item.source, item.applied_source, ...refs].filter(Boolean))];
    return ordered.map((ref, index) => {
      let labelText = index === 0 ? "看裁决依据 ↗" : `看补充来源 ${index} ↗`;
      if (ref === item.applied_source && ref !== item.source) labelText = "看采用值依据 ↗";
      return link(ref, labelText, record);
    }).join(" ");
  }

  function netJudgment(item, record) {
    const displayLabel = item.public_component_label || (item.label === "军事成本扣分" ? "军事代价扣减" : item.label);
    const intro = netPublicIntro[displayLabel] || netPublicIntro[item.label] || "";

    const summaryText = [intro, decision].filter(Boolean).join("\n");

      ? `<div class="label">为什么这样评</div>${prose(summaryText)}`
      : "";
    const publicEvidence = Array.isArray(item.reader_public_evidence_items) ? item.reader_public_evidence_items : [];
    const highlightTexts = (publicEvidence.length
      ? publicEvidence.map(entry => `${entry?.public_label || entry?.public_role || "公开依据"}：${entry?.public_basis || ""}`)
      : (Array.isArray(item.reader_highlights) ? item.reader_highlights : []))
      .map(text => conciseNetText(text))
      .filter((text, index, values) => text && text !== decision && values.indexOf(text) === index);
    const highlights = highlightTexts.length
      ? `<div class="label">关键事实</div><ul>${highlightTexts.map(text => `<li>${esc(text)}</li>`).join("")}</ul>`
      : "";
    const boundaryText = item.reader_boundary ? conciseNetText(item.reader_boundary) : "";

      ? `<div class="label">限制与边界</div>${prose(boundaryText)}`
      : "";
    const rawHow = String(item.reader_how || "");

      : "";
    const fullBasis = item.reader_full_basis

    return `<article class="context-story net-public-item"><div class="component"><span><strong>${esc(displayLabel)}</strong></span><b>${esc(netValue(item))}</b></div>${summary}${highlights}${boundary}${how}${sourceBlock}</article>`;

  function netCalculation(item) {
    const how = item.reader_how || `${item.label}为计算项，具体公式见完整计分账本。`;

    return `<div class="component"><span><strong>${esc(item.public_component_label || item.label)}</strong><small>${esc(netPublicText(how))}</small></span><b>${esc(netValue(item))}</b></div>`;

  function buildNetReading(record) {
    const section = evidenceSection("统治绩效构成");
    const groups = Object.entries(record.net?.component_details || {});
    if (!section || !groups.length || section.dataset.netReadable === "done") return;

    const intro = document.createElement("div");
    intro.className = "net-reading";
    intro.innerHTML = `<p class="reading-intro">先看历史事实与判断，再看分数如何换算。小计、折算和总计属于计算过程，不再伪装成独立“评分依据”。</p>`;

    for (const [key, items] of groups) {
      if (!Array.isArray(items)) continue;
      const group = document.createElement("section");
      group.className = "net-public-group";
      group.dataset.netGroup = key;
      const title = `<h3>${esc(netGroupNames[key] || groupNames[key] || key)}</h3>`;

      const firstNotApplicable = key === "first" && items.every(item =>
        item.value == null || (item.label === "附加F" && Number(item.value) === 0)
      );
      if (firstNotApplicable) {
        group.innerHTML = `${title}<p class="notice"><strong>本项不适用。</strong>这不代表军事能力差，只表示该人物没有进入“建国、复国或统一创业主链”的本项加分口径，因此第一项不参与净收益计分。</p>`;
        intro.append(group);
        continue;
      }

      if (key === "first") {
        group.innerHTML = `${title}<p class="subline">正在整理第一项的逐人计算口径…</p>`;
        intro.append(group);
        void hydrateFirstItemGroup(group, record, items);
        continue;
      }

      const judgments = items.filter(item => item.reader_kind === "judgment");
      const calculations = items.filter(item => item.reader_kind === "calculation" && item.value != null);
      if (!judgments.length && !calculations.length) continue;
      group.innerHTML = `${title}${judgments.map(item => netJudgment(item, record)).join("")}${calculations.length ? `<details class="net-calculations"><summary>这一组怎么算出来？</summary>${calculations.map(netCalculation).join("")}</details>` : ""}`;
      intro.append(group);
    }

    const heading = section.querySelector(":scope > h2, :scope > h3");
    heading?.after(intro);
    section.dataset.netReadable = "done";
  }

  function enhanceC5Overview(record) {
    const axis = record.axes?.C5;
    if (!axis) return;
    const row = document.querySelector("#person-capability .style-axis .axis-row");
    if (!row || row.querySelector(".c5-scale-note")) return;
    if (axis.person_type) {
      const type = document.createElement("div");
      type.className = "c5-type subline";
      type.textContent = axis.person_type;
      row.append(type);
    }
    const note = document.createElement("div");
    note.className = "c5-scale-note subline";
    note.textContent = "S端表示更能约束自身权力，E端表示更易出现报复、强制滥用或特权；不计入能力雷达。";
    row.append(note);
  }

  function enhanceImpact(record) {
    const evidence = document.querySelector("#history-evidence");
    if (!evidence || evidence.dataset.personReadable === "done") return;
    const heading = evidence.querySelector(":scope > h2, :scope > h3.section-title");
    const firstDetails = heading?.nextElementSibling;
    if (firstDetails?.tagName === "DETAILS") {
      const summary = firstDetails.querySelector(":scope > summary");
      if (summary) summary.textContent = "完整定档依据";
    }
    evidence.dataset.personReadable = "done";
  }

  function openHistoricalImpactTarget(event) {
    const link = event.target.closest('[data-section^="history-dimension-"], [data-section="history-judgment-boundary"]');
    if (!link) return;
    const target = document.getElementById(link.dataset.section);
    if (target?.tagName === "DETAILS") target.open = true;
  }

  function foldNetLedger() {
    const section = evidenceSection("统治绩效构成");
    if (!section || section.dataset.ledgerFolded === "done") return;

    const items = Array.from(section.children).filter(node => node.tagName === "DETAILS");
    if (!items.length) return;
    const note = document.createElement("p");
    note.className = "subline net-ledger-note";
    note.textContent = "下面保留原始指标、内部档位、折算与小计，供复核使用；普通阅读无需展开。";
    const wrapper = document.createElement("details");
    wrapper.className = "net-ledger";
    const toggle = document.createElement("summary");
    toggle.textContent = "完整计分账本（审计视图）";
    wrapper.append(toggle, ...items);
    section.append(note, wrapper);
    section.dataset.ledgerFolded = "done";
  }

  function ensureMilitaryArchiveNav() {
    const nav = document.querySelector("header nav");
    if (!nav || nav.querySelector("[data-military-archive-nav]")) return;
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.militaryArchiveNav = "true";
    button.textContent = "军事档案";
    button.addEventListener("click", () => { location.href = "military.html"; });
    nav.append(button);
  }

  function currentRecord() {
    const match = location.hash.match(/^#person\/([^/?#]+)/);
    if (!match) return null;
    return byId.get(decodeURIComponent(match[1])) || null;
  }

  function enhance() {
    ensureMilitaryArchiveNav();
    const record = currentRecord();
    if (!record) return;
    enhanceC5Overview(record);
    enhanceImpact(record);
    normalizeEvidenceCardHeadings();
    buildNetReading(record);
    foldNetLedger();
  }

  screen.addEventListener("click", openHistoricalImpactTarget, true);
  new MutationObserver(enhance).observe(screen, {childList: true, subtree: true});
  window.addEventListener("hashchange", enhance);
  enhance();
})();
</script>
</body></html>
