<main><h1>哪些群体获得接纳，哪些承受排斥或离散？</h1>
<p>这里看统治者在实际掌权时期，怎样改变不同区域、族群和身份群体的参与、身份与相互接纳。军事征服、行政设置和教育文化成果各有对应评价，不能直接折算成这里的社会结果。</p>
<p>收录第四项现有全部 <span id="total">201</span> 条人物记录，按姓名排列。每人的实际主政时期和综合评价就绪状态分别标明；保留的单项记录不表示已进入综合评价池，也不据此另作排名。</p>

的重大负向限制。"},{"package_ref":"I4PKG-LIUZHUANG-A-AILAO","schema":"fourth-item-a-authored-public-v1","title":"刘庄：群体参与、身份与共同体变化","story":"永平十二年柳貌率新一批哀牢内属后，明帝任用郑纯继续治理；与邑豪约定常赋，夷俗安之。只取新纳群体在既有机制下实际安定，不取置郡本体或疆域。","baseline":"比较起点：光武已接受贤栗内属；郑纯任西部都尉时已获地方信任，这些不归明帝首创。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"相对前批内属，新纳群体在郑纯治理下约赋安定，保相对变化第2级、低位；不与已由司法安全结算的楚狱后果重复相抵。","coverage":"覆盖范围：柳貌所属新纳群体；史载户口用于定位，不据总数推定全民同等身份。","duration":"持续性与交班：郑纯都尉、太守合计十年，不能全算任后；建初元年与守令冲突再叛为直接后继反证，故不升相对变化第3级或高位。","boundary":"仅计柳貌新纳群体的实际安定，不将郑纯此前都尉阶段全归本人；后继再叛限制更高档与位置。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《后汉书·卷八十六·哀牢夷》永平十二年内属、郑纯约赋夷俗安之及建初元年再叛。","target":"","label":"《后汉书·卷八十六·哀牢夷》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/後漢書/卷86","target":"https://zh.wikisource.org/wiki/後漢書/卷86","label":"维基文库：卷86","kind":"史料文本入口"}],"status":"正向结果","components":"正向结果强度2级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"}],"status":"正向 · 清晰可验证的有限扩张、修复、收缩或破坏 · 低位","points":7.5,"calculation":"正向合成强度2，负向合成强度0；相减为2。按普通净算、4级保留及重大负向限制规则，最终幅度为2级。取低位，正式调整为+7.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-SHADOW-刘彧","ruler_name":"刘彧","polity":"刘宋","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"刘彧使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"465—472年","story":"明帝采纳休仁推荐，任孙谦为巴东、建平太守并接受其辞兵赴任；孙谦对被掠人口放还家，山地群体归心，任职三年。个人行为归孙谦，皇帝只计入任用并容纳非强制处置的有限结果。","decision":"正负结果合并后形成正向净变化。\n\n大臣主导了非强制的区域群体归附。 持续性与交班：本条未提供独立的长期延续记录，不据此声称已验证后继三十年的连续状态。","responsibility":"具体结果由部属交付；本人责任限于现有材料所证的统治和授权关系，不把执行能力全部归于本人。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、 urce_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《资治通鉴·卷十九》元狩二年：迎浑邪降众，斩欲亡者八千；四万余人分五属国、因其故俗；金日磾由养马至侍中等职。","target":"","label":"《资治通鉴·卷十九》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/資治通鑑/卷019","target":"https://zh.wikisource.org/wiki/資治通鑑/卷019","label":"维基文库：卷019","kind":"史料文本入口"},{"original":"《史记·卷一百一十一》：帝令骠骑往迎；斩其欲亡者八千人；天子嘉其功，诏中明确褒奖获首虏八千余级并益封。不是仅凭战事发生于本朝归责。","target":"","label":"《史记·卷一百一十一》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/史記/卷111","target":"https://zh.wikisource.org/wiki/史記/卷111","label":"维基文库：卷111","kind":"史料文本入口"}],"status":"正负结果并存","components":"正向结果强度3级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"},{"package_ref":"I4PKG-RULER-HAN-LIUCHE-A-02","schema":"fourth-item-a-authored-public-v1","title":"刘彻：群体参与、身份与共同体变化","story":"告缗执行造成大量人口没入官奴婢并被分配苑囿诸官，形成大规模且持久的身份降格。","baseline":"比较起点：告缗行动针对的大量家庭原本具有自由平民身份。","responsibility":"本人政策经国家执行，造成材料所载的身份改变。","level_basis":"财政执行使大量人口没入官奴婢并被分配，造成身份降格。","coverage":"覆盖范围：大量自由人口被降为官奴婢并分配苑囿诸官；本轴只计入身份与自由状态变化。","duration":"持续性与交班：奴役和家庭分配造成持久的身份与自由损失。","boundary":"大规模匈奴安置与身份纳入仍构成相对变化第3级正向；直接杀伤不再增强本轴负向，告缗身份降格自身足以维持相对变化第3级负向结果。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《西汉会要·卷四十九》引《汉书·食货志》：杨可告缗后，没入奴婢分诸苑养狗马禽兽及与诸官；仅以身份没入后果支持A，不重复消费财政收入。","target":"","label":"《西汉会要·卷四十九》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/西漢會要/卷49","target":"https://zh.wikisource.org/wiki/西漢會要/卷49","label":"维基文库：卷49","kind":"史料文本入口"}],"status":"负向损害","components":"正向结果强度0级；负向损害强度3级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"负向 · 清晰可验证的有限扩张、修复、收缩或破坏 · 高位","points":-11.5,"calculation":"正向合成强度3，负向合成强度3.5；相减为-0.5。另保留3级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为2级。取高位，正式调整为-11.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-HAN-LIUZHI","ruler_name":"刘志","polity":"汉","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"刘志使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"150—168年亲政","story":"延熹三年诏复拜夏方为交阯刺史，日南宿贼二万余人闻其威惠相率投降。实际任命和区域非强制接纳结果证实；不再以纪年推导应奉行为的皇帝本人责任。","decision":"正负结果合并后形成正向净变化。\n\n明确任用带来一个区域的实际归附，主要执行归夏方，皇帝有限信用只取相对变化第1级、低位。 持续性与交班：本条未提供独立的长期延续记录，不据此声称已验证后继三十年的连续状态。","responsibility":"本人明确任命，大臣主导达成结果；保留大臣的主要实施贡献。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：刘志","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：刘志","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：刘志","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-WORK-LIUZHI-A-01","schema":"fourth-item-a-authored-public-v1","title":"刘志：群体参与、身份与共同体变化","story":"延熹三年诏复拜夏方为交阯刺史，日南宿贼二万余人闻其威惠相率投降。实际任命和区域非强制接纳结果证实；不再以纪年推导应奉行为的皇帝本人责任。","baseline":"比较起点：日南冲突在居风令贪暴及此前讨伐后持续，旧部众仍据日南。","responsibility":"本人明确任命，大臣主导达成结果；保留大臣的主要实施贡献。","level_basis":"明确任用带来一个区域的实际归附，主要执行归夏方，皇帝有限信用只取相对变化第1级、低位。","coverage":"覆盖范围：日南二万余归附者；不外推全部交州。","duration":"持续性与交班：本条未提供独立的长期延续记录，不据此声称已验证后继三十年的连续状态。","boundary":"夏方早年任职之功不归入本人；现窗口只计皇帝重新任命所实现的结果，维持低位。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《后汉书·卷八十六》：延熹三年，诏复拜夏方为交阯刺史；日南宿贼闻之，二万余人相率诣方降。","target":"","label":"《后汉书·卷八十六》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/後漢書/卷86","target":"https://zh.wikisource.org/wiki/後漢書/卷86","label":"维基文库：卷86","kind":"史料文本入口"}],"status":"正向结果","components":"正向结果强度1级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"}],"status":"正向 · 局部、短期或低强度变化 · 低位","points":3,"calculation":"正向合成强度1，负向合成强度0；相减为1。按普通净算、4级保留及重大负向限制规则，最终幅度为1级。取低位，正式调整为+3分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-HAN-LIUHENG","ruler_name":"刘恒","polity":"汉","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"刘恒使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"前180—前157年","story":"刘恒在这一时期的社会整合项没有独立计入的结果。现有相关记录所讨论的经历是：\n\n文帝因伏生年老不可征，诏太常遣晁错往受尚书；晁错学成返朝，上书称说并迁博士，证实本人授权的经典知识传递与专业接收。\n\n这些材料支持各自领域的事实或裁决，不能由此直接推定群体身份、参与和相互接纳已有独立变化。","decision":"现有社会整合项没有足以进入独立结算的结果，因此按“没有确认独立变化”记0分；不将军事统一、行政设置、教育或文化成果自动折算为社会接纳，也不把其他统治者的行为并入本人。","responsibility":"评价限于刘恒的实际主政时期。当前没有独立社会整合项结果可据以具体归责，不从在位或朝代整体趋势推定本人功过。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。本轴未登记独立结果，相关背景来源只支持背景事实，不构成社会整合项新增分值依据。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[{"package_ref":"I4PKG-HAN-LIUHENG-SHANGSHU-TRANSMISSION","story":"文帝因伏生年老不可征，诏太常遣晁错往受尚书；晁错学成返朝，上书称说并迁博士，证实本人授权的经典知识传递与专业接收。","boundary":"这条材料属于知识生产与文化生态；不能仅凭该成果推定群体身份、参与或接纳发生了独立变化。","source_refs":["《汉书》卷49晁错传：诏太常遣错受尚书，归而称说，迁博士。","https://zh.wikisource.org/wiki/漢書/卷049","《汉书》卷88伏生传：受业诏令与伏生此前齐鲁授业基线。","https://zh.wikisource.org/wiki/漢書/卷088","《汉书》卷30艺文志：宣帝后继师法不反归文帝。","h LE","schema":"fourth-item-a-authored-public-v1","title":"孙皓：群体参与、身份与共同体变化","story":"听信亡吴者公孙的谶言，把文武至卒伍中公孙姓者迁往广州，不许留江边；按姓氏强制改变居所。","baseline":"比较起点：文武官员至士卒中的公孙姓者原居原任，姓氏不构成叛乱参加证据。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"同一姓氏跨职位的集体强迁为相对变化第2级；不是个别人谴调，不升相对变化第3级。","coverage":"覆盖范围：公孙姓任职者及士卒这一身份群体，人数未知，不外推其全部家属。","duration":"持续性与交班：已徙的结果有据，吴亡后的返迁未证，取中位以下，不把亡国计为这项材料后果。","boundary":"郭马反乱有旧军分给和核户背景，不把郭马及部下兵乱结果全部归本次公孙姓迁徙。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《三国志·卷四十八·孙皓传》裴注引《汉晋春秋》：文武职位至于卒伍有姓公孙者，皆徙于广州，不令停江边。","target":"","label":"《三国志·卷四十八·孙皓传》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/三國志/卷48","target":"https://zh.wikisource.org/wiki/三國志/卷48","label":"维基文库：卷48","kind":"史料文本入口"}],"status":"负向损害","components":"正向结果强度0级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"负向 · 清晰可验证的有限扩张、修复、收缩或破坏 · 低位","points":-7.5,"calculation":"正向合成强度0，负向合成强度2；相减为-2。另保留2级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为2级。取低位，正式调整为-7.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-FD-MENG-CHANG","ruler_name":"孟昶","polity":"后蜀","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"孟昶使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"934-965","story":"孟昶在这一时期的社会整合项没有独立计入的结果。现有相关记录所讨论的经历是：\n\n宰相毋昭裔自出私财营建学馆、招徒讲学，孟昶予以许可并使项目顺利运行；史载由此蜀中文学复盛。\n\n毋昭裔等在孟昶朝雕版印行《九经》等书，并启动蜀石经；孟昶批准相关项目，广政中后期石经又获得国家层面的持续支持，形成早期印刷和经典标准文本传播的重要成果。\n\n这些材料支持各自领域的事实或裁决，不能由此直接推定群体身份、参与和相互接纳已有独立变化。","decision":"现有社会整合项没有足以进入独立结算的结果，因此按“没有确认独立变化”记0分；不将军事统一、行政设置、教育或文化成果自动折算为社会接纳，也不把其他统治者的行为并入本人。","responsibility":"评价限于孟昶的实际主政时期。当前没有独立社会整合项结果可据以具体归责，不从在位或朝代整体趋势推定本人功过。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。本轴未登记独立结果，相关背景来源只支持背景事实，不构成社会整合项新增分值依据。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[{"package_ref":"I4PKG-WORK-MENGCHANG-B-01","story":"宰相毋昭裔自出私财营建学馆、招徒讲学，孟昶予以许可并使项目顺利运行；史载由此蜀中文学复盛。","boundary":"这条材料属于教育与人才流动；不能仅凭该成果推定群体身份、参与或接纳发生了独立变化。","source_refs":["https://news.nankai.edu.cn/mtnk/system/2025/01/20/030065508.shtml"],"sources":[{"original":"https://news.nankai.edu.cn/mtnk/system/2025/01/20/030065508.shtml","target":"https://news.nankai.edu.cn/mtnk/system/2025/01/20/030065508.shtml","label":"news.nankai.edu.cn 来源页面","kind":"研究或资料页面"}]},{"package_ref":"I4PKG-WORK-MENGCHANG-C-01","story":"毋昭裔等在孟昶朝雕版印行《九经》等书，并启动蜀石经；孟昶批准相关项目，广政中后期石经又获得国家层面的持续支持，形成早期印刷和经典标准文本传播的重要成果。","boundary":"这条材料属于知识生产与文化生态；不能仅凭该成果推定群体身份、参与或接纳发生了独立变化。","source_refs":["https://ruzang.pku.edu.cn/info/1064/2999.htm","https://cssn.cn/skgz/bwyc/202403/t20240328_5742768.shtml"],"sources":[{"original":"https://ruzang.pku.edu.cn/info/1064/2999.htm","target":"https://ruzang.pku.edu.cn/info/1064/2999.htm","label":"ruzang.pku.edu.cn 来源页面","kind":"研究或资料页面"},{"original":"https://cssn.cn/skgz/bwyc/202403/t20240328_5742768.shtml","target":"https://cssn.cn/skgz/bwyc/202403/t20240328_5742768.shtml","label":"cssn.cn 来源页面","kind":"研究或资料页面"}]}],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：孟昶","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：孟昶","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：孟昶","kind":"人物范围记录（非史料原文）"}],"evidence_items":[],"status":"没有确认独立变化","points":0,"cal ","major_negative":"重大负向限制已触发，须与正向成果分开保留。"},{"package_ref":"I4PKG-JIN-TAIZONG-A-REDEEM","schema":"fourth-item-a-authored-public-v1","title":"完颜晟：群体参与、身份与共同体变化","story":"天会元年以官粟赎新迁宁江州贫而卖身者六百余人，另清查先帝同姓自鬻未复者。只计有具体对象的国家赎身。","baseline":"比较起点：太祖末新迁上京、宁江州人口贫困自卖，不能先当作天会新创奴役。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"局部实际赎身相对变化第1级；与靖康北迁是不同对象，负向变化第2级/重大负向限制第2级不解除，净文明影响幅度第1级、中位负。","coverage":"覆盖范围：有数目的六百余人，未把全国禁买贫民法令都当作落实人数。","duration":"持续性与交班：当时解除特定卖身状态；无两个后继同对象追踪，不取高位。","boundary":"局部实际赎身相对变化第1级；与靖康北迁是不同对象，负向变化第2级/重大负向限制第2级不解除，净文明影响幅度第1级、中位负。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《金史·卷四十六·食货一》太宗天会元年以官粟赎新迁宁江州贫而卖身者六百余人。","target":"","label":"《金史·卷四十六·食货一》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/金史/卷46","target":"https://zh.wikisource.org/wiki/金史/卷46","label":"维基文库：卷46","kind":"史料文本入口"}],"status":"正向结果","components":"正向结果强度1级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"}],"status":"负向 · 局部、短期或低强度变化 · 中位","points":-4.5,"calculation":"正向合成强度1，负向合成强度2；相减为-1。另保留2级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为1级。取中位，正式调整为-4.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-JIN-WEISHAOWANG","ruler_name":"完颜永济","polity":"金","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"完颜永济使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"1208—1213年","story":"完颜永济在这一时期的社会整合项没有独立计入的结果。现有相关记录所讨论的经历是：\n\n现有本项记录未形成可单列制度节点，缺少可以明确属于本人责任的的规则改变和实际运行链。\n\n这些材料支持各自领域的事实或裁决，不能由此直接推定群体身份、参与和相互接纳已有独立变化。","decision":"现有社会整合项没有足以进入独立结算的结果，因此按“没有确认独立变化”记0分；不将军事统一、行政设置、教育或文化成果自动折算为社会接纳，也不把其他统治者的行为并入本人。","responsibility": 例处置，并开放养马为吏等有限身份上升。","baseline":"比较起点：部分契丹户在奖励和任职通道上低于女真人。","responsibility":"章宗政府实施清查与处置，本人承担相应政策责任。","level_basis":"有军功契丹户获得女真人官赏恩例及养马、为吏通道，按身份类别改善待遇，支持1级有限正向结果；与二税户放良为不同对象，作为独立补强参与合成，不据此推定全体平等。","coverage":"覆盖范围：有军功契丹户的奖励、服役和有限身份流动。","duration":"持续性与交班：有军功契丹户的有限待遇及准入以泰和元年诏谕为界，不推所有契丹人或后世持续；仅作独立次包补强。","boundary":"仅覆盖有军功契丹户，非全体身份平等；与二税户放良不重复。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《金史·卷十一·章宗纪三》泰和元年四月：诏谕累经签军立功的契丹人户，官赏恩例与女直人同，并许养马、为吏。只定位有限待遇和准入，不推定全体身份平等。","target":"","label":"《金史·卷十一·章宗纪三》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/金史/卷11","target":"https://zh.wikisource.org/wiki/金史/卷11","label":"维基文库：卷11","kind":"史料文本入口"}],"status":"正向结果","components":"正向结果强度1级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-JIN-ZHANGZONG-A-RELEASE-TAXHOUSEHOLDS","schema":"fourth-item-a-authored-public-v1","title":"完颜璟：群体参与、身份与共同体变化","story":"章宗命官分括北京、中都二税户，有凭验者放良；明昌元年六月上报已免一千七百余户、一万三千九百余口。","baseline":"比较起点：世宗曾处理二税户，但至大定二十九年仍有凭验争议和私人役属，不能将先帝处理后视为全已放良。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"二税户实际放良支持2级有限身份修复，覆盖及持续性支持中位；另有不同对象的军功契丹户待遇改善，作为独立1级正向结果补强0.5。合成正向强度2.5，净幅度仍为2级中位。","coverage":"覆盖范围：有实际核验放免的户口，未放者仍维持二税与身份限制。","duration":"持续性与交班：正式断定为良且有完成报告；其后为良为驱从已断，身份确定性有据，但不宣称全体契丹解放。","boundary":"二税户放良与有军功契丹户的奖励属于不同受益对象，不能相互重复。被释放者本人仍受应举限制的损害由教育与人才流动评价；宗室两案未满足本轴群体后果准入，不参与正负合成。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《金史·卷四十六·食货一》章宗大定二十九年分括、明昌元年六月奏所免户口及身份断定。","target":"","label":"《金史·卷四十六·食货一》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/金史/卷46","target":"https://zh.wikisource.org/wiki/金史/卷46","label":"维基文库：卷46","kind":"史料文本入口"}],"status":"正向结果","components":"正向结果强度2级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-ZHANGZONG-ROYALCHILDREN-A","schema":"fourth-item-a-authored-public-v1","title":"完颜璟：不单独计分的相关事实","story":"永蹈案赐死其妃与二子；公主长乐参加密谋，剥离。永中因语言得罪被赐死后，二子亦弃市。本条保留无独立实罪证据的家属与子嗣扩大。","baseline":"比较起点：宗室家属有独立人身安全，不因永蹈谋反均为首犯。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"永蹈、永中两个王府的亲属受罚，未证对宗室子孙的一般身份排斥或系统清洗；两案不能自动组成群体负向变化第2级。","coverage":"覆盖范围：两个王府的妻子、子嗣；不将所有世宗子孙一并算作受害。","duration":"持续性与交班：这些事实不满足群体后果的独立准入条件，因此持续性不参与本轴计分。","boundary":"永蹈、永中两个王府的亲属受罚，未证对宗室子孙的一般身份排斥或系统清洗；两案不能自动组成群体负向变化第2级。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《金史·卷八十五·世宗诸子》永中、永蹈条及后期追复。","target":"","label":"《金史·卷八十五·世宗诸子》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/金史/卷85","target":"https://zh.wikisource.org/wiki/金史/卷85","label":"维基文库：卷85","kind":"史料文本入口"}],"status":"不单独计分，保留相关事实","components":"正向结果强度0级；负向损害强度0级。相关事实不参与本轴合成。","major_negative":"该材料未触发独立的重大负向限制。"}],"status":"正向 · 清晰可验证的有限扩张、修复、收缩或破坏 · 中位","points":9.5,"calculation":"正向合成强度2.5，负向合成强度0；相减为2.5。按普通净算、4级保留及重大负向限制规则，最终幅度为2级。取中位，正式调整为+9.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-ROSTER-323631DDD7CB22F6","ruler_name":"完颜阿骨打","polity":"金","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"完颜阿骨打使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"1115—1123年","story":"对一部分归附人口贷粮、令被虏亲属聚居，保留有限接纳正向变化第2级；但天辅六至七年又把山西部族向内地、岭东迁送，护送侵扰导致叛亡，且尽徙燕京六州富强工技人口入内地，形成独立的强迁与共同体拆散负向变化第2级。不再泛称全部降人自由安居。","decision":"已确认的正向结果与负向损害按强度合成后相抵为0；负向事实仍须保留。\n\n可证的家庭团聚为2级正向结果，强制迁离为2级负向损害。 持续性与交班：太宗天会初仍须赎救新迁户贫困卖身者；其救济不归入本人阿骨打。两条相反结果均留存，轴级净抵消不是无害。","responsibility":"由本人主政下的政府执行；评价承担统治责任，不把每项执行细节都说成本人亲自完成。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每 5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-JIN-SHIZONG","ruler_name":"完颜雍","polity":"金","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"完颜雍使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"1161—1189年","story":"大定二年针对辽寺将良民抑为贱的二税户，受理佐证并特免为民，形成受压身份的有限修复。皇统四年饥民赎良归熙宗，明昌元年一千七百余户放良归章宗，均不计入世宗；大定二十三年奴婢婚娶条件亦不等于后代普遍放良。\n\n世宗明令禁止女真人改汉姓、仿南人衣装并设置刑责，以刑罚压缩姓名、服饰与文化选择。大定初对契丹猛安谋克曾有不分从乱与否的一概分隶，但《金史》同时记载世宗发现后明确纠正、令未从乱者仍旧，未证实为持续实际损害，故从评价依据剥离，只作为同一窗口自我纠偏反证。 大定二十一年又实际徙银山契丹民于临潢，不与大定初被纠正的分隶混同；作为已发生身份及地域强制的同向覆盖，不另堆相对变化级。","decision":"已确认的正向结果与负向损害按强度合成后相抵为0；负向事实仍须保留。\n\n已确认被寺院错误役为奴的二税户实际恢复自由身份。 持续性与交班：世宗特免可证；章宗仍须重新清查，说明未根除整个问题，其新增放良人数不归入本人世宗。\n\n女真人姓名、服饰限制与银山契丹迁民按已证实施边界同一组材料结算；不把维护族群传统自身判负，不将同一组材料两个表现再拆成独立0.5补强。 持续性与交班：禁令明确进入世宗本纪并在本窗口施行；后继持续性未证实，故停相对变化第2级。","responsibility":"金世宗主政下的政府决定和执行，本人承担相应政策责任。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：完颜雍","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：完颜雍","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：完颜雍","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-RULER-JIN-SHIZONG-A-01","schema":"fourth-item-a-authored-public-v1","title":"完颜雍：群体参与、身份与共同体变化","story":"大定二年针对辽寺将良民抑为贱的二税户，受理佐证并特免为民，形成受压身份的有限修复。皇统四年饥民赎良归熙宗，明昌元年一千七百余户放良归章宗，均不计入世宗；大定二十三年奴婢婚娶条件亦不等于后代普遍放良。","baseline":"比较起点：辽寺二税户中有良民被寺僧隐瞒来历、抑为贱者。","responsibility":"金世宗主政下的政府决定和执行，本人承担相应政策责任。","level_basis":"已确认被寺院错误役为奴的二税户实际恢复自由身份。","coverage":"覆盖范围：有佐证的二税户身份修复；不包括泛称的饥民与奴婢后代。","duration":"持续性与交班：世宗特免可证；章宗仍须重新清查，说明未根除整个问题，其新增放良人数不归入本人世宗。","boundary":"仍保留奴婢制度，后继继续清查；这项材料只以已确认二税户的身份修复取相对变化第2级，不声称全体奴婢解放。与另一独立负向变化第2级合并判断仍为文明影响幅度第0级。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《金史·卷四十六·食货志·户口》大定二年二税户特免；与皇统四年、明昌元年各自区分。","target":"","label":"《金史·卷四十六·食货志·户口》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/金史/卷46","target":"https://zh.wikisource.org/wiki/金史/卷46","label":"维基文库：卷46","kind":"史料文本入口"}],"status":"正向结果","components":"正向结果强度2级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-RULER-JIN-SHIZONG-A-02","schema":"fourth-item-a-authored-public-v1","title":"完颜雍：群体参与、身份与共同体变化","story":"世宗明令禁止女真人改汉姓、仿南人衣装并设置刑责，以刑罚压缩姓名、服饰与文化选择。大定初对契丹猛安谋克曾有不分从乱与否的一概分隶，但《金史》同时记载世宗发现后明确纠正、令未从乱者仍旧，未证实为持续实际损害，故从评价依据剥离，只作为同一窗口自我纠偏反证。 大定二十一年又实际徙银山契丹民于临潢，不与大定初被纠正的分隶混同；作为已发生身份及地域强制的同向覆盖，不另堆相对变化级。","baseline":"比较起点：未参与叛乱的契丹家庭原本保有社区组织；女真臣民对姓氏、服饰与文化表达也有较大自主选择。","responsibility":"金世宗主政下的政府决定和执行，本人承担相应政策责任。","level_basis":"女真人姓名、服饰限制与银山契丹迁民按已证实施边界同一组材料结算；不把维护族群传统自身判负，不将同一组材料两个表现再拆成独立0.5补强。","coverage":"覆盖范围：女真群体的姓氏、服饰与身份表达选择。","duration":"持续性与交班：禁令明确进入世宗本纪并在本窗口施行；后继持续性未证实，故停相对变化第2级。","boundary":"女真人姓名、服饰限制与银山契丹迁民按已证实施边界同一组材料结算；不把维护族群传统自身判负，不将同一组材料两个表现再拆成独立0.5补强。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《金史·卷八·世宗本纪》载禁女真人改称汉姓、学南人衣装，犯者抵罪。","target":"","label":"《金史·卷八·世宗本纪》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/zh-hans/金史/卷8","target":"https://zh.wikisource.org/zh-hans/金史/卷8","label":"维基文库：卷8","kind":"史料文本入口"},{"original":"《金史·卷九十·完颜斡鲁古传》载世宗纠正未从乱契丹被一概分隶，令其仍旧。","target":"","label":"《金史·卷九十·完颜斡鲁古传》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/zh-hans/金史_(四庫全書本)/卷090","target":"https://zh.wikisource.org/zh-hans/金史_(四庫全書本)/卷090","label":"维基文库：卷090","kind":"史料文本入口"},{"original":"《金史·卷四十六》大定二十一年徙银山契丹民。","target":"","label":"《金史·卷四十六》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/金史/卷46","target":"https://zh.wikisource.org/wiki/金史/卷46","label":"维基文库：卷46","kind":"史料文本入口"}],"status":"负向损害","components":"正向结果强度0级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"正负相抵，净调整为0","points":0,"calculation":"正向合成强度2，负向合成强度2；相减为0。另保留2级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为0级。正负相抵，正式调整为0分；负向事实不会因此消失。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-PUBLIC-6DACD59C17927ECA","ruler_name":"弘历","polity":"清","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"弘历使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"1735—1799年","story":"准噶尔战争中，乾隆谕旨与国家军政执行出现永绝根株、尽行歼灭式处置；清剿、斩戮、妇孺赏军及分赏为奴造成不可逆的共同体毁灭。与此同时，疫病与逃亡亦造成巨大人口损失。","decision":"正负结果合并后形成负向净变化。\n\n准噶尔共同体毁灭负向变化第4级；乌鲁木齐部分遣犯限年转民及眷属不为奴只支持限定身份群体正向变化第2级，不能把笼统制度性纳入填成正向变化第3级。 持续性与交班：共同体毁灭不可逆；另一有限身份修复仅有条件、定限与范围内效力，不能泛称新疆全体居民接纳。","responsibility":"本人直接下诏，国家机构执行。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：弘历","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：弘历","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：弘历","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-RULER-PUBLIC-6DACD59C17927ECA-A-01","schema":"fourth-item-a-authored-public-v1","title":"弘历：群体参与、身份与共同体变化","story":"准噶尔战争中，乾隆谕旨与国家军政执行出现永绝根株、尽行歼灭式处置；清剿、斩戮、妇孺赏军及分赏为奴造成不可逆的共同体毁灭。与此同时，疫病与逃亡亦造成巨大人口损失。","baseline":"比较起点：扩张与迁徙安置前，内亚已有多个群体及不同秩序。","responsibility":"本人直接下诏，国家机构执行。","level_basis":"准噶尔共同体毁灭负向变化第4级；乌鲁木齐部分遣犯限年转民及眷属不为奴只支持限定身份群体正向变化第2级，不能把笼统制度性纳入填成正向变化第3级。","coverage":"覆盖范围：准噶尔部及相关厄鲁特社会的跨地区军事清剿、人口处置和共同体破坏。","duration":"持续性与交班：共同体毁灭不可逆；另一有限身份修复仅有条件、定限与范围内效力，不能泛称新疆全体居民接纳。","boundary":"疫病与逃亡不全部归本人；国家清剿责任仍在。另一对象身份修复只正向变化第2级，不抵消同一毁灭链重大负向限制，净档仍受重大负向限制第4级下限约束。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"https://www.shidianguji.com/book/CADAL01035462/chapter/1l4abivkhehb6","target":"https://www.shidianguji.com/book/CADAL01035462/chapter/1l4abivkhehb6","label":"www.shidianguji.com 来源页面","kind":"史料文本入口"},{"original":"https://www.shidianguji.com/mid-page/7463961276453863475","target":"https://www.shidianguji.com/mid-page/7463961276453863475","label":"www.shidianguji.com 来源页面","kind":"史料文本入口"},{"original":"https://iqh.ruc.edu.cn/old/qdbjmzyj/bj_ztyj/xbbj/77ed5198ab5149bba38617e349c4fc71.htm","target":"https://iqh.ruc.edu.cn/old/qdbjmzyj/bj_ztyj/xbbj/77ed5198ab5149bba38617e349c4fc71.htm","label":"iqh.ruc.edu.cn 来源页面","kind":"研究或资料页面"},{"original":"https://www.dpm.org.cn/Uploads/pdf/1532/T00020_00.pdf","target":"https://www.dpm.org.cn/Uploads/pdf/1532/T00020_00.pdf","label":"www.dpm.org.cn 来源页面","kind":"研究或资料页面"},{"original":"《皇朝文献通考·卷二百零五》：改发乌鲁木齐等处人犯限年无过编入民籍；到配未满身故者妻子照限满例编民，不为奴。","target":"","label":"《皇朝文献通考·卷二百零五》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/皇朝文獻通考_(四庫全書本)/卷205","target":"https://zh.wikisource.org/wiki/皇朝文獻通考_(四庫全書本)/卷205","label":"维基文库：卷205","kind":"史料文本入口"}],"status":"正负结果并存","components":"正向结果强度2级；负向损害强度4级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"负向 · 主要领域形成稳定的重大改变 · 高位","points":-18,"calculation":"正向合成强度2，负向合成强度4；相减为-2。另保留4级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为3级。取高位，正式调整为-18分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-YUAN-KUBLAI","ruler_name":"忽必烈","polity":"元","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"忽必烈使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"1260—1294年","story":"蒙古、汉、回回等群体共同进入行政体系，正式身份和任官仍有层级差别；这些制度分类本身不足以证明独立的社会接纳改善或损害。\n\n至元十九年籍阿合马妻子亲属资产时，明确将其奴婢纵为民；本条保留这一有对象的自由身份恢复，不将行政族群分类重判为全体整合。","decision":"现有材料经复核后未形成可单独计入的净变化。相关事实不足以构成可单独计入的群体结果。 现有材料未能定位原判断所需的受影响对象、实际参与结果或依附人口获释事件，因此这条材料不参与本轴正负合成；不据此否认元代身份差序的存在。\n\n仅证实阿合马一处家产系统的奴婢放良，人数及群体覆盖未知；未证普遍放良规则，泸州赎还请求也不替代已实施群体结果。 仅证实阿合马一处家产系统的奴婢放良，人数及群体覆盖未知；未证普遍放良规则，泸州赎还请求也不替代已实施群体结果。","responsibility":"本条行为与结果处在本人实际掌权时期，责任范围限于材料所证的措施。\n\n本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：忽必烈","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：忽必烈","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：忽必烈","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-WORK-KUBLAI-A-01","schema":"fourth-item-a-authored-public-v1","title":"忽必烈：不单独计分的相关事实","story":"蒙古、汉、回回等群体共同进入行政体系，正式身份和任官仍有层级差别；这些制度分类本身不足以证明独立的社会接纳改善或损害。","baseline":"比较起点：征服时代已有多群体并存与差序身份。","responsibility":"本条行为与结果处在本人实际掌权时期，责任范围限于材料所证的措施。","level_basis":"相关事实不足以构成可单独计入的群体结果。","coverage":"覆盖范围：多群体行政参与与正式身份差序并存。","duration":"持续性与交班：未证实实际结果，不以后世发展归入本人。","boundary":"现有材料未能定位原判断所需的受影响对象、实际参与结果或依附人口获释事件，因此这条材料不参与本轴正负合成；不据此否认元代身份差序的存在。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"https://zh.wikisource.org/wiki/元史/卷081","target":"https://zh.wikisource.org/wiki/元史/卷081","label":"维基文库：卷081","kind":"史料文本入口"},{"original":"https://zh.wikisource.org/wiki/元史/卷083","target":"https://zh.wikisource.org/wiki/元史/卷083","label":"维基文库：卷083","kind":"史料文本入口"},{"original":"https://zh.wikisource.org/wiki/元史/卷103","target":"https://zh.wikisource.org/wiki/元史/卷103","label":"维基文库：卷103","kind":"史料文本入口"}],"status":"不单独计分，保留相关事实","components":"正向结果强度0级；负向损害强度0级。相关事实不参与本轴合成。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-KUBLAI-A-RELEASE-AHMAD-SLAVES","schema":"fourth-item-a-authored-public-v1","title":"忽必烈：不单独计分的相关事实","story":"至元十九年籍阿合马妻子亲属资产时，明确将其奴婢纵为民；本条保留这一有对象的自由身份恢复，不将行政族群分类重判为全体整合。","baseline":"比较起点：阿合马妻子亲属拥有的奴婢处于私人依附，财政查抄本身不等于身份解放。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"仅证实阿合马一处家产系统的奴婢放良，人数及群体覆盖未知；未证普遍放良规则，泸州赎还请求也不替代已实施群体结果。","coverage":"覆盖范围：一个权贵家产系统的奴婢，人数未知。","duration":"持续性与交班：这些事实不满足群体后果的独立准入条件，因此持续性不参与本轴计分。","boundary":"仅证实阿合马一处家产系统的奴婢放良，人数及群体覆盖未知；未证普遍放良规则，泸州赎还请求也不替代已实施群体结果。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《元史·卷十二》至元十九年五月籍阿合马妻子亲属所营资产，其奴婢纵为民。","target":"","label":"《元史·卷十二》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/元史_(四庫全書本)/卷012","target":"https://zh.wikisource.org/wiki/元史_(四庫全書本)/卷012","label":"维基文库：卷012","kind":"史料文本入口"}],"status":"不单独计分，保留相关事实","components":"正向结果强度0级；负向损害强度0级。相 [{"package_ref":"I4PKG-LOCAL-REAUDIT-CIXI-A-01","schema":"fourth-item-a-authored-public-v1","title":"慈禧：群体参与、身份与共同体变化","story":"1902年懿旨明确准满汉官民彼此结婚、开除旧禁；原需规避的婚姻关系获得合法身份。","baseline":"比较起点：清代旧例仍保留满汉不通婚的正式身份边界，民间虽已有规避和事实通婚。","responsibility":"作为实际掌权者直接颁布命令，不把名义在位者视为决策者。","level_basis":"取消正式婚姻身份障碍，但此前已有事实通婚，不能把全部融合归于此令。","coverage":"覆盖范围：满、汉两大身份群体的婚姻合法性；实际新增通婚量未证实。","duration":"持续性与交班：禁令解除后未恢复，法律开放稳定交班。","boundary":"民间此前已有事实通婚；且本正向与庚子教民迫害无关，不能解除共同体与社会整合轴重大负向。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"https://www.qinghistory.cn/c/353/353825.shtml","target":"https://www.qinghistory.cn/c/353/353825.shtml","label":"www.qinghistory.cn 来源页面","kind":"研究或资料页面"}],"status":"正向结果","components":"正向结果强度1级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-LOCAL-REAUDIT-CIXI-A-NEG-BOXER","schema":"fourth-item-a-authored-public-v1","title":"慈禧：群体参与、身份与共同体变化","story":"1900年春夏朝廷对义和团政策反复后，在慈禧实际控制下明显转向利用拳民对外，任命端王主持总理衙门并于6月21日宣战；北方中国教民成为大规模身份性攻击对象，大量教堂、社区被毁，数以千计中国教民死亡。并非所有地方暴行均由慈禧逐案命令，但中央政策转向显著扩大了群体安全崩解。","baseline":"比较起点：1899年前清廷虽长期存在民教冲突，中央正式政策仍要求保护教堂和教民，中国基督徒并未处于中央政府支持的群体性暴力状态。","responsibility":"实际掌权者推动中央政策转向，地方官军与其他行动者具体实施；不把每起地方暴行都认定为本人逐案下令。","level_basis":"中央政策转向使宗教身份群体遭到广泛迫害。","coverage":"覆盖范围：华北多省中国基督徒及其家庭、聚落和教会共同体。","duration":"持续性与交班：暴力高峰持续数月并在战败后迅速逆转，但死亡、社区毁灭和流离不可逆。","boundary":"中央早期曾下令保护教民，部分地方督抚拒绝执行亲拳路线，且大量杀戮由拳民和地方官军直接实施；因此不定相对变化第4级，也不把全部义和团暴行归慈禧本人。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"https://www.cambridge.org/core/journals/modern-asian-studies/article/atrocity-and-reciprocity-during-the-boxer-war-19001901-sociolegal-perspectives/63EE577E7EE2418093D8F12F6B5AA99B","target":"https://www.cambridge.org/core/journals/modern-asian-studies/article/atrocity-and-reciprocity-during-the-boxer-war-19001901-sociolegal-perspectives/63EE577E7EE2418093D8F12F6B5AA99B","label":"www.cambridge.org 来源页面","kind":"研究或资料页面"},{"original":"https://www.cambridge.org/core/journals/modern-asian-studies/article/abs/search-for-chinese-christianity-in-the-republican-period-19121949/EDE546188DA32E86276C590564981A1C","target":"https://www.cambridge.org/core/journals/modern-asian-studies/article/abs/search-for-chinese-christianity-in-the-republican-period-19121949/EDE546188DA32E86276C590564981A1C","label":"www.cambridge.org 来源页面","kind":"研究或资料页面"},{"original":"https://zh.wikisource.org/zh/%E5%AE%A3%E6%88%B0%E8%A9%94%E6%9B%B8","target":"https://zh.wikisource.org/zh/%E5%AE%A3%E6%88%B0%E8%A9%94%E6%9B%B8","label":"维基文库：宣戰詔書","kind":"史料文本入口"}],"status":"负向损害","components":"正向结果强度0级；负向损害强度3级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"负向 · 清晰可验证的有限扩张、修复、收缩或破坏 · 高位","points":-11.5,"calculation":"正向合成强度1，负向合成强度3；相减为-2。另保留3级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为2级。取高位，正式调整为-11.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-SHADOW-慕容垂","ruler_name":"慕容垂","polity":"后燕","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"慕容垂使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"384—396年","story":"慕容垂在这一时期的社会整合项没有独立计入的结果。现有相关记录所讨论的经历是：\n\n设置百官并实授吏部、司隶和中外军政职位，恢复早期国家办事组织。\n\n这些材料支持各自领域的事实或裁决，不能由此直接推定群体身份、参与和相互接纳已有独立变化。","decision":"现有社会整合项没有足以进入独立结算的结果，因此按“没有确认独立变化”记0分；不将军事统一、行政设置、教育或文化成果自动折算为社会接纳，也不把其他统治者的行为并入本人。","responsibility":"评价限于慕容垂的实际主政时期。当前没有独立社会整合项结果可据以具体归责，不从在位或朝代整体趋势推定本人功过。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。本轴未登记独立结果，相关背景来源只支持背景事实，不构成社会整合项新增分值依据。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items": 四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：李雄","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：李雄","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-LOCAL-REAUDIT-LIXIONG-A-POS","schema":"fourth-item-a-authored-public-v1","title":"李雄：群体参与、身份与共同体变化","story":"苻成、隗文叛后复来，李雄释罪并厚加待纳，史文明记由是夷夏安之；以对有宿怨群体的实际赦纳及接纳反应证实有限正向变化第1级。","baseline":"比较起点：流民入蜀、地方战争及群体互不信任并存；不能以蜀地相对富庶自动推定社会接纳。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"实际赦纳有宿怨的群体，并有“夷夏安之”的社会反应记载，支持局部1级正向变化；概括性反应不足以证明主要领域的稳定改变。","coverage":"覆盖范围：复来者及其相关夷夏群体；不将所有归附、人口增长、任官或减税扩成独立正向结果。","duration":"持续性与交班：本人窗口有接纳反应；李班、李期继位后冲突不得作为本人长期稳定交班，未证实30年及两次同口径群体锚。","boundary":"夷夏安之是直接社会反应，但范围概括，只有有限接纳正向变化第1级；它不是对汉中和建宁强迁同一受害群体的返还修复，不能解除负向结果重大负向限制第2级。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《晋书·卷一百二十一·李雄载记》：苻成、隗文既降复叛、手伤雄母，复来皆释罪厚待，由是夷夏安之。","target":"","label":"《晋书·卷一百二十一·李雄载记》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/晉書/卷121","target":"https://zh.wikisource.org/wiki/晉書/卷121","label":"维基文库：卷121","kind":"史料文本入口"}],"status":"正向结果","components":"正向结果强度1级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-LOCAL-REAUDIT-LIXIONG-A-NEG","schema":"fourth-item-a-authored-public-v1","title":"李雄：群体参与、身份与共同体变化","story":"李雄遣李国、李云攻汉中后尽徙汉中人于蜀；又诱建宁夷攻李毅，城陷后送妇女千口成都。只计入居民及妇女被强制离土的群体离散，不重复计攻城胜败或杀壮士的战斗伤亡。","baseline":"比较起点：汉中居民与建宁群体原居本地；征服控制与税役组织本身归其他项目。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"汉中居民与建宁妇女实际被迫离土，支持清晰而有限的2级负向变化。其他地区战前饥疫及无法区分的战斗伤亡不用于增强本项。","coverage":"覆盖范围：汉中居民迁蜀及建宁妇女送成都两处实际强制离土；同方向合包增强覆盖，不凭人数或第二场景自动升相对变化第3级。","duration":"持续性与交班：原文证实已经迁走，不仅是迁徙命令；后续返还、身份处置及两个接班参照点未证实，不外推永久奴役或长达30年的持续迫害。","boundary":"战前南土饥疫死亡十万不可归李雄；建宁壮士是否皆非战斗员未明，不以此加码。汉中与建宁强制离土已支持负向变化第2级/重大负向限制第2级，与独立接纳正向变化第1级净为文明影响幅度第1级、中位（-4.5）；后续持续性不足高位。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《晋书·卷一百二十一·李雄载记》：遣李国李云寇汉中，尽徙汉中人于蜀；诱建宁夷讨李毅，城陷送妇女千口成都。","target":"","label":"《晋书·卷一百二十一·李雄载记》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/晉書/卷121","target":"https://zh.wikisource.org/wiki/晉書/卷121","label":"维基文库：卷121","kind":"史料文本入口"}],"status":"负向损害","components":"正向结果强度0级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"负向 · 局部、短期或低强度变化 · 中位","points":-4.5,"calculation":"正向合成强度1，负向合成强度2；相减为-1。另保留2级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为1级。取中位，正式调整为-4.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-SHADOW-杨坚","ruler_name":"杨坚","polity":"隋","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"杨坚使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"580—604年实际掌权","story":"灭陈后释放部分俘口、安置陈宗室官员及子弟，岭南首领在归附后获授官还治，突厥启民部众入塞后获安置并返还部分被掠人口，形成多个群体接纳正向变化第3级；陈后主与王公百司被俘后入长安的离土为具体负向变化第2级，不再以泛称差序控制扣负向变化第1级。","decision":"正负结果合并后形成正向净变化。\n\n多个群体接纳正向变化第3级；被俘陈君臣离开建康入长安负向变化第2级，与司马昭对降服君臣的迁徙采用同一条件。 持续性与交班：多群体安置实际发生并部分延续至炀帝；不同群体待遇有差，不泛称普遍平等。","responsibility":"按本人实际掌权时段及本条具名行为界定责任，其他掌权者的独立行动不并入。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：杨坚","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：杨坚","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：杨坚","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-RULER-SHADOW-杨坚-A-01","schema":"fourth-item-a-authored-public-v1","title":"杨坚：群体参与、身份与共同体变化","story":"灭陈后释放部分俘口、安置陈宗室官员及子弟，岭南首领在归附后获授官还治，突厥启民部众入塞后获安置并返还部分被掠人口，形成多个群体接纳正向变化第3级；陈后主与王公百司被俘后入长安的离土为具体负向变化第2级，不再以泛称差序控制扣负向变化第1级。","baseline":"比较起点：征服后的安置阶段之前，南北分裂，精英与民众分别处于不同秩序中。","responsibility":"按本人实际掌权时段及本条具名行为界定责任，其他掌权者的独立行动不并入。","level_basis":"多个群体接纳正向变化第3级；被俘陈君臣离开建康入长安负向变化第2级，与司马昭对降服君臣的迁徙采用同一条件。","coverage":"覆盖范围：陈俘与宗室、岭南首领、启民所部等不同有限群体。","duration":"持续性与交班：多群体安置实际发生并部分延续至炀帝；不同群体待遇有差，不泛称普遍平等。","boundary":"降君臣得到待遇不等于可以保留原居社会网络；正向第三级与负向第二级合并净文明影响幅度第1级，高位受重大负向限制限制。五教强制课读不在共同体与社会整合重复计入，民间恐迁谣言不当作真实全面强迁。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《隋书·卷二·高祖纪下》平陈后的释放、安置与相关诏令。","target":"","label":"《隋书·卷二·高祖纪下》","kind":"所引文字依据"},{"original":"《隋书·卷八十二·南蛮传》岭南首领归附、授官及还治。","target":"","label":"《隋书·卷八十二·南蛮传》","kind":"所引文字依据"},{"original":"《隋书·卷八十四·北狄传》启民可汗部众入塞、安置及返还人口。","target":"","label":"《隋书·卷八十四·北狄传》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/隋書/卷02","target":"https://zh.wikisource.org/wiki/隋書/卷02","label":"维基文库：卷02","kind":"史料文本入口"},{"original":"https://zh.wikisource.org/wiki/隋書/卷82","target":"https://zh.wikisource.org/wiki/隋書/卷82","label":"维基文库：卷82","kind":"史料文本入口"},{"original":"https://zh.wikisource.org/wiki/隋書/卷84","target":"https://zh.wikisource.org/wiki/隋書/卷84","label":"维基文库：卷84","kind":"史料文本入口"},{"original":"《陈书·卷六》祯明三年三月：后主与王公百司发自建邺，入于长安。","target":"","label":"《陈书·卷六》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/陳書/卷6","target":"https://zh.wikisource.org/wiki/陳書/卷6","label":"维基文库：卷6","kind":"史料文本入口"},{"original":"《资治通鉴·卷一百七十七》：五教与民间讹言欲徙入关引发惊骇；不把谣言写成已实施迁民。","target":"","label":"《资治通鉴·卷一百七十七》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/資治通鑑/卷177","target":"https://zh.wikisource.org/wiki/資治通鑑/卷177","label":"维基文库：卷177","kind":"史料文本入口"}],"status":"正负结果并存","components":"正向结果强度3级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"正向 · 局部、短期或低强度变化 · 中位","points":4.5,"calculation":"正向合成强度3，负向合成强度2；相减为1。另保留2级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为1级。取中位，正式调整为+4.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-SHADOW-杨广","ruler_name":"杨广","polity":"隋","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"杨广使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"604—618年","story":"大业六年帝遣陈棱、张镇周击流求，虏民万余还，献俘后颁赐百官；计已发生的群体离散与依附身份处置。吐谷浑十万余口来降在《隋书》可证，但不能由此推出这些人均被强迁分置，因此不据此增强负向判断。\n\n强迁各州富商大贾数万户与一艺户三千余家充实东都。","decision":"正负结果合并后形成负向净变化。\n\n来降不等于被强迁。这项材料只计流求俘民分赐负向变化第2级，与东都强迁独立负向变化第2级补强为负向变化第2.5级，净文明影响幅度第2级、中位；吐谷浑不参与强迁幅度或覆盖。 持续性与交班：大规模迁离社区与家庭离散已经实施，难以逆转。\n\n东都强迁富商及一艺户证实负向变化第2级；城市集聚不是独立社会接纳收益。与流求俘民分赐负向变化第2级另一独立材料补强为负向变化第2.5级，净文明影响幅度第2级负向，中位。 持续性与交班：数万户及一艺户已被迁离原籍，不能以东都后续繁荣视为原家庭获得补偿；原社区恢复和具体后继状态未证，取中位。","responsibility":"本人授权将领实施，所评为授权措施的实际后果。\n\n本人直接作出决定或发布命令，实际执行结果由本条所列材料核对。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：杨广","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：杨广","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：杨广","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-RULER-SHADOW-杨广-A-01","schema":"fourth-item-a-authored-public-v1","title":"杨广：群体参与、身份与共同体变化","story":"大业六年帝遣陈棱、张镇周击流求，虏民万余还，献俘后颁赐百官；计已发生的群体离散与依附身份处置。吐谷浑十万余口来降在《隋书》可证，但不能由此推出这些人均被强迁分置，因此不据此增强负向判断。","baseline":"比较起点：流求被俘居民此前仍生活于本地家庭与社区；以被掳离土、分赐百官之前为基线。","responsibility":"本人授权将领实施，所评为授权措施的实际后果。","level_basis":"来降不等于被强迁。这项材料只计流求俘民分赐负向变化第2级，与东都强迁独立负向变化第2级补强为负向变化第2.5级，净文明影响幅度第2级、中位；吐谷浑不参与强迁幅度或覆盖。","coverage":"覆盖范围：流求被俘万余人口，不包含未证强迁分置的吐谷浑降众。","duration":"持续性与交班：大规模迁离社区与家庭离散已经实施，难以逆转。","boundary":"来降不等于被强迁。这项材料只计流求俘民分赐负向变化第2级，与东都强迁独立负向变化第2级补强为负向变化第2.5级，净文明影响幅度第2级、中位；吐谷浑不参与强迁幅度或覆盖。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《资治通鉴·卷一百八十一》大业六年：帝遣陈棱、张镇周击流求，虏民万余还，献俘后颁赐百官；闭合国家授权、强迁及依附处置，不与攻战胜败重复。吐谷浑降众分置的另一叙述仍须另证。","target":"","label":"《资治通鉴·卷一百八十一》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/zh-hant/資治通鑑/卷181","target":"https://zh.wikisource.org/zh-hant/資治通鑑/卷181","label":"维基文库：卷181","kind":"史料文本入口"},{"original":"《隋书·卷八十三·吐谷浑传》：部落来降者十万余口；并未闭合原包所称这十余万降众分置。","target":"","label":"《隋书·卷八十三·吐谷浑传》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/隋書/卷83","target":"https://zh.wikisource.org/wiki/隋書/卷83","label":"维基文库：卷83","kind":"史料文本入口"}],"status":"负向损害","components":"正向结果强度0级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"},{"package_ref":"I4PKG-RULER-SHADOW-杨广-A-02","schema":"fourth-item-a-authored-public-v1","title":"杨广：群体参与、身份与共同体变化","story":"强迁各州富商大贾数万户与一艺户三千余家充实东都。","baseline":"比较起点：商人及专业技艺家庭原本分居各自本籍州郡。","responsibility":"本人直接作出决定或发布命令，实际执行结果由本条所列材料核对。","level_basis":"东都强迁富商及一艺户证实负向变化第2级；城市集聚不是独立社会接纳收益。与流求俘民分赐负向变化第2级另一独立材料补强为负向变化第2.5级，净文明影响幅度第2级负向，中位。","coverage":"覆盖范围：迁往东都的数万富商家庭和三千余技艺家庭。","duration":"持续性与交班：数万户及一艺户已被迁离原籍，不能以东都后续繁荣视为原家庭获得补偿；原社区恢复和具体后继状态未证，取中位。","boundary":"东都强迁富商及一艺户证实负向变化第2级；城市集聚不是独立社会接纳收益。与流求俘民分赐负向变化第2级另一独立材料补强为负向变化第2.5级，净文明影响幅度第2级负向，中位。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《资治通鉴·卷一百八十》大业元年徙洛州郭内居民及各州富商大贾数万户实东京；大业三年十月敕河北诸郡送一艺户三千余家，置十二坊安置。只消费强制离土，不重复计营都财政与劳役成本。","target":"","label":"《资治通鉴·卷一百八十》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/zh-hant/資治通鑑/卷180","target":"https://zh.wikisource.org/zh-hant/資治通鑑/卷180","label":"维基文库：卷180","kind":"史料文本入口"}],"status":"负向损害","components":"正向结果强度0级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"负向 · 清晰可验证的有限扩张、修复、收缩或破坏 · 中位","points":-9.5,"calculation":"正向合成强度0，负向合成强度2.5；相减为-2.5。另保留2级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为2级。取中位，正式调整为-9.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-SHADOW-杨行密","ruler_name":"杨行密","polity":"吴","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"杨行密使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"883—905年淮南实际主政","story":"孙儒屠高邮、威胁海陵时，命高霸率兵民入广陵，以违命族诛相威胁；数万家弃资焚舍携老幼迁徙，形成地域社区强制离散。","decision":"正负结果合并后形成负向净变化。\n\n已实施的有限地域或身份群体强制处置为相对变化第2级；不以绝对人数推定主要领域结构毁灭。 持续性与交班：实际离土或身份损害已经发生；未证全域、跨代延续，取中位。","responsibility":"本人直接作出决定或发布命令，实际执行结果由本条所列材料核对。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家 ,"polity":"后周","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"柴荣使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"954-959","story":"柴荣在这一时期的社会整合项没有独立计入的结果。现有相关记录所讨论的经历是：\n\n显德二年全国裁废无敕额佛寺、严限剃度并大量令僧尼还俗，后又收缴民间铜佛像熔铸钱币，形成宗教组织和图像载体的实际大范围收缩。\n\n诏王朴校定《钦天历》并投入国家使用；又推动国家搜求、校勘和抄写图书，形成历法专业知识与国家藏书整理两条独立正向链。\n\n这些材料支持各自领域的事实或裁决，不能由此直接推定群体身份、参与和相互接纳已有独立变化。","decision":"现有社会整合项没有足以进入独立结算的结果，因此按“没有确认独立变化”记0分；不将军事统一、行政设置、教育或文化成果自动折算为社会接纳，也不把其他统治者的行为并入本人。","responsibility":"评价限于柴荣的实际主政时期。当前没有独立社会整合项结果可据以具体归责，不从在位或朝代整体趋势推定本人功过。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。本轴未登记独立结果，相关背景来源只支持背景事实，不构成社会整合项新增分值依据。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[{"package_ref":"I4PKG-WORK-CHAIRONG-C-NEG","story":"显德二年全国裁废无敕额佛寺、严限剃度并大量令僧尼还俗，后又收缴民间铜佛像熔铸钱币，形成宗教组织和图像载体的实际大范围收缩。","boundary":"这条材料属于知识生产与文化生态；不能仅凭该成果推定群体身份、参与或接纳发生了独立变化。","source_refs":["https://www.ecnu.edu.cn/info/1095/60260.htm","https://www.dpm.org.cn/lemmas/239698.html"],"sources":[{"original":"https://www.ecnu.edu.cn/info/1095/60260.htm","target":"https://www.ecnu.edu.cn/info/1095/60260.htm","label":"www.ecnu.edu.cn 来源页面","kind":"研究或资料页面"},{"original":"https://www.dpm.org.cn/lemmas/239698.html","target":"https://www.dpm.org.cn/lemmas/239698.html","label":"www.dpm.org.cn 来源页面","kind":"研究或资料页面"}]},{"package_ref":"I4PKG-WORK-CHAIRONG-C-POS","story":"诏王朴校定《钦天历》并投入国家使用；又推动国家搜求、校勘和抄写图书，形成历法专业知识与国家藏书整理两条独立正向链。","boundary":"这条材料属于知识生产与文化生态；不能仅凭该成果推定群体身份、参与或接纳发生了独立变化。","source_refs":["https://zh.wikisource.org/zh-hans/%E6%96%B0%E6%B3%95%E7%AE%97%E6%9B%B8_%28%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC%29/%E5%8D%B7099"],"sources":[{"original":"https://zh.wikisource.org/zh-hans/%E6%96%B0%E6%B3%95%E7%AE%97%E6%9B%B8_%28%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC%29/%E5%8D%B7099","target":"https://zh.wikisource.org/zh-hans/%E6%96%B0%E6%B3%95%E7%AE%97%E6%9B%B 接司法伤害后的家庭/身份负向链合并，本轴综合结果为文明影响幅度第2级、低位负。 持续性与交班：已见返籍与区域安定结果，后继政策不归入本人；697年王求礼等阻止尽族为同一地区链的前置纠正，不单列。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：武则天","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：武则天","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：武则天","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-WUZETIAN-A-FAMILY-PROSECUTION","schema":"fourth-item-a-authored-public-v1","title":"武则天：群体参与、身份与共同体变化","story":"拔擢并重赏来俊臣等后，制狱反复扩大到家属与疏亲，造成跨案件的家庭没入、流离、亲属身份牵连与家庭结构破坏；直接被捕、处死、酷讯和一般司法恐惧退出本轴，归第二项社会安全。","baseline":"比较起点：家属与非参与者原有安全及身份，不能将告密、酷讯所得谋反供辞视为全族实罪。","responsibility":"本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","level_basis":"多个案件的家属籍没、离散与亲属身份损害；直接司法伤害另计。","coverage":"覆盖范围：跨多个案件的官僚及关系家庭；只计入家庭没入、流离与亲属身份牵连，不计入死亡、抓捕、酷讯本身。","duration":"持续性与交班：690年代跨案家庭没入、流离与亲属身份牵连存在不可逆部分；697年后收束与释放构成同链修复。","boundary":"直接人身/司法后果退出第四项，晚年收束与部分释放进一步压低净本级位置；独立家庭/身份结构损害仍保留相对变化第3级覆盖判断但本轴综合结果降至文明影响幅度第2级低位。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《旧唐书·卷一百八十六上·来俊臣传》坐族千余家、则天重赏、六家出狱及最终弃市。","target":"","label":"《旧唐书·卷一百八十六上·来俊臣传》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/舊唐書/卷186上","target":"https://zh.wikisource.org/wiki/舊唐書/卷186上","label":"维基文库：卷186上","kind":"史料文本入口"},{"original":"《资治通鉴·卷二百六》698年阎知微夷三族并及疏亲。","target":"","label":"《资治通鉴·卷二百六》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/ 四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：玄烨","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：玄烨","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-RULER-PUBLIC-5B02E75C191C9829-A-01","schema":"fourth-item-a-authored-public-v1","title":"玄烨：群体参与、身份与共同体变化","story":"接纳遭准噶尔进攻而内徙的喀尔喀三部，按口赈给并保全各部，不采将其拆入内蒙古四十九旗的意见；1691年多伦会盟后编旗封爵并保留汗号，使大群体获得安置及持续参与渠道。","baseline":"比较起点：喀尔喀三部在顺治朝已有朝贡封号和往来；准噶尔入侵造成的新难民危机与接纳安排才是本人新增窗口。","responsibility":"按本人实际掌权时段及本条具名行为界定责任，其他掌权者的独立行动不并入。","level_basis":"覆盖喀尔喀三部及其部众的长期安置和参与结构，支持3级正向结果。身份层级本身不能证明相对继承基线新增了可独立计入的损害。","coverage":"覆盖范围：喀尔喀三部及其内徙人口。三部不是三次独立加分，不能外推全体蒙古与西藏。","duration":"持续性与交班：喀尔喀旗盟秩序跨后继延续，支持高位；仍是一类区域整合主链，不构成跨场景相对变化第4级新范式。","boundary":"保留汗号与部落结构不等于身份平等；没有以等级差别自动扣负向变化第1级。与汉地相关的独立正负结果另一独立材料合并判断。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《清史稿·卷五百二十一·藩部传四》：喀尔喀前有朝贡，乱后内徙、赈济、保全部落及多伦会盟；原卷五百二十定位有误。","target":"","label":"《清史稿·卷五百二十一·藩部传四》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/清史稿/卷521","target":"https://zh.wikisource.org/wiki/清史稿/卷521","label":"维基文库：卷521","kind":"史料文本入口"}],"status":"正向结果","components":"正向结果强度3级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-RULER-PUBLIC-5B02E75C191C9829-A-02","schema":"fourth-item-a-authored-public-v1","title":"玄烨：群体参与、身份与共同体变化","story":"康熙十八年毛奇龄等前明士人实际进入明史馆及官职，构成有限汉人士人接纳正向变化第2级；同年再次迁徙福建沿海居民，至二十年迁民悉令复业。同一群体已经有归复结果，原负向变化第2级强迁按完整生命周期减至残余负向变化第1级，解除重大负向限制；不可另加正向变化修复分。","baseline":"比较起点：顺治朝已有汉官任用，明遗民与清廷仍有政治隔阂；早期迁界由摄政启动，福建一度复土后再迁的亲政责任须单列。","responsibility":"按本人实际掌权时段及本条具名行为界定责任，其他掌权者的独立行动不并入。","level_basis":"汉人士人实际参与正向变化第2级与福建再迁后归复的残余负向变化第1级分别成立；与刘骜昌陵迁民返故处采用同一修复标准。","coverage":"覆盖范围：汉人士人中的实际参与者与福建沿海被再迁居民，不能把五十名馆员外推全体汉民，也不把顺治以来所有迁界损害倒归玄烨。","duration":"持续性与交班：馆员多年实际参与可证，但部分拒绝或退出；福建再迁后又准复业，限制损害持续性，不取负向相对变化第3级。","boundary":"亲政再迁责任不能归摄政；但本人窗口同一迁民群体已复业，不能仍按未修复负向变化第2级。残余离土扰动与汉人士人接纳合并判断，不外推全体汉民关系完成改善。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"毛奇龄《史馆兴辍录》：自上开制科，以予辈五十人充明史馆官；部分馆员后告归、转任。","target":"","label":"正式记录所引文字依据","kind":"所引文字依据"},{"original":"https://www.qinghistory.cn/c/429/429154.shtml","target":"https://www.qinghistory.cn/c/429/429154.shtml","label":"www.qinghistory.cn 来源页面","kind":"研究或资料页面"},{"original":"《重纂福建通志·卷八十六·海防》：康熙十八年，督抚上请，遂再迁焉。","target":"","label":"《重纂福建通志·卷八十六·海防》","kind":"所引文字依据"},{"original":"https://ctext.org/wiki.pl?chapter=111419&if=gb&remap=gb","target":"https://ctext.org/wiki.pl?chapter=111419&if=gb&remap=gb","label":"ctext.org 来源页面","kind":"研究或资料页面"},{"original":"《康熙福建通志·卷五十五》：十八年徙沿海居民于内地；二十年迁民悉令复业。","target":"","label":"《康熙福建通志·卷五十五》","kind":"所引文字依据"},{"original":"https://www.shidianguji.com/book/NGJ89241200001453019385/chapter/1lwo5070qmrse","target":"https://www.shidianguji.com/book/NGJ89241200001453019385/chapter/1lwo5070qmrse","label":"www.shidianguji.com 来源页面","kind":"史料文本入口"}],"status":"正负结果并存","components":"正向结果强度2级；负向损害强度1级。","major_negative":"该材料未触发独立的重大负向限制。"}],"status":"正向 · 清晰可验证的有限扩张、修复、收缩或破坏 · 中位","points":9.5,"calculation":"正向合成强度3.5，负向合成强度1；相减为2.5。按普通净算、4级保留及重大负向限制规则，最终幅度为2级。取中位，正式调整为+9.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-FD-WANG-JIAN","ruler_name":"王建","polity":"前蜀","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"王建使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"907-918","story":"王建在这一时期的社会整合项没有独立计入的结果。现有相关记录所讨论的经历是：\n\n唐末战乱中文士大量流离，王建主动招纳并高规格礼遇韦庄、贯休、毛文锡、牛峤、杜光庭等跨地域文人和宗教知识人物；韦庄入蜀后进入中枢，贯休获赐号、建寺并能当面讽谏。由此形成相对稳定的成都文人创作与文化人才聚集环境。\n\n这些材料支持各自领域的事实或裁决，不能由此直接推定群体身份、参与和相互接纳已有独立变化。","decision":"现有社会整合项没有足以进入独立结算的结果，因此按“没有确认独立变化”记0分；不将军事统一、行政设置、教育或文化成果自动折算为社会接纳，也不把其他统治者的行为并入本人。","responsibility":"评价限于王建的实际主政时期。当前没有独立社会整合项结果可据以具体归责，不从在位或朝代整体趋势推定本人功过。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。本轴未登记独立结果，相关背景来源只支持背景事实，不构成社会整合项新增分值依据。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[{"package_ref":"I4PKG-WORK-WANGJIAN-C-01","story":"唐末战乱中文士大量流离，王建主动招纳并高规格礼遇韦庄、贯休、毛文锡、牛峤、杜光庭等跨地域文人和宗教知识人物；韦庄入蜀后进入中枢，贯休获赐号、建寺并能当面讽谏。由此形成相对稳定的成都文人创作与文化人才聚集环境。","boundary":"这条材料属于知识生产与文化生态；不能仅凭该成果推定群体身份、参与或接纳发生了独立变化。","source_refs":["https://mzj.sh.gov.cn/lnb-wsws/20211221/0924d323ea0848b8b0e2284c231c7ee3.html","https://www.longyuan.net/news/mview.asp?id=5017"],"sources":[{"original":"https://mzj.sh.gov.cn/lnb-wsws/20211221/0924d323ea0848b8b0e2284c231c7ee3.html","target":"https://mzj.sh.gov.cn/lnb-wsws/20211221/0924d323ea0848b8b0e2284c231c7ee3.html","label":"mzj.sh.gov.cn 来源页面","kind":"研究或资料页面"},{"original":"https://www.longyuan.net/news/mview.asp?id=5017","target":"https://www.longyuan.net/news/mview.asp?id=5017","label":"www.longyuan.net 来源页面","kind":"研究或资料页面"}]}],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：王建","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：王建","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：王建","kind":"人物范围记录（非史料原文）"}],"evidence_items":[],"status":"没有确认独立变化","points":0,"calculation":"当前没有满足本轴条件的独立结果参与合成，调整为0分；这不等于历史上没有相关行动或没有材料。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0 dow":"319—333年","story":"设置胡人辞讼渠道、禁侮衣冠华族；并见战后流人恢复本业的实际接纳。只计有限保护，不由法律文字推出全体胡汉平等。\n\n石勒诱集祖约及宗室，杀亲属中外百余人，并将妇女伎妾分赐诸胡；王安另救祖逖幼子，不能归于石勒主动保护。","decision":"正负结果合并后形成正向净变化。\n\n胡汉诉讼保护及流人复业涉及不同身份群体的实际接纳，支持1级有限正向变化，取中位；差序仍存，不取高位。 持续性与交班：本人窗口有限保护有据；后赵后续族群冲突和继任强制政策不能支持稳定高位交班。\n\n祖氏一族百余人及妇女分赐，仍限同案家族；人数、族灭及分赐本身未证实更广身份规则或共同体结构变化。 持续性与交班：这些事实不满足群体后果的独立准入条件，因此持续性不参与本轴计分。","responsibility":"本人直接作出决定或发布命令，实际执行结果由本条所列材料核对。\n\n本人直接决定或明确授权实施；具体执行者与后续行为仍按所列史料区分。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：石勒","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：石勒","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：石勒","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-WORK-SHILE-A-01","schema":"fourth-item-a-authored-public-v1","title":"石勒：群体参与、身份与共同体变化","story":"设置胡人辞讼渠道、禁侮衣冠华族；并见战后流人恢复本业的实际接纳。只计有限保护，不由法律文字推出全体胡汉平等。","baseline":"比较起点：胡汉冲突频繁且缺乏稳定保护渠道。","responsibility":"本人直接作出决定或发布命令，实际执行结果由本条所列材料核对。","level_basis":"胡汉诉讼保护及流人复业涉及不同身份群体的实际接纳，支持1级有限正向变化，取中位；差序仍存，不取高位。","coverage":"覆盖范围：胡汉诉讼、社会保护与差等身份并存。","duration":"持续性与交班：本人窗口有限保护有据；后赵后续族群冲突和继任强制政策不能支持稳定高位交班。","boundary":"仍保留不同身份的差别待遇；保护命令不能直接等同普遍结果，复业支持有限变化，缺少稳定交班依据，不取高位。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《晋书·卷一百零五》胡人辞讼、不得侮易衣冠华族以及复流人本业；同卷仍称胡为国人，醉胡闯门事件不证明平等司法。","target":"","label":"《晋书·卷一百零五》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/晉書/卷105","target":"https://zh.wikisource.org/wiki/晉書 on":"正负结果合并后形成负向净变化。\n\n相关事实不足以构成可单独计入的群体结果。 持续性与交班：未证实可计分的公共结果，不再用存世文物或后继行动补强。\n\n2级难民强返损害与另一俘民群体1级接纳收益合并。 持续性与交班：强制驱回实际发生；后又阴遣刘知远慰抚部分吐谷浑，未证全部强迁得到修复。军俘获得安全归属，不等同普遍融合。","responsibility":"本人统治下的国家条约形成约束，具体实施效果须另有材料支持。\n\n本人直接下令，且接收安置已有实施记录。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：石敬瑭","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：石敬瑭","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：石敬瑭","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-WORK-SHIJINGTANG-A-01","schema":"fourth-item-a-authored-public-v1","title":"石敬瑭：不单独计分的相关事实","story":"燕云交割及云州拒守、请解围属于可确认政治军事事实；这项材料未证成独立社会身份变化。","baseline":"比较起点：相关北方人口处于后唐—契丹竞争边界。","responsibility":"本人统治下的国家条约形成约束，具体实施效果须另有材料支持。","level_basis":"相关事实不足以构成可单独计入的群体结果。","coverage":"覆盖范围：政治归属变化与社会整合结果未形成清晰净方向。","duration":"持续性与交班：未证实可计分的公共结果，不再用存世文物或后继行动补强。","boundary":"交割及吴峦拒守、石敬瑭请契丹解围可证；未证实原材料两个相反共同体与社会整合轴身份结果，不得以未知写成正向变化第1级−负向变化第1级。撤销这项材料计分资格，割地事实仍保留，不在第四项复制军事损益。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"https://zh.wikisource.org/zh-hant/新五代史/卷29","target":"https://zh.wikisource.org/zh-hant/新五代史/卷29","label":"维基文库：卷29","kind":"史料文本入口"},{"original":"https://zh.wikisource.org/wiki/契丹國志/卷二","target":"https://zh.wikisource.org/wiki/契丹國志/卷二","label":"维基文库：卷二","kind":"史料文本入口"}],"status":"不单独计分，保留相关事实","components":"正向结果强度0级；负向损害强度0级。相关事实不参与本轴合成。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-LOCAL-REAUDIT-SHIJINGTANG-A-02","schema":"fourth-item-a-authored-public-v1","title":"石敬瑭：群体参与、身份与共同体变化","story":"天福六年因契丹索逃户，命张澄率兵搜索四州山谷，将逃来吐谷浑强行驱回，计共同体强迁负向变化第2级；另于天福五年释放、最终接纳被南唐拒收的五百余军俘，给官并编为显义都，保有限正向变化第1级。两对象分别记录，不用燕云割地替代社会结果。","baseline":"比较起点：逃入晋境的吐谷浑千余帐为避契丹苛虐而来；另有南唐军俘被本国拒收。","responsibility":"本人直接下令，且接收安置已有实施记录。","level_basis":"2级难民强返损害与另一俘民群体1级接纳收益合并。","coverage":"覆盖范围：吐谷浑逃亡部落与另一批被拒收军俘。","duration":"持续性与交班：强制驱回实际发生；后又阴遣刘知远慰抚部分吐谷浑，未证全部强迁得到修复。军俘获得安全归属，不等同普遍融合。","boundary":"吐谷浑强返是2级负向结果；另一群体的俘民接纳是1级正向结果。合并后为1级负向，取低位，并保留强迁的重大负向限制。燕云交割的军事结果不能替代这里的社会结果证据。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《资治通鉴·卷二百八十二》天福五年杜光业等五百七人释放后被南唐拒收，晋授官并置显义都；六年正月张澄率二千兵逐吐谷浑还故土。","target":"","label":"《资治通鉴·卷二百八十二》","kind":"所引文字依据"},{"original":"《新五代史·卷七十四·吐浑》逃亡缘由、德光索还、晋高祖驱出与另行慰抚。后出帝及刘知远后续杀戮不归石敬瑭。","target":"","label":"《新五代史·卷七十四·吐浑》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/資治通鑑/卷282","target":"https://zh.wikisource.org/wiki/資治通鑑/卷282","label":"维基文库：卷282","kind":"史料文本入口"},{"original":"https://zh.wikisource.org/wiki/新五代史/卷74","target":"https://zh.wikisource.org/wiki/新五代史/卷74","label":"维基文库：卷74","kind":"史料文本入口"}],"status":"正负结果并存","components":"正向结果强度1级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"负向 · 局部、短期或低强度变化 · 低位","points":-3,"calculation":"正向合成强度1，负向合成强度2；相减为-1。另保留2级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为1级。取低位，正式调整为-3分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-SHADOW-石虎","ruler_name":"石虎","polity":"后赵","pool_note":"已具综合结算","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"石虎使哪些群体获得接纳，又有哪些群体承受排斥或离 "苻健使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"351—355年","story":"苻健在这一时期的社会整合项没有独立计入的结果。现有相关记录所讨论的经历是：\n\n在丰阳设置荆州并组织关市、远商往来，使地方管理与贸易入口相连接。\n\n这些材料支持各自领域的事实或裁决，不能由此直接推定群体身份、参与和相互接纳已有独立变化。","decision":"现有社会整合项没有足以进入独立结算的结果，因此按“没有确认独立变化”记0分；不将军事统一、行政设置、教育或文化成果自动折算为社会接纳，也不把其他统治者的行为并入本人。","responsibility":"评价限于苻健的实际主政时期。当前没有独立社会整合项结果可据以具体归责，不从在位或朝代整体趋势推定本人功过。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。本轴未登记独立结果，相关背景来源只支持背景事实，不构成社会整合项新增分值依据。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[{"assessment_source":"docs/评分结算/净收益/第二项治国净收益/制度行政/01-A制度建设与实际运行方向卡.json","assessment_ruler_id":"RULER-SHADOW-苻健","assessment_field":"public_story","story":"在丰阳设置荆州并组织关市、远商往来，使地方管理与贸易入口相连接。","boundary":"这是现行制度建设评价所记录的相关经历，属于项目裁决正文，并非新增史料原文；制度行为不能直接替代本轴的群体接纳或排斥结果。","source_refs":["docs/评分结算/净收益/第二项治国净收益/制度行政/01-A制度建设与实际运行方向卡.json"],"sources":[{"original":"docs/评分结算/净收益/第二项治国净收益/制度行政/01-A制度建设与实际运行方向卡.json","target":"docs/评分结算/净收益/第二项治国净收益/制度行政/01-A制度建设与实际运行方向卡.json","label":"制度建设正式记录：苻健","kind":"相关项目裁决（非史料原文）"}]}],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：苻健","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：苻健","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：苻健","kind":"人物范围记录（非史料原文）"}],"evidence_items":[],"status":"没有确认独立变化","points":0,"calculation":"当前没有满足本轴条件的独立结果参与合成，调整为0分；这不等于历史上没有相关行动或没有材料。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19 众及拓跋氏幼主；个别首领待遇不外推全部人口。","duration":"持续性与交班：本窗口刘库仁招抚已实施；与刘卫辰的冲突并存。未用后继北魏复国补足本人交班。","boundary":"同卷处罚违命侵掠氐羌者后有降附贡献，支持招抚方向，但未另证实长期身份地位改变，不取高于相对变化第1级的新增结果。380年氐户分徙为独立负向变化第2级，不作为这项材料普通限制吞并。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《资治通鉴·卷一百零四》太元元年：苻坚听燕凤议，分代民属刘库仁、刘卫辰并授官；拓跋窟咄入太学为另一教育结果，不在A重复计分。","target":"","label":"《资治通鉴·卷一百零四》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/資治通鑑/卷104","target":"https://zh.wikisource.org/wiki/資治通鑑/卷104","label":"维基文库：卷104","kind":"史料文本入口"},{"original":"《资治通鉴·卷一百零四》：刘库仁分招抚离散，恩信甚著；秦王坚赏其功。又记魏曷飞违命侵掠，坚鞭之并斩储安，氐羌降附贡献；不能由贡献数字外推稳定平等。","target":"","label":"《资治通鉴·卷一百零四》","kind":"所引文字依据"}],"status":"正向结果","components":"正向结果强度1级；负向损害强度0级。","major_negative":"该材料未触发独立的重大负向限制。"},{"package_ref":"I4PKG-FUJIAN-A-DI-RELOCATION","schema":"fourth-item-a-authored-public-v1","title":"苻坚：群体参与、身份与共同体变化","story":"太元五年（380）苻坚分氐十五万户，由宗亲分领散居方镇；亲送苻丕至灞上时诸氐与父兄哭别，赵整以远徙种人进谏而不纳。计已实施的离土与家庭离散，不计军事部署收益或后来的淝水战败。","baseline":"比较起点：三原、九嵕、武都、汧、雍氐户原居当地并有父兄家庭连接；从分徙前取基线。","responsibility":"本人直接决定且已经实施，限于所载具体行为。","level_basis":"分配户数与已发生的哭别共同支持清晰的群体强制离土负向变化第2级；未证实长期身份降格或主要领域持续断裂，不由十五万户裸数升相对变化第3级。","coverage":"覆盖范围：五处氐户及多个方镇；十五万户是史籍所载安排总数，不等同现代精确人口或全体完成迁移的核算。","duration":"持续性与交班：本窗口分徙及亲属离别已实现；返迁、后继两锚和30年状态未证，不取高位。","boundary":"保留代众招抚正向变化第1级；氐户承担方镇任务不等于奴婢化，不虚增身份损害。正向变化第1级−负向变化第2级为文明影响幅度第1级负向，覆盖广而持续性有限，取中位（−4.5），保重大负向限制第2级。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"《资治通鉴·卷一百零四》太元五年七月至八月：分三原、九嵕、武都、汧、雍氐十五万户，使诸宗亲各领之，散居方镇；坚送丕至灞上，诸氐别其父兄，皆恸哭；赵整进谏，坚笑而不纳。","target":"","label":"《资治通鉴·卷一百零四》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/wiki/資治通鑑/卷104","target":"https://zh.wikisource.org/wiki/資治通鑑/卷104","label":"维基文库：卷104","kind":"史料文本入口"}],"status":"负向损害","components":"正向结果强度0级；负向损害强度2级。","major_negative":"重大负向限制已触发，须与正向成果分开保留。"}],"status":"负向 · 局部、短期或低强度变化 · 中位","points":-4.5,"calculation":"正向合成强度1，负向合成强度2；相减为-1。另保留2级重大负向限制。按普通净算、4级保留及重大负向限制规则，最终幅度为1级。取中位，正式调整为-4.5分。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的有限扩张、修复、收缩或破坏","主要领域形成稳定的重大改变","跨场景新范式或系统性破坏"]}}},{"ruler_id":"RULER-SHADOW-萧绎","ruler_name":"萧绎","polity":"梁","pool_note":"保留的池外单项记录，不纳入综合评价池","item":{"reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"萧绎使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"552—554年称帝主政；此前湘东王阶段只作背景","story":"萧绎在这一时期的社会整合项没有独立计入的结果。现有相关记录所讨论的经历是：\n\n江陵陷落前主动命人焚毁国家与私人汇聚的古今图书，通鉴记十四万卷；大量建康转移典籍和本人长期聚书一并毁灭。\n\n这些材料支持各自领域的事实或裁决，不能由此直接推定群体身份、参与和相互接纳已有独立变化。","decision":"现有社会整合项没有足以进入独立结算的结果，因此按“没有确认独立变化”记0分；不将军事统一、行政设置、教育或文化成果自动折算为社会接纳，也不把其他统治者的行为并入本人。","responsibility":"评价限于萧绎的实际主政时期。当前没有独立社会整合项结果可据以具体归责，不从在位或朝代整体趋势推定本人功过。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。本轴未登记独立结果，相关背景来源只支持背景事实，不构成社会整合项新增分值依据。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[{"package_ref":"I4PKG-WORK-XIAOYI-C-01","story":"江陵陷落前主动命人焚毁国家与私人汇聚的古今图书，通鉴记十四万卷；大量建康转移典籍和本人长期聚书一并毁灭。","boundary":"这条材料属于知识生产与文化生态；不能仅凭该成果推定群体身份、参与或接纳发生了独立变化。","source_refs":["《资治通鉴·卷一百六十五·梁纪二十一》载江陵陷落前萧绎命焚古今图书十四万卷。","https://zh.wikisource.org/zh-hant/資治通鑑/卷165"],"sources":[{"original":"《资治通鉴·卷一百六十五·梁纪二十一》载江陵陷落前萧绎命焚古今图书十四万卷。","target":"","label":"《资治通鉴·卷一百六十五·梁纪二十一》","kind":"所引文字依据"},{"original":"https://zh.wikisource.org/zh-hant/資治通鑑/卷165","target":"https://zh.wikisource.org/zh-hant/資治通鑑/卷165","label":"维基文库：卷165","kind":"史料文本入口"}]}],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：萧绎","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/ 并继续记载器物制作；未另证具体工艺失传、专业教学或生产链中断。不能只因死者为工匠，就把同一死亡再作为知识文化负向。","boundary":"这是相关知识文化材料，不替代本轴的独立结果。工匠被杀和人身恐怖有据，但未另证工艺断传或专业生产中断，不以死亡人数再造文化损害。","source_refs":["https://ctext.org/wiki.pl?chapter=39511&if=gb&remap=gb","https://zqb1.cyol.com/html/2024-06/14/nw.D110000zgqnb_20240614_1-08.htm","《晋书·卷一百三十·赫连勃勃载记》叱干阿利筑城、制兵器与凡杀工匠数千；同段继续记器物制作，不能由死亡数直接推出工艺断传。","https://zh.wikisource.org/wiki/晉書/卷130"],"sources":[{"original":"https://ctext.org/wiki.pl?chapter=39511&if=gb&remap=gb","target":"https://ctext.org/wiki.pl?chapter=39511&if=gb&remap=gb","label":"原有来源页面","kind":"现行证据引用"},{"original":"https://zqb1.cyol.com/html/2024-06/14/nw.D110000zgqnb_20240614_1-08.htm","target":"https://zqb1.cyol.com/html/2024-06/14/nw.D110000zgqnb_20240614_1-08.htm","label":"原有来源页面","kind":"现行证据引用"},{"original":"《晋书·卷一百三十·赫连勃勃载记》叱干阿利筑城、制兵器与凡杀工匠数千；同段继续记器物制作，不能由死亡数直接推出工艺断传。","target":"","label":"原有引文与采用说明","kind":"现行证据引用"},{"original":"https://zh.wikisource.org/wiki/晉書/卷130","target":"https://zh.wikisource.org/wiki/晉書/卷130","label":"原有来源页面","kind":"现行证据引用"}]}],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：赫连勃勃","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：赫连勃勃","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：赫连勃勃","kind":"人物范围记录（非史料原文）"}],"evidence_items":[],"status":"没有确认独立变化","points":0,"calculation":"当前没有满足本轴条件的独立结果参与合成，调整为0分；这不等于历史上没有相关行动或没有材料。","method":"先把符合条件的正向结果与负向损害分别判断为0至4级；同方向取最强结果，第二项独立结果最多补强0.5，方向强度不超过4。正负强度之差决定净方向，非零差的绝对值向下取整、最低1级、最高4级。一侧达到4级、反向最高1级时，按合同保留4级；重大负向损害另有最低负档、最高正档及高位限制。无关正向成果不能解除重大负向限制，同一损害的真实修复才可降低限制。最终幅度1至4级的低、中、高位分别对应3/4.5/6、7.5/9.5/11.5、13.5/16/18、19/21/22.5分，再按方向取正负；0级为0分。覆盖、持续性、交班、跨场景结果与反证决定档内位置，材料条数不决定分数。","scale":["局部、短期或低强度变化","清晰可验证的 "reader_public_fourth_a":{"schema":"fourth-item-a-authored-public-v1","question":"铁木真使哪些群体获得接纳，又有哪些群体承受排斥或离散？","window":"1206—1227年","story":"统一蒙古及对外征服过程中，大量俘虏与工匠人口被跨区域迁移、分配给皇族和国家使用，并形成从自由民到完全奴隶的广泛依附谱系；同时亦吸收畏兀儿、契丹等多群体专业人才进入帝国服务，构成有限整合正向。","decision":"正负结果合并后形成负向净变化。\n\n跨地区的俘虏迁移与奴役重构了依附身份和共同体关系。 持续性与交班：强迁与依附人口体系在统一蒙古帝国及后继政权中继续运作；自由身和共同体损害难以逆转。","responsibility":"本人建立的征服及帝国分配体系形成责任依据，具体迁徙与依附化由所属组织执行。","boundary":"只评价不同区域、族群和身份群体的实际参与、接纳、排斥及共同体关系变化。军事征服、行政设置、直接人身伤害和教育文化成果分别由相应项目承担，同一后果不重复计算。","source_note":"各条经历下列出对应正式引用；引用的存在不等于每句话都由史料直接证明，社会后果与档位理由仍属于有边界的评价。实际主政时期沿用共享曲线的人物窗口；当前没有同口径的后继延续证据时，不补写长期改善或损害。","context_items":[],"assessment_sources":[{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/01-第四项文明与国家整合收益正式结算.json","label":"第四项正式记录：铁木真","kind":"本项裁决入口"},{"original":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","target":"docs/评分结算/净收益/第四项文明与国家整合收益/03-第四项共享曲线交班锚与去重审计.json","label":"共享曲线、主政时期与候选处置：铁木真","kind":"现行裁决依据（非史料原文）"},{"original":"config/common/canonical-ruler-pool.json","target":"config/common/canonical-ruler-pool.json","label":"人物范围与就绪状态：铁木真","kind":"人物范围记录（非史料原文）"}],"evidence_items":[{"package_ref":"I4PKG-LOCAL-REAUDIT-TEMUJI-A-01","schema":"fourth-item-a-authored-public-v1","title":"铁木真：群体参与、身份与共同体变化","story":"统一蒙古及对外征服过程中，大量俘虏与工匠人口被跨区域迁移、分配给皇族和国家使用，并形成从自由民到完全奴隶的广泛依附谱系；同时亦吸收畏兀儿、契丹等多群体专业人才进入帝国服务，构成有限整合正向。","baseline":"比较起点：草原及被征服地区各群体原有不同共同体、自由身份和本地生业网络；前帝国蒙古社会的奴隶角色相对较小。","responsibility":"本人建立的征服及帝国分配体系形成责任依据，具体迁徙与依附化由所属组织执行。","level_basis":"跨地区的俘虏迁移与奴役重构了依附身份和共同体关系。","coverage":"覆盖范围：跨多个征服区的人口、工匠、俘虏与依附群体。","duration":"持续性与交班：强迁与依附人口体系在统一蒙古帝国及后继政权中继续运作；自由身和共同体损害难以逆转。","boundary":"不把军事杀伤和疆域扩张在共同体与社会整合重复计分；跨群体专业人才吸纳形成相对变化第2级正向，但不足以洗掉系统性强迁与依附化。","source_note":"以下保留本条正式记录所引用的材料。历史事实、群体后果及档位判断须区分；书名引文与网页可能是同一材料的两种入口，不按链接条数加分。","sources":[{"original":"https://www.cambridge.org/core/books/abs/cambridge-world-history-of-slavery/forced-migrations-and-slavery-in-the-mongol-empire-12061368/C183F34FAECBB6F24
