<main><h1>真实信息能否改变最高决定</h1>
<p>看具体意见如何进入、本人如何处置、错误是否实际纠正，以及表达者能否安全履职。主动改意、信息上达与外部程序约束分别理解；设置渠道不直接算成有效纠错。</p>
<p>这里展示反馈与约束正式记录的全部 <span id="count">__COUNT__</span> 位人物，包括未进入综合榜者；排列沿用正式记录顺序，不另生成排名。分数和折算见各人的治国成效页。</p>
<label for="search">搜索人物、意见或事件</label><input id="search" type="search" autocomplete="off">
<section aria-label="全池反馈纠错阅读">__ENTRIES__</section></main>
<script>
if(['localhost','127.0.0.1','[::1]'].includes(location.hostname))for(const link of document.querySelectorAll('[data-local-source]'))link.href='../'+link.dataset.localSource;
const entries=[...document.querySelectorAll('article')];document.getElementById('search').addEventListener('input',event=>{const q=event.target.value.trim();let count=0;for(const entry of entries){entry.hidden=q!==''&&!entry.textContent.includes(q);if(!entry.hidden)count++;}document.getElementById('count').textContent=count;});
</script></body></html>
