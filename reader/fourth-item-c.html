<main><h1>哪些知识得到生产、保存和传播，哪些受到破坏？</h1>
<p>这里看实际掌权时期可以归于本人的知识产品、文本保存传播及文化生态变化。先读具体材料与本人责任，再看正负结果怎样合成分数；零值分别解释未确认独立变化、材料复核后不计分和正负相抵。</p>
<p>收录第四项现有全部 <span id="total">201</span> 条人物记录，按姓名排列。每人的主政时期、综合结算就绪状态和范围分别标明；保留的单项记录不表示已经进入综合评价池，本页不另作排名。</p>
