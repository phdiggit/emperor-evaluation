<main><h1>哪些群体获得接纳，哪些承受排斥或离散？</h1>
<p>这里看统治者在实际掌权时期，怎样改变不同区域、族群和身份群体的参与、身份与相互接纳。军事征服、行政设置和教育文化成果各有对应评价，不能直接折算成这里的社会结果。</p>
<p>收录第四项现有全部 <span id="total">__COUNT__</span> 条人物记录，按姓名排列。每人的实际主政时期和综合评价就绪状态分别标明；保留的单项记录不表示已进入综合评价池，也不据此另作排名。</p>
<label for="search">搜索人物、经历或材料</label><input id="search" type="search" autocomplete="off"><p>当前显示 <span id="count">__COUNT__</span> 人。</p>
<section id="entries" aria-label="国家共同体与社会整合全池阅读"></section></main>
<script id="fourth-a-data" type="application/json">__PAYLOAD__</script>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceIdentity=__SOURCE_IDENTITY__;
function link(path,label){const local=['localhost','127.0.0.1','[::1]'].includes(location.hostname);const href=/^https?:\/\//.test(path)?path:local||!sourceIdentity.repository||!sourceIdentity.revision?'../'+path:'https://github.com/'+sourceIdentity.repository+'/blob/'+sourceIdentity.revision+'/'+path;return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`;}
</script><script src="fourth-item-a-public.js"></script><script>
const DATA=JSON.parse(document.getElementById('fourth-a-data').textContent);
document.getElementById('entries').innerHTML=DATA.map(r=>`<article class="person" id="${esc(r.ruler_id)}"><h2>${esc(r.ruler_name)}</h2><p class="meta">${esc(r.polity)} · ${esc(r.pool_note)}</p>${FourthItemAReading.heading(r.item)}${FourthItemAReading.html(r.item,r)}</article>`).join('');
const entries=[...document.querySelectorAll('article.person')];document.getElementById('search').addEventListener('input',event=>{const q=event.target.value.trim();let count=0;for(const entry of entries){entry.hidden=q!==''&&!entry.textContent.includes(q);if(!entry.hidden)count++;}document.getElementById('count').textContent=count;});
if(location.hash){const entry=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(entry)entry.scrollIntoView();}
</script></body></html>
