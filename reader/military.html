<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>帝王三镜 · 战役与武将档案</title>
<style>
:root{--paper:#f5f2eb;--ink:#242e2c;--muted:#727970;--line:#deded3;--red:#984333;--green:#286559;--gold:#96763c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 "Microsoft YaHei",sans-serif}a{color:var(--green)}header{padding:18px 4vw;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;background:#f9f7f1}header strong{font:22px serif;letter-spacing:2px}header span{color:var(--muted);font-size:12px}header a{margin-left:auto}main{max-width:1120px;margin:auto;padding:28px 4vw 70px}h1,h2{font-family:"SimSun",serif}h1{font-size:38px;line-height:1.3;margin:8px 0 18px}h2{font-size:24px;margin:8px 0}.eyebrow{letter-spacing:3px;font-size:11px;color:var(--red)}.muted,.subline,small{color:var(--muted)}.panel{border:1px solid var(--line);border-radius:7px;padding:22px;background:#fcfbf7;margin:16px 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:240px;background:#fffdf8;border:1px solid var(--line);padding:10px 12px;border-radius:4px;font:inherit}.toolbar button{background:var(--ink);color:white;border:1px solid var(--ink);border-radius:4px;padding:9px 16px;font:inherit;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stat{border-top:2px solid var(--line);padding-top:10px}.stat b{font:28px Georgia,serif;color:var(--green)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{display:block;border:1px solid var(--line);border-radius:6px;padding:15px;background:#fcfbf7;text-decoration:none;color:inherit}.card:hover{border-color:var(--green)}.card strong{display:block;font-size:16px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{display:inline-block;padding:2px 7px;border-radius:3px;background:#e9eee5;font-size:12px}.chip.result{color:var(--red)}.chip.diff{color:var(--green)}.prose{white-space:pre-line;line-height:1.95}.label{font-size:12px;color:var(--red);margin-top:16px}.notice{border-left:3px solid var(--gold);padding:10px 14px;background:#eeeae0;font-size:13px}.member{border-top:1px solid var(--line);padding:12px 0}.member:first-child{border-top:0}.member-head{display:flex;justify-content:space-between;gap:12px}.sources{font-size:12px;overflow-wrap:anywhere}.sources code{display:block;margin:5px 0;white-space:normal}.back{font-size:13px}.grade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grade-grid>div{padding:10px;background:#f1eee6;border-radius:4px}.empty{padding:40px;text-align:center;color:var(--muted)}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}.achievement{border-top:1px dotted var(--line);padding:12px 0}.achievement:first-child{border-top:0}.footer{font-size:12px;color:var(--muted);margin-top:28px}@media(max-width:700px){main{padding:20px 16px}.cards,.stats,.grade-grid{grid-template-columns:1fr}h1{font-size:30px}header span{display:none}}
</style>
</head>

</html>
