<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#26342d;font:16px/1.9 "Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding:12px 24px;background:#f8f6f0;border-bottom:1px solid #d7ddd3}a{color:#286559;text-underline-offset:3px}button,input{font:inherit;padding:6px 10px;border:1px solid #ccd5c9;border-radius:4px;background:#fffdf8}button{cursor:pointer}input{width:240px;max-width:100%}#status{font-size:13px}.layout{display:grid;grid-template-columns:250px minmax(0,1000px);gap:35px;max-width:1380px;margin:auto;padding:28px}aside{position:sticky;top:85px;align-self:start;max-height:80vh;overflow:auto;font-size:13px}aside a{display:block;margin:8px 0;text-decoration:none}article{min-width:0}h1{font:32px/1.5 serif}h2,h3{margin-top:36px;scroll-margin-top:100px}p,li{overflow-wrap:anywhere}code{font-size:.9em;background:#e9ede3;padding:1px 4px;border-radius:3px}pre{overflow:auto;padding:16px;background:#e9ede3}pre code{padding:0}.table-scroll{overflow:auto;max-height:70vh;border:1px solid #d7ddd3;border-radius:5px}table{border-collapse:collapse;min-width:100%;font-size:14px}td,th{padding:10px 14px;text-align:left;border-bottom:1px solid #d7ddd3;min-width:90px;vertical-align:top}th{position:sticky;top:0;background:#e7ecdf;z-index:2}td:first-child{position:sticky;left:0;background:#f5f2eb}th:first-child{left:0;z-index:3}details{margin:18px 0;padding:12px 16px;border:1px solid #d7ddd3;border-radius:5px}summary{cursor:pointer;font-weight:bold}.located{outline:3px solid #b48e42;outline-offset:4px;scroll-margin-top:110px}blockquote{border-left:3px solid #b48e42;margin-left:0;padding-left:18px}#context{display:none;background:#e7ecdf;padding:12px 18px;margin-bottom:20px}#context.show{display:block}.raw{margin-left:auto;font-size:13px}
@media(max-width:800px){header{padding:10px 14px;gap:8px}.layout{display:block;padding:18px}aside{position:static;max-height:190px;margin-bottom:24px;border-bottom:1px solid #d7ddd3}h1{font-size:26px}input{width:180px}.raw{margin-left:0}td,th{min-width:100px}body{font-size:15px}}
@media print{header,aside,#context{display:none}.layout{display:block}.table-scroll{max-height:none;overflow:visible}td:first-child,th{position:static}}
</style></head><body><header><a id="return" href="/reader/index.html">← 综合阅读</a><input id="find" aria-label="在文内查找" placeholder="查找人物或关键词"><button id="next">查找下一处</button><span id="status" aria-live="polite"></span><a id="raw" class="raw">查看原始Markdown</a></header><div class="layout"><aside><details open><summary>目录</summary>__CONTENTS__</details></aside><article data-source-line-count="__SOURCE_LINE_COUNT__"><div id="context"></div>__BODY__</article></div>
<script>
const params=new URLSearchParams(location.search),person=params.get('person'),name=params.get('name');
document.getElementById('raw').href=location.pathname+'?raw=1';
if(person)document.getElementById('return').href='/reader/index.html#person/'+encodeURIComponent(person);
history.scrollRestoration='manual';
for(const table of document.querySelectorAll('article table')){const wrap=document.createElement('div');wrap.className='table-scroll';table.before(wrap);wrap.append(table);const rows=Array.from(table.rows);const columns=Math.max(...rows.map(r=>r.cells.length));for(let i=0;i<columns;i++){const length=Math.max(0,...rows.slice(0,40).map(r=>r.cells[i]?.textContent.length||0));const width=length>70?320:length>25?220:100;for(const row of rows)if(row.cells[i])row.cells[i].style.minWidth=width+'px'}}
function reveal(el){document.querySelectorAll('.located').forEach(x=>x.classList.remove('located'));for(let p=el.parentElement;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;el.classList.add('located');el.scrollIntoView({block:'center'});}
let last='',current=-1;
function search(){const q=document.getElementById('find').value.trim();if(!q){document.getElementById('status').textContent='请输入姓名或关键词';return}if(q!==last){last=q;current=-1}const matches=Array.from(document.querySelectorAll('article h1,article h2,article h3,article h4,article p,article li,article tr')).filter(el=>el.textContent.includes(q)&&!Array.from(el.children).some(c=>c.matches('p,li,tr')&&c.textContent.includes(q)));if(!matches.length){document.getElementById('status').textContent='未找到匹配内容';return}current=(current+1)%matches.length;reveal(matches[current]);document.getElementById('status').textContent=`${current+1} / ${matches.length}处`}
document.getElementById('next').onclick=search;document.getElementById('find').onkeydown=e=>{if(e.key==='Enter')search()};
function resolveFragment(hash,doc=document){
 if(!hash)return {target:null,status:'empty'};
 const exact=doc.getElementById(hash);if(exact)return {target:exact,status:'exact'};
 const headings=Array.from(doc.querySelectorAll('article h1,article h2,article h3,article h4,article h5,article h6'));
 const legacy=headings.find(el=>el.dataset.legacyAnchor===hash);if(legacy)return {target:legacy,status:'legacy'};
 const line=hash.match(/^L(\d+)(?:[-—]L?\d+)?$/);
 if(line){const count=Number(doc.querySelector('article').dataset.sourceLineCount);if(Number(line[1])<1||Number(line[1])>count)return {target:null,status:'missing'};const blocks=Array.from(doc.querySelectorAll('article [data-source-line]'));const target=blocks.filter(el=>Number(el.dataset.sourceLine)<=Number(line[1])).sort((a,b)=>Number(b.dataset.sourceLine)-Number(a.dataset.sourceLine))[0];return {target:target||null,status:target?'line':'missing'}}
 const matching=headings.filter(el=>el.textContent.toLowerCase().includes(hash.toLowerCase()));
 if(matching.length===1)return {target:matching[0],status:'heading'};
 if(matching.length>1)return {target:null,status:'ambiguous'};
 const blocks=Array.from(doc.querySelectorAll('article p,article li,article tr'));
 const matches=blocks.filter(el=>el.textContent.includes(hash)&&!Array.from(el.querySelectorAll('p,li,tr')).some(child=>child.textContent.includes(hash)));
 return {target:matches.length===1?matches[0]:null,status:matches.length===1?'text':matches.length?'ambiguous':'missing'};
}
function fragmentTarget(){let hash;try{hash=decodeURIComponent(location.hash.slice(1))}catch{return {target:null,status:'invalid'}}return resolveFragment(hash)}
function followFragment(){const result=fragmentTarget();if(result.target){reveal(result.target);document.getElementById('status').textContent='已定位原引用';return true}if(result.status!=='empty'){document.querySelectorAll('.located').forEach(el=>el.classList.remove('located'));document.getElementById('status').textContent=result.status==='ambiguous'?'原引用有多个匹配，请通过文内查找核对':'原引用定位未找到，请通过目录或文内查找核对';return true}return false}
if(name){document.getElementById('find').value=name;const info=document.getElementById('context');info.className='show';info.textContent=`正在查阅：${name}。本页保留正式阅读材料，可通过目录或文内查找继续定位。`;if(!followFragment()){const anchor=document.getElementById('person-'+(person||'').toLowerCase());const headings=Array.from(document.querySelectorAll('article h2,article h3,article h4'));const target=anchor||headings.find(el=>el.textContent.includes(name));if(target)reveal(target);else search();}}else followFragment();
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(location.hash===a.hash)followFragment();else location.hash=a.hash}));
window.addEventListener('pageshow',()=>requestAnimationFrame(()=>{const el=document.querySelector('.located');if(el)reveal(el)}));
window.addEventListener('hashchange',followFragment);
</script></body></html>
